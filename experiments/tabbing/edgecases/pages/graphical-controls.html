<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>SVG and canvas button surfaces</title>
<link rel="stylesheet" href="_shared.css">
<h1>Graphical actions without keyboard entry points</h1>
<p>Both drawings respond to a click. Neither has a tab stop or a keyboard alternative.</p>
<p id="out">idle</p>
<button id="before">Before the drawings</button>
<svg width="280" height="80" viewBox="0 0 280 80" style="display:block">
  <g data-probe="e150" role="button" aria-label="Run SVG action" style="cursor:pointer">
    <rect x="16" y="14" width="248" height="52" rx="4" fill="#eee" stroke="#888" />
    <text x="36" y="46">Run SVG action</text>
  </g>
</svg>
<canvas data-probe="e151" width="280" height="80" role="button" aria-label="Run canvas action"
  style="display:block; cursor:pointer">Run canvas action</canvas>
<button id="after">After the drawings</button>
<script src="_helpers.js"></script>
<script>
// SVG namespace and descendant hit targets exercise more than an HTML div.
document.querySelector('[data-probe="e150"]').addEventListener('click', function click150() {
  mark('e150');
});
const canvas = document.querySelector('[data-probe="e151"]');
const ctx = canvas.getContext('2d');
ctx.fillStyle = '#eee';
ctx.fillRect(16, 14, 248, 52);
ctx.strokeStyle = '#888';
ctx.strokeRect(16, 14, 248, 52);
ctx.fillStyle = '#222';
ctx.font = '15px system-ui';
ctx.fillText('Run canvas action', 36, 46);
// Unlike e23 (a div that draws elsewhere), the bitmap is the control itself.
// Only its painted button region is actionable; the canvas has no DOM button.
canvas.addEventListener('click', function click151(event) {
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width;
  const y = (event.clientY - rect.top) * canvas.height / rect.height;
  if (x >= 16 && x <= 264 && y >= 14 && y <= 66) mark('e151');
});
</script>
</html>
