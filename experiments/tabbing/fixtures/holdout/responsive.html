<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Viewport-dependent equivalents</title>
<link rel="stylesheet" href="shared.css">
<style>
  #small-screen { display:none; }
  @media (max-width:600px) { #keyboard-alternative { display:none; } #small-screen { display:inline-block; } }
</style>
<h1>Viewport-dependent equivalents</h1>
<div data-probe="h140" id="mouse-action" class="control">Open resources</div>
<button data-probe="h141" id="keyboard-alternative">Open resources</button>
<div data-probe="h142" id="small-screen" class="control">Open compact timetable</div>
<output id="resources">Resources closed</output><output id="compact">Timetable closed</output>
<script>
  function openResources() { document.getElementById('resources').textContent = 'Resources open'; }
  document.getElementById('mouse-action').addEventListener('click', openResources);
  document.getElementById('keyboard-alternative').addEventListener('click', openResources);
  document.getElementById('small-screen').addEventListener('click', () => {
    document.getElementById('compact').textContent = 'Timetable open';
  });
</script></html>
