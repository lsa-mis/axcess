[project]
name = "audit"
version = "0.1.0"
description = "Local, offline web accessibility auditor for WCAG 1.4.5 (Images of Text)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "imregan" }]
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "playwright>=1.40",
    "tldextract>=5.1",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "yoyo-migrations>=8.2",
    "rich>=13.7",
    "pytesseract>=0.3.10",
    "pillow>=10.2",
    "rapidfuzz>=3.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "aiofiles>=23.2",
    "defusedxml>=0.7",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-aiofiles",
    "types-beautifulsoup4",
    "types-defusedxml",
]

[project.scripts]
audit = "audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/audit/analyzer/vlm/prompts" = "audit/analyzer/vlm/prompts"
"src/audit/rules" = "audit/rules"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end integration tests (may hit local fixture server)",
    "live_vlm: tests that require a live Ollama instance",
    "ui: Playwright-based UI tests",
]

[tool.coverage.run]
source = ["src/audit"]
branch = true

[tool.coverage.report]
precision = 1
show_missing = true
