<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Axcess accessibility evidence loop</title>
  <desc id="desc">An authorized website enters a local trust boundary. Axcess scopes and renders pages, runs attributed detection layers, stores scan evidence locally, groups issues, and presents them to an expert. The expert exports remediation work and rescans the site to verify change.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#edf4f3"/>
    </linearGradient>
    <linearGradient id="navyCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#1d4f63"/>
    </linearGradient>
    <linearGradient id="tealCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0b5d58"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 6 L 0 12 z" fill="#496a7a"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 6 L 0 12 z" fill="#0f766e"/>
    </marker>
    <style>
      .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #102a43; }
      .white { fill: #ffffff; }
      .muted { fill: #526b78; }
      .eyebrow { font-size: 17px; font-weight: 750; letter-spacing: 1.6px; }
      .heading { font-size: 29px; font-weight: 760; }
      .body { font-size: 18px; font-weight: 520; }
      .small { font-size: 15px; font-weight: 560; }
      .number { font-size: 22px; font-weight: 800; }
      .flow { fill: none; stroke: #496a7a; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>

  <text class="label heading" x="64" y="66">AXCESS EVIDENCE LOOP</text>
  <text class="label muted body" x="64" y="98">Local evidence, attributed methods, expert decisions, verified change</text>

  <!-- Local trust boundary -->
  <rect x="250" y="132" width="1288" height="588" rx="34" fill="#ffffff" fill-opacity="0.58" stroke="#80a7a1" stroke-width="3" stroke-dasharray="11 9"/>
  <rect x="286" y="112" width="235" height="42" rx="21" fill="#d9efeb"/>
  <path d="M310 133 v-7 a9 9 0 0 1 18 0 v7" fill="none" stroke="#0f766e" stroke-width="3"/>
  <rect x="307" y="132" width="24" height="18" rx="4" fill="#0f766e"/>
  <text class="label eyebrow" x="345" y="139">LOCAL TRUST BOUNDARY</text>

  <!-- Target site -->
  <g filter="url(#shadow)">
    <rect x="42" y="272" width="172" height="204" rx="28" fill="url(#navyCard)"/>
  </g>
  <circle cx="128" cy="335" r="38" fill="none" stroke="#8bd8ce" stroke-width="4"/>
  <path d="M90 335 h76 M128 297 c-18 20-18 56 0 76 M128 297 c18 20 18 56 0 76 M96 316 h64 M96 354 h64" fill="none" stroke="#8bd8ce" stroke-width="3"/>
  <text class="label white eyebrow" x="128" y="404" text-anchor="middle">AUTHORIZED</text>
  <text class="label white heading" x="128" y="435" text-anchor="middle">Target site</text>
  <text class="label white small" x="128" y="458" text-anchor="middle">Public or signed-in</text>

  <path class="flow" d="M214 374 H286"/>

  <!-- Scope and render -->
  <g filter="url(#shadow)">
    <rect x="286" y="238" width="248" height="272" rx="28" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/>
  </g>
  <circle cx="326" cy="278" r="21" fill="#102a43"/>
  <text class="label white number" x="326" y="286" text-anchor="middle">1</text>
  <rect x="355" y="264" width="116" height="75" rx="9" fill="#e4eef3" stroke="#496a7a" stroke-width="3"/>
  <rect x="371" y="281" width="84" height="39" rx="4" fill="#ffffff"/>
  <path d="M396 348 h34 M413 339 v9" stroke="#496a7a" stroke-width="4" stroke-linecap="round"/>
  <text class="label heading" x="326" y="390">Scope &amp; render</text>
  <text class="label muted body" x="326" y="425">URL policy + queue</text>
  <text class="label muted body" x="326" y="453">Playwright Chromium</text>
  <text class="label muted body" x="326" y="481">Visible login when needed</text>

  <path class="flow" d="M534 374 H594"/>

  <!-- Detection layers -->
  <g filter="url(#shadow)">
    <rect x="594" y="180" width="305" height="389" rx="28" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/>
  </g>
  <circle cx="634" cy="220" r="21" fill="#102a43"/>
  <text class="label white number" x="634" y="228" text-anchor="middle">2</text>
  <text class="label heading" x="673" y="229">Detection layers</text>

  <g>
    <rect x="628" y="261" width="237" height="48" rx="12" fill="#e7eef7"/>
    <circle cx="656" cy="285" r="12" fill="#315c91"/>
    <text class="label body" x="680" y="292">axe-core · DOM rules</text>

    <rect x="628" y="321" width="237" height="48" rx="12" fill="#e8f4ed"/>
    <circle cx="656" cy="345" r="12" fill="#2f7d57"/>
    <text class="label body" x="680" y="352">Alfa · ACT outcomes</text>

    <rect x="628" y="381" width="237" height="48" rx="12" fill="#fff3d8"/>
    <circle cx="656" cy="405" r="12" fill="#a66a00"/>
    <text class="label body" x="680" y="412">Browser behavior probes</text>

    <rect x="628" y="441" width="237" height="48" rx="12" fill="#f3eafa"/>
    <circle cx="656" cy="465" r="12" fill="#76508f"/>
    <text class="label body" x="680" y="472">OCR + optional local AI</text>
  </g>
  <text class="label muted small" x="628" y="530">Method and uncertainty stay attached.</text>

  <path class="flow" d="M899 374 H958"/>

  <!-- Evidence store -->
  <g filter="url(#shadow)">
    <rect x="958" y="238" width="244" height="272" rx="28" fill="url(#tealCard)"/>
  </g>
  <circle cx="998" cy="278" r="21" fill="#ffffff"/>
  <text class="label number" x="998" y="286" text-anchor="middle" fill="#0f766e">3</text>
  <ellipse cx="1080" cy="318" rx="56" ry="19" fill="#a7e0d7"/>
  <path d="M1024 318 v63 c0 11 25 20 56 20 s56-9 56-20 v-63 M1024 350 c0 11 25 20 56 20 s56-9 56-20" fill="#a7e0d7" fill-opacity="0.25" stroke="#a7e0d7" stroke-width="3"/>
  <text class="label white heading" x="998" y="435">Local evidence</text>
  <text class="label white body" x="998" y="466">SQLite · blobs · screenshots</text>
  <text class="label white small" x="998" y="490">Immutable scan identity</text>

  <path class="flow" d="M1202 374 H1261"/>

  <!-- Issue synthesis -->
  <g filter="url(#shadow)">
    <rect x="1261" y="238" width="240" height="272" rx="28" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/>
  </g>
  <circle cx="1301" cy="278" r="21" fill="#102a43"/>
  <text class="label white number" x="1301" y="286" text-anchor="middle">4</text>
  <rect x="1325" y="302" width="127" height="96" rx="10" fill="#e4eef3" stroke="#496a7a" stroke-width="3"/>
  <path d="M1347 327 h82 M1347 348 h62 M1347 369 h74" stroke="#496a7a" stroke-width="6" stroke-linecap="round"/>
  <text class="label heading" x="1301" y="435">Group issues</text>
  <text class="label muted body" x="1301" y="466">Impact · pages · action</text>
  <text class="label muted small" x="1301" y="490">Evidence remains traceable</text>

  <!-- Expert review strip -->
  <path class="flow" d="M1381 510 V611 H1184"/>
  <g filter="url(#shadow)">
    <rect x="781" y="602" width="403" height="166" rx="28" fill="#102a43"/>
  </g>
  <circle cx="836" cy="652" r="25" fill="#8bd8ce"/>
  <circle cx="836" cy="642" r="8" fill="#102a43"/>
  <path d="M820 666 c5-15 27-15 32 0" fill="#102a43"/>
  <text class="label white heading" x="881" y="656">Expert review</text>
  <text class="label white body" x="820" y="701">Confirm · reject · remediate · verify</text>
  <text class="label white small" x="820" y="733">The human owns the conclusion.</text>

  <!-- Outputs -->
  <path class="flow" d="M781 685 H688"/>
  <g filter="url(#shadow)">
    <rect x="365" y="602" width="323" height="166" rx="28" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/>
  </g>
  <path d="M407 640 h43 l18 18 v64 h-61 z M450 640 v20 h18" fill="#e4eef3" stroke="#496a7a" stroke-width="3" stroke-linejoin="round"/>
  <text class="label heading" x="493" y="657">Handoff</text>
  <text class="label muted body" x="493" y="689">Workbook · report · Jira</text>
  <text class="label muted small" x="407" y="740">Linked page references and limitations</text>

  <!-- Rescan feedback loop -->
  <path d="M526 768 V814 H128 V476" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowTeal)"/>
  <rect x="245" y="794" width="270" height="42" rx="21" fill="#d9efeb"/>
  <path d="M271 814 a12 12 0 1 1 7 11" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text class="label eyebrow" x="301" y="820">RESCAN TO VERIFY CHANGE</text>

  <!-- Footer claims -->
  <rect x="1222" y="793" width="316" height="58" rx="18" fill="#fff3d8"/>
  <text class="label eyebrow" x="1246" y="818">EVIDENCE ≠ CERTIFICATION</text>
  <text class="label muted small" x="1246" y="841">Manual verification remains essential.</text>
</svg>
