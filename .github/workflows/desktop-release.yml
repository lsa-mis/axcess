name: Desktop preview release

# Publishes the preview release that installed apps are offered: GitHub
# release desktop-v0.2.N, marked latest, with one file per platform. Only a
# person starts it (Actions > Desktop preview release > Run workflow, on
# main). Merges and pull requests run desktop-build.yml ("Desktop test
# build") instead, which makes the same files but never publishes them.
on:
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, and a second run waits rather than cancelling the
# first part-way through its upload.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  check-branch:
    name: Check the release comes from main
    runs-on: ubuntu-latest
    steps:
      # Fails before any build minutes are spent. Builds of another branch
      # come from a manual run of "Desktop test build" on that branch.
      - name: Stop unless this run is on main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Preview releases are published only from main. This run is on $GITHUB_REF. To try a branch's installers, run \"Desktop test build\" on it instead."
            exit 1
          fi

  build:
    name: Build
    needs: check-branch
    uses: ./.github/workflows/desktop-build.yml

  publish:
    name: Publish preview release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: desktop-v${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          # One file per platform, named in plain words with its version by
          # releaseFileName (desktop/src/updates.cjs), and the two files the
          # Windows updater reads: latest.yml (which installer is newest) and
          # the installer's .blockmap (so an update downloads only what
          # changed). Nothing else: no second name for the same file.
          find artifacts -type f \( -name 'Axcess-*-Mac-*.dmg' -o -name 'Axcess-*-Windows-Installer.exe' -o -name 'Axcess-*-Windows-Installer.exe.blockmap' -o -name 'Axcess-*-Windows-Portable.zip' -o -name 'Axcess-*-Linux.AppImage' -o -name 'latest.yml' \) -exec cp {} release/ \;
          ls -l release
          for required in "Axcess-$VERSION-Mac-Apple-Silicon.dmg" "Axcess-$VERSION-Windows-Installer.exe" "Axcess-$VERSION-Windows-Installer.exe.blockmap" "Axcess-$VERSION-Windows-Portable.zip" "Axcess-$VERSION-Linux.AppImage" latest.yml; do
            test -f "release/$required" || { echo "Missing release asset: $required"; exit 1; }
          done
          test "$(ls release | wc -l)" -eq 6 || { echo "Expected exactly 6 release files:"; ls release; exit 1; }
      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          # The whole commit message, not just its subject: the body of the
          # commit on main is written as the release notes for that build.
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)"
          subject="$(printf '%s\n' "$message" | head -n 1)"
          body="$(printf '%s\n' "$message" | tail -n +2 | grep -viE '^(Co-Authored-By|Signed-off-by):' || true)"
          notes="Preview build of \`main\` at ${GITHUB_SHA::7}: ${subject}
          ${body:+
          ## What changed

          ${body}
          }
          Built by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Axcess offers this version the next time it opens. This is a preview: Apple has not checked it (notarization), and Windows does not know who made it (code signing), so each asks you to approve it the first time. The steps are at https://lsa-mis.github.io/axcess/get-started/#first-launch."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Axcess $VERSION (preview)" --notes "$notes"
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          # Publishing last keeps releases/latest pointing at a complete asset set.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Prune old preview releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("desktop-v"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
