name: CI

# The gates AGENTS.md asks for before handoff, run on every pull request and
# on main. Until this existed nothing ran pytest, ruff, mypy or the frontend
# checks, while desktop-build publishes a release from every push to main.
#
# The Playwright files under tests/ui (auto-marked `browser` by
# tests/conftest.py) hold every axe-core check of the review app, the
# desktop screens and the public site, and the sentence-case check of
# control labels. They run in the `accessibility` job on every pull request
# and push to main, so an automated WCAG 2.2 Level A or AA failure blocks
# the merge (about 13 minutes). The crawl-driven integration suites need the
# fixture site and longer; they run in `browser-suites` only on a schedule,
# on demand, or when a pull request carries the `run-browser-tests` label.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
  schedule:
    - cron: "41 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-static:
    name: Ruff and mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --frozen --no-install-project
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync ruff format --check src tests scripts
      - run: uv run --no-sync mypy

  python-tests:
    name: Unit, quality and route tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked dependencies
        # Tests import from src; installing the Axcess wheel would need the
        # packaged React dist, which this job does not build.
        run: uv sync --frozen --no-install-project
      - name: Run tests
        env:
          PYTHONPATH: src
        run: >-
          uv run --no-sync pytest -p no:cacheprovider
          tests/unit tests/quality tests/ui -m "not browser"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/audit/web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/audit/web/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `build` runs `tsc -b` before `vite build`, so it is also the typecheck.
      - run: npm run build

  desktop-node:
    name: Desktop launcher tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install launcher dependencies
        # The tests load forge.config.cjs (for @electron/fuses) but never
        # start Electron, so the Electron binary download is skipped.
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - run: npm test

  desktop-release-dry-run:
    name: Desktop release dry run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The release steps desktop-build.yml runs only after a merge, run here
      # first with the same scripts: pick the version from the published
      # tags, stamp it into desktop/package.json, and check the installer
      # names against the ones the publish job requires. The first 0.60
      # build failed at the stamp, which no pull request job had ever run.
      - name: Choose the version a release would take
        id: pick
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'desktop-v*' | node desktop/scripts/next-version.cjs | tee -a "$GITHUB_OUTPUT"
      - name: Stamp it as a release build does
        run: node desktop/scripts/stamp-version.cjs "${{ steps.pick.outputs.package_version }}" "${{ github.sha }}"
      - name: Check the installer names the publish job requires
        run: node desktop/scripts/release-names.cjs --expect "${{ steps.pick.outputs.version }}"

  accessibility:
    name: Accessibility and Playwright UI suites
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/audit/web/frontend/package-lock.json
      - name: Install locked dependencies
        run: uv sync --frozen --no-install-project
      - name: Install Chromium and Tesseract
        # Tesseract too: the New scan form shows the image text check as on
        # only when Tesseract is installed, and its UI tests expect that.
        run: |
          uv run --no-sync playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Build the review UI
        # The Playwright UI tests drive the built SPA served at /app/.
        run: |
          npm ci
          npm run build
        working-directory: src/audit/web/frontend
      - name: Install the pinned Alfa runner
        run: npm ci
        working-directory: src/audit/alfa_runner
      - name: Run Playwright UI suites
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest -p no:cacheprovider tests/ui -m browser

  browser-suites:
    name: Integration suites
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-browser-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/audit/web/frontend/package-lock.json
      - name: Install locked dependencies
        run: uv sync --frozen --no-install-project
      - name: Install Chromium and Tesseract
        run: |
          uv run --no-sync playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr
      - name: Build the review UI
        # The Playwright UI tests drive the built SPA served at /app/.
        run: |
          npm ci
          npm run build
        working-directory: src/audit/web/frontend
      - name: Install the pinned Alfa runner
        run: npm ci
        working-directory: src/audit/alfa_runner
      - name: Run integration suites
        # All of tests/integration: several suites drive Chromium through the
        # crawler without importing Playwright themselves.
        env:
          PYTHONPATH: src
        run: uv run --no-sync pytest -p no:cacheprovider tests/integration
