name: Desktop application build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-build.yml
      - desktop/**
      - src/**
      - pyproject.toml
      - uv.lock
  # A pull request that changes the desktop app or how it is built and
  # released builds both installers too, so a packaging break shows before
  # the merge rather than in the release after it. It never publishes: the
  # publish job runs only on main. Changes under src/ alone do not trigger
  # it (most pull requests), since each run costs macOS and Windows minutes.
  pull_request:
    paths:
      - .github/workflows/desktop-build.yml
      - desktop/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Choose the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      package_version: ${{ steps.pick.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One step after the highest published two-part tag: desktop-v0.60,
      # then 0.61 ... 0.69, 0.70. `version` is what people see; npm and
      # Squirrel.Windows get it as semver (0.61.0) in `package_version`.
      - id: pick
        name: Next version after the published releases
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'desktop-v*' | node desktop/scripts/next-version.cjs | tee -a "$GITHUB_OUTPUT"

  build-macos:
    name: Apple Silicon macOS desktop artifact
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        # The same script CI's release dry run calls on every pull request.
        # (npm version refused 0.60, the version package.json already has.)
        run: node scripts/stamp-version.cjs "${{ needs.version.outputs.package_version }}" "${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/desktop/playwright-browsers" uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: bash
        run: |
          brew install tesseract
          desktop/scripts/bundle-tesseract-macos.sh
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      - name: Package desktop installer
        shell: bash
        working-directory: desktop
        run: |
          for attempt in 1 2 3; do
            if npm run make; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Packaging failed; retrying (attempt $((attempt + 1)) of 3)."
            sleep $((attempt * 10))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-macos-apple-silicon
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x64 desktop artifact
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        # The same script CI's release dry run calls on every pull request.
        # (npm version refused 0.60, the version package.json already has.)
        run: node scripts/stamp-version.cjs "${{ needs.version.outputs.package_version }}" "${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\desktop\playwright-browsers"
          uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          desktop/scripts/bundle-tesseract-windows.ps1
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      # Forge packages the app; electron-builder wraps it in the NSIS
      # installer and writes latest.yml (scripts/make-windows-installer.cjs).
      - name: Package desktop installer
        shell: pwsh
        working-directory: desktop
        run: npm run make:windows
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-windows-x64
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish preview release
    needs: [version, build-macos, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: desktop-v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*-Setup.exe' -o -name '*-Setup.exe.blockmap' -o -name 'latest.yml' \) -exec cp {} release/ \;
          ls -l release
          # latest.yml is the Windows update feed: installed copies read it
          # to find and check the new installer (src/updates.cjs).
          for required in "Axcess-$VERSION-arm64.dmg" "Axcess-$VERSION-Setup.exe" latest.yml; do
            test -f "release/$required" || { echo "Missing release asset: $required"; exit 1; }
          done
          # Version-less copies give the public site permanent download links:
          # https://github.com/lsa-mis/axcess/releases/latest/download/<name>
          # always resolves to the newest release's asset of that name.
          cp "release/Axcess-$VERSION-arm64.dmg" release/Axcess-macOS-AppleSilicon.dmg
          cp "release/Axcess-$VERSION-Setup.exe" release/Axcess-Windows-x64-Setup.exe
          ls -l release
      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          # The whole commit message, not just its subject: the body of the
          # commit on main is written as the release notes for that build.
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)"
          subject="$(printf '%s\n' "$message" | head -n 1)"
          body="$(printf '%s\n' "$message" | tail -n +2 | grep -viE '^(Co-Authored-By|Signed-off-by):' || true)"
          notes="Preview build of \`main\` at ${GITHUB_SHA::7}: ${subject}
          ${body:+
          ## What changed

          ${body}
          }
          Built by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Installed copies of Axcess offer this build on their next launch. The macOS build is an ad-hoc signed preview: right-click Axcess and choose Open on first launch."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Axcess preview $VERSION" --notes "$notes"
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          # Publishing last keeps releases/latest pointing at a complete asset set.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Prune old preview releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("desktop-v"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
