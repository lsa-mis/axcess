name: Desktop application build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-build.yml
      - desktop/**
      - src/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Apple Silicon macOS desktop artifact
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        run: |
          npm version "0.1.${{ github.run_number }}" --no-git-tag-version
          npm pkg set "config.buildCommit=${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/desktop/playwright-browsers" uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: bash
        run: |
          brew install tesseract
          desktop/scripts/bundle-tesseract-macos.sh
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      - name: Package desktop installer
        shell: bash
        working-directory: desktop
        run: |
          for attempt in 1 2 3; do
            if npm run make; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Packaging failed; retrying (attempt $((attempt + 1)) of 3)."
            sleep $((attempt * 10))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-macos-apple-silicon
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x64 desktop artifact
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        run: |
          npm version "0.1.${{ github.run_number }}" --no-git-tag-version
          npm pkg set "config.buildCommit=${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\desktop\playwright-browsers"
          uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          desktop/scripts/bundle-tesseract-windows.ps1
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      - name: Package desktop installer
        shell: pwsh
        working-directory: desktop
        run: |
          npm run premake
          npm exec electron-forge make
          node scripts/verify-packaged.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-windows-x64
          path: desktop/out/make/**
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish preview release
    needs: [build-macos, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: 0.1.${{ github.run_number }}
      TAG: desktop-v0.1.${{ github.run_number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*-Setup.exe' -o -name 'RELEASES' -o -name '*.nupkg' \) -exec cp {} release/ \;
          ls -l release
          for required in "Axcess-$VERSION-arm64.dmg" "Axcess-$VERSION-Setup.exe" RELEASES; do
            test -f "release/$required" || { echo "Missing release asset: $required"; exit 1; }
          done
          # Version-less copies give the public site permanent download links:
          # https://github.com/lsa-mis/axcess/releases/latest/download/<name>
          # always resolves to the newest release's asset of that name.
          cp "release/Axcess-$VERSION-arm64.dmg" release/Axcess-macOS-AppleSilicon.dmg
          cp "release/Axcess-$VERSION-Setup.exe" release/Axcess-Windows-x64-Setup.exe
          ls -l release
      - name: Create or update the release
        shell: bash
        run: |
          set -euo pipefail
          # The whole commit message, not just its subject: the body of the
          # commit on main is written as the release notes for that build.
          message="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.message)"
          subject="$(printf '%s\n' "$message" | head -n 1)"
          body="$(printf '%s\n' "$message" | tail -n +2 | grep -viE '^(Co-Authored-By|Signed-off-by):' || true)"
          notes="Preview build of \`main\` at ${GITHUB_SHA::7}: ${subject}
          ${body:+
          ## What changed

          ${body}
          }
          Built by workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}.

          Installed copies of Axcess offer this build on their next launch. The macOS build is an ad-hoc signed preview: right-click Axcess and choose Open on first launch."
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
              --title "Axcess preview $VERSION" --notes "$notes"
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          # Publishing last keeps releases/latest pointing at a complete asset set.
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Prune old preview releases
        shell: bash
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("desktop-v"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
            | while read -r tag; do
                [ -n "$tag" ] || continue
                gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
