name: Desktop test build

# Builds the macOS, Windows and Linux download files as workflow artifacts
# (kept 14 days) and never publishes them. It runs on its own so a packaging
# break shows early. A release that installed apps are offered comes only from
# desktop-release.yml ("Desktop preview release"), which a person runs by hand
# on main and which calls this file for its builds (workflow_call).
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/desktop-build.yml
      - desktop/**
      - src/**
      - pyproject.toml
      - uv.lock
  # A pull request that changes the desktop app or how it is built builds
  # the installers too, so a packaging break shows before the merge.
  # Changes under src/ alone do not trigger it (most pull requests), since
  # each run costs macOS and Windows minutes.
  pull_request:
    paths:
      - .github/workflows/desktop-build.yml
      - .github/workflows/desktop-release.yml
      - desktop/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
  workflow_call:
    outputs:
      version:
        description: The version the builds were stamped with, such as 0.2.1.
        value: ${{ jobs.version.outputs.version }}
      package_version:
        description: The version written into desktop/package.json.
        value: ${{ jobs.version.outputs.package_version }}

permissions:
  contents: read

# A new test build on the same branch cancels the one still running. Called
# from desktop-release.yml, github.workflow is the caller's name, so a test
# build never cancels a release's builds, nor a release a test build's.
concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Choose the release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      package_version: ${{ steps.pick.outputs.package_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The next version on the release line the team chose
      # (config.releaseLine in desktop/package.json, "0.2"): one step after
      # the highest desktop-v0.2.N tag, or 0.2.0 when there is none. Semver
      # throughout, so `version` and `package_version` are the same.
      - id: pick
        name: Next version after the published releases
        shell: bash
        run: |
          set -euo pipefail
          git ls-remote --tags --refs origin 'desktop-v*' | node desktop/scripts/next-version.cjs | tee -a "$GITHUB_OUTPUT"

  build-macos:
    name: Apple Silicon macOS desktop artifact
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        # The same script CI's release dry run calls on every pull request.
        # (npm version refuses the version package.json already has.)
        run: node scripts/stamp-version.cjs "${{ needs.version.outputs.package_version }}" "${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/desktop/playwright-browsers" uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: bash
        run: |
          brew install tesseract
          desktop/scripts/bundle-tesseract-macos.sh
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      - name: Package desktop installer
        shell: bash
        working-directory: desktop
        run: |
          for attempt in 1 2 3; do
            if npm run make; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Packaging failed; retrying (attempt $((attempt + 1)) of 3)."
            sleep $((attempt * 10))
          done
      # Only the file people download; Forge's own zip stays behind.
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-macos-apple-silicon
          path: desktop/out/make/*.dmg
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Windows x64 desktop artifact
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        # The same script CI's release dry run calls on every pull request.
        # (npm version refuses the version package.json already has.)
        run: node scripts/stamp-version.cjs "${{ needs.version.outputs.package_version }}" "${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "$PWD\desktop\playwright-browsers"
          uv run playwright install chromium
      - name: Bundle Tesseract OCR
        shell: pwsh
        # Retried: the Chocolatey community feed sometimes answers 504
        # Gateway Timeout, and one bad minute there skipped a whole release.
        # Success is judged by tesseract.exe being on disk, not by choco's
        # exit code, since the bundle script needs exactly that file.
        run: |
          $tesseract = Join-Path $env:ProgramFiles "Tesseract-OCR\tesseract.exe"
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install tesseract --yes --no-progress
            if (Test-Path $tesseract) { break }
            if ($attempt -eq 4) { throw "Tesseract did not install after 4 attempts." }
            Write-Host "Tesseract install failed; retrying (attempt $($attempt + 1) of 4)."
            Start-Sleep -Seconds (30 * $attempt)
          }
          desktop/scripts/bundle-tesseract-windows.ps1
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      # Forge packages the app; electron-builder wraps it in the NSIS
      # installer and writes latest.yml (scripts/make-windows-installer.cjs).
      - name: Package desktop installer
        shell: pwsh
        working-directory: desktop
        run: npm run make:windows
      # Axe.Windows scans each setup and uninstall screen through UI
      # Automation, installing and removing Axcess on this runner. An error
      # fails the build, so an installer with one is never published.
      - name: Check the installer's accessibility
        shell: pwsh
        working-directory: desktop
        run: |
          $installer = (Get-ChildItem out/make/nsis/*-Windows-Installer.exe | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-installer-accessibility.ps1 -Installer $installer -OutputDirectory out/installer-a11y
          exit $LASTEXITCODE
      # Axe.Windows does not measure colour contrast: this measures every
      # text element on the screenshots the step above saved, 4.5:1 or
      # better (SC 1.4.3). The screenshots are uploaded with the scans.
      - name: Check the installer's text contrast
        run: uv run --no-sync python desktop/scripts/installer_contrast.py desktop/out/installer-a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axcess-windows-installer-accessibility
          path: desktop/out/installer-a11y/**
          if-no-files-found: ignore
          retention-days: 14
      # The installer with the two files its updates read, and the zip;
      # not electron-builder's working files (builder-debug.yml).
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-windows-x64
          path: |
            desktop/out/make/nsis/*-Windows-Installer.exe
            desktop/out/make/nsis/*-Windows-Installer.exe.blockmap
            desktop/out/make/nsis/latest.yml
            desktop/out/make/zip/*-Windows-Portable.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Linux x64 AppImage
    needs: version
    # The oldest Ubuntu GitHub offers: an AppImage runs on distros whose
    # glibc is as new as the build machine's or newer (Ubuntu 22.04 has
    # 2.35), since the PyInstaller backend and bundled Tesseract use the
    # host's glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            src/audit/web/frontend/package-lock.json
            src/audit/alfa_runner/package-lock.json
      - run: npm ci
        working-directory: src/audit/web/frontend
      - run: npm run build
        working-directory: src/audit/web/frontend
      - run: npm ci
        working-directory: src/audit/alfa_runner
      - run: npm ci
        working-directory: desktop
      - name: Stamp build version
        shell: bash
        working-directory: desktop
        run: node scripts/stamp-version.cjs "${{ needs.version.outputs.package_version }}" "${{ github.sha }}"
      - run: uv sync --group desktop
      - name: Bundle Chromium
        # --with-deps installs the system libraries Chromium needs on this
        # runner, for verify-packaged; desktop Linux systems have them.
        shell: bash
        run: PLAYWRIGHT_BROWSERS_PATH="$PWD/desktop/playwright-browsers" uv run playwright install --with-deps chromium
      - name: Bundle Tesseract OCR
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng
          desktop/scripts/bundle-tesseract-linux.sh
      - name: Bundle Python backend
        run: uv run pyinstaller --clean --noconfirm --distpath desktop/backend-dist --workpath build/desktop-pyinstaller desktop/backend.spec
      # Forge packages the app; electron-builder wraps it in the AppImage
      # (scripts/make-linux-appimage.cjs); verify-packaged then runs the
      # bundled backend's own checks, OCR included.
      - name: Package desktop AppImage
        working-directory: desktop
        run: npm run make:linux
      - uses: actions/upload-artifact@v4
        with:
          name: axcess-linux-x64
          path: desktop/out/make/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
