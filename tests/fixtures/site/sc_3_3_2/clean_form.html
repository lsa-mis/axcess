<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Well-labelled form</title></head>
<body>
  <form>
    <label for="email">Email address</label>
    <input id="email" type="email">

    <label>Phone number <input type="tel"></label>

    <label for="dob">Date of birth</label>
    <input id="dob" type="text" aria-describedby="dob-fmt">
    <span id="dob-fmt">Format: MM/DD/YYYY</span>
  </form>
</body>
</html>
