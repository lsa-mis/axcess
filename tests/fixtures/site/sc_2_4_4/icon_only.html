<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon-only links — unlabeled</title></head>
<body>
  <nav>
    <!-- Two icon-only links with NO accessible name. Both should be flagged. -->
    <a href="/search"><svg width="20" height="20" aria-hidden="true"><path d="M0 0h20v20H0z"/></svg></a>
    <a href="/cart"><img src="cart.svg" alt=""></a>
  </nav>
</body>
</html>
