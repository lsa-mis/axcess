<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Focus: partly hidden, and hidden on purpose (no SC 2.4.11 failure)</title></head>
<body style="margin:0;">
  <!-- The same solid 120px bar as obscured.html. The page does not scroll,
       so where each link sits is the whole story. -->
  <header style="position:fixed;top:0;left:0;width:100%;height:120px;background:#003f75;z-index:1000;"></header>

  <!-- 60px to 160px: the bar covers the top 60px and the link's centre
       (110px), but the bottom 40px shows. SC 2.4.11 fails only when the
       component is entirely hidden, so this must NOT be reported. (No part
       hidden at all is SC 2.4.12, Level AAA, which the check does not test.) -->
  <a href="#partly" id="partly-hidden" style="display:block;position:absolute;top:60px;left:20px;width:300px;height:100px;background:#f5f5f5;">Partly under the bar</a>

  <!-- A visually hidden link (the .sr-only pattern) that sits under the
       bar. It paints no pixel wherever it is, so the bar is not what hides
       it. Whether focus on it can be seen is a different question (SC 2.4.7
       Focus Visible), not this rule's. Must NOT be reported. -->
  <a href="#main" id="sr-only-skip" style="position:absolute;top:10px;left:10px;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Skip to main content</a>

  <a href="#ok" id="visible-link" style="position:absolute;top:400px;left:20px;">Clearly visible</a>
</body>
</html>
