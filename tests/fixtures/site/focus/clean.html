<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Focus clean</title></head>
<body style="margin:0;height:1200px;">
  <!-- No sticky/fixed overlay — every focusable element is visible. -->
  <a href="#a" style="position:absolute;top:200px;left:20px;">Visible link one</a>
  <a href="#b" style="position:absolute;top:320px;left:20px;">Visible link two</a>
  <button style="position:absolute;top:440px;left:20px;">A visible button</button>
</body>
</html>
