<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Gallery</title></head>
<body>
  <h1>Image gallery</h1>
  <nav>
    <a href="/">Home</a>
  </nav>

  <figure>
    <img src="/images/blank.png" alt="A plain gray square"
         srcset="/images/blank.png 1x, /images/blank@2x.png 2x">
    <figcaption>Plain gray square (responsive)</figcaption>
  </figure>

  <picture>
    <source srcset="/images/blank@2x.png" media="(min-width: 800px)">
    <img src="/images/photo.jpg" alt="" role="presentation">
  </picture>

  <p>
    An inline SVG logo containing visible text:
    <svg width="100" height="40" xmlns="http://www.w3.org/2000/svg" aria-label="Acme logo">
      <text x="10" y="25" font-size="20">ACME</text>
    </svg>
    End of SVG.
  </p>

  <p>An icon-only SVG (no text) should not be flagged:
    <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
      <rect width="20" height="20" fill="red"></rect>
    </svg>
  </p>

  <img src="/images/text-banner.png" alt="Banner">
  <img src="/images/missing.png" alt="Missing intentionally">
</body>
</html>
