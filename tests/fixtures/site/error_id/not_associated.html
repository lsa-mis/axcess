<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Error visible but not associated</title></head>
<body>
  <h1>Sign up</h1>
  <!-- A visible error message sits next to the field, but nothing links it to
       the control: no aria-invalid, no aria-describedby/aria-errormessage.
       Assistive technology never announces it. Expect one
       error-not-programmatically-associated on #email. -->
  <form>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <span class="error">This field is required.</span>
    </div>
    <button type="submit">Sign up</button>
  </form>
</body>
</html>
