<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Clean form — error properly identified</title></head>
<body>
  <h1>Sign up</h1>
  <!-- A required field is invalid on load, but the error is shown in text AND
       tied to the field with aria-invalid + aria-describedby. The probe must
       NOT flag this (false-positive guard). -->
  <form>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required
             aria-invalid="true" aria-describedby="email-err">
      <span id="email-err" class="error">Enter a valid email address.</span>
    </div>
    <button type="submit">Sign up</button>
  </form>
</body>
</html>
