# Per-rule audit-report metadata.
#
# Drives `audit/exports/audit_report.py`, which produces the
# senior-engineer-style audit report. Each entry below corresponds to:
#
#   * `axe_rules[<rule_id>]`, one per axe-core rule we want to surface
#     in proper card form. Rules NOT listed here still appear in the
#     report, but flagged "human review needed" because we don't have a
#     templated fix.
#   * `image_findings[<key>]`, keyed on `<classification>_<adequacy>`
#     so it matches the synthesizer's grouping output (e.g.
#     `essential_missing`, `logo_adequate`).
#   * `semantic_criteria[<sc>]`, keyed on the WCAG criterion: the AI review's
#     cards, which the browser checks (keyboard, zoom and layout, focus,
#     motion and reading order) also use for their criterion.
#   * `alfa_rules[<sia-rN>]`, one per Rule check (Alfa) rule. Guidance only:
#     an Alfa issue keeps its own title and criterion, so these cards carry
#     no title or wcag_* fields (issues._ALFA_OWN_FIELDS).
#
# The issue page shows these words, so they follow docs/plain-language.md
# (AGENTS.md "Interface language"): lead with the point, short sentences,
# "fix" not "remediate", "occurrence" not "finding". fix_steps are rendered
# as HTML with <code> only (escape < and > inside it as &lt; &gt;);
# what_happening honours <code>; every other field is shown as plain text.
# Each card was written from the rule's own documentation (Deque University,
# Siteimprove Alfa, W3C ACT rules and Understanding WCAG) and checked a
# second time against those sources.
#
# Owner taxonomy: dev | editor | designer | content
#   - dev      = changes a template, CSS rule, or build config
#   - editor   = updates page content in the CMS
#   - designer = adjusts a design token, component, or layout
#   - content  = rewrites copy, captions, or labels
#
# Effort taxonomy:
#   - under_15m   = a single in-place fix per page (ship today)
#   - under_2h    = one shared rule / token / template change
#   - multi_sprint = structural rework, design-system overhaul, content audit
#
# Confidence default: high | medium | low
#   - high    = the rule itself is reliable; the fix is mechanical
#   - medium  = depends on local context (alt-text wording, label clarity)
#   - low     = needs human review to confirm the issue is real

axe_rules:

  image-alt:
    title: "Images have no alt text for screen readers"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      An image (<code>&lt;img&gt;</code>) has no alt text (the text a screen
      reader reads for an image). The rule check (axe) found no
      <code>alt</code> attribute, <code>aria-label</code>,
      <code>aria-labelledby</code> or <code>title</code>, and no role that
      marks it as decoration (<code>role="none"</code> or
      <code>role="presentation"</code>). An <code>alt</code> that holds only a
      space, such as <code>alt=" "</code>, also fails. The check only sees
      whether alt text exists, not whether it is good.
    why_matters: >-
      Blind and deafblind people who use a screen reader or a braille display
      get nothing from the image. Without an alt attribute, screen readers
      often read the file name instead, such as "image.jpg".
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Decide what the image does on this page. If it gives information,
        write alt text that says what it means, not how it looks. For example,
        write "Acme logo", not "blue square with letters": <code>&lt;img
        src="logo.png" alt="Acme logo"&gt;</code>. Do not use the file name or
        the word "image".
      - >-
        If the image is only decoration, add an empty alt:
        <code>alt=""</code>, with nothing between the quotes. Screen readers
        then skip it.
      - >-
        An image that is the only content of a link or a button needs alt text
        that says what it does. For a link, say where it goes: <code>&lt;a
        href="/search"&gt;&lt;img src="search.svg"
        alt="Search"&gt;&lt;/a&gt;</code>.
      - >-
        Change the content management system (CMS) field or the page template
        so every image always gets an <code>alt</code> attribute, even an
        empty one.
    fix_options:
      - label: "Describe the image's meaning in its alt attribute"
        approach: >-
          Decide what each image tells the reader where it sits, and write
          that meaning into alt. Describe the purpose, not the look: "Acme
          logo", not "blue square with letters".
        watch_out: >-
          The same image file can need different alt text on different pages.
          A logo that is also a link to the home page should say where the
          link goes, not what the picture shows.
      - label: "Mark it as decoration and carry the meaning in nearby text"
        approach: >-
          If the image only repeats text next to it, or is only ornament, set
          alt="" so screen readers skip it. Make sure the text around it
          carries the information.
        watch_out: >-
          alt="" on the only source of some information hides that information
          completely. An image with alt="" that is the only content of a link
          leaves the link with no name at all.
    verify_manual: >-
      Turn on a screen reader (VoiceOver: Cmd+F5 on macOS; NVDA: Ctrl+Alt+N on
      Windows). Tab does not stop on images, so read line by line (VoiceOver:
      Control+Option+Right Arrow; NVDA: Down Arrow). You should hear alt text
      that makes sense for each image that gives information, and nothing for
      decorative images.
    verify_automated: "Scan again and see if this image is still found."
    acceptance: >-
      Every image on the affected pages has alt text that says what it means,
      or alt="" when it is only decoration.
    confidence_default: high

  color-contrast:
    title: "Text does not stand out enough from its background"
    wcag_sc: "1.4.3"
    wcag_name: "Contrast (Minimum)"
    wcag_level: "AA"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) measured the contrast between the text color and
      its background color, and it is too low. Normal text needs a ratio of at
      least 4.5:1, and large text needs 3:1. Large text is at least 18pt
      (24px), or at least 14pt (about 18.7px) and bold. The rule check does
      not report text it cannot measure, such as text over an image or a
      gradient.
    why_matters: >-
      People with low vision or color blindness may not be able to read text
      that is too close in color to its background. Glare from bright sunlight
      makes such text hard for everyone to read.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence and read the measured ratio, the two colors, the
        font size and the font weight. For example: "color contrast of 4.16
        (foreground color: #3170fb, background color: #fafafc, font size:
        9.0pt (12px), font weight: normal). Expected contrast ratio of 4.5:1".
        The foreground color is the text color.
      - >-
        Put the two colors into a contrast checker, such as the WebAIM
        Contrast Checker. Find a darker text color or a lighter background
        that reaches 4.5:1, or 3:1 for large text. Do not round up: 4.499:1
        does not pass.
      - >-
        Change the color where the whole site sets it, such as a shared color
        setting (design token) or a CSS custom property like
        <code>--link-color</code>. One setting often colors many elements, so
        one change can fix many occurrences.
      - >-
        Check the same text in every state people can see, such as hover,
        focus and visited.
    fix_options:
      - label: "Change the text color"
        approach: >-
          Make the text darker or lighter until it reaches 4.5:1 against its
          real background, or 3:1 for large text.
        watch_out: >-
          Check hover, focus and visited states too. Measure against what is
          really behind the text, such as an image or gradient, not only the
          background color set in the code.
      - label: "Put the text on its own background"
        approach: >-
          Change the background, or place the text on a solid panel or a
          see-through dark or light layer (scrim). Then contrast no longer
          depends on the image behind it.
        watch_out: >-
          Measure a see-through layer where the image under it is closest in
          brightness to the text, not an average of the whole image.
      - label: "Make the text large enough to count as large text"
        approach: >-
          Text of at least 24px, or about 18.7px and bold, only needs 3:1. A
          bigger size or a bold weight can fix a near miss without new colors.
        watch_out: >-
          This is a lower bar, not an exemption. It does not help small
          labels, and bigger text can change the layout, so check the page
          again.
    verify_manual: >-
      In Chrome's developer tools, use the Inspect tool and point at the text:
      the pop-up shows the contrast ratio. Check text over images or gradients
      by eye, because the rule check does not report it. Text in a logo, or on
      a control that is turned off (disabled), has no contrast requirement.
    verify_automated: "Scan again and see if this text is still found."
    acceptance: >-
      Every piece of text on the affected pages reaches 4.5:1 against its
      background, or 3:1 when it is large text.
    confidence_default: high

  link-name:
    title: "Links have no name for screen readers"
    wcag_sc: "2.4.4"
    wcag_name: "Link Purpose (In Context)"
    wcag_level: "A"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      A link (<code>&lt;a href&gt;</code>) has no name that a screen reader
      can read (accessible name). The rule check (axe) found no text inside
      the link that a screen reader can read, and no <code>aria-label</code>,
      <code>aria-labelledby</code> or <code>title</code>. Common causes are an
      empty link, a link with only an icon, and a link around an image with no
      alt text. The check only sees whether a name exists, not whether it is
      clear.
    why_matters: >-
      Screen reader users do not know where the link goes, on the page or in
      their list of links. The screen reader may say only "link", or read out
      an image's file name. People who use voice control cannot say the link's
      name to click it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        If the link holds only an image, give the image alt text that says
        where the link goes: <code>&lt;a href="/search"&gt;&lt;img
        src="search.svg" alt="Search"&gt;&lt;/a&gt;</code>.
      - >-
        If the link holds only an icon, add <code>aria-label="Search"</code>
        to the link, or visually hidden text inside it.
      - >-
        If the link has text, make sure <code>display: none</code> or
        <code>aria-hidden="true"</code> does not hide it from screen readers.
        If an empty link sits next to a link to the same page, remove the
        empty one.
      - >-
        Make each name say where the link goes. A list of links that all say
        "read more" or "click here" does not tell people which link is which.
    fix_options:
      - label: "Give the link visible text"
        approach: >-
          Replace an empty or icon-only link with text, or put text next to
          the icon inside the link. Then every user sees the same name a
          screen reader hears.
        watch_out: >-
          A name is not always a clear purpose. "Read more" repeated twenty
          times passes this rule check but can still fail WCAG 2.4.4 Link
          Purpose (In Context).
      - label: "Name it for screen readers only"
        approach: >-
          Add an aria-label, or add visually hidden text inside the link with
          a screen-reader-only CSS class (often called sr-only).
        watch_out: >-
          aria-label replaces any visible text in the link. If the spoken name
          no longer contains the words on screen, voice control users may not
          be able to click it by saying those words. Where visible text
          exists, add to it with hidden text instead.
      - label: "Point to text that is already on the page"
        approach: >-
          When the link's purpose is written next to it, such as a card title,
          give that text an id and point to it with aria-labelledby.
        watch_out: >-
          The id must exist and be unique on the page. If two elements share
          the id, the link can get the wrong name.
    verify_manual: >-
      Turn on a screen reader and open its list of links (VoiceOver:
      Control+Option+U, then choose Links; NVDA: Insert+F7). Every link should
      have a name that says where it goes. Then press Tab to each fixed link
      and listen to what the screen reader says.
    verify_automated: "Scan again and see if this link is still found."
    acceptance: >-
      Every link on the affected pages has a name a screen reader can read,
      and the name says where the link goes.
    confidence_default: high

  label:
    title: "Form fields have no name for screen readers"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      A form field has no name that a screen reader can read (accessible
      name). The rule check (axe) looks at every <code>&lt;input&gt;</code>
      except buttons and hidden fields, and at every
      <code>&lt;textarea&gt;</code>. This field has no
      <code>&lt;label&gt;</code> with text around it or pointing to it, and no
      <code>aria-label</code>, <code>aria-labelledby</code>,
      <code>title</code> or <code>placeholder</code>. A label hidden from
      screen readers does not count, and drop-down lists
      (<code>&lt;select&gt;</code>) have their own rule (select-name).
    why_matters: >-
      A screen reader says only the kind of field, such as "edit text", and
      not what to enter. People who use voice control cannot say the field's
      name to move to it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Add a visible label and tie it to the field: <code>&lt;label
        for="email"&gt;Email&lt;/label&gt; &lt;input id="email"
        type="email"&gt;</code>. The <code>for</code> value must match the
        field's <code>id</code> exactly. A visible label helps everyone, not
        only screen reader users.
      - >-
        Or wrap the field in its label: <code>&lt;label&gt;&lt;input
        type="checkbox"&gt; Send me updates&lt;/label&gt;</code>.
      - >-
        If a <code>&lt;label&gt;</code> element does not fit, name the field
        another way. Give text already on screen an <code>id</code> and point
        to it with <code>aria-labelledby="that-id"</code>, or add
        <code>aria-label="Search"</code> to the field.
      - >-
        Do not use <code>placeholder</code> as the only label. It passes this
        rule check, but it disappears when the person starts typing. Browsers
        also usually show it in a pale color that does not meet the WCAG
        contrast minimum.
    fix_options:
      - label: "Tie a visible label to the field"
        approach: >-
          Give the field a label element with for="..." that matches its id,
          or wrap the field inside the label.
        watch_out: >-
          The for value must match the field's id exactly, and every id must
          be unique. Placeholder text is not a label: it disappears as soon as
          the person types.
      - label: "Name the field for screen readers only"
        approach: >-
          Use aria-label where a visible label would only repeat what is
          already clear, such as a search field right next to a Search button.
        watch_out: >-
          A field with no visible label is harder for everyone, not only for
          screen reader users. Keep this for the few cases where the field's
          purpose is clear from what is around it.
      - label: "Point to text that is already on the page"
        approach: >-
          Use aria-labelledby to name the field from text already on screen,
          such as a table row or section heading.
        watch_out: >-
          Ids must be unique. When you point to several ids, the name is read
          in the order you list them, not the order on screen.
    verify_manual: >-
      Turn on a screen reader and press Tab to each field: you should hear
      what to enter, such as "Email, edit text". Then click each visible
      label. A text field should get the cursor and a checkbox should change,
      which shows the label is tied to it.
    verify_automated: "Scan again and see if this field is still found."
    acceptance: >-
      Every form field on the affected pages has a name a screen reader reads,
      from a visible label where possible.
    confidence_default: high

  html-has-lang:
    title: "The page does not say what language it is in"
    wcag_sc: "3.1.1"
    wcag_name: "Language of Page"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (axe) looks for a <code>lang</code> attribute on the
      page's top element (<code>&lt;html&gt;</code>), which names the page's
      main language. Here it is missing or empty, and on an HTML page
      <code>xml:lang</code> alone does not count. The check does not test
      whether the value is a real language code, because a separate rule
      (html-lang-valid) does that.
    why_matters: >-
      Without it, screen readers use the user's default language, so blind
      people may hear words pronounced wrongly. People with reading or
      learning disabilities who use text-to-speech tools have the same
      problem. Translation tools can use it too, to recognize the page's
      language.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        In the base page template, add the main language to the
        <code>&lt;html&gt;</code> element: <code>&lt;html
        lang="en"&gt;</code>. Use a standard language code (BCP 47), such as
        <code>en</code>, <code>es</code>, <code>en-US</code> or
        <code>fr-CA</code>.
      - >-
        If the page uses several languages, use the one used most. If they are
        used equally, use the one that comes first.
      - >-
        If part of the page is in another language, add <code>lang</code> to
        the element that holds it: <code>&lt;span
        lang="es"&gt;Hola&lt;/span&gt;</code>.
      - >-
        For a right-to-left language, such as Arabic, also add
        <code>dir="rtl"</code>.
    fix_options:
      - label: "Set lang on the html element in the template"
        approach: >-
          Add lang to the page template the server sends, so the language is
          right before any JavaScript runs.
        watch_out: >-
          Some sites build each page with JavaScript in the browser
          (single-page apps). If lang is set only by the script, the page has
          no language until the script runs. A site with a different language
          per page must also update lang each time the page changes.
      - label: "Take the language from the content settings"
        approach: >-
          Where the content management system (CMS) or translation system
          already knows each page's language, write that value into the html
          element. Do not fix one language for the whole site.
        watch_out: >-
          The value must be a valid BCP 47 code: pt-BR, not pt_br. Passages in
          another language still need their own lang on the element that holds
          them.
    verify_manual: >-
      Open the page source or the browser's developer tools, and check that
      the html element has a lang value that matches the page's main language.
      Then listen to a paragraph with a screen reader: it should use the voice
      and pronunciation of that language.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every affected page has a lang value on its html element that matches
      the page's main language.
    confidence_default: high

  tabindex:
    title: "A tabindex above 0 changes the Tab order"
    wcag_sc: "2.4.3"
    wcag_name: "Focus Order"
    wcag_level: "A"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      The rule check (axe) flags every element with a <code>tabindex</code>
      above 0, such as <code>tabindex="1"</code>, and treats this rule as a
      best practice. These elements get keyboard focus before all other
      elements, wherever they sit on the page, so the Tab order no longer
      follows the page. WCAG 2.4.3 Focus Order counts this as a failure only
      when the new order loses meaning or makes the page hard to use
      (Technique F44). A person must decide.
    why_matters: >-
      Keyboard and screen reader users cannot predict where focus will go
      next, and people who find reading hard can get lost. An element can also
      seem to be skipped: it got focus first, so reaching it again means going
      through the whole page.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Change each <code>tabindex</code> above 0 to
        <code>tabindex="0"</code>. Remove it completely from elements that
        already take focus, such as links, buttons and form fields.
      - >-
        If the order is then wrong, move the element in the page code (HTML)
        so the code order matches the reading order. CSS such as
        <code>float</code> or <code>position: absolute</code> can show things
        in a different order from the code.
      - >-
        A skip link does not need a tabindex. Put it first inside
        <code>&lt;body&gt;</code>, as in <code>&lt;a href="#content"&gt;Skip
        to content&lt;/a&gt;</code>, and it is reached first.
      - >-
        For a set of tabs (<code>role="tab"</code>), let only the selected tab
        take Tab focus with <code>tabindex="0"</code>. Give the other tabs
        <code>tabindex="-1"</code>, and move between tabs with the arrow keys.
        This is the tabs pattern in the W3C ARIA Authoring Practices Guide.
    fix_options:
      - label: "Remove the positive tabindex values"
        approach: >-
          Delete tabindex="1" and higher, and let the order of the page code
          set the focus order. Where the order is really wrong, move the
          elements in the code.
        watch_out: >-
          One positive value jumps ahead of the whole page, so removing it
          changes the order of everything around it. Test the whole page
          again, not only the element you changed.
      - label: "Use an element that takes focus by itself"
        approach: >-
          Replace a div that has a tabindex with a real button or link. It
          gets focus, keyboard use and the right role with no extra code.
        watch_out: >-
          Changing the tag changes the default look. A button inside a form
          needs type="button" so it does not send the form.
      - label: "Keep it out of the Tab order and focus it with script"
        approach: >-
          Use tabindex="-1" on an element that should not be reached with Tab,
          and move focus to it with JavaScript only when needed.
        watch_out: >-
          People can no longer reach it with Tab, so your script must move
          focus there every time it is needed. Do not use this for links,
          buttons or fields people need to reach.
    verify_manual: >-
      Start at the top of the page and press Tab through all of it. Focus
      should follow the reading order, with no element getting focus first out
      of place. Every link, button and field should get focus once, where it
      sits on the page.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      No element on the affected pages has a tabindex above 0, and Tab moves
      through each page in reading order.
    confidence_default: high

  target-size:
    title: "Buttons or links are too small and too close together"
    wcag_sc: "2.5.8"
    wcag_name: "Target Size (Minimum)"
    wcag_level: "AA"
    abilities_affected: [motor]
    what_happening: >-
      The rule check (axe) measures each control that can take focus, such as
      a link or button, but not links inside a sentence. A control fails when
      it is under 24 by 24 CSS pixels (the size unit in page code) and too
      close to another control. Too close means a circle 24 pixels across,
      centered on it, touches another control, or the same circle around
      another small control. This requirement is new in WCAG 2.2.
    why_matters: >-
      Small controls that sit close together are easy to miss, so people tap
      the wrong one or have to try again. This affects people with hand
      tremors or limited hand control, and people who use a phone with one
      hand or have large fingers.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Use the element locator (CSS selector) in the occurrence to find the
        control. The occurrence message gives its size, for example "105.9px
        by 22.4px". It also gives the width of the free space around it, such
        as "Safe clickable space has a diameter of 22.4px".
      - >-
        Make the link or button itself at least 24 by 24 pixels, not only the
        icon inside it. A link is inline by default, and
        <code>min-height</code> does not work on inline elements. Set a
        display value first: <code>.toolbar a { display: inline-block;
        min-width: 24px; min-height: 24px; }</code>
      - >-
        If the control cannot grow, add space around it instead, so a 24-pixel
        circle centered on each small control touches no other control or
        circle. For a list of links, a gap between items often works:
        <code>.people-list li + li { margin-top: 4px; }</code>
      - >-
        If you can, aim for 44 by 44 pixels. That also meets WCAG 2.5.5 Target
        Size (Enhanced), Level AAA.
    fix_options:
      - label: "Make the control's clickable area bigger"
        approach: >-
          Grow the clickable box to at least 24 by 24 CSS pixels. Add padding
          or a minimum size to the link or button, not only to the icon inside
          it.
        watch_out: >-
          Top and bottom padding on an inline link does not push lines apart,
          so the bigger box can cover the lines above and below. Use
          inline-block, and check that the larger control does not overlap its
          neighbors.
      - label: "Space the controls further apart"
        approach: >-
          WCAG 2.5.8 is also met when a 24-pixel circle centered on each small
          control does not touch another control or its circle. Extra spacing
          can fix it where the design cannot grow.
        watch_out: >-
          The spacing is measured between controls, so it stops working as
          soon as someone adds a control nearby or makes a row denser.
      - label: "Offer a larger control that does the same thing"
        approach: >-
          WCAG allows a small control when another control on the same page
          does the same job and meets the size rule.
        watch_out: >-
          The rule check (axe) cannot see this exception, so it still reports
          the small control. A person has to check that the larger control
          exists, then mark the occurrence Not a problem (false positive).
    verify_manual: >-
      In your browser's developer tools, select each flagged control and read
      its width and height on the Computed tab. Each should be at least 24 by
      24 pixels, or a 24-pixel circle centered on it should touch no other
      control. Then tap each control on a phone without zooming: it should
      work the first time without hitting its neighbor.
    verify_automated: >-
      Scan again set to WCAG version 2.2 and see if this control is still
      found.
    acceptance: >-
      Every flagged control is at least 24 by 24 CSS pixels, or has the clear
      space around it that WCAG 2.5.8 asks for.
    confidence_default: high

  link-in-text-block:
    title: "Links in text stand out by color alone"
    wcag_sc: "1.4.1"
    wcag_name: "Use of Color"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) looks at links inside a block of text, such as a
      paragraph. A link passes if it has a style the text around it lacks,
      such as an underline, bold or a border. It also passes if its text
      color, or its background color, has a contrast ratio of at least 3:1
      with the color around it. This link differs by color only, and the
      difference is below 3:1.
    why_matters: >-
      About 8% of men and 0.4% of women in the US cannot tell some colors
      apart, so they may miss the link completely. People with low vision
      often see colors poorly too, and so do some older people.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Read the occurrence message. It gives the contrast between the link
        color and the text color, for example "1.66:1" for link text
        <code>#000000</code> in surrounding text <code>#333333</code>.
      - >-
        Underline links inside text by default: <code>main p a {
        text-decoration: underline; }</code>. You may change the underline on
        hover or focus, but it must be there before anyone points at or tabs
        to the link.
      - >-
        If the design cannot use underlines, add another cue that shows at all
        times, such as bold text or a bottom border. A small icon next to each
        link is another cue, but the rule check (axe) may still report the
        link, so check it by eye.
      - >-
        Make the change in the shared stylesheet or shared style setting
        (design token), so one change fixes every page that uses this link
        style.
    fix_options:
      - label: "Add a cue that does not rely on color"
        approach: >-
          Underline links inside body text, or give them another visible
          difference, such as bold or a bottom border, that shows before
          anyone interacts.
        watch_out: >-
          An underline that appears only on hover does not count. The cue has
          to be there before the user points at or tabs to the link.
      - label: "Raise the contrast between the link and the text around it"
        approach: >-
          Choose a link color with at least 3:1 contrast against the body
          text, and at least 4.5:1 against the background (WCAG 1.4.3).
        watch_out: >-
          With dark body text, few colors meet both numbers. The fix also
          holds only while both colors stay fixed: a theme switch or a dark
          mode palette can break it. Deque, the maker of the rule check (axe),
          also advises a visible change on hover and keyboard focus.
    verify_manual: >-
      Turn on a grayscale color filter (Mac: System Settings, Accessibility,
      Display, Color filters; Windows: Settings, Accessibility, Color
      filters). Read the flagged text without moving the mouse. Every link
      should still stand out from the words around it.
    verify_automated: "Scan again and see if this link is still found."
    acceptance: >-
      Every link inside a block of text has an underline or another cue
      besides color, or 3:1 contrast with the text around it.
    confidence_default: medium

  region:
    title: "Some content sits outside any page region"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) found content outside every landmark. A landmark is
      a page region that screen reader users can jump to, such as the menu
      (<code>&lt;nav&gt;</code>) or the main content
      (<code>&lt;main&gt;</code>). A few things may sit outside, such as skip
      links, dialogs and areas that announce updates (live regions,
      <code>aria-live</code>). WCAG does not require this, but it is a best
      practice.
    why_matters: >-
      Screen reader users often open a list of landmarks and jump between
      them. Content outside every landmark is not in that list, so they can
      miss it or not know what it belongs to.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Use the element locator (CSS selector) in an occurrence to find the
        content. Look at its parent elements in the browser's developer tools
        to see which part of the layout it belongs to.
      - >-
        Put each part of the page into the matching landmark. Use
        <code>&lt;header&gt;</code> for the top of the site and
        <code>&lt;nav&gt;</code> for menus. Use <code>&lt;main&gt;</code> for
        the page's own content, <code>&lt;aside&gt;</code> for side content
        and <code>&lt;footer&gt;</code> for the footer. Use only one
        <code>&lt;main&gt;</code> per page. For example:
        <code>&lt;body&gt;&lt;header&gt;…&lt;/header&gt;&lt;main&gt;…&lt;/main&gt;&lt;footer&gt;…&lt;/footer&gt;&lt;/body&gt;</code>
      - >-
        Fix it in the shared page template or layout component. The rule check
        (axe) reports each block of content separately. So one missing wrapper
        can cause many occurrences, and one template change can clear them
        all.
    fix_options:
      - label: "Wrap the content in landmark elements"
        approach: >-
          Put the page's parts inside header, nav, main, aside and footer, so
          every block with content sits in a landmark.
        watch_out: >-
          Content that falls between landmarks still fails, so a partial
          change is not enough. A section counts as a landmark only when it
          has a name, for example from aria-label. A header or footer inside
          an article, aside, main, nav or section is not a landmark.
      - label: "Add landmark roles where the element cannot change"
        approach: >-
          Add role="main", role="navigation" and similar roles to existing
          containers when a component library fixes the element itself.
        watch_out: >-
          Prefer the native elements. A role on the wrong container, such as
          one that wraps both the menu and the content, misleads more than no
          role at all.
    verify_manual: >-
      Open the landmark list in a screen reader (VoiceOver on Mac:
      Control+Option+U, then choose Landmarks; NVDA on Windows: Insert+F7,
      then choose Landmarks). Every part of the page you can see should belong
      to one of the listed regions. In NVDA you can also press D to jump from
      landmark to landmark.
    verify_automated: >-
      Scan again and see if content outside a landmark is still found on this
      page.
    acceptance: >-
      Every piece of visible content on the page sits inside a landmark, such
      as the header, menu, main content or footer.
    confidence_default: high

  landmark-one-main:
    title: "The page has no main content region"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) looks for a main content region: a
      <code>&lt;main&gt;</code> element or an element with
      <code>role="main"</code>. It found none that screen readers can reach,
      on the page or in any of its frames. A main region hidden with
      <code>display: none</code>, <code>aria-hidden="true"</code> or
      <code>inert</code> does not count. WCAG does not require this, but it is
      a best practice.
    why_matters: >-
      Screen reader users jump straight to the main content with a key or the
      landmark list. Without a main region there is nowhere to jump to, so
      they may have to go through the header and menus first.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the element in the page template that holds the page's own
        content, not the header, menu or footer.
      - >-
        Change it to <code>&lt;main&gt;</code>, or wrap the content in one:
        <code>&lt;main id="main"&gt;…&lt;/main&gt;</code>. Use one main
        element per page.
      - >-
        Put it directly in <code>&lt;body&gt;</code>, or inside a
        <code>&lt;div&gt;</code> or a <code>&lt;form&gt;</code> with no name.
        HTML does not allow it inside <code>&lt;header&gt;</code>,
        <code>&lt;nav&gt;</code>, <code>&lt;aside&gt;</code>,
        <code>&lt;footer&gt;</code>, <code>&lt;article&gt;</code> or
        <code>&lt;section&gt;</code>.
    fix_options:
      - label: "Mark the primary content as the main region"
        approach: >-
          Pick the one area that holds the page's own content, make it the
          main element, and use section or div for the other areas.
        watch_out: >-
          Single-page apps swap views with JavaScript. A main in the outer
          layout plus a main in each view gives two mains on the live page,
          even though each template looks right. HTML allows only one visible
          main, and the rule check (axe) reports extra ones under a separate
          rule (landmark-no-duplicate-main).
      - label: "Make sure screen readers can reach the main region"
        approach: >-
          Where the page code holds several views at once, hide the inactive
          ones with the hidden attribute, display: none or the inert
          attribute. Leave the active view's main exposed.
        watch_out: >-
          A main inside a container with aria-hidden="true" does not count, so
          the page still fails. Moving a view off screen with CSS hides it
          only from sight, not from screen readers. Check what the browser
          passes to screen readers (accessibility tree), not just the screen.
    verify_manual: >-
      Open the landmark list in a screen reader (VoiceOver on Mac:
      Control+Option+U, then choose Landmarks; NVDA on Windows: Insert+F7,
      then choose Landmarks). There should be exactly one main region, and it
      should hold the page's own content.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every page has exactly one main region that screen readers can reach,
      and it holds the page's own content.
    confidence_default: high

  page-has-heading-one:
    title: "The page has no main heading (h1)"
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      The rule check (axe) looks for a level-one heading
      (<code>&lt;h1&gt;</code>, or <code>role="heading"</code> with
      <code>aria-level="1"</code>) on the page or in its frames. It found none
      that screen readers can reach, and a heading hidden with <code>display:
      none</code> does not count. Text styled to look big, such as a
      <code>&lt;div&gt;</code> with a large font class, is not a heading. WCAG
      does not require an h1, but it is a best practice.
    why_matters: >-
      Screen reader users often jump straight to the first h1 to reach the
      main content and learn what the page is. Without one, they must listen
      to more of the page to find their place. People with some learning
      disabilities also lose a clear cue to how the page is organized.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Compare the page's headings with how the page looks. Use a screen
        reader's heading list, or the browser's developer tools to see what
        the browser passes to screen readers (accessibility tree). Every block
        that looks like a section title should appear as a heading.
      - >-
        Mark the title that names the page as the page's one level-one
        heading, usually at the start of the main content:
        <code>&lt;main&gt;&lt;h1&gt;Undergraduate
        admissions&lt;/h1&gt;…</code>. Then mark the section titles below it
        as <code>&lt;h2&gt;</code> and <code>&lt;h3&gt;</code>, without
        skipping levels.
      - >-
        If the design shows no visible title, keep the h1 for screen readers
        with a visually hidden class. Do not use <code>display: none</code>,
        <code>visibility: hidden</code> or <code>aria-hidden="true"</code>:
        they hide it from screen readers too.
    fix_options:
      - label: "Turn the visible title into a real heading"
        approach: >-
          Let the component that already looks like the page title render as
          an h1. Component libraries often let you set this, such as a tag or
          level setting on a title component.
        watch_out: >-
          If the text that looks like a title is a button or other control,
          keep the control and put a real heading above it. Do not turn a
          button into a heading.
      - label: "Use standard heading tags, with a hidden-text class where needed"
        approach: >-
          Replace styled div or span wrappers with h1 to h3. Where a heading
          should not be seen, use a visually hidden class, not display: none,
          which also hides it from screen readers.
        watch_out: >-
          Heading tags bring their own margins and font sizes, which can
          override your component library's spacing. Check the layout after
          the change.
    verify_manual: >-
      Open the heading list in a screen reader (VoiceOver on Mac:
      Control+Option+U, then choose Headings; NVDA on Windows: Insert+F7, then
      choose Headings). There should be one level 1 heading that names the
      page, and the levels below it should step down without gaps. Everything
      that looks like a heading should be in the list.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every page has one level-one heading that names the page, and screen
      readers can reach it.
    confidence_default: medium

  heading-order:
    title: "Heading levels skip a step"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      The rule check (axe) reads the page's headings in order, including those
      in frames but not hidden ones. It fails a heading that is more than one
      level deeper than the heading before it, for example an
      <code>&lt;h2&gt;</code> followed by an <code>&lt;h4&gt;</code>. Going
      back up, such as <code>&lt;h4&gt;</code> to <code>&lt;h2&gt;</code>, is
      fine, and the first heading can be any level. The rule check treats this
      rule as a best practice, and W3C's headings tutorial says to avoid
      skipped levels. WCAG 1.3.1 Info and Relationships counts it as a failure
      only when the levels hide how sections fit together, so a person must
      decide.
    why_matters: >-
      Screen reader users move from heading to heading and use the levels to
      understand how sections fit together. A skipped level makes it look as
      if a section is missing, which is confusing.
    owner: editor
    effort: under_2h
    fix_steps:
      - >-
        Use the element locator (CSS selector) in the occurrence to find the
        flagged heading. Then look at the heading just before it in the page's
        heading list.
      - >-
        Change the flagged heading to one level below that heading, or add the
        section heading that is missing. For example,
        <code>&lt;h2&gt;Courses&lt;/h2&gt; &lt;h3&gt;Fall
        term&lt;/h3&gt;</code>, not <code>&lt;h2&gt;Courses&lt;/h2&gt;
        &lt;h4&gt;Fall term&lt;/h4&gt;</code>.
      - >-
        If someone picked a level for its font size, use the level the
        structure needs and change the size with a CSS class.
      - >-
        For a reusable component, such as a card, let each page set its
        heading level. The same card may sit under an h2 on one page and an h3
        on another.
    fix_options:
      - label: "Turn styled text into real headings at the right level"
        approach: >-
          Where text looks like a section title but is a div or span, let the
          component render it as a heading at the right level. Component
          libraries often have a tag or level setting for this.
        watch_out: >-
          If the text that looks like a section title is a button or other
          control, keep the control and put a real heading above it. Do not
          turn a button into a heading.
      - label: "Use standard heading tags, with a hidden-text class where needed"
        approach: >-
          Replace styled wrappers with h1 to h6. Where a heading should not be
          seen, use a visually hidden class, not display: none, which also
          hides it from screen readers.
        watch_out: >-
          Heading tags bring their own margins and font sizes, which can
          override your component library's spacing. Check the layout after
          the change.
      - label: "Fix only the level order"
        approach: >-
          Where the headings exist but skip levels, renumber them so each one
          is at most one level deeper than the heading before it.
        watch_out: >-
          Levels show how sections nest, not how big the text is. Pick the
          level the structure needs, then change the look with CSS. Do not
          pick a level for its font size.
    verify_manual: >-
      Open the heading list in a screen reader (VoiceOver on Mac:
      Control+Option+U, then choose Headings; NVDA on Windows: Insert+F7, then
      choose Headings). The list should read like a table of contents, with no
      level skipped on the way down.
    verify_automated: "Scan again and see if this heading is still found."
    acceptance: >-
      Every heading on the affected pages is at most one level deeper than the
      heading before it.
    confidence_default: high

  accesskeys:
    title: "Two or more elements share the same shortcut key"
    abilities_affected: [vision, motor]
    what_happening: >-
      The <code>accesskey</code> attribute gives an element a keyboard
      shortcut. This rule check (axe) found two or more elements on the page
      with the same shortcut key. It treats upper and lower case as the same
      key, so <code>accesskey="s"</code> and <code>accesskey="S"</code> clash.
      The occurrence points to the first element that uses the key, and the
      check skips elements that are hidden.
    why_matters: >-
      A person who presses a shared shortcut cannot know which element it will
      act on, so what happens is unexpected. This hurts keyboard users who are
      blind or have low vision most, because they rely on keys instead of a
      mouse. WCAG does not require unique shortcut keys, but they help people.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the element code (HTML) of the occurrence and note its
        <code>accesskey</code> value. Then search the page code (DOM) for that
        value to find the other elements that use it. The report shows only
        the first one.
      - >-
        Decide whether you need the shortcuts at all. If not, remove the
        <code>accesskey</code> attributes.
      - >-
        If you keep them, give each element its own key. For example, change
        <code>&lt;a href="/help" accesskey="g"&gt;Help&lt;/a&gt;</code> to
        <code>&lt;a href="/help" accesskey="h"&gt;Help&lt;/a&gt;</code> when
        another element already uses <code>g</code>.
      - >-
        If the keys come from a shared template, such as a header, fix the
        template so every page gets the change.
    fix_options:
      - label: "Give every shortcut its own key"
        approach: >-
          Keep the accesskey attributes and change the repeated ones so no two
          elements on a page use the same letter, in upper or lower case.
        watch_out: >-
          Shortcut keys can clash with keys the browser already uses. Not
          every browser supports them, and people often do not know they exist
          unless you tell them.
      - label: "Remove the shortcut keys"
        approach: >-
          Delete the accesskey attributes. Deque, the maker of the rule check
          (axe), advises against them because of the clashes and the patchy
          support.
        watch_out: >-
          If some people rely on the shortcuts today, tell them before you
          remove them. Make sure every action is still easy to reach with the
          Tab key.
    verify_manual: >-
      Search the page code (DOM) for accesskey and check that no value
      repeats, counting upper and lower case as the same. Then press each
      shortcut in the browsers you support and check that it does the one
      thing you expect.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every accesskey value on the page is used by only one element, or the
      page has no accesskey attributes.
    confidence_default: high

  area-alt:
    title: "A clickable area of an image has no name"
    wcag_sc: "2.4.4"
    wcag_name: "Link Purpose (In Context)"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      The page has an image with clickable areas (an image map). Each
      clickable area is an <code>&lt;area&gt;</code> element with an
      <code>href</code>, and it works like a link. This area has no name a
      screen reader can read (accessible name). The rule check (axe) passes an
      area with a non-empty <code>alt</code>, <code>aria-label</code>,
      <code>aria-labelledby</code> that points to text, or <code>title</code>.
      It checks every such area, even hidden ones.
    why_matters: >-
      Screen readers often read the file name instead, so blind and deafblind
      users do not know where each link goes. Clear link names also help
      people who find movement hard, because they can skip links they do not
      need.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the <code>&lt;map&gt;</code> for the flagged area, and look at
        where each area sits on the image.
      - >-
        Give each <code>&lt;area&gt;</code> an <code>alt</code> that says
        where the link goes: <code>&lt;area shape="rect" coords="0,0,80,120"
        href="/reference" alt="Reference desk"&gt;</code>.
      - >-
        Give the <code>&lt;img&gt;</code> that uses the map its own
        <code>alt</code> that says what the map is for, for example
        <code>alt="Library floor plan. Choose an area to learn more."</code>
    fix_options:
      - label: "Add alt text to each area"
        approach: >-
          Write an alt on every area that names its link target, the same way
          you would write link text. The W3C technique for image maps (H24)
          uses this.
        watch_out: >-
          Describe where the link goes, not the shape or color, and give each
          area a different name. "Click here" or "Area 3" does not tell people
          anything.
      - label: "Replace the image map with ordinary links"
        approach: >-
          Show the image with its own alt text and put a list of normal text
          links next to it or under it.
        watch_out: >-
          This changes the design. Check with the designer, and make sure
          every area on the old map still has a link in the new list.
    verify_manual: >-
      Tab through the image map with the keyboard and a screen reader running.
      Each area should say a link name that tells you where it goes. Open the
      screen reader's list of links and check that each area has a clear name.
    verify_automated: "Scan again and see if a clickable area with no name is still found."
    acceptance: >-
      Every clickable area in an image map has a name that says where its link
      goes. The image itself has alt text that says what the map is for.
    confidence_default: high

  aria-allowed-attr:
    title: "Element has an ARIA attribute its role does not support"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Accessible Rich Internet Applications (ARIA) attributes are code, such
      as <code>aria-expanded</code>, that tell screen readers what an element
      is doing. Some work on any element. Others work only with certain roles
      (the kind of thing an element is, such as a button or a tab). The rule
      check (axe) found an ARIA attribute on an element whose role does not
      support it, for example <code>&lt;div aria-expanded="true"&gt;</code>.
    why_matters: >-
      Browsers and screen readers ignore an attribute the role does not
      support, so people lose what it says, such as whether a section is open.
      The wrong mix can also make screen readers report wrong information
      about the controls on the page.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the attribute in the occurrence, such as
        <code>aria-expanded="false"</code>. Look it up in the WAI-ARIA 1.2
        standard to see which roles support it.
      - >-
        Move the attribute to the element people use. For a section that opens
        and closes, <code>aria-expanded</code> belongs on the button that
        toggles it: <code>&lt;button aria-expanded="false"
        aria-controls="fees"&gt;Fees&lt;/button&gt;</code>.
      - >-
        If the flagged element is itself the control, use a native element
        such as <code>&lt;button&gt;</code>. Or give it a role that supports
        the attribute.
      - >-
        Update the script that changes the attribute so it changes it on the
        new element.
    fix_options:
      - label: "Move the attribute to the control"
        approach: >-
          Put the attribute on the element people act on, such as the button
          that opens a section, not on the box around the content.
        watch_out: >-
          The script that sets the value must now update the new element. If
          it still updates the old one, the state a screen reader reads goes
          out of date.
      - label: "Change the element or its role"
        approach: >-
          If the flagged element really is the control, use a native element
          such as a button, or add a role that supports the attribute.
        watch_out: >-
          A role only changes what screen readers say. A div with
          role="button" still needs keyboard focus and must work with Enter
          and Space. A native button gives you both for free.
      - label: "Remove the attribute"
        approach: "If the attribute carries no real information, delete it."
        watch_out: >-
          Check that the state is given somewhere else first. Removing the
          only aria-expanded leaves screen reader users with no open or closed
          state.
    verify_manual: >-
      Turn on a screen reader (VoiceOver: Command+F5 on macOS; NVDA on
      Windows) and press Tab to reach the control. It should say its state,
      such as "collapsed", and the state should change when you press Enter or
      Space.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every ARIA attribute on the affected elements is one that the element's
      role supports.
    confidence_default: high

  aria-allowed-role:
    title: "Element has a role that does not fit it"
    abilities_affected: [vision, motor]
    what_happening: >-
      A role (the <code>role</code> attribute) tells screen readers what kind
      of thing an element is, such as a list or a button. The rule check (axe)
      found a role that the ARIA in HTML standard does not allow on this
      element, for example <code>&lt;ul role="region"&gt;</code>. The Web
      Content Accessibility Guidelines (WCAG) do not require this, but
      following it helps people.
    why_matters: >-
      A role that clashes with its element can make screen readers report the
      wrong kind of thing. People who rely on them then get wrong information
      about that part of the page.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Decide what the element is for. If the HTML element already says it,
        delete the <code>role</code> attribute.
      - >-
        If you need the role, put it on an element that allows it. For a
        labelled area around a list, wrap the list: <code>&lt;section
        aria-label="Social media
        posts"&gt;&lt;ul&gt;…&lt;/ul&gt;&lt;/section&gt;</code>.
      - >-
        For cards in a list, use list code around them:
        <code>&lt;ul&gt;&lt;li&gt;&lt;article&gt;…&lt;/article&gt;&lt;/li&gt;&lt;/ul&gt;</code>,
        rather than <code>&lt;article role="listitem"&gt;</code>.
      - >-
        Check the roles each element allows in the ARIA in HTML standard
        before you add a new one.
    fix_options:
      - label: "Remove the role"
        approach: >-
          Delete the role attribute and let the element's own meaning stand.
        watch_out: >-
          If a parent has role="list", removing role="listitem" from its
          children leaves a list with no items. Remove the parent's role too,
          or wrap each item in a div with role="listitem".
      - label: "Wrap the element in one that allows the role"
        approach: >-
          Add a wrapper, such as a div, and put the role on the wrapper
          instead.
        watch_out: >-
          The wrapper changes the page code (DOM). Check styles and scripts
          that expect the element to be a direct child, such as grid or flex
          layouts.
      - label: "Change the element"
        approach: >-
          Swap the element for one that allows the role, such as a div in
          place of an article.
        watch_out: >-
          You lose the old element's own meaning. An article that becomes a
          div is no longer announced as an article.
    verify_manual: >-
      In the browser's developer tools, select the element and open the
      Accessibility pane. Check that its role is the one you meant. Then read
      that part of the page with a screen reader, and check that it says the
      right kind of thing.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every affected element has either no role attribute or a role that ARIA
      in HTML allows for that element.
    confidence_default: medium

  aria-braille-equivalent:
    title: "Braille text is set without a matching name"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, hearing]
    what_happening: >-
      An element has text meant only for braille displays, but it lacks the
      standard name or role text that the braille text replaces. In one case,
      <code>aria-braillelabel</code> (the text a braille display shows) is on
      an element with no name a screen reader can read (accessible name). In
      the other, <code>aria-brailleroledescription</code> is on an element
      with no <code>aria-roledescription</code>, or an empty one. The rule
      check (axe) marks this rule as one a person must review, not as a sure
      failure.
    why_matters: >-
      Blind and deafblind people who read on a braille display rely on this
      text. ARIA says to ignore it when no name or role description matches,
      but not all screen readers do, so what people get varies.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Check that the braille attribute is on the right element, not on its
        parent or child. Move it to the element that has the name or role
        description.
      - >-
        For <code>aria-braillelabel</code>: give the same element an
        accessible name, for example text inside it, <code>aria-label</code>,
        or alt text on an image inside it. Example: <code>&lt;button
        aria-braillelabel="****"&gt;&lt;img alt="4 stars"
        src="stars.jpg"&gt;&lt;/button&gt;</code>
      - >-
        For <code>aria-brailleroledescription</code>: add a non-empty
        <code>aria-roledescription</code> to the same element, for example
        <code>aria-roledescription="slide"
        aria-brailleroledescription="sld"</code>.
      - >-
        If the braille attribute adds nothing that the normal name does not
        already give, remove it.
    fix_options:
      - label: "Add the missing name or role description"
        approach: >-
          Keep the braille attribute and give the same element an accessible
          name (for aria-braillelabel) or an aria-roledescription (for
          aria-brailleroledescription).
        watch_out: >-
          The braille text should not be the same as the accessible name. If
          it would be the same, you do not need the braille attribute.
      - label: "Remove the braille attribute"
        approach: >-
          Delete aria-braillelabel or aria-brailleroledescription. Screen
          readers with braille support turn the normal name into braille on
          their own, and that almost always works better.
        watch_out: >-
          Removing it clears this rule, but it does not give the element a
          name. For example, an image with alt="" and a braille label still
          needs real alt text if it carries meaning.
    verify_manual: >-
      In the browser's developer tools, open the Accessibility panel for each
      flagged element. Check that it has a non-empty accessible name, or a
      non-empty role description, next to the braille attribute. If you have a
      braille display, move a screen reader to the element and check that the
      display shows useful text.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every element with a braille label also has an accessible name, and
      every element with a braille role description also has a non-empty role
      description.
    confidence_default: medium

  aria-command-name:
    title: "Custom buttons, links or menu items have no name"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      An ARIA role (code that tells screen readers what an element is) makes
      this element a button, link or menu item. It has no name a screen reader
      can read (accessible name): no text inside, no <code>aria-label</code>,
      no <code>aria-labelledby</code> pointing to text, and no
      <code>title</code>. An example is <code>&lt;div role="button"&gt;</code>
      with nothing in it. Other rules check native <code>&lt;button&gt;</code>
      and <code>&lt;a&gt;</code> elements.
    why_matters: >-
      Screen reader users hear only "button" or "link" and cannot tell what it
      does. People who use voice control have no name to say to click it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each flagged element. Icon-only controls, such as a close "X" or
        a menu icon, are a common cause.
      - >-
        Give it a short name that says what it does. Visible text inside the
        element is best: <code>&lt;div role="button"
        tabindex="0"&gt;Save&lt;/div&gt;</code>.
      - >-
        If there is no visible text, add <code>aria-label</code>, for example
        <code>&lt;div role="button" tabindex="0"
        aria-label="Close"&gt;</code>. Or point <code>aria-labelledby</code>
        at the id of text already on the page.
      - >-
        Where you can, use a real <code>&lt;button&gt;</code> or <code>&lt;a
        href="..."&gt;</code> in place of the ARIA role.
    fix_options:
      - label: "Put visible text inside the element"
        approach: >-
          Add a text label, or text next to the icon inside the element, so
          everyone sees the same name that a screen reader reads.
        watch_out: >-
          An image inside the element needs real alt text (the text a screen
          reader reads for an image). An image with alt="" adds nothing to the
          name.
      - label: "Name it with aria-label or aria-labelledby"
        approach: >-
          Add aria-label with a short action word, or aria-labelledby that
          points to the id of text on the page.
        watch_out: >-
          aria-labelledby that points to an id that does not exist, or to an
          empty element, still leaves no name. The title attribute also passes
          the rule, but it shows only as a mouse-hover tooltip, so do not rely
          on it alone.
      - label: "Replace the ARIA role with a native element"
        approach: >-
          Use a button element for actions and an a element with href for
          links. They come with keyboard support built in.
        watch_out: >-
          The native element still needs a name. An empty button or link then
          fails the button-name or link-name rule instead.
    verify_manual: >-
      Turn on a screen reader (VoiceOver: Command+F5 on macOS; NVDA on
      Windows), then move to each flagged control with its reading keys or
      Tab. It should say a name that tells you what it does, such as "Close,
      button". If Tab skips the control, that is a separate keyboard problem
      to fix too.
    verify_automated: "Scan again and see if this control is still found."
    acceptance: >-
      Every element with a button, link or menu item role has a name that says
      what it does.
    confidence_default: high

  aria-conditional-attr:
    title: "ARIA state does not fit this element"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, hearing, motor]
    what_happening: >-
      The rule check (axe) looks for two cases of ARIA attributes (code that
      tells screen readers about elements) used where they are not allowed.
      First, a native checkbox <code>&lt;input type="checkbox"&gt;</code>
      whose <code>aria-checked</code> value does not match its real state:
      checked, not checked, or partly checked. Second, a table row with
      <code>aria-expanded</code>, <code>aria-level</code>,
      <code>aria-posinset</code> or <code>aria-setsize</code> inside a table
      or grid. Those four are allowed only on rows of a table whose rows open
      and close (tree grid, <code>role="treegrid"</code>).
    why_matters: >-
      Screen readers and other assistive tools may act in ways no one can
      predict. A person may hear a checked state that is not the real one, or
      row details that do not match how the table works.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Checkbox: remove <code>aria-checked</code> from the native checkbox.
        The browser already reports the real state. Use <code>&lt;input
        type="checkbox" checked&gt;</code> for a box that starts checked.
      - >-
        Table row: decide whether the rows really open and close to show child
        rows. If they do, change the table's role to tree grid:
        <code>&lt;table role="treegrid"&gt;</code>.
      - >-
        If the rows do not open and close, remove <code>aria-expanded</code>,
        <code>aria-level</code>, <code>aria-posinset</code> and
        <code>aria-setsize</code> from them.
    fix_options:
      - label: "Let the native checkbox report its own state"
        approach: >-
          Delete aria-checked. In script, set the checked property when the
          state changes, or the indeterminate property for a partly checked
          box.
        watch_out: >-
          The rule check (axe) passes a value that matches the real state. But
          the ARIA in HTML standard says not to use aria-checked on a native
          checkbox at all. Remove it; do not just keep it in step.
      - label: "Turn the table into a tree grid"
        approach: >-
          Set role="treegrid" on the table so the row attributes are allowed.
        watch_out: >-
          A tree grid is an interactive widget. People expect arrow keys to
          move between rows and cells, and Right and Left arrows to open and
          close rows. You must build that keyboard support.
      - label: "Remove the row attributes"
        approach: >-
          If the table is a plain data table, delete the four row attributes
          and keep it a normal table.
        watch_out: >-
          If rows do open and close, removing aria-expanded hides that state.
          Put a button in the row with its own aria-expanded instead.
    verify_manual: >-
      With a screen reader, move to each flagged checkbox. Check that it says
      "checked" or "not checked" correctly, before and after you press Space.
      For a flagged table, check that the screen reader describes it the way
      it really works, and that every row control works by keyboard.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      No native checkbox has aria-checked, and only rows inside a tree grid
      use aria-expanded, aria-level, aria-posinset or aria-setsize.
    confidence_default: high

  aria-deprecated-role:
    title: "Elements use an out-of-date ARIA role"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, hearing, motor]
    what_happening: >-
      An element's <code>role</code> attribute (code that tells screen readers
      what an element is) uses a role that the ARIA standards no longer
      recommend (deprecated). In this version of the rule check (axe), these
      are <code>role="directory"</code>, <code>role="doc-biblioentry"</code>
      and <code>role="doc-endnote"</code>.
    why_matters: >-
      Screen readers and other assistive tools may not recognize an
      out-of-date role. People who use them may not learn what the element is.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        For <code>role="directory"</code> (an old role for a list of links,
        such as a table of contents): pick a current role that fits. Usually
        that is a real list, <code>&lt;ul&gt;</code> or
        <code>&lt;ol&gt;</code> with <code>&lt;li&gt;</code>. Use
        <code>role="tree"</code> only if the items open and close like
        folders.
      - >-
        For <code>role="doc-biblioentry"</code> and
        <code>role="doc-endnote"</code>: keep
        <code>role="doc-bibliography"</code> or
        <code>role="doc-endnotes"</code> on the section. Mark the entries as a
        list, for example <code>&lt;section
        role="doc-endnotes"&gt;&lt;ol&gt;&lt;li&gt;...&lt;/li&gt;&lt;/ol&gt;&lt;/section&gt;</code>.
      - >-
        If a shared component or template adds the role, fix it there so every
        page gets the change.
    fix_options:
      - label: "Use native list elements"
        approach: >-
          Replace the out-of-date role with ul or ol and li, which every
          screen reader already knows as a list.
        watch_out: >-
          Do not drop the section's role along with the entry role. Keep
          doc-endnotes or doc-bibliography on the section so it still says
          what it holds.
      - label: "Use the list and listitem roles"
        approach: >-
          Where you cannot change the HTML elements, put role="list" on the
          container and role="listitem" on each entry.
        watch_out: >-
          Each listitem must sit inside the element that has role="list". A
          listitem outside a list is an error of its own.
    verify_manual: >-
      With a screen reader, move to the fixed area. It should say it is a list
      and give the number of items. Each entry should read as a list item.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      No element on the affected pages uses the directory, doc-biblioentry or
      doc-endnote role.
    confidence_default: high

  aria-dialog-name:
    title: "Dialogs have no name"
    abilities_affected: [vision, motor]
    what_happening: >-
      An element with <code>role="dialog"</code> or
      <code>role="alertdialog"</code> has no name a screen reader can read
      (accessible name). It has no <code>aria-label</code>, no
      <code>aria-labelledby</code> that points to text, and no
      <code>title</code>. This rule does not check a native
      <code>&lt;dialog&gt;</code> that has no role attribute. WCAG does not
      require this, but it is best practice, and the ARIA standard says every
      dialog needs a name.
    why_matters: >-
      When a dialog opens, screen reader users are not told what it is for.
      They may not be able to tell a sign-up form from a warning.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Give the dialog a visible heading, then point to it: <code>&lt;div
        role="dialog" aria-labelledby="dlg-title"&gt;&lt;h2
        id="dlg-title"&gt;Sign up&lt;/h2&gt;...&lt;/div&gt;</code>.
      - >-
        If there is no visible title, add <code>aria-label</code>, for example
        <code>aria-label="Cookie settings"</code>.
      - >-
        Most dialogs come from one shared component. Make a title or label
        required in that component so every dialog gets a name.
    fix_options:
      - label: "Point aria-labelledby at the visible title"
        approach: >-
          Give the dialog's heading an id and set aria-labelledby on the
          dialog to that id.
        watch_out: >-
          The id must exist and be unique, and the heading must have text. A
          missing id or an empty heading still leaves the dialog with no name.
      - label: "Add aria-label"
        approach: >-
          Set aria-label on the dialog to a short phrase that says what it is
          for.
        watch_out: >-
          Screen reader users hear a name that sighted users do not see, so
          keep it close to what the dialog shows. The title attribute also
          passes the rule, but it is a weak choice because it shows only as a
          mouse-hover tooltip.
    verify_manual: >-
      Open each dialog with the keyboard while a screen reader runs. When
      focus moves into the dialog, the screen reader should say the dialog's
      name, such as "Sign up, dialog".
    verify_automated: "Scan again and see if this dialog is still found."
    acceptance: "Every dialog and alert dialog has a name that says what it is for."
    confidence_default: high

  aria-hidden-body:
    title: "The whole page is hidden from screen readers"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The page's <code>&lt;body&gt;</code> element has
      <code>aria-hidden="true"</code>. That tells screen readers and other
      assistive tools to skip everything on the page. The rule check (axe)
      looks for this attribute on the body of the main page in the page state
      it checked.
    why_matters: >-
      Blind people who use a screen reader cannot read or use the page. The
      rule check (axe) rates this as critical, its most serious level.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Remove <code>aria-hidden="true"</code> from the
        <code>&lt;body&gt;</code> element, whether it is in the page template
        or added by a script.
      - >-
        If a script adds it, for example when a dialog, menu or cookie notice
        opens, find that script. Search the code for <code>aria-hidden</code>.
      - >-
        To hide the page behind an open dialog, hide only the parts outside
        the dialog. Or use a native <code>&lt;dialog&gt;</code> opened with
        <code>showModal()</code>, which does this for you.
    fix_options:
      - label: "Remove the attribute from the body"
        approach: >-
          Delete aria-hidden from the body in the template, and stop any
          script from setting it there.
        watch_out: >-
          If a script sets it when something opens and never removes it, the
          page stays hidden after the popup closes. Test open and close, not
          just page load.
      - label: "Hide only what sits outside the dialog"
        approach: >-
          When a dialog opens, set aria-hidden="true" on each part of the page
          outside the dialog. Remove it when the dialog closes.
        watch_out: >-
          The dialog must not sit inside any element that has
          aria-hidden="true". If it does, the dialog is hidden too.
      - label: "Use a native modal dialog"
        approach: >-
          Use the dialog element and open it with showModal(). The browser
          makes the rest of the page unusable (inert) until it closes.
        watch_out: >-
          This works only with showModal(). A dialog opened with show() does
          not block the rest of the page. If you use aria-modal="true" on a
          custom dialog, your code must also block the rest of the page.
    verify_manual: >-
      With a screen reader running, load the page and read from the top: you
      should hear the page content. Then open and close each dialog, menu and
      cookie notice, and check that you can still read the content afterwards.
      In the browser's developer tools, the body element should not have
      aria-hidden="true".
    verify_automated: "Scan again and see if the body element is still found."
    acceptance: >-
      No page has aria-hidden="true" on its body element, at load or after any
      popup opens and closes.
    confidence_default: high

  aria-hidden-focus:
    title: "Hidden content can still get keyboard focus"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some elements have <code>aria-hidden="true"</code>, which hides them
      from screen readers. But the Tab key can still reach the element, or
      something inside it such as a link, a button or a form field. The rule
      check (axe) reports this mismatch. It can happen when a closed menu is
      hidden this way but its links still take focus.
    why_matters: >-
      The Tab key stops on content that screen readers are told to skip.
      Screen reader users then land on a link or button and cannot tell
      whether it is meant to be hidden or shown.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        For each occurrence, open the Page inspector's Page code (DOM) tab and
        find the links, buttons and fields inside the element. Decide if the
        content should be hidden from everyone, or shown to everyone.
      - >-
        If it should be hidden from everyone, hide it fully. Use
        <code>display: none</code> or the <code>hidden</code> attribute. Or
        add the <code>inert</code> attribute to the wrapper, which stops focus
        and hides it from screen readers.
      - >-
        If it must stay in place but hidden from screen readers, take each
        item out of the Tab order. Add <code>tabindex="-1"</code> to links and
        buttons, or <code>disabled</code> to form fields. Set this on each
        item, because <code>tabindex</code> on the wrapper does not pass down.
      - >-
        If the content is visible and useful, remove
        <code>aria-hidden="true"</code> so screen readers can read it too.
    fix_options:
      - label: "Hide it from everyone"
        approach: >-
          Use display: none, the hidden attribute or inert while the content
          is not in use, for example a closed menu. Remove it when the content
          opens.
        watch_out: >-
          inert gives no visual sign. Do not use it on content people can see
          and expect to use. When the content opens again, check that its
          links and buttons can be reached.
      - label: "Take each item out of the Tab order"
        approach: >-
          Add tabindex="-1" to every link and button inside the hidden
          content, and disabled to every form field.
        watch_out: >-
          aria-disabled="true" does not take a field out of the Tab order, but
          the disabled attribute does. When you show the content again, remove
          tabindex="-1" and disabled, or people cannot reach or use it.
      - label: "Stop hiding it from screen readers"
        approach: >-
          If sighted users can see and use the content, remove aria-hidden so
          screen reader users get it too.
        watch_out: >-
          aria-hidden="false" on an inner element does not undo
          aria-hidden="true" on a parent. Remove it from the parent itself.
    verify_manual: >-
      Press Tab through the whole page with a screen reader on. Focus should
      never land on something you cannot see or that the screen reader does
      not read. Open and close any menus, slides or dialogs, and Tab again
      each time.
    verify_automated: "Scan again and see if these elements are still found."
    acceptance: >-
      Every element with aria-hidden="true" on the affected pages is out of
      reach of the Tab key, and so is everything inside it.
    confidence_default: high

  aria-input-field-name:
    title: "Custom form fields have no name"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This custom form field has no name a screen reader can read (accessible
      name). The rule check (axe) looks at fields built with a role, such as
      <code>role="textbox"</code>, <code>role="combobox"</code>,
      <code>role="listbox"</code>, <code>role="searchbox"</code>,
      <code>role="slider"</code> or <code>role="spinbutton"</code>. It skips
      normal HTML fields such as <code>&lt;input&gt;</code> and
      <code>&lt;select&gt;</code>. This field has no <code>aria-label</code>
      with words in it, no <code>aria-labelledby</code> that points to text,
      and no <code>title</code> with words in it.
    why_matters: >-
      Blind and deafblind screen reader users hear only the field type, such
      as "combo box", and cannot tell what to enter or choose. Some people
      with mobility disabilities use assistive tools that also need this name.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the field with the element locator (CSS selector). If a native
        field can do the job, use it with a real label, for example
        <code>&lt;label for="country"&gt;Country&lt;/label&gt; &lt;select
        id="country"&gt;…&lt;/select&gt;</code>.
      - >-
        If the custom field must stay, point it at its visible label with
        <code>aria-labelledby</code>: <code>&lt;span
        id="country-label"&gt;Country&lt;/span&gt; &lt;div role="combobox"
        aria-labelledby="country-label" …&gt;</code>.
      - >-
        If there is no visible label on screen, add one. Use
        <code>aria-label="Country"</code> only when a visible label is truly
        not possible.
      - >-
        Do not rely on a <code>&lt;label&gt;</code> element alone. It does not
        name a <code>&lt;div&gt;</code> with a role, even when you wrap the
        div in it or its <code>for</code> matches the div's id. Use
        <code>aria-labelledby</code> instead.
    fix_options:
      - label: "Use a native HTML field with a label"
        approach: >-
          Replace the custom field with an input, select or textarea element
          and connect a visible label element to it. The browser then gives it
          a name, a role and keyboard support for free. The official guide to
          Accessible Rich Internet Applications (ARIA) gives this advice as
          its first rule.
        watch_out: >-
          Native fields can be harder to style, and a native select looks
          different in each browser. Check that the new field still works with
          your form scripts and saved values.
      - label: "Point the field at its visible label with aria-labelledby"
        approach: >-
          Give the visible label text an id and add aria-labelledby with that
          id to the element with the role. The screen reader then reads the
          same words people see.
        watch_out: >-
          The id must exist on the page and be unique. If it is wrong, or the
          element it points to is empty, the field still has no name. The rule
          check (axe) then still finds it.
      - label: "Add an aria-label or title"
        approach: >-
          When the design has no text on screen for the field, put the name in
          aria-label or in title.
        watch_out: >-
          Neither one gives a visible label, and sighted people need one too
          (WCAG 3.3.2 Labels or Instructions). Most browsers show a title only
          when you point at it with a mouse, so keyboard and touch users often
          cannot see it.
    verify_manual: >-
      Turn on a screen reader and move to the field with the Tab key. It
      should read a clear name and the kind of field, for example "Country,
      combo box". Check that the name matches the words shown on screen.
    verify_automated: "Scan again and see if this field is still found."
    acceptance: >-
      Every custom form field with a role on the affected pages has an
      accessible name that says what to enter and matches any visible label.
    confidence_default: high

  aria-meter-name:
    title: "Meters have no name"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This element with <code>role="meter"</code> has no name a screen reader
      can read (accessible name). A meter shows a value within a known range,
      such as disk space used or battery level. This one has no
      <code>aria-label</code> with words in it, no
      <code>aria-labelledby</code> that points to text, and no
      <code>title</code>. Text inside the meter does not count as its name.
    why_matters: >-
      A screen reader user may hear a value but not what it measures, so "75%"
      could mean anything. People with low vision and some people with
      mobility disabilities who use assistive tools are also affected.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the meter with the element locator (CSS selector) and look for
        the text on screen that says what it measures.
      - >-
        Point the meter at that text with <code>aria-labelledby</code>:
        <code>&lt;span id="disk-label"&gt;Disk space used&lt;/span&gt; &lt;div
        role="meter" aria-labelledby="disk-label" aria-valuenow="75"
        aria-valuemin="0" aria-valuemax="100"&gt;&lt;/div&gt;</code>.
      - >-
        If there is no such text, add <code>aria-label</code>, for example
        <code>aria-label="Battery level"</code>.
    fix_options:
      - label: "Point the meter at visible text with aria-labelledby"
        approach: >-
          Give the heading or caption that describes the meter an id, and add
          aria-labelledby with that id to the meter. Screen reader users then
          hear the same words sighted users read.
        watch_out: >-
          If the id does not exist, or the element it points to is empty, the
          meter still has no name. The rule check (axe) then still finds it.
      - label: "Add an aria-label or title"
        approach: >-
          Put a short name for what is measured in aria-label or title on the
          meter.
        watch_out: >-
          An empty aria-label="" does not count. An aria-label never shows on
          screen, and a title shows only as a mouse tooltip. Make sure sighted
          users can also tell what the meter measures.
      - label: "Use the native meter element with a label"
        approach: >-
          Replace the element that has role="meter" with an HTML meter
          element, leave off the role attribute, and connect a visible label
          element to it.
        watch_out: >-
          This rule only checks elements with a role="meter" attribute, so
          after the change the rule check (axe) no longer tests its name.
          Check the name yourself with a screen reader.
    verify_manual: >-
      Turn on a screen reader and read the page with its arrow keys until you
      reach the meter. It should read what it measures and its value, for
      example "Disk space used, 75%".
    verify_automated: "Scan again and see if this meter is still found."
    acceptance: >-
      Every element with role="meter" on the affected pages has an accessible
      name that says what it measures.
    confidence_default: high

  aria-progressbar-name:
    title: "Progress bars have no name"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This progress bar has no name a screen reader can read (accessible
      name). The rule check (axe) looks at elements with
      <code>role="progressbar"</code>, which show how far a task has got, such
      as a file upload. This one has no <code>aria-label</code> with words in
      it, no <code>aria-labelledby</code> that points to text, and no
      <code>title</code>. Text inside the progress bar does not count as its
      name.
    why_matters: >-
      A screen reader user cannot tell which task the progress bar belongs to,
      which matters most when a page has more than one. People with low vision
      and some people with mobility disabilities who use assistive tools are
      also affected.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the progress bar with the element locator (CSS selector) and look
        for the text on screen that says what is loading or being done.
      - >-
        Point the progress bar at that text with <code>aria-labelledby</code>:
        <code>&lt;span id="upload-label"&gt;Uploading photo.jpg&lt;/span&gt;
        &lt;div role="progressbar" aria-labelledby="upload-label"
        aria-valuenow="40" aria-valuemin="0"
        aria-valuemax="100"&gt;&lt;/div&gt;</code>.
      - >-
        If there is no such text, add <code>aria-label</code>, for example
        <code>aria-label="Upload progress"</code>.
      - >-
        If one shared component makes many progress bars, fix the component so
        each copy gets its own name.
    fix_options:
      - label: "Point the progress bar at visible text with aria-labelledby"
        approach: >-
          Give the text that describes the task an id, and add aria-labelledby
          with that id to the progress bar.
        watch_out: >-
          If the id does not exist, or the element it points to is empty, the
          progress bar still has no name. The rule check (axe) then still
          finds it. Each id must be unique when a page shows several progress
          bars.
      - label: "Add an aria-label or title"
        approach: >-
          Put a short name for the task in aria-label or title on the progress
          bar.
        watch_out: >-
          An empty aria-label="" does not count. When there are several
          progress bars, give each one a different name, not the same
          "Progress" on all.
      - label: "Use the native progress element with a label"
        approach: >-
          Replace the element that has role="progressbar" with an HTML
          progress element, leave off the role attribute, and connect a
          visible label element to it.
        watch_out: >-
          This rule only checks elements with a role="progressbar" attribute,
          so after the change the rule check (axe) no longer tests its name.
          Check the name yourself with a screen reader.
    verify_manual: >-
      Turn on a screen reader and read the page with its arrow keys until you
      reach the progress bar. It should read which task it shows and how far
      along it is, for example "Uploading photo.jpg, 40%".
    verify_automated: "Scan again and see if this progress bar is still found."
    acceptance: >-
      Every element with role="progressbar" on the affected pages has an
      accessible name that says which task it shows.
    confidence_default: high

  aria-prohibited-attr:
    title: "Element has an ARIA attribute its role forbids"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) looks for Accessible Rich Internet Applications
      (ARIA) attributes that an element's role (the kind of thing it is)
      forbids. Most often it is a name set with <code>aria-label</code> or
      <code>aria-labelledby</code> on an element that cannot be named.
      Examples are a <code>&lt;span&gt;</code> or <code>&lt;div&gt;</code>
      with no role outside any link or button, and the roles
      <code>none</code>, <code>presentation</code>, <code>paragraph</code> and
      <code>strong</code>. The rule check fails the element only when it has
      no text inside.
    why_matters: >-
      Screen readers may not read a name on these elements. People who use
      screen readers can then miss the information it holds.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find what the name was meant to say and what it should name. A
        <code>&lt;span aria-label="Instagram"&gt;</code> social icon usually
        names the link or button people click.
      - >-
        Move the name to that link or button. If there is no real link or
        button, use one: <code>&lt;a href="…"
        aria-label="Instagram"&gt;&lt;span
        class="icon"&gt;&lt;/span&gt;&lt;/a&gt;</code>.
      - >-
        If the element is really a picture, such as a CSS background image,
        give it <code>role="img"</code>. That role allows
        <code>aria-label</code> and <code>aria-labelledby</code>.
      - >-
        If everyone should get the information, write it as text on the page
        instead.
    fix_options:
      - label: "Move the attribute to an element that allows it"
        approach: >-
          Put the name on the link, button or other control people use, and
          remove it from the element itself.
        watch_out: >-
          aria-label replaces the control's text for screen readers. If the
          control has visible words, the name must include them, or voice
          control users cannot say it.
      - label: "Change the role"
        approach: >-
          Give the element a role where the attribute is allowed, such as
          role="img" for a picture drawn with CSS.
        watch_out: >-
          role="img" hides everything inside the element from screen readers.
          Do not use it on an element that holds text, links or buttons.
      - label: "Put the information in page text"
        approach: >-
          Write the words as visible text, or as hidden text inside the
          element using the site's screen-reader-only class.
        watch_out: >-
          display:none hides text from screen readers too. Use a
          screen-reader-only class, not display:none.
    verify_manual: >-
      Turn on a screen reader and move to the element or the control around
      it. Check that you hear the name you meant, once, and in words that
      match what is on screen.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every affected element either has no forbidden ARIA attribute, or has a
      role that allows the attributes it uses.
    confidence_default: high

  aria-required-attr:
    title: "Elements with a role miss an attribute it needs"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This element has a role but is missing an attribute that the role needs.
      Some roles need an extra Accessible Rich Internet Applications (ARIA)
      attribute, such as a state (on or off) or a level. The occurrence
      message names the missing attribute. For example,
      <code>role="switch"</code> needs <code>aria-checked</code>, and
      <code>role="heading"</code> needs <code>aria-level</code>.
    why_matters: >-
      A screen reader cannot tell users a control's state, such as whether a
      switch is on or off, or a heading's level. Blind and deafblind people,
      and some people with mobility disabilities who use assistive tools, are
      affected.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the occurrence message to see which attribute is missing, then
        find the element with the element locator (CSS selector). The rule
        check (axe) asks for <code>aria-checked</code> on checkbox, radio,
        switch, menuitemcheckbox and menuitemradio, and
        <code>aria-level</code> on heading. It asks for
        <code>aria-valuenow</code> on slider, meter, scrollbar and a separator
        that can take focus.
      - >-
        A combobox needs <code>aria-expanded</code>. It also needs
        <code>aria-controls</code>, pointing at its popup list, unless
        <code>aria-expanded="false"</code>.
      - >-
        Add the attribute with its correct current value, for example
        <code>&lt;div role="switch" aria-checked="false" tabindex="0"&gt;Dark
        mode&lt;/div&gt;</code> or <code>&lt;div role="heading"
        aria-level="2"&gt;Opening hours&lt;/div&gt;</code>. For controls
        people can change, have your script update the value every time the
        state changes.
      - >-
        Where you can, use the native element instead: <code>&lt;h2&gt;</code>
        already has a level, and <code>&lt;input type="checkbox"&gt;</code>
        already has a checked state.
    fix_options:
      - label: "Add the missing attribute and keep it up to date"
        approach: >-
          Add the state or property the message names, and have the component
          script change it whenever the control changes.
        watch_out: >-
          A fixed value that never changes passes the rule check (axe) but
          gives wrong information. A switch that always says "off" misleads
          people when it is on. Test it by using the control.
      - label: "Use a native HTML element"
        approach: >-
          Replace the element with a native one that already carries the
          state. Use an h1 to h6 heading, an input with type="checkbox" or
          type="radio", a slider input with type="range", or a meter element
          for a meter.
        watch_out: >-
          Check styling and scripts after the swap. A native checkbox can
          still take role="switch", but it keeps its own checked state. Never
          add aria-checked to it, because the two values can disagree.
      - label: "Remove a role that does not fit"
        approach: >-
          If the element is not really that kind of control, for example a
          plain text block marked role="heading" by mistake, remove the role.
        watch_out: >-
          Removing the role also removes what it told screen readers. Make
          sure the element still makes sense without it, and that no script
          depends on the role.
    verify_manual: >-
      Turn on a screen reader and move to the element. It should read its
      state or level, for example "Dark mode, switch, off" or "heading level
      2". Then use the control and check that the reading changes to match.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every element with a role on the affected pages has all the attributes
      that role needs, and their values match what the control shows.
    confidence_default: high

  aria-required-children:
    title: "Container role has missing or wrong items inside"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some container roles (a role is the kind of thing an element is) must
      hold certain items, such as <code>tab</code> items in a
      <code>tablist</code>. The rule check (axe) fails when those items are
      missing, or when an element with another role sits in their place. A
      plain <code>&lt;li&gt;</code> has its own role (list item), so an
      <code>&lt;li&gt;</code> between <code>&lt;ul role="tablist"&gt;</code>
      and its tabs fails. The rule check does not fail missing items while the
      container has <code>aria-busy="true"</code> (still loading).
    why_matters: >-
      Screen readers use a container and its items to tell people what a
      widget is and to help them move through it. When items are missing or
      wrong, a screen reader can read the widget wrongly, or the widget may
      not work with it.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the occurrence message. It names the missing item role, or the
        child that is not allowed. The rule check (axe) writes a plain list
        item as <code>li[tabindex]</code>, even when it has no
        <code>tabindex</code>.
      - >-
        Put the item role on the container's direct children, or mark each
        wrapper in between with <code>role="none"</code>: <code>&lt;ul
        role="tablist"&gt;&lt;li role="none"&gt;&lt;a role="tab"
        href="#feed"&gt;Facebook&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;</code>.
      - >-
        Make sure those wrappers cannot take keyboard focus and have no ARIA
        attributes that work on any element (global ARIA attributes), such as
        <code>aria-label</code>. If they do, browsers ignore
        <code>role="none"</code>.
      - >-
        If the items load later, set <code>aria-busy="true"</code> on the
        container while they load, and remove it when they are in place.
    fix_options:
      - label: "Tell screen readers to skip the wrappers"
        approach: >-
          Add role="none" to each element that sits between the container and
          its items, such as the li between a tab list and its tabs.
        watch_out: >-
          Browsers ignore role="none" if the wrapper can take focus or has an
          ARIA attribute that works on any element. A script that adds
          tabindex to the wrapper undoes the fix.
      - label: "Move the item role onto the wrapper"
        approach: >-
          Put the item role, such as role="tab", on the direct child itself
          instead of on an element inside it.
        watch_out: >-
          Focus, keyboard handling and states such as aria-selected must move
          with the role. The link inside must not add a second Tab stop.
      - label: "Remove the container role"
        approach: >-
          If this is not really a widget, remove the container role and use a
          plain list of links.
        watch_out: >-
          Remove the item roles too, such as role="tab". Items left without
          their container fail the matching rule (aria-required-parent).
    verify_manual: >-
      Turn on a screen reader and move into the widget. It should say what the
      widget is, such as "tab list", and read each item as the right kind of
      thing, such as "tab". In the browser's developer tools, the page as
      screen readers get it (accessibility tree) should show the items
      directly under the container.
    verify_automated: "Scan again and see if this container is still found."
    acceptance: >-
      Every affected container holds the item roles it needs, with no other
      roles or focusable wrappers in between.
    confidence_default: medium

  aria-required-parent:
    title: "Item role is not inside its required container"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some roles (the kind of thing an element is) only make sense inside a
      set container. For example, a <code>tab</code> goes inside a
      <code>tablist</code>, and an <code>option</code> inside a
      <code>listbox</code>. The rule check (axe) fails when the item has no
      such container above it. It also fails when another role sits in
      between, such as a plain <code>&lt;li&gt;</code> (a list item) between a
      <code>tablist</code> and its <code>tab</code>.
    why_matters: >-
      Screen readers use the container to explain an item, such as which tab
      list a tab belongs to. Without it, a screen reader can read the item
      wrongly, or the item's widget may not work with it.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the occurrence message. It names the missing container role, such
        as <code>tablist</code>.
      - >-
        If the container is there but another element sits in between, mark
        that element <code>role="none"</code>: <code>&lt;li
        role="none"&gt;&lt;a role="tab"
        href="#feed"&gt;Facebook&lt;/a&gt;&lt;/li&gt;</code>.
      - >-
        If there is no container, add one around the items: <code>&lt;div
        role="tablist" aria-label="Social feeds"&gt;…&lt;/div&gt;</code>.
      - "If the item is not part of a widget at all, remove its role."
    fix_options:
      - label: "Add or repair the container"
        approach: >-
          Wrap the items in an element with the required container role, or
          mark the elements in between with role="none".
        watch_out: >-
          The container then needs the right items inside. A stray child with
          another role fails the matching rule (aria-required-children).
      - label: "Link the item to its container with aria-owns"
        approach: >-
          When the page code (DOM) order does not match the widget, put
          aria-owns on the container, listing the item's id.
        watch_out: >-
          The ARIA standard says not to use aria-owns in place of the real
          page structure. Use it only when you cannot move the item, and make
          sure the id exists and is unique.
      - label: "Remove the item role"
        approach: >-
          If the element is not part of a widget, delete its role and let the
          HTML element speak for itself.
        watch_out: >-
          Styles or scripts may select on the role, such as [role="tab"].
          Check they still work after the role is gone.
    verify_manual: >-
      Turn on a screen reader and move to the item. The screen reader should
      read it as the right kind of thing, such as "tab", inside the right
      widget, such as "tab list". In the browser's developer tools, the page
      as screen readers get it (accessibility tree) should show the item
      directly under its container.
    verify_automated: "Scan again and see if this item is still found."
    acceptance: >-
      Every affected item sits inside its required container, with no other
      role in between.
    confidence_default: medium

  aria-roles:
    title: "Role values are misspelled or not allowed"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This element has a <code>role</code> value that does not work. The rule
      check (axe) reports a value with no real Accessible Rich Internet
      Applications (ARIA) role in it, such as the made-up
      <code>role="btn"</code>. It also reports an abstract role, such as
      <code>role="widget"</code>, <code>role="input"</code> or
      <code>role="landmark"</code>. The ARIA standard says never to put these
      on a page.
    why_matters: >-
      Browsers ignore a role they cannot use, so screen readers cannot tell
      users what the element is or how to use it. Blind and deafblind people,
      and some people with mobility disabilities who use assistive tools, are
      affected.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the element with the element locator (CSS selector) and read its
        <code>role</code> value in the occurrence message.
      - >-
        Change it to the real role you meant, for example
        <code>role="button"</code> for <code>btn</code> or
        <code>role="navigation"</code> for <code>nav</code>. Check the
        spelling against the list of roles in the ARIA standard.
      - >-
        Better still, use the native element that already has the role:
        <code>&lt;button&gt;</code> or <code>&lt;nav&gt;</code>.
      - "If no role fits, remove the <code>role</code> attribute."
    fix_options:
      - label: "Correct the role value"
        approach: >-
          Replace the misspelled, made-up or abstract value with the real,
          non-abstract ARIA role that matches what the element does.
        watch_out: >-
          A role is a promise. For example, role="button" means the element
          must also work with the Enter and Space keys and be reachable with
          Tab. Add that behavior, or the fix creates a new problem.
      - label: "Use a native HTML element"
        approach: >-
          Replace the element with one that has the role built in, such as
          button, nav, main or ul, and drop the role attribute.
        watch_out: >-
          Native elements bring their own default styles and behavior. Check
          the layout and any scripts that looked for the old element.
      - label: "Put a valid role first in a list of roles"
        approach: >-
          The role attribute can hold several words. Browsers use the first
          word that is a real, non-abstract role. The rule check (axe) passes
          when at least one word is a real role and no word is abstract.
        watch_out: >-
          The axe-core notes say older browsers may not support more than one
          role word. Put the role you need first, and do not rely on a later
          word for anything important.
    verify_manual: >-
      Open the browser developer tools, select the element and read its role
      in the Accessibility panel. Then move to it with a screen reader and
      check that it reads the kind of element you intended, such as "button".
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every role attribute on the affected pages has no abstract role, and its
      first real ARIA role matches what the element does.
    confidence_default: high

  aria-text:
    title: "Text wrappers hide a link or control"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) found a link, button or form field inside an
      element with <code>role="text"</code>. Some screen readers, such as
      VoiceOver, read everything inside <code>role="text"</code> as plain
      text, so they do not announce the control. People add this role so
      split-up text reads as one phrase, for example a heading with a
      <code>&lt;span&gt;</code> in the middle. This is a best practice, not a
      WCAG requirement, and <code>role="text"</code> is not part of the
      Accessible Rich Internet Applications (ARIA) 1.2 standard.
    why_matters: >-
      A screen reader user can reach the control but hears nothing, so they
      land on an empty stop and cannot tell what it does. People with mobility
      disabilities who use assistive tools are also affected.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the element with <code>role="text"</code> using the element
        locator (CSS selector) and see which link or control is inside it.
      - >-
        Move <code>role="text"</code> so it wraps only plain text. Correct:
        <code>&lt;h1&gt;&lt;span role="text"&gt;Hello &lt;br&gt;
        World&lt;/span&gt;&lt;/h1&gt;</code>. Wrong: <code>&lt;span
        role="text"&gt;&lt;a href="/site.html"&gt;Our
        site&lt;/a&gt;&lt;/span&gt;</code>.
      - >-
        If the text cannot be split away from the control, remove
        <code>role="text"</code>.
      - >-
        Do not try to hide the control with <code>tabindex="-1"</code>. The
        rule check (axe) still reports it, because assistive tools can still
        reach an element with a negative tabindex.
    fix_options:
      - label: "Remove role=\"text\""
        approach: >-
          Take the role off the wrapper so the link or control inside keeps
          its own name and role.
        watch_out: >-
          VoiceOver may then read split text, such as a heading with a styled
          word, as separate pieces. That is less smooth but still usable,
          while a silent control is not.
      - label: "Wrap only the plain text"
        approach: >-
          Put role="text" on a smaller element that holds only the text
          pieces, and keep the link or button outside it.
        watch_out: >-
          Check the whole wrapper after the change. Any link, button or form
          field left inside still triggers the rule and still reads as
          nothing.
    verify_manual: >-
      Turn on VoiceOver (Command+F5 on a Mac). Move to the link or control
      with Control+Option+Right Arrow. VoiceOver should read its name and
      role, for example "Our site, link", and the nearby text should still
      make sense.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every element with role="text" on the affected pages holds only plain
      text and no links, buttons or form fields.
    confidence_default: high

  aria-toggle-field-name:
    title: "Custom on/off controls have no name"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some elements act as a custom checkbox, radio button, switch, menu
      choice or list option, but they have no name. The rule check (axe) looks
      at elements with <code>role="checkbox"</code>,
      <code>role="radio"</code>, <code>role="switch"</code>,
      <code>role="menuitemcheckbox"</code>, <code>role="menuitemradio"</code>
      or <code>role="option"</code>. Each one needs a name a screen reader can
      read (accessible name). It can come from text inside the element,
      <code>aria-label</code>, <code>aria-labelledby</code> or
      <code>title</code>.
    why_matters: >-
      A screen reader says only "checkbox, not checked" or "switch, on", so a
      blind user cannot tell what the control turns on or off. People who use
      voice control also have no name to say when they want to click it.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the component that draws the control. Custom toggles usually come
        from one shared component, so one fix often clears many occurrences.
      - >-
        Give each control a name that says what it controls. Visible text
        inside it works best: <code>&lt;div role="checkbox"
        aria-checked="false" tabindex="0"&gt;Newspaper&lt;/div&gt;</code>
      - >-
        If the label text sits outside the control, point to it with
        <code>aria-labelledby</code>: <code>&lt;p
        id="font-sans"&gt;Sans-serif&lt;/p&gt; &lt;li role="menuitemradio"
        aria-checked="true" aria-labelledby="font-sans"&gt;&lt;/li&gt;</code>
      - >-
        Where you can, use a native <code>&lt;input type="checkbox"&gt;</code>
        or <code>&lt;input type="radio"&gt;</code> with a
        <code>&lt;label&gt;</code> instead of a custom role.
    fix_options:
      - label: "Put the label text inside the control"
        approach: >-
          Place the visible words, such as "Newspaper", inside the element
          with the role. The screen reader then reads the same words people
          see.
        watch_out: >-
          A switch that shows "on" and "off" text inside it gets those words
          as its name. Name it for what it controls, for example
          aria-label="Blue light filter", and let aria-checked carry on or
          off.
      - label: "Point to a visible label with aria-labelledby"
        approach: >-
          Give the visible label an id, and set aria-labelledby on the control
          to that id.
        watch_out: >-
          The id must exist on the same page and hold text. An aria-labelledby
          that points to a missing id or an empty element still leaves the
          control with no name.
      - label: "Switch to a native form control"
        approach: >-
          Replace the custom role with a native checkbox or radio input and a
          label element. The browser then handles the name, the state and the
          keyboard for you.
        watch_out: >-
          Custom styling often hides the native input. Hide it visually only,
          not with display: none, or it disappears for screen readers and
          keyboards too.
    verify_manual: >-
      Turn on a screen reader (VoiceOver: Command+F5 on macOS; NVDA on
      Windows). Move to each control with Tab, or with the arrow keys inside a
      menu or list. It should say what the control is for, then its role and
      state, for example "Newspaper, checkbox, not checked".
    verify_automated: "Scan again and see if these controls are still found."
    acceptance: >-
      Every element with a checkbox, radio, switch, menu choice or option role
      has a name that says what it controls.
    confidence_default: high

  aria-tooltip-name:
    title: "Tooltips have no text for screen readers"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Some elements with <code>role="tooltip"</code> have no name. A tooltip
      is the small popup that explains a button or field. The rule check (axe)
      wants each one to have text inside it, a non-empty
      <code>aria-label</code>, an <code>aria-labelledby</code> that points to
      text, or a <code>title</code>. These tooltips have none of them.
    why_matters: >-
      Screen reader users cannot tell what the tooltip says, so they miss the
      hint it gives sighted users.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Put the tooltip text inside the tooltip element: <code>&lt;div
        role="tooltip" id="save-tip"&gt;Saves a draft. It does not
        publish.&lt;/div&gt;</code>
      - >-
        Link the tooltip to the control it explains with
        <code>aria-describedby</code>: <code>&lt;button
        aria-describedby="save-tip"&gt;Save&lt;/button&gt;</code>
      - >-
        If a script adds the text only when someone hovers, keep the tooltip
        hidden until its text is in place. The rule check (axe) skips tooltips
        that are hidden from screen readers.
    fix_options:
      - label: "Write the text inside the tooltip"
        approach: >-
          Keep the help text as normal text inside the element with
          role="tooltip". This is the simplest name and matches what sighted
          users see.
        watch_out: >-
          A tooltip that holds only an icon or an image still has no text.
          Give the image alt text or add words.
      - label: "Name it with aria-label"
        approach: >-
          Set aria-label on the tooltip when its visible content cannot give a
          name, for example when it shows only an icon.
        watch_out: >-
          An empty aria-label="" still fails. Keep the aria-label words the
          same as the words people see, or the two versions drift apart.
    verify_manual: >-
      Turn on a screen reader and move keyboard focus to the control the
      tooltip explains. You should hear the tooltip text after the control's
      name.
    verify_automated: "Scan again and see if these tooltips are still found."
    acceptance: >-
      Every element with role="tooltip" has text a screen reader can read.
    confidence_default: high

  aria-treeitem-name:
    title: "Tree items have no name"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some items in a tree (a list that opens into nested levels, like a
      folder view) have no name. The rule check (axe) wants each element with
      <code>role="treeitem"</code> to have text inside, a non-empty
      <code>aria-label</code>, an <code>aria-labelledby</code> that points to
      text, or a <code>title</code>. The rule check (axe) lists this as a best
      practice, not as a Web Content Accessibility Guidelines (WCAG)
      criterion. It still helps people use the tree.
    why_matters: >-
      A screen reader user moves through the tree one item at a time. A
      nameless item gives them nothing to tell it apart from the others, so
      they cannot find the item they want.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the tree component. Tree items usually come from one template, so
        one fix often clears every occurrence.
      - >-
        Put the item's label text inside it: <code>&lt;li
        role="treeitem"&gt;Reports&lt;/li&gt;</code>
      - >-
        If the item shows only an icon, name it with <code>aria-label</code>:
        <code>&lt;div role="treeitem" aria-label="Reports"&gt;&lt;svg
        aria-hidden="true"&gt;…&lt;/svg&gt;&lt;/div&gt;</code>
    fix_options:
      - label: "Put the label text inside the item"
        approach: >-
          Show the item's words, such as a folder name, as text inside the
          treeitem element.
        watch_out: >-
          The name can then take in other text inside the item. If child items
          sit inside it, check with a screen reader that the name it reads is
          still short and clear.
      - label: "Name icon-only items with aria-label or aria-labelledby"
        approach: >-
          When an item shows only an icon, set aria-label, or point
          aria-labelledby at a visible text element.
        watch_out: >-
          An aria-labelledby that points to a missing id or an empty element
          still leaves the item with no name.
    verify_manual: >-
      Turn on a screen reader, press Tab to move into the tree, and use the
      arrow keys to go through the items. Each item should say its name, and
      open or closed where it has children.
    verify_automated: "Scan again and see if these tree items are still found."
    acceptance: >-
      Every element with role="treeitem" has a name that tells it apart from
      the other items.
    confidence_default: high

  aria-valid-attr:
    title: "Page code uses ARIA attributes that do not exist"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some elements have an attribute that starts with <code>aria-</code>, but
      it is not a real Accessible Rich Internet Applications (ARIA) attribute.
      ARIA attributes tell screen readers what an element is and what state it
      is in. The rule check (axe) compares each name with the list it knows. A
      typing mistake such as <code>aria-labeledby</code> (one "l") or a
      made-up name such as <code>aria-visible</code> fails.
    why_matters: >-
      Screen readers cannot use a misspelled or made-up attribute, so the
      name, state or link the developer meant to add may never reach their
      users. Some browsers accept the misspelling aria-labeledby, but others
      do not, so you cannot rely on it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the element code (HTML) of each occurrence and find the
        <code>aria-</code> attribute that the rule check (axe) names.
      - >-
        Fix the spelling to the real name. For example, change
        <code>aria-labeledby</code> to <code>aria-labelledby</code>.
      - >-
        If no real ARIA attribute does the job, remove it and use the right
        tool. For example, use <code>role="button"</code> instead of
        <code>aria-role="button"</code>. Use <code>aria-hidden="true"</code>
        instead of <code>aria-visible="false"</code>, but only if screen
        readers should really skip that content.
      - >-
        Fix the component or template that writes the attribute, so new pages
        do not bring it back.
    fix_options:
      - label: "Correct the spelling"
        approach: >-
          Rename the attribute to the ARIA name the developer meant, and keep
          its value.
        watch_out: >-
          The fixed attribute may now start to work. A corrected
          aria-labelledby changes what screen readers read, and a corrected
          aria-hidden hides content. Check that its value is right.
      - label: "Remove an attribute that has no ARIA meaning"
        approach: >-
          Delete made-up aria- attributes. If a script needs to store data on
          the element, use a data- attribute instead.
        watch_out: >-
          Search your scripts and CSS for the old name first. A style or
          script may still read it and break when it is gone.
    verify_manual: >-
      Look at the element in the Accessibility panel of the browser's
      developer tools. The name, role and state should now show what the
      attribute was meant to add.
    verify_automated: "Scan again and see if these elements are still found."
    acceptance: >-
      Every attribute on the affected pages that starts with aria- is a real
      ARIA attribute, spelled correctly.
    confidence_default: high

  aria-valid-attr-value:
    title: "ARIA attribute has a value that is not valid"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Each Accessible Rich Internet Applications (ARIA) attribute accepts only
      certain values. For example, <code>aria-hidden</code> takes
      <code>true</code> or <code>false</code>, and <code>aria-controls</code>
      takes the id (the unique name) of another element on the page. The rule
      check (axe) fails a typo such as <code>aria-hidden="rtue"</code>, a
      value the attribute does not accept, or an id that matches no element.
      It does not fail a missing <code>aria-controls</code> id while the
      element is closed (<code>aria-expanded="false"</code>) or not selected
      (<code>aria-selected="false"</code>).
    why_matters: >-
      Screen readers cannot use a value they do not understand. Screen reader
      users lose the state, name or link the attribute was meant to give them.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Read the attribute and value in the occurrence, such as
        <code>aria-controls="panel-3"</code>.
      - >-
        Fix typos and use a value the attribute allows. The WAI-ARIA 1.2
        standard lists them: for example, <code>aria-live</code> takes
        <code>off</code>, <code>polite</code> or <code>assertive</code>.
      - >-
        For an id, make sure one element in the page has exactly that id:
        <code>&lt;div role="tab" aria-controls="panel-3"&gt;</code> needs
        <code>&lt;div role="tabpanel" id="panel-3"&gt;</code>. If a template
        or script builds the id, check that it builds the same id on both
        elements.
      - >-
        If the occurrence names <code>aria-errormessage</code>, point it at a
        visible error message that screen readers announce. For example, give
        the message <code>role="alert"</code>, or also list its id in
        <code>aria-describedby</code>.
    fix_options:
      - label: "Correct the value"
        approach: >-
          Replace the value with one the attribute accepts, such as true or
          false for aria-hidden.
        watch_out: >-
          An allowed value can still be wrong. aria-expanded="true" on a
          closed section passes this rule but tells people the wrong thing.
      - label: "Point the id at an element that exists"
        approach: >-
          Give the target element the id the attribute names, or change the
          attribute to the target's real id.
        watch_out: >-
          Ids must be unique. If two elements share the id, the attribute can
          point at the wrong one.
      - label: "Remove the attribute"
        approach: >-
          If the target is never in the page, remove the attribute that names
          it.
        watch_out: >-
          In a tabs widget, each tab should point to its panel with
          aria-controls. Fix the id there rather than removing the attribute.
    verify_manual: >-
      In the browser's developer tools, search the page code for the id in the
      attribute and check that exactly one element has it. Then turn on a
      screen reader and check that the element says the state you expect, such
      as "expanded". The state should change when you use it.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every ARIA attribute on the affected elements has a value the attribute
      allows, and every id it names is on the page.
    confidence_default: high

  autocomplete-valid:
    title: "A field has an autocomplete value browsers do not know"
    wcag_sc: "1.3.5"
    wcag_name: "Identify Input Purpose"
    wcag_level: "AA"
    abilities_affected: [cognition, motor]
    what_happening: >-
      A form field has an <code>autocomplete</code> attribute, but its value
      is not one the HTML standard defines. The rule check (axe) only looks at
      fields that have this attribute. It reports a made-up word such as
      <code>autocomplete="badname"</code>, and words in the wrong order or
      joined with commas, such as <code>autocomplete="work,email"</code>. A
      browser cannot tell what such a field asks for.
    why_matters: >-
      With a correct value, the browser can fill in a person's name, email or
      address for them. People with memory or language disabilities then do
      not need to recall these details, and people with motor disabilities
      type less. Some tools also show a familiar icon next to the field, such
      as a birthday cake for a birth date.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Work out what the field asks for. Then pick the matching value from
        the list "Input Purposes for User Interface Components" in WCAG. For
        example: <code>name</code>, <code>given-name</code>,
        <code>email</code>, <code>tel</code>, <code>street-address</code>,
        <code>postal-code</code>, <code>username</code>,
        <code>new-password</code>.
      - >-
        Replace the wrong value with that word: <code>&lt;input type="email"
        autocomplete="email"&gt;</code>. Separate words with spaces, never
        commas. If no word on the list fits, remove the
        <code>autocomplete</code> attribute.
      - >-
        If you need extra words, keep this order: an optional
        <code>section-</code> name, then optional <code>shipping</code> or
        <code>billing</code>. Next comes an optional <code>home</code>,
        <code>work</code>, <code>mobile</code>, <code>fax</code> or
        <code>pager</code>, and then the field word. For example:
        <code>autocomplete="shipping postal-code"</code> or
        <code>autocomplete="work email"</code>.
      - >-
        Only <code>tel</code>, <code>email</code> and <code>impp</code> (and
        the <code>tel-</code> parts) can follow <code>home</code>,
        <code>work</code>, <code>mobile</code>, <code>fax</code> or
        <code>pager</code>. So <code>autocomplete="work photo"</code> is
        wrong.
    fix_options:
      - label: "Use the standard word for the field's purpose"
        approach: >-
          Replace the value with the matching word from the WCAG list, such as
          email, tel or postal-code. This is the fix WCAG 1.3.5 describes
          (technique H98).
        watch_out: >-
          Pick the word for what the field really asks. A valid but wrong
          word, such as email on a name field, passes the rule check (axe) but
          still fails WCAG 1.3.5 (failure F107). WCAG 1.3.5 covers only fields
          about the person filling in the form, not about someone else.
      - label: "Add the extra words in the right order"
        approach: >-
          Where one form has two addresses or two phone numbers, tell them
          apart with shipping or billing, a section- name, or home, work or
          mobile.
        watch_out: >-
          Order matters: section- first, then shipping or billing, then home,
          work or mobile, then the field word. The words home, work, mobile,
          fax and pager only go before tel, email or impp.
      - label: "Remove the value, or turn autofill off"
        approach: >-
          If the field asks for something that is not on the list, such as a
          comment, remove the autocomplete attribute. Use autocomplete="off"
          only when the browser must never fill the field in.
        watch_out: >-
          Both stop the rule check (axe) reporting the field. But a field
          about the user, such as their email, then no longer tells software
          what it asks for. WCAG 1.3.5 requires that.
    verify_manual: >-
      Compare each value with the WCAG list of input purposes and check the
      word order. Then, in a browser with saved autofill details, click the
      field and see whether the browser offers the right kind of saved
      details.
    verify_automated: "Scan again and see if this field is still found."
    acceptance: >-
      Every autocomplete value on the affected pages is a standard value, in
      the right order, that matches what the field asks for.
    confidence_default: high

  avoid-inline-spacing:
    title: "Text spacing is locked too tight to change"
    wcag_sc: "1.4.12"
    wcag_name: "Text Spacing"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      This element sets text spacing in its own <code>style</code> attribute
      (inline style) and marks it <code>!important</code>, a flag that makes a
      style win over others. The rule check (axe) reports it when that locked
      value is smaller than the minimum. The minimums are 0.12 times the font
      size for letter spacing and 0.16 times for word spacing. Line height
      must be 1.5 times, but only on text that wraps onto more than one line.
      A value of <code>normal</code> also counts as too small. Example:
      <code>style="line-height: 1.2 !important"</code>. The check looks only
      at <code>style</code> attributes, not at style sheets.
    why_matters: >-
      People with low vision or dyslexia widen the spacing between lines,
      words and letters to read more easily. They use tools such as a browser
      extension, a bookmark that runs a small script (bookmarklet) or their
      own style sheet. Most browsers do not let these tools override a style
      attribute marked !important, so the text stays tight.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence and find the <code>style</code> attribute. Look
        for <code>line-height</code>, <code>letter-spacing</code> or
        <code>word-spacing</code> with <code>!important</code>.
      - >-
        Remove <code>!important</code> from those values. Change
        <code>style="line-height: 1.2 !important"</code> to
        <code>style="line-height: 1.2"</code>.
      - >-
        You can also move the spacing into a class in a style sheet, and
        remove it from the <code>style</code> attribute.
      - >-
        Find where the style attribute comes from, such as a template, a
        script, or text pasted into the content editor. Fix it there so it
        does not come back.
    fix_options:
      - label: "Remove !important from the style attribute"
        approach: >-
          Keep the inline spacing value but drop !important, so tools people
          use to change spacing can override it.
        watch_out: >-
          The !important may have been added to beat another style rule. Check
          the element still looks right after you remove it.
      - label: "Set the value at or above the minimum"
        approach: >-
          If !important must stay, set the value to at least the minimum:
          line-height 1.5, letter-spacing 0.12em, or word-spacing 0.16em.
        watch_out: >-
          This passes the rule check, but it still locks the spacing, so
          people cannot make it wider. Removing !important is the better fix.
      - label: "Move spacing into a style sheet"
        approach: >-
          Replace the inline style with a class in the site's style sheet, so
          spacing is set in one place.
        watch_out: >-
          This rule does not check style sheets. An !important there can still
          block spacing changes, so avoid it on spacing values in the style
          sheet too.
    verify_manual: >-
      Use a text spacing tool, such as a bookmark that runs a small script
      (bookmarklet). It should set line height to 1.5, space after paragraphs
      to 2, letter spacing to 0.12 and word spacing to 0.16 times the font
      size. Check that the text on this element spreads out, and that no text
      is cut off or covers other content.
    verify_automated: >-
      Scan again and see if a style attribute that locks text spacing too
      tight is still found.
    acceptance: >-
      Every style attribute on the affected pages sets line-height,
      letter-spacing and word-spacing without !important, or at or above the
      minimum.
    confidence_default: high

  blink:
    title: "The page uses the old blink tag"
    wcag_sc: "2.2.2"
    wcag_name: "Pause, Stop, Hide"
    wcag_level: "A"
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      The page code (DOM) contains a <code>&lt;blink&gt;</code> element. This
      tag was made to switch text on and off without end, and the user cannot
      stop it. The rule check (axe) reports every <code>&lt;blink&gt;</code>
      element that shows on the page. It does not report hidden ones, and it
      does not check the style setting (CSS) <code>text-decoration:
      blink</code>.
    why_matters: >-
      Blinking text is hard to read for people with low vision or cognitive
      disabilities. A blinking link or button is hard to click for people with
      limited hand movement. Blinking also distracts people with attention,
      reading or learning disabilities.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Search the page templates and the content system for
        <code>&lt;blink&gt;</code>. Old content pasted into a rich-text field
        is a common source. Also search the style sheets for
        <code>text-decoration: blink</code>, which this rule does not check.
      - >-
        Remove the tag and keep the text inside it. For example, change
        <code>&lt;p&gt;&lt;blink&gt;Sale
        Thursday!&lt;/blink&gt;&lt;/p&gt;</code> to
        <code>&lt;p&gt;&lt;strong&gt;Sale
        Thursday!&lt;/strong&gt;&lt;/p&gt;</code>.
      - >-
        If the text must stand out, use a style that does not move. Bold text
        (as <code>&lt;strong&gt;</code> above), a border or a background color
        all work.
    fix_options:
      - label: "Remove the tag and use still emphasis"
        approach: >-
          Delete the blink tag, keep the words, and mark them with strong or a
          still style such as bold text or a colored box.
        watch_out: >-
          If you show importance with color alone, some people will miss it.
          Keep a word, icon or bold weight as well, and check that the new
          colors have enough contrast.
      - label: "Replace it with a short animation that stops"
        approach: >-
          If the design needs movement, use a CSS or script animation that
          stops by itself within 5 seconds. Or give people a button to pause
          it.
        watch_out: >-
          This rule check (axe) only looks for the blink tag, so it will not
          report a new animation that blinks forever. Test the new animation
          yourself, and never let it flash more than three times a second
          (WCAG 2.3.1).
    verify_manual: >-
      Search the page source and style sheets for "blink" rather than only
      looking at the page. Many modern browsers do not make this tag blink, so
      the page can look fine while the tag is still there. If you replaced it
      with an animation, watch it and check that it stops within 5 seconds or
      has a pause button.
    verify_automated: "Scan again and see if a <blink> element is still found."
    acceptance: >-
      Every page is free of blink elements, and any text that needs emphasis
      stays still or stops moving within 5 seconds.
    confidence_default: high

  button-name:
    title: "Buttons have no name for screen readers"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Some <code>&lt;button&gt;</code> elements have no name a screen reader
      can read (accessible name). The rule check (axe) accepts text inside the
      button, <code>aria-label</code>, <code>aria-labelledby</code>, a
      <code>title</code>, or a <code>&lt;label&gt;</code> for the button.
      These buttons have none of them. For example, the button may hold only
      an icon that is hidden with <code>aria-hidden="true"</code>.
    why_matters: >-
      A screen reader says only "button", so blind and deafblind users cannot
      tell what the button does.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Look at each button in the Page inspector, or on the live page, and
        find what it does. That gives its name, for example "Close", "Search"
        or "Show more links".
      - >-
        Give the button that name as text inside it. For an icon button, keep
        the icon hidden and add text that only screen readers read:
        <code>&lt;button&gt;&lt;i class="fa fa-search"
        aria-hidden="true"&gt;&lt;/i&gt;&lt;span
        class="sr-only"&gt;Search&lt;/span&gt;&lt;/button&gt;</code>. Use your
        site's own screen-reader-only class (it is <code>sr-only</code> in
        Bootstrap 4 and <code>visually-hidden</code> in Bootstrap 5).
      - >-
        If the button shows and hides a section, also add
        <code>aria-expanded="true"</code> or <code>"false"</code> so screen
        readers say whether the section is open. This is not part of this
        rule, but it helps the same users.
      - >-
        If the button comes from a shared component or template, fix it there
        so every page that uses it gets the name.
    fix_options:
      - label: "Put visible text in the button"
        approach: >-
          Write a short word or phrase inside the button, next to the icon or
          instead of it. Everyone sees the same name that a screen reader
          reads.
        watch_out: >-
          A value attribute on a button element does not give it a name. Only
          the text inside it, or one of the name attributes, counts.
      - label: "Add text only screen readers read"
        approach: >-
          Keep the icon, hide it with aria-hidden="true", and add a span
          inside the button that uses the site's screen-reader-only class.
        watch_out: >-
          If the screen-reader-only class is missing from the page's styles,
          the text shows on screen. If it uses display: none, screen readers
          skip it and the button still has no name.
      - label: "Name the button with aria-label or aria-labelledby"
        approach: >-
          Add aria-label="Close" to the button, or point aria-labelledby at
          the id of text already on the page.
        watch_out: >-
          aria-label replaces any text inside the button, so keep it the same
          as any visible words. This lets voice control users say what they
          see (WCAG 2.5.3 Label in Name). A title attribute also passes this
          rule. Do not rely on it: people who use a keyboard or a touch screen
          never see its tooltip.
    verify_manual: >-
      Turn on a screen reader (VoiceOver on macOS: Command+F5; NVDA on
      Windows: Ctrl+Alt+N) and press Tab to each fixed button. It should say
      what the button does, and that it is a button. The name should match any
      words or icon you can see.
    verify_automated: "Scan again and see if these buttons are still found."
    acceptance: >-
      Every button on the affected pages has a name that says what it does,
      and a screen reader reads that name.
    confidence_default: high

  bypass:
    title: "No way to skip past repeated menus"
    wcag_sc: "2.4.1"
    wcag_name: "Bypass Blocks"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      This rule check (axe) looks for a way to jump past the blocks that
      repeat on every page, such as the header and main menu. It accepts any
      one of three signs: a link within the page (such as
      <code>href="#main"</code>), a heading, or a main area
      (<code>&lt;main&gt;</code> or <code>role="main"</code>). This page has
      links but none of the three signs. The rule check (axe) marks this for a
      person to check, and a pass does not prove that the way to skip works.
    why_matters: >-
      Keyboard users must press Tab through every header and menu link on each
      new page before they reach the content. That is slow, tiring and even
      painful for some people with limited movement. Screen reader users have
      to hear that repeated content again, and screen magnifier users have to
      search past it.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Wrap the main content of the page in one <code>&lt;main&gt;</code>
        element, with an id: <code>&lt;main
        id="main"&gt;…&lt;/main&gt;</code>.
      - >-
        Add a skip link as the first thing in the <code>&lt;body&gt;</code>:
        <code>&lt;a href="#main"&gt;Skip to main content&lt;/a&gt;</code>. It
        can stay off screen until it gets keyboard focus, but it must become
        visible then.
      - >-
        Give each section a real heading (<code>&lt;h1&gt;</code> to
        <code>&lt;h6&gt;</code>), and put the menu in <code>&lt;nav&gt;</code>
        and the footer in <code>&lt;footer&gt;</code>.
      - "Make the change in the shared page template, so every page gets it."
    fix_options:
      - label: "Add a skip link to the main content"
        approach: >-
          Put a link such as "Skip to main content" first on the page and
          point it at the id of the main element. Move it off screen until it
          gets keyboard focus, then show it.
        watch_out: >-
          Do not hide it with display: none, visibility: hidden or the hidden
          attribute, because then no one can reach it. Check that the target
          id exists on every page that uses the template.
      - label: "Add page regions and headings"
        approach: >-
          Use main, nav, header and footer elements for the page regions, and
          start each section with a heading. Screen reader users can then jump
          between them.
        watch_out: >-
          Browsers do not let keyboard users jump by heading or region without
          a screen reader or an add-on. Sighted keyboard users still need a
          skip link. Use only one main element per page.
    verify_manual: >-
      Load the page and press Tab once: a skip link should appear. Pressing
      Enter on it should move focus to the main content, so the next Tab lands
      on the first link in the content. With a screen reader, check that you
      can jump to the main region and to the headings.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every page has a working way past repeated blocks, such as headings, a
      main region, and a skip link to it that shows on focus.
    confidence_default: medium

  color-contrast-enhanced:
    title: "Text misses the stricter Level AAA contrast ratio"
    wcag_sc: "1.4.6"
    wcag_name: "Contrast (Enhanced)"
    wcag_level: "AAA"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) found text that meets the Level AA contrast minimum
      but not the stricter Level AAA level. The contrast ratio measures how
      much lighter one color is than the other, from 1:1 (same color) to 21:1
      (black on white). This text is at least 4.5:1 but under 7:1, or, for
      large text, at least 3:1 but under 4.5:1. Text below the AA minimum
      shows up in the <code>color-contrast</code> issue instead.
    why_matters: >-
      Text that blends into its background is hard to read for people with low
      vision, and color blindness can lower the contrast even more. The 7:1
      level makes up for the contrast loss of about 20/80 vision (seeing at 20
      feet what most people see at 80 feet).
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Check whether your policy asks for Level AAA. If it asks only for
        Level AA, you do not have to fix this, but a fix still helps people
        with low vision. The World Wide Web Consortium (W3C), which writes
        WCAG, does not advise requiring Level AAA for a whole site. Some
        content cannot meet every Level AAA criterion.
      - >-
        Open each occurrence and read the check's message. It gives the
        contrast ratio, the text color (foreground color), the background
        color, the font size and the font weight. For example: "contrast of
        6.54 ... Expected contrast ratio of 7:1".
      - >-
        Pick a darker text color, or a lighter background, that reaches 7:1
        for normal text, or 4.5:1 for large text. Large text is 24px (18pt) or
        bigger, or 14pt (about 18.7px) or bigger in bold. Do not round up:
        6.99:1 does not meet 7:1. For example, on white, <code>#767676</code>
        gives 4.54:1 and <code>#595959</code> just reaches 7:1.
      - >-
        Change the color in the shared style (the design token or CSS custom
        property, such as <code>--text-muted: #595959;</code>), not on each
        element. One shared color often causes many occurrences, so one change
        can fix them all.
    fix_options:
      - label: "Darken the text or lighten the background"
        approach: >-
          Change one of the two colors until the pair reaches 7:1, or 4.5:1
          for large text. Muted grays and brand colors used for text are
          common causes.
        watch_out: >-
          A color that reaches 7:1 on white can miss it on a light gray panel.
          Check every background the color sits on, and every state, such as
          hover, focus and visited. A brand color may need a separate, darker
          shade used only for text.
      - label: "Make the text large"
        approach: >-
          Large text only needs 4.5:1, and all normal text in this issue
          already reaches 4.5:1. So making a heading or short label 24px, or
          19px in bold, fixes it without a color change.
        watch_out: >-
          Bold means a font weight of 700 or more. The rule check (axe) treats
          semibold (600) as normal text, so it still needs 7:1. Bigger text
          can also break the layout on narrow screens, so check it at 320px
          wide.
      - label: "Offer a high-contrast view"
        approach: >-
          Add a clearly labeled control that switches the page to colors that
          reach 7:1 (W3C technique G174). This can suit a design that must
          keep its default colors.
        watch_out: >-
          The scan checks the default view, so it will still report these
          occurrences. The control itself must reach the Level AAA contrast.
          The high-contrast view must keep all the same content and features,
          and meet every other WCAG criterion at your level.
    verify_manual: >-
      Inspect the text in your browser's developer tools; in Chrome, the color
      picker shows the contrast ratio with AA and AAA lines. Check hover and
      focus states too. Use a contrast checker for text on images or
      gradients, text under other elements, and images of text, because the
      rule check (axe) skips them.
    verify_automated: >-
      Scan again at Level AAA and see if this text is still found, because a
      Level AA scan does not run this rule.
    acceptance: >-
      Every text element on the affected pages reaches 7:1 contrast with its
      background, or 4.5:1 if large, except logos and disabled controls.
    confidence_default: high

  definition-list:
    title: "A list of terms and descriptions is built wrongly"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A description list (<code>&lt;dl&gt;</code>) pairs terms
      (<code>&lt;dt&gt;</code>) with their descriptions
      (<code>&lt;dd&gt;</code>). The rule check (axe) fails it for either of
      two reasons. First, it holds something other than
      <code>&lt;dt&gt;</code>, <code>&lt;dd&gt;</code>, or a
      <code>&lt;div&gt;</code> with no role around a group. The check ignores
      elements that screen readers cannot reach, such as
      <code>&lt;script&gt;</code> and <code>&lt;template&gt;</code>. Second,
      it has terms or descriptions directly inside it, but no
      <code>&lt;dt&gt;</code> comes before a <code>&lt;dd&gt;</code>. For
      example, it has only terms, only descriptions, or every description
      comes before every term.
    why_matters: >-
      Screen readers announce description lists in a special way. When the
      list is built wrongly, blind and deafblind screen reader users may get
      confusing or wrong output. They can lose the link between a term and its
      description.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence. The rule check (axe) either names the elements
        that are not allowed, or says no <code>&lt;dt&gt;</code> is followed
        by a <code>&lt;dd&gt;</code>.
      - >-
        Put each term before its descriptions. Each group is one or more
        <code>&lt;dt&gt;</code> and then one or more <code>&lt;dd&gt;</code>:
        <code>&lt;dl&gt;&lt;dt&gt;Phone&lt;/dt&gt;&lt;dd&gt;555-0100&lt;/dd&gt;&lt;/dl&gt;</code>.
      - >-
        Move other elements, such as <code>&lt;p&gt;</code> or
        <code>&lt;span&gt;</code>, inside a <code>&lt;dt&gt;</code> or
        <code>&lt;dd&gt;</code>, or out of the list.
      - >-
        To style each pair, wrap it in a plain <code>&lt;div&gt;</code> with
        no role:
        <code>&lt;dl&gt;&lt;div&gt;&lt;dt&gt;Phone&lt;/dt&gt;&lt;dd&gt;555-0100&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;</code>.
    fix_options:
      - label: "Fix the order and children of the list"
        approach: >-
          Keep the <dl>, and make sure it holds only term and description
          groups, with each <dt> before its <dd>.
        watch_out: >-
          A <div> that groups a pair must have no role. A <div> with a role,
          even role="presentation", or a <div> nested inside another <div>, is
          not allowed.
      - label: "Use a different structure"
        approach: >-
          If the content is not really terms and descriptions, use headings
          and paragraphs, a <ul>, or a table with header cells.
        watch_out: >-
          A layout with labels and values, such as contact details, often is a
          real term and description list. Keep the <dl> for those, and fix it
          instead.
    verify_manual: >-
      Open the browser's developer tools and look at the accessibility pane
      (accessibility tree), which shows what screen readers get. Each term
      should show as a term and each description as a definition, in the right
      pairs. With a screen reader, read through the list and check that each
      description follows its own term.
    verify_automated: >-
      Scan again and see if a wrongly built list of terms and descriptions is
      still found.
    acceptance: >-
      Every <dl> on the affected pages holds only groups of <dt> followed by
      <dd>, optionally wrapped in <div> elements with no role. Elements hidden
      from screen readers, such as <script> and <template>, may also sit in
      it.
    confidence_default: high

  dlitem:
    title: "A term or description is not inside its list"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A term (<code>&lt;dt&gt;</code>) or a description
      (<code>&lt;dd&gt;</code>) must sit inside a description list
      (<code>&lt;dl&gt;</code>). It may sit directly in the
      <code>&lt;dl&gt;</code>, or in a plain <code>&lt;div&gt;</code> that
      sits directly in the <code>&lt;dl&gt;</code>. On this page, the element
      has some other parent. Or its <code>&lt;dl&gt;</code> has a role the
      check does not accept, such as <code>role="menu"</code>. Only
      <code>role="list"</code>, <code>role="presentation"</code> or
      <code>role="none"</code> pass.
    why_matters: >-
      Without a description list around them, terms and descriptions lose
      their meaning as pairs. Blind and deafblind screen reader users then do
      not know which description goes with which term.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence and look at the element that directly contains the
        <code>&lt;dt&gt;</code> or <code>&lt;dd&gt;</code>.
      - >-
        If the terms and descriptions have no list around them, wrap them in a
        <code>&lt;dl&gt;</code>: <code>&lt;dl&gt;&lt;dt&gt;Opening
        hours&lt;/dt&gt;&lt;dd&gt;9 to 5&lt;/dd&gt;&lt;/dl&gt;</code>.
      - >-
        If a wrapper sits between the <code>&lt;dl&gt;</code> and the pair,
        make it one plain <code>&lt;div&gt;</code> with no role. Remove any
        other wrapper levels.
      - >-
        If the <code>&lt;dl&gt;</code> has a role such as
        <code>role="menu"</code>, remove it. If a <code>&lt;dt&gt;</code> or
        <code>&lt;dd&gt;</code> is used only for its look, such as indenting,
        replace it with a <code>&lt;div&gt;</code> or <code>&lt;p&gt;</code>
        and use styles instead.
    fix_options:
      - label: "Wrap the pairs in a description list"
        approach: >-
          Put the <dt> and <dd> elements inside a <dl>, with each term before
          its descriptions.
        watch_out: >-
          Moving the elements can break styles that expect the old parent.
          Check the layout after the change.
      - label: "Replace the elements"
        approach: >-
          When the content is not terms and descriptions, use headings and
          paragraphs instead of <dt> and <dd>.
        watch_out: >-
          Label and value pairs, such as "Price: $20", lose their pairing for
          screen reader users if they become plain paragraphs. Keep a <dl> for
          those.
    verify_manual: >-
      Open the browser's developer tools and check that the element sits
      inside a dl element, directly or through one plain div. With a screen
      reader, read the list and check that each description is read right
      after its own term.
    verify_automated: >-
      Scan again and see if a term or description outside its list is still
      found.
    acceptance: >-
      Every <dt> and <dd> on the affected pages sits directly inside a <dl>,
      or inside one plain <div> that is directly inside a <dl>.
    confidence_default: high

  document-title:
    title: "The page has no title"
    wcag_sc: "2.4.2"
    wcag_name: "Page Titled"
    wcag_level: "A"
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      The page has no title, or its <code>&lt;title&gt;</code> element is
      empty or holds only spaces. The page title shows in the browser tab and
      in search results. The rule check (axe) reads the title of the page it
      opened. It does not check pages inside frames. If a page has more than
      one <code>&lt;title&gt;</code>, only the first one counts.
    why_matters: >-
      The title is the first thing a screen reader user meets, so without it
      blind users must read the page to learn what it is. People with memory
      or reading difficulties, and people with severe movement difficulties
      who rely on audio, also use titles to tell pages apart.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Add one <code>&lt;title&gt;</code> inside the page's
        <code>&lt;head&gt;</code>, for example <code>&lt;title&gt;Parking
        permits | Transportation | University of
        Michigan&lt;/title&gt;</code>.
      - >-
        Put the most specific part first, then the section, then the site
        name. Keep the first part close to the page's main heading
        (<code>&lt;h1&gt;</code>).
      - >-
        If the page template takes the title from a content field, give the
        template a fallback so it never writes an empty title.
      - >-
        In a single-page app, which changes views without loading a new page,
        set <code>document.title</code> each time the view changes.
    fix_options:
      - label: "Write the title in the page template"
        approach: >-
          Build the title in the template from the page's own name, the
          section and the site name. Then every page gets a title when it is
          published.
        watch_out: >-
          A title that is the same on every page, such as just the site name,
          passes this check but does not help. Each title should say what that
          page is about.
      - label: "Set the title in the app's router"
        approach: >-
          In a single-page app, set the title in code each time the route or
          view changes, using the view's main heading.
        watch_out: >-
          A title that is set only when the app first loads stays the same on
          every view. Test the title after moving to other views, not just on
          the first page.
    verify_manual: >-
      Open the page and read the text in the browser tab. It should say what
      the page is about, with the most specific part first. With a screen
      reader, reload the page and listen to the first thing it reads.
    verify_automated: "Scan again and see if a page with no title is still found."
    acceptance: >-
      Every page has one non-empty title that says what the page is about,
      with the most specific part first.
    confidence_default: high

  duplicate-id-aria:
    title: "Two elements share an id that another element points to"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The same <code>id</code> appears on more than one element on this page.
      A label or an accessibility attribute (ARIA attribute) points to that
      <code>id</code>. Examples are <code>&lt;label for="email"&gt;</code>,
      <code>aria-labelledby</code> and <code>aria-describedby</code>. Browsers
      usually use only the first element with that <code>id</code>. So a name
      or hint can come from the wrong place or go to the wrong field.
    why_matters: >-
      Blind and deafblind screen reader users can get the wrong name or hint
      for a field or control, or no name at all. They have no visual cue to
      catch the mistake.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence. Its message names the repeated <code>id</code>
        value. Search the page code for <code>id="that-value"</code> to find
        every element that uses it.
      - >-
        Give each element its own <code>id</code>, or remove the
        <code>id</code> from an element that does not need it. Then update
        every reference so it points to the right element: <code>for</code> on
        a <code>&lt;label&gt;</code>, and <code>aria-labelledby</code>,
        <code>aria-describedby</code>, <code>aria-controls</code>,
        <code>aria-owns</code>, <code>aria-activedescendant</code>,
        <code>aria-errormessage</code>, <code>aria-details</code> or
        <code>aria-flowto</code>.
      - >-
        Example: two forms on one page both use <code>&lt;input
        id="email"&gt;</code>. Rename them to <code>id="signup-email"</code>
        and <code>id="footer-email"</code>. Change each <code>&lt;label
        for="..."&gt;</code> to match its own field.
      - >-
        A template or component may appear more than once on the page. Make it
        build a new <code>id</code> for each copy, not a fixed one.
    fix_options:
      - label: "Rename the repeated id by hand"
        approach: >-
          Change one copy of the id to a new value. Then update each label or
          ARIA attribute that should point to it.
        watch_out: >-
          Scripts and style rules may also use that id. Search the code for
          the old value, or the page can lose styling or stop working.
      - label: "Generate a new id for each copy of a component"
        approach: >-
          Where a form, card or widget appears more than once, have the
          template or framework make each id different. For example, add a
          number or a record key to it.
        watch_out: >-
          The label and the field must use the same generated value. If each
          one generates its own, the link between them breaks.
      - label: "Wrap the field inside its label"
        approach: >-
          For a simple form field, put the <input> inside the <label>. The
          label then names the field without needing an id.
        watch_out: >-
          Remove the label's for attribute too. If it stays, it still points
          to the first element with that id, not to the field inside the
          label. ARIA attributes such as aria-describedby still need a unique
          id.
    verify_manual: >-
      Open the browser's developer tools console. For each changed id, run
      document.querySelectorAll('[id="your-id"]').length and check that it
      returns 1. Then turn on a screen reader, tab to each affected field or
      control, and check that it reads its own name and hint.
    verify_automated: >-
      Scan again and see if a repeated id that a label or ARIA attribute
      points to is still found.
    acceptance: >-
      Every id that a label or ARIA attribute points to is on only one
      element, and each field reads its own name.
    confidence_default: medium

  empty-heading:
    title: "Headings have no text"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some headings (<code>&lt;h1&gt;</code> to <code>&lt;h6&gt;</code>, or
      <code>role="heading"</code>) have no text a screen reader can read. The
      rule check (axe) counts text inside the heading,
      <code>aria-label</code>, <code>aria-labelledby</code> or a
      <code>title</code>. A common cause is a heading that holds only a space
      (<code>&amp;nbsp;</code>), a line break, a hidden icon or an empty link.
      The Web Content Accessibility Guidelines (WCAG) do not require this
      directly, but fixing it helps people.
    why_matters: >-
      Screen reader users jump from heading to heading to find their way
      around a page. A heading with no text tells them nothing about its
      section.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at each occurrence. Decide if it should be a heading at all.
        Often an empty heading is a blank line that someone gave a heading
        style in the page editor, to add space.
      - >-
        If it is not a real heading, delete it. To add space between blocks,
        use the page's spacing styles (CSS margin), not an empty
        <code>&lt;h2&gt;&amp;nbsp;&lt;/h2&gt;</code>.
      - >-
        If it is a real heading, write short text that names the section, for
        example <code>&lt;h2&gt;Upcoming events&lt;/h2&gt;</code>. If the
        heading holds only an icon or a link, put the text inside it.
      - >-
        Do not hide heading text from screen readers with
        <code>aria-hidden="true"</code> or <code>display: none</code>. That
        makes the heading empty for them.
    fix_options:
      - label: "Delete the empty heading"
        approach: >-
          Remove headings that only add space, and use spacing styles for the
          gap instead.
        watch_out: >-
          After you delete it, check that the heading levels around it still
          make sense. For example, a level 2 heading should not jump straight
          to a level 4.
      - label: "Give the heading real text"
        approach: >-
          Type a short, clear name for the section into the heading, so it
          helps both sighted and screen reader users.
        watch_out: >-
          If the heading holds only an image, the image needs alt text (the
          text a screen reader reads for an image). An image with alt=""
          leaves the heading empty.
      - label: "Name it for screen readers only"
        approach: >-
          When the design must not show text, add text inside the heading that
          uses the site's screen-reader-only class.
        watch_out: >-
          Sighted users do not see this text. Use it only when the section's
          topic is already clear on screen from something else.
    verify_manual: >-
      With a screen reader on, move through the headings (NVDA: press H;
      VoiceOver: Control+Option+Command+H). Every heading you land on should
      say a name, and none should sound blank.
    verify_automated: "Scan again and see if these headings are still found."
    acceptance: >-
      Every heading on the affected pages has text that names its section, and
      no heading tag is used only to add space.
    confidence_default: high

  empty-table-header:
    title: "Table header cells have no text"
    abilities_affected: [vision]
    what_happening: >-
      Some table header cells (<code>&lt;th&gt;</code>, or
      <code>role="columnheader"</code> or <code>role="rowheader"</code>) are
      empty. The rule check (axe) looks for text inside the cell. An
      <code>aria-label</code> or <code>title</code> alone does not count. The
      Web Content Accessibility Guidelines (WCAG) do not require this
      directly, but fixing it helps people.
    why_matters: >-
      Screen readers read a cell's header when users move through a table. An
      empty header gives blind and low vision users no clue what the row or
      column holds, and sighted users see no label either.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at each empty header cell and decide if it heads a row or a
        column. It is often the top-left corner cell, or a column of buttons
        or checkboxes.
      - >-
        If it heads nothing, make it a normal cell: change
        <code>&lt;th&gt;&lt;/th&gt;</code> to
        <code>&lt;td&gt;&lt;/td&gt;</code>. In a page editor, this usually
        means turning off the header setting for that cell.
      - >-
        If it heads data, write text in it that names the column or row, for
        example <code>&lt;th&gt;Actions&lt;/th&gt;</code> or
        <code>&lt;th&gt;Student name&lt;/th&gt;</code>.
    fix_options:
      - label: "Make it a normal data cell"
        approach: >-
          Use td for a cell that labels nothing, such as the empty top-left
          corner of a table with both row and column headers.
        watch_out: >-
          Only do this when the cell truly heads nothing. If the column holds
          data, its cells then have no header to be read with them.
      - label: "Write visible header text"
        approach: >-
          Put a short, clear name in the header cell so both sighted and
          screen reader users know what the column or row holds.
        watch_out: >-
          aria-label on an empty header cell does not fix this rule. Use real
          text in the cell.
      - label: "Add text only screen readers read"
        approach: >-
          When the design must keep the header blank, put text inside the cell
          that uses the site's screen-reader-only class. The rule check (axe)
          counts this text.
        watch_out: >-
          Sighted users still see no header. Use this only when the column's
          purpose is clear on screen, for example a column of Edit buttons.
    verify_manual: >-
      With a screen reader on, move across and down the table (NVDA:
      Ctrl+Alt+arrow keys; VoiceOver: Control+Option+arrow keys). The screen
      reader should read each cell with a header that names its column or row.
    verify_automated: "Scan again and see if these header cells are still found."
    acceptance: >-
      Every table header cell on the affected pages has text, and cells that
      head nothing are normal data cells.
    confidence_default: medium

  form-field-multiple-labels:
    title: "A form field has more than one label"
    wcag_sc: "3.3.2"
    wcag_name: "Labels or Instructions"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      A form field (<code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> or
      <code>&lt;textarea&gt;</code>) has more than one
      <code>&lt;label&gt;</code>: labels that point to it with
      <code>for</code>, or wrap around it. The rule check (axe) leaves out a
      pointing label hidden from everyone, for example with <code>display:
      none</code>. It never reports this as a certain problem, so a person
      must check it. With two labels or more, it passes only if screen readers
      reach just one, and the field names it in <code>aria-labelledby</code>.
    why_matters: >-
      Screen readers and browsers handle two labels differently: some read the
      first label, some the last, some both. A screen reader user may hear
      only part of what the field is for.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find every <code>&lt;label&gt;</code> for the field. Look for
        <code>&lt;label for="…"&gt;</code> with the field's <code>id</code>,
        and for a <code>&lt;label&gt;</code> wrapped around the field.
      - >-
        Merge them into one label that holds all the needed words:
        <code>&lt;label for="email"&gt;Email (required)&lt;/label&gt;
        &lt;input id="email" type="email"&gt;</code>.
      - >-
        Move extra help, such as a format hint, out of the label. Put it in
        its own element and link it with <code>aria-describedby</code>:
        <code>&lt;input id="dob" aria-describedby="dob-hint"&gt; &lt;p
        id="dob-hint"&gt;Use DD/MM/YYYY&lt;/p&gt;</code>.
    fix_options:
      - label: "Merge the labels into one"
        approach: "Keep one label element and put all the words people need into it."
        watch_out: >-
          Do not drop words that matter, such as "required". Make sure no
          other label still points to the same id or wraps the field.
      - label: "Keep one label and turn the rest into a description"
        approach: >-
          Keep the main label. Change the other text into a normal element and
          link it with aria-describedby, so screen readers read it as a hint.
        watch_out: >-
          Screen readers read a description after the name, and some screen
          reader settings skip it. Do not put anything essential only in the
          description.
      - label: "Keep both texts on screen and name the field from them"
        approach: >-
          Change the extra label element into a plain element, such as a span
          with an id. Then add aria-labelledby to the field, with the id of
          each text in reading order.
        watch_out: >-
          aria-labelledby replaces the name from the label element, so list
          the main label's id too. Do not only add aria-hidden="true" to an
          extra label: the axe help page warns that this is not enough.
    verify_manual: >-
      Turn on a screen reader and press Tab to reach the field. You should
      hear the whole label once, with nothing missing or repeated. If you can,
      test in more than one screen reader and browser, because they handle two
      labels differently.
    verify_automated: "Scan again and see if this field is still found."
    acceptance: >-
      Every form field on the affected pages has exactly one label that screen
      readers can reach, and it holds all the words the field needs.
    confidence_default: low

  frame-focusable-content:
    title: "Keyboard users cannot reach controls inside a frame"
    wcag_sc: "2.1.1"
    wcag_name: "Keyboard"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      A frame (<code>&lt;iframe&gt;</code> or <code>&lt;frame&gt;</code>) has
      a negative tabindex, such as <code>tabindex="-1"</code>. That takes it
      out of the order the Tab key moves through. But the page inside the
      frame has links, buttons or fields that the Tab key should reach. The
      element locator (CSS selector) ends in <code>html</code>: that is the
      page inside the frame, and the part before it is the frame to fix.
    why_matters: >-
      People who use a keyboard or a screen reader cannot move into the frame,
      so they cannot use the controls inside it. If the frame scrolls, they
      cannot scroll it either.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the frame element named at the start of the element locator (CSS
        selector), for example <code>&lt;iframe src="/map" tabindex="-1"
        title="Office map"&gt;</code>.
      - >-
        Remove the negative <code>tabindex</code> from it, or set
        <code>tabindex="0"</code>: <code>&lt;iframe src="/map" title="Office
        map"&gt;&lt;/iframe&gt;</code>.
      - >-
        If a script or a third-party embed code adds the attribute, change
        that code or its settings, not just the page.
    fix_options:
      - label: "Put the frame back in the Tab order"
        approach: >-
          Remove tabindex="-1" from the frame, or set tabindex="0", so the Tab
          key moves into it and on to its controls.
        watch_out: >-
          Some embed codes add tabindex="-1" again when they load. Check the
          page as it runs in the browser, not only the template.
      - label: "Keep tabindex=\"-1\" only if nothing inside needs the keyboard"
        approach: >-
          If no one should use the controls in the frame, remove them from the
          page inside it. Keep the frame out of the Tab order only when
          nothing inside can take focus and the frame does not need to scroll.
        watch_out: >-
          Deque, the maker of the rule check (axe), warns that this breaks as
          soon as the frame's content changes and gains a control. It advises
          not using a negative tabindex on frames at all.
    verify_manual: >-
      Press Tab from the top of the page. Focus should move into the frame and
      reach each control inside it, then move on out of the frame. Check that
      you can use each control with Enter or Space.
    verify_automated: "Scan again and see if this frame is still found."
    acceptance: >-
      Every frame that holds links, buttons or fields can be reached with the
      Tab key, and none of them has a negative tabindex.
    confidence_default: high

  frame-tested:
    title: "Content inside a frame was not checked"
    abilities_affected: []
    what_happening: >-
      A frame (<code>&lt;iframe&gt;</code> or <code>&lt;frame&gt;</code>)
      shows another page inside this page. The rule check (axe) can only check
      a frame when its own code runs inside that frame. Here it could not, so
      the rule check (axe) did not check anything inside the frame. This is a
      gap in what was checked, not a problem found. WCAG does not require this
      rule. It is a best practice that tells you part of the page still needs
      checking.
    why_matters: >-
      People use the content in a frame, such as an embedded form, video
      player or map, as part of your page. Nobody looked for problems inside
      it, such as a form field with no label, so the report can miss them.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Use the occurrence's element locator (CSS selector) to find the frame
        in the page code (DOM). Its <code>src</code> attribute holds the
        frame's address, for example <code>&lt;iframe
        src="https://forms.example.com/apply"&gt;</code>.
      - >-
        If the frame shows a page from your own site, scan that address as its
        own start page. The rule check then runs on it directly.
      - >-
        The frame may show another company's content, such as a video player,
        map or form service. If so, check it by hand with a keyboard and a
        screen reader. Ask the provider for their accessibility information.
    fix_options:
      - label: "Scan the frame's own page"
        approach: >-
          Start a scan with the frame's address, so its content is checked as
          a page of its own.
        watch_out: >-
          A page checked on its own can behave differently than inside the
          frame, for example with a different size or settings passed in the
          address.
      - label: "Check the frame content by hand"
        approach: >-
          Use the keyboard to reach and use every control in the frame, and
          listen to it with a screen reader.
        watch_out: >-
          A frame from another company can change without notice. Check it
          again after the provider updates it.
    verify_manual: >-
      Tab into the frame and check that you can reach and use every control,
      and that focus can leave the frame again. With a screen reader, check
      that each control and field inside the frame has a clear name.
    verify_automated: >-
      A scan of this page cannot look inside the frame, so scan the frame's
      own address and see what is found.
    acceptance: >-
      Every frame on the affected pages has had its content checked, either by
      a scan of the frame's own address or by hand.
    confidence_default: low

  frame-title:
    title: "An embedded frame has no name for screen readers"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      An embedded frame (<code>&lt;iframe&gt;</code> or
      <code>&lt;frame&gt;</code>) shows content from another page, such as a
      video, map, form or social media post. This frame has no name a screen
      reader can read (accessible name). The rule check (axe) passes a frame
      that has a non-empty <code>title</code>, <code>aria-label</code> or
      <code>aria-labelledby</code> that points to text, or
      <code>role="none"</code> or <code>role="presentation"</code>. It skips
      frames with a negative <code>tabindex</code>, such as
      <code>tabindex="-1"</code>, and frames hidden from screen readers. The
      <code>name</code> attribute does not count.
    why_matters: >-
      Screen reader users move between frames by their names. Without a name,
      the screen reader may say only "frame", a file name or a web address.
      People may then have to go into each frame to find out what it holds.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each flagged frame. Frames added by embed code, such as social
        media posts, videos and maps, often have no name. Look in the embed
        code or the script that adds the frame.
      - >-
        Add a <code>title</code> that says what the frame holds, for example
        <code>&lt;iframe src="..." title="Map of the North Campus visitor
        parking"&gt;&lt;/iframe&gt;</code>. Say what it is, not "iframe" or
        "embed".
      - >-
        Give each frame on a page a different name, unless two frames show the
        same thing.
      - >-
        If you control the page inside the frame, give it a
        <code>&lt;title&gt;</code> that matches the frame's
        <code>title</code>. Some screen readers read that inner title instead.
    fix_options:
      - label: "Add a title attribute in the embed code"
        approach: >-
          Put a title attribute on the iframe in the template or embed code.
          This is the W3C technique for frames (H64). Use title rather than
          aria-label: at least one common browser and screen reader pair reads
          only title on frames.
        watch_out: >-
          The title must say what the frame shows, not what tool made it. A
          title such as "iframe" or "YouTube video player" passes the check
          but tells people very little.
      - label: "Set the name after a third-party script adds the frame"
        approach: >-
          When a provider's script builds the frame (for example an Instagram
          embed), use the provider's option for a title if it has one. If not,
          run a short script after the frame appears that sets its title.
        watch_out: >-
          If the provider's script rebuilds the frame later, your title can be
          lost. Check the name after the embed has fully loaded, not only in
          the page source.
      - label: "Hide a frame that shows nothing"
        approach: >-
          Some frames show nothing and hold nothing to read or use, such as a
          zero-size tracking frame. Remove it from the page if you can. If
          not, give it tabindex="-1" and aria-hidden="true" so keyboard and
          screen reader users skip it.
        watch_out: >-
          Never do this to a frame with content or controls. People who use a
          keyboard or screen reader would lose access to them.
    verify_manual: >-
      Open the page with a screen reader and move to each frame. Each one
      should say a name that tells you what it holds, not "frame" or a web
      address. With the keyboard, check that you can still reach everything
      inside the frame.
    verify_automated: "Scan again and see if a frame with no name is still found."
    acceptance: >-
      Every embedded frame has a short name that says what it holds, or is
      hidden because it holds nothing to read or use.
    confidence_default: high

  frame-title-unique:
    title: "Two or more embedded frames share the same title"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Two or more embedded frames (<code>&lt;iframe&gt;</code> or
      <code>&lt;frame&gt;</code>) on the page have the same
      <code>title</code>. The rule check (axe) compares the <code>title</code>
      of every frame that has one, ignoring upper and lower case and extra
      spaces. It does not compare <code>aria-label</code>. It marks each frame
      that shares a title for a person to review, not as a sure failure. Two
      frames that show the same thing may share a name.
    why_matters: >-
      Screen reader users pick frames from a list by name. If two frames that
      show different things have the same name, people do not know which one
      they need.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        List the frames that share the title and open each one. Check whether
        they show the same thing.
      - >-
        If they show different things, give each a <code>title</code> that
        says what it holds. For example, use <code>title="Video: Campus
        tour"</code> and <code>title="Video: Student stories"</code>, not
        <code>title="YouTube video player"</code> twice.
      - >-
        If they show the same thing, such as the same page in two places, the
        shared title is fine. Mark the occurrence as Not a problem (false
        positive).
    fix_options:
      - label: "Write a title from what each frame holds"
        approach: >-
          Build each frame's title from its content, such as the video name or
          the map location, instead of a fixed label from the embed code.
        watch_out: >-
          Embed code often gives every frame the same title, such as the
          provider's player name. Change it for each embed, not once in a
          shared template.
      - label: "Keep a shared title for frames with the same content"
        approach: >-
          When two frames show the same thing, keep the same title and record
          why in the occurrence's status.
        watch_out: >-
          The frames must truly serve the same purpose. Two different ads or
          videos under one title still leave people guessing.
    verify_manual: >-
      With a screen reader, move from frame to frame. Check that frames with
      different content have different names. For frames that share a name,
      open both and check that they show the same thing.
    verify_automated: >-
      Scan again and see if frames that share the same title are still found.
    acceptance: >-
      Every embedded frame on the page has a name that no other frame uses,
      unless both frames show the same content.
    confidence_default: low

  html-lang-valid:
    title: "The page's language code is not a valid code"
    wcag_sc: "3.1.1"
    wcag_name: "Language of Page"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The page sets its language on the <code>&lt;html&gt;</code> element, but
      the code is not a known language code. The rule check (axe) reads the
      <code>lang</code> and <code>xml:lang</code> values and tests only the
      first part, before any hyphen. It reports the page when that part is not
      in its list of language codes, or when the value is only spaces.
      Examples that fail: <code>lang="english"</code>,
      <code>lang="en_US"</code> (underscore instead of hyphen) and
      <code>lang="eng"</code> (use <code>en</code>).
    why_matters: >-
      When the code is not valid, screen readers use the user's default
      language, so words can sound wrong and be hard to understand. This
      affects blind and deafblind people who use screen readers, and people
      with reading or learning disabilities who listen to pages with
      text-to-speech.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find where the page template writes the <code>&lt;html&gt;</code> tag,
        or where the site's language setting comes from.
      - >-
        Replace the value with the standard code for the page's main language
        (a BCP 47 language tag). For example: <code>&lt;html
        lang="en"&gt;</code>, <code>&lt;html lang="fr-CA"&gt;</code> or
        <code>&lt;html lang="pt-BR"&gt;</code>. Use a hyphen, not an
        underscore.
      - >-
        Use the two-letter code when one exists: <code>en</code>, not
        <code>eng</code>; <code>fr</code>, not <code>fra</code>. Look up codes
        in the IANA Language Subtag Registry.
      - >-
        If the tag also has <code>xml:lang</code>, give it the same value as
        <code>lang</code>, or remove it. The rule check (axe) tests both.
    fix_options:
      - label: "Correct the code in the page template"
        approach: >-
          Write the right language code directly into the <html> tag of the
          served page, so it is correct before any script runs.
        watch_out: >-
          The rule check (axe) tests only the first part, so a wrong region
          such as en-UK (the right code is en-GB) still passes. Make sure the
          whole code is right, not just the part the scan tests.
      - label: "Map the site's language setting to a language code"
        approach: >-
          Where a content system or translation layer stores a language
          setting (locale), convert it to a standard code for the <html> tag.
        watch_out: >-
          Some platforms store this setting in other forms, such as en_US or
          english. Convert each one (en_US becomes en-US) and test every
          language the site offers, not only the default.
      - label: "Remove a wrong xml:lang value"
        approach: >-
          On a normal HTML page, xml:lang has no effect on the language. If
          only xml:lang is wrong, remove it and keep a correct lang.
        watch_out: >-
          Keep a valid lang on the <html> tag. If you remove the only language
          setting, the page has a different problem: it has no language at
          all.
    verify_manual: >-
      Open the browser's developer tools and read the lang value on the html
      element, which the scan and screen readers use. Check that the whole
      code is in the IANA Language Subtag Registry and matches the main
      language of the text. Then listen to the page with a screen reader and
      check that it uses the right voice.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every page's <html> element has a lang value that is a valid language
      code for the page's main language.
    confidence_default: high

  html-xml-lang-mismatch:
    title: "The page's two language settings name different languages"
    wcag_sc: "3.1.1"
    wcag_name: "Language of Page"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The <code>&lt;html&gt;</code> element sets the language twice, with
      <code>lang</code> and with <code>xml:lang</code>, and the two name
      different languages. The rule check (axe) only tests pages where both
      values are known language codes. It compares only the first part of each
      code, so <code>lang="fr"</code> with <code>xml:lang="en"</code> fails,
      but <code>lang="en-US"</code> with <code>xml:lang="en-GB"</code> passes.
      The World Wide Web Consortium (W3C) has retired its own test rule for
      this, because modern screen readers no longer use xml:lang.
    why_matters: >-
      Modern screen readers use lang and ignore xml:lang when both are set, so
      the harm to most people is small. A tool that does read xml:lang may
      still pick the wrong voice or pronunciation.
    owner: dev
    effort: under_15m
    fix_steps:
      - "Decide which language is correct for the page's main text."
      - >-
        On a normal HTML page, remove <code>xml:lang</code> and keep one
        correct <code>lang</code>: <code>&lt;html lang="fr"&gt;</code>. The
        HTML standard says <code>xml:lang</code> has no effect on language in
        HTML pages.
      - >-
        If you must keep <code>xml:lang</code>, give it exactly the same value
        as <code>lang</code>: <code>&lt;html lang="fr-CA"
        xml:lang="fr-CA"&gt;</code>.
    fix_options:
      - label: "Remove xml:lang"
        approach: >-
          Delete the xml:lang attribute from the <html> tag and keep a correct
          lang. This leaves one place that sets the page language.
        watch_out: >-
          If the page is served as XML (XHTML with the content type
          application/xhtml+xml), browsers use xml:lang first. In that case
          keep it and make it match instead.
      - label: "Make both values the same"
        approach: >-
          Set lang and xml:lang to the same language code, from the same place
          in the template, so they cannot drift apart.
        watch_out: >-
          This rule only compares the first part (en and en), but the HTML
          standard asks for exactly the same value. en-US with en-GB passes
          the scan but still breaks the HTML standard.
    verify_manual: >-
      Open the browser's developer tools and read the html element. Check that
      there is one lang value, or that lang and xml:lang have exactly the same
      value. Check that this value matches the main language of the text.
    verify_automated: "Scan again and see if this page is still found."
    acceptance: >-
      Every page's <html> element has either lang alone, or lang and xml:lang
      with the same value, naming the page's main language.
    confidence_default: medium

  identical-links-same-purpose:
    title: "Links with the same name may go to different places"
    wcag_sc: "2.4.9"
    wcag_name: "Link Purpose (Link Only)"
    wcag_level: "AAA"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      The rule check (axe) found links that share the name a screen reader
      reads (accessible name) but go to different addresses. The rule check
      cannot know if they lead to the same content, so a person must decide.
      It ignores case, punctuation and emoji in names, and small address
      differences such as http or https, a trailing slash or
      <code>#section</code>. This rule only runs when a scan checks Level AAA.
    why_matters: >-
      Screen reader users often hear link names without the text around them,
      so two "Read more" links that go to different pages sound the same.
      Opening the wrong one costs people with motor disabilities extra steps,
      and can make people with cognitive disabilities lose their way.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Open each link with the same name and compare where they go. If they
        lead to the same content, even at different addresses, nothing needs
        to change. Set the occurrence to Not a problem (false positive).
      - >-
        If they lead to different content, give each link text that says where
        it goes. For example: <code>&lt;a href="/news/tax"&gt;Read more about
        the tax change&lt;/a&gt;</code>
      - >-
        If the design needs short visible text, add the rest to the accessible
        name and keep the visible words at the start. For example: <code>&lt;a
        href="/news/tax" aria-label="Read more about the tax change"&gt;Read
        more&lt;/a&gt;</code>
      - >-
        For a link that is only an image, the image's alt text (the text a
        screen reader reads for an image) is the link name. Make it say where
        the link goes.
    fix_options:
      - label: "Rewrite the visible link text"
        approach: >-
          Change each link's visible words so they say where it goes, for
          example "Current climbing routes" instead of "Click here".
        watch_out: >-
          Longer text can wrap badly in cards and menus. Put the words that
          tell links apart first, and check the layout at narrow widths.
      - label: "Add hidden context to the accessible name"
        approach: >-
          Keep the short visible text and add the missing words with
          aria-label, or with text hidden by a CSS "visually hidden" class.
        watch_out: >-
          The name must still contain the visible words (WCAG 2.5.3 Label in
          Name), or voice control users cannot say the link. Do not hide the
          extra text with display: none, which hides it from screen readers
          too.
      - label: "Keep the same name when the links do the same thing"
        approach: >-
          Links that lead to the same or equivalent content, such as a logo
          link and a "Home" link, can share a name.
        watch_out: >-
          Equivalent means the same key content. Two "Contact us" links that
          lead to pages with different contact details still need different
          names.
    verify_manual: >-
      Open the list of links in a screen reader (VoiceOver on Mac: VO+U, then
      Links; NVDA on Windows: Insert+F7, then Links). Each link name should
      say where it goes without the text around it. Links with the same name
      should lead to the same content.
    verify_automated: >-
      Scan again at Level AAA and see if links with the same name and
      different addresses are still found.
    acceptance: >-
      Every set of links on a page that share a name leads to the same or
      equivalent content.
    confidence_default: low

  image-redundant-alt:
    title: "Image alt text repeats the text next to it"
    abilities_affected: [vision]
    what_happening: >-
      The image's alt text (the text a screen reader reads for an image) is
      the same as the text around it. The rule check (axe) finds the nearest
      link, button, paragraph, list item or table cell that holds the
      <code>&lt;img&gt;</code>. It reports the image when all the text in that
      element is exactly the same as the alt text, ignoring upper and lower
      case. For example: <code>&lt;a href="/"&gt;&lt;img src="home.png"
      alt="Home page"&gt;Home page&lt;/a&gt;</code>. WCAG does not require
      this, but fixing it helps people.
    why_matters: >-
      Blind and deafblind people who use a screen reader get the same words
      twice, such as "Home page Home page". This wastes their time and can
      confuse them.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        For each flagged image, read the visible text next to it. Decide
        whether the image adds anything that the text does not say.
      - >-
        If the image adds nothing, give it empty alt text so screen readers
        skip it: <code>&lt;a href="/"&gt;&lt;img src="home.png" alt=""&gt;Home
        page&lt;/a&gt;</code>. Keep the <code>alt</code> attribute; do not
        delete it.
      - >-
        If the image shows something more, write alt text that adds to the
        caption instead of repeating it. For example, a photo captioned "North
        Quad" could have <code>alt="Brick building with a clock tower"</code>.
      - >-
        If a template copies the image title into the alt text, change the
        template so editors can write alt text or leave it empty.
    fix_options:
      - label: "Make the image decorative with empty alt text"
        approach: >-
          Set alt="" when the text next to the image already says everything
          the image does, such as an icon beside its label.
        watch_out: >-
          If the image is the only thing inside a link or button, empty alt
          text leaves it with no name at all. Check that visible text stays in
          the same link or button.
      - label: "Rewrite the alt text to add information"
        approach: >-
          Use this when the image shows more than the caption says, such as a
          photo in a gallery. Describe what the photo shows, and leave the
          name to the caption.
        watch_out: >-
          Do not just reword the caption. Alt text that says the same thing in
          other words still makes people hear it twice.
    verify_manual: >-
      Move through the area with a screen reader. You should hear each piece
      of information once. Check that a link or button that holds the image
      still says its name.
    verify_automated: >-
      Scan again and see if an image whose alt text repeats the text next to
      it is still found.
    acceptance: >-
      Every image next to text has alt text that adds something new, or has
      empty alt text when the text already says it all.
    confidence_default: medium

  input-button-name:
    title: "Input buttons have no name for screen readers"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Some <code>&lt;input&gt;</code> buttons (<code>type="button"</code>,
      <code>"submit"</code> or <code>"reset"</code>) have no name a screen
      reader can read (accessible name). The rule check (axe) looks for text
      in the <code>value</code> attribute (the text shown on the button),
      <code>aria-label</code>, <code>aria-labelledby</code>,
      <code>title</code> or a label. A submit or reset button with no
      <code>value</code> attribute passes, because the browser shows its own
      word, such as "Submit". An empty <code>value=""</code> removes that
      word, so the button has no name.
    why_matters: >-
      A screen reader says only "button", so blind and deafblind users cannot
      tell what it does. Sighted users may also see a blank button.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find what each button does, for example "Search" or "Send message".
      - >-
        Put that text in the <code>value</code> attribute: <code>&lt;input
        type="submit" value="Send message"&gt;</code>. This is also the text
        people see on the button.
      - >-
        Do not leave an empty <code>value=""</code>. Fill it in. On a submit
        or reset button you can also remove it, so the browser shows its own
        word, such as "Submit". A <code>type="button"</code> has no such word,
        so it always needs a name.
    fix_options:
      - label: "Write text in the value attribute"
        approach: >-
          Set value to a short phrase that says what the button does. Everyone
          sees and hears the same name.
        watch_out: >-
          The browser's own "Submit" or "Reset" passes this rule but may not
          say what the button does. "Send message" is clearer than "Submit".
      - label: "Use a button element instead"
        approach: >-
          If you also need an icon, replace the input with a button element
          that has type="submit" and the words "Send message" inside it.
        watch_out: >-
          A different rule, button-name, checks a button element. Its value
          attribute does not name it; the text inside it does.
      - label: "Name it with aria-label or aria-labelledby"
        approach: >-
          Add aria-label, or point aria-labelledby at text already on the
          page, when the button shows only a background image or icon.
        watch_out: >-
          aria-label replaces the value text for screen readers. Keep it the
          same as the words people see, so voice control users can say it
          (WCAG 2.5.3 Label in Name).
    verify_manual: >-
      Look at each fixed button: it should show readable text. Then press Tab
      to it with a screen reader on. It should say that text, and that it is a
      button.
    verify_automated: "Scan again and see if these buttons are still found."
    acceptance: >-
      Every input button on the affected pages shows text that says what it
      does, and a screen reader reads that text as its name.
    confidence_default: high

  input-image-alt:
    title: "Image button has no name for screen readers"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      An image button (<code>&lt;input type="image"&gt;</code>) is a button
      drawn as a picture. The rule check (axe) looks for the name a screen
      reader reads (accessible name). The name can come from <code>alt</code>,
      <code>aria-label</code>, <code>aria-labelledby</code>,
      <code>title</code> or a <code>&lt;label&gt;</code>. This button has none
      of these, or they are empty. Text shown near the button does not count,
      because the page code (DOM) does not link it to the button.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, hear
      "button" with no purpose, or a default such as "Submit Query". They do
      not know what the button does before they press it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide what the button does, not what the picture shows. A magnifying
        glass that starts a search needs the name "Search", not "Magnifying
        glass".
      - >-
        Put that action in the <code>alt</code> attribute. Example:
        <code>&lt;input type="image" src="go.png" alt="Search"&gt;</code>.
      - >-
        If a visible word already names the button, point to it instead:
        <code>&lt;input type="image" src="go.png"
        aria-labelledby="search-heading"&gt;</code>. Check that the element
        with <code>id="search-heading"</code> exists and has text.
      - >-
        If the button comes from a template or form builder, add the name
        there, so every copy of the button gets it.
    fix_options:
      - label: "Add alt text that names the action"
        approach: >-
          Write a short alt value that says what happens when you press the
          button, such as "Search" or "Add to cart".
        watch_out: >-
          Do not use alt="" on an image button. It is still a button, so you
          cannot mark it as decoration. An empty alt leaves it with no useful
          name. Also avoid words like "image" or a file name.
      - label: "Point to visible text with aria-labelledby"
        approach: >-
          Give the visible text an id, and set aria-labelledby on the button
          to that id. The button then reads the same words people see.
        watch_out: >-
          If the id is misspelled, or the text it points to is empty, the
          button still has no name.
      - label: "Use a normal button with an image inside"
        approach: >-
          Replace the image button with a button element that holds visible
          text, or an image with alt text that names the action.
        watch_out: >-
          An image button sends its form. A button element does the same only
          while its type is "submit", which is the default, so do not set
          type="button". An image button also sends the spot you clicked (as
          name.x and name.y). Check that the server does not need them.
    verify_manual: >-
      Turn on a screen reader (VoiceOver on macOS: Cmd+F5; NVDA on Windows:
      Ctrl+Alt+N) and press Tab to reach the button. It should say "button"
      and the action, such as "Search, button", and never "Submit Query" or a
      file name.
    verify_automated: "Scan again and see if an image button with no name is still found."
    acceptance: >-
      Every image button has a name that says what it does, and a screen
      reader reads that name.
    confidence_default: high

  label-title-only:
    title: "A form field has no real label, only a hint"
    abilities_affected: [vision, motor]
    what_happening: >-
      A form field (<code>&lt;input&gt;</code>, <code>&lt;select&gt;</code> or
      <code>&lt;textarea&gt;</code>) has only a <code>title</code> or
      <code>aria-describedby</code> text to say what it is for. It has no
      <code>&lt;label&gt;</code> with text, no <code>aria-label</code> and no
      <code>aria-labelledby</code>. A <code>title</code> and
      <code>aria-describedby</code> are both meant for hints, not names. WCAG
      does not require this rule, but following it helps people.
    why_matters: >-
      Browsers do not show a title the same way, so people using touch, a
      keyboard or a screen magnifier may never see it. Text linked with
      aria-describedby is not a name at all, so a screen reader may read the
      field with no name.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Add a visible label and tie it to the field: <code>&lt;label
        for="fname"&gt;First name&lt;/label&gt; &lt;input id="fname"
        type="text"&gt;</code>.
      - >-
        Keep the <code>title</code> or <code>aria-describedby</code> text only
        if it adds a hint. Remove it if it just repeats the label.
      - >-
        If a visible label really does not fit, use <code>aria-label</code> or
        <code>aria-labelledby</code>. For example, a search field right next
        to a "Search" button: <code>&lt;input type="search"
        aria-labelledby="search-btn"&gt;</code>.
    fix_options:
      - label: "Add a visible label element"
        approach: >-
          Use a label with for="…" that matches the field's id. The axe help
          page calls this the best choice, because all current browsers and
          screen readers support it. It notes that a label wrapped around the
          field has less support.
        watch_out: >-
          Placeholder text is not a label. It disappears once the person
          starts typing.
      - label: "Name it from text already on screen"
        approach: >-
          Point aria-labelledby at a visible heading or button that already
          says what the field is for.
        watch_out: >-
          The id must exist and be unique. If the referenced text is empty,
          the field still has no name.
      - label: "Use aria-label"
        approach: >-
          Add aria-label when the purpose is clear from what is around the
          field.
        watch_out: >-
          This makes the rule check (axe) stop reporting the field, but nobody
          can see an aria-label. The rule does not check that the label is
          visible. A field with no visible label may also fall short of WCAG
          3.3.2 Labels or Instructions. A person decides that.
    verify_manual: >-
      Look at the field without moving the mouse over it: you should see a
      label that says what it is for. Then press Tab to reach it with a screen
      reader on, and check that you hear that label as its name.
    verify_automated: "Scan again and see if this field is still found."
    acceptance: >-
      Every form field on the affected pages gets its name from a label
      element, aria-labelledby or aria-label, not only from a title or a
      description.
    confidence_default: high

  landmark-banner-is-top-level:
    title: "Site banner sits inside another region"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) found a banner (the site-wide header, for example
      with the logo) inside another landmark. A landmark is a page region that
      screen reader users can jump to. The rule check looks at
      <code>role="banner"</code> and <code>&lt;header&gt;</code>. It skips a
      <code>&lt;header&gt;</code> inside <code>&lt;article&gt;</code>,
      <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
      <code>&lt;nav&gt;</code> or <code>&lt;section&gt;</code>, because that
      is not a banner. WCAG does not require this, but it is a best practice.
    why_matters: >-
      Screen reader users expect one site banner at the top level of the page
      that they can jump to from the landmark list. A banner inside another
      region is harder to find and makes the page layout confusing.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the landmark that wraps the flagged banner. Use the element
        locator (CSS selector) in the occurrence, then look at its parent
        elements in your browser's developer tools.
      - >-
        If this is the site header, move it into the page body, next to the
        main content and not inside another landmark. For example:
        <code>&lt;body&gt; &lt;header&gt;…&lt;/header&gt;
        &lt;main&gt;…&lt;/main&gt; &lt;/body&gt;</code>
      - >-
        If it only heads one part of the page, such as a card or a section,
        remove <code>role="banner"</code>. A plain <code>&lt;header&gt;</code>
        inside <code>&lt;section&gt;</code> or <code>&lt;article&gt;</code> is
        not a banner, so the rule check does not flag it.
    fix_options:
      - label: "Move the site header to the top level"
        approach: >-
          Change the shared page layout so the site header sits in the body,
          next to the menu, main content and footer.
        watch_out: >-
          Styles or scripts may depend on the old wrapper around the header.
          Check the header still looks and works the same after the move.
      - label: "Remove the banner role from headers of page parts"
        approach: >-
          Take role="banner" off headers that only introduce a section, card
          or widget, and keep them as plain header elements.
        watch_out: >-
          Keep one banner for the real site header. If every banner role is
          removed, screen reader users lose their quick way to the site
          header.
    verify_manual: >-
      In developer tools, none of the banner's parent elements should be
      another landmark, such as a menu, the footer or a named section. In a
      screen reader's landmark list (VoiceOver on Mac: VO+U, then Landmarks;
      NVDA on Windows: Insert+F7, then Landmarks), one banner should hold the
      site header.
    verify_automated: >-
      Scan again and see if a banner inside another landmark is still found.
    acceptance: >-
      Every banner landmark on the page sits at the top level, not inside any
      other landmark.
    confidence_default: high

  landmark-complementary-is-top-level:
    title: "Side content region sits inside another region"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) found side content (<code>&lt;aside&gt;</code> or
      <code>role="complementary"</code>) inside another landmark, such as a
      header, menu, footer or named section. A landmark is a page region that
      screen reader users can jump to. The rule check allows side content
      inside <code>&lt;main&gt;</code>, but not inside any other landmark.
      WCAG does not require this, but it is a best practice.
    why_matters: >-
      Screen reader users jump between landmarks to reach side content or to
      skip past it. Side content tucked inside the header, menu or footer is
      harder to find and skip, and it makes the page layout confusing.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the landmark that wraps the flagged side content. Use the element
        locator (CSS selector) in the occurrence, then look at its parent
        elements in your browser's developer tools.
      - >-
        Check that it is a real landmark. An <code>&lt;aside&gt;</code> with
        no name inside an <code>&lt;article&gt;</code>,
        <code>&lt;aside&gt;</code>, <code>&lt;nav&gt;</code> or
        <code>&lt;section&gt;</code> is not a landmark under the HTML rules
        for browsers (HTML-AAM). The rule check (axe 4.10) still flags it. If
        so, set the occurrence to Not a problem (false positive).
      - >-
        If the side content is about the whole page, move it next to the main
        content, out of the header, menu or footer. For example:
        <code>&lt;main&gt;…&lt;/main&gt; &lt;aside aria-label="Related
        news"&gt;…&lt;/aside&gt;</code>
      - >-
        If it supports the main content, you can place it inside
        <code>&lt;main&gt;</code> instead, with no other landmark in between.
        If it only belongs to one small part of the page, it may not need to
        be a landmark at all (see the options below).
    fix_options:
      - label: "Move the side content to the top level"
        approach: >-
          Change the page code so the aside sits next to the header, menu,
          main content and footer, not inside any of them.
        watch_out: >-
          If CSS then moves it back to its old spot on screen, the visual
          order and the screen reader order can stop matching. Check both
          after the move.
      - label: "Place it inside the main content"
        approach: >-
          When the side content supports the main content, put it inside the
          main element, with no other landmark in between. The rule check (axe
          4.10) accepts this.
        watch_out: >-
          This works for the main content only. Inside the header, a menu, the
          footer or a named section, the rule check still flags it. The ARIA
          Authoring Practices Guide (APG) still prefers side content at the
          top level.
      - label: "Make it plain content, not a landmark"
        approach: >-
          If the box is not a region people need to jump to, change the aside
          to a plain div (or remove the complementary role). Keep a visible
          heading on it.
        watch_out: >-
          It disappears from the screen reader's landmark list. Without a
          heading, screen reader users lose their quick way to reach it.
    verify_manual: >-
      In developer tools, the only landmark among its parent elements should
      be the main content, or none. Check you can reach it from a screen
      reader's landmark list (VoiceOver on Mac: VO+U, then Landmarks; NVDA on
      Windows: Insert+F7, then Landmarks). If you made it plain content, find
      it by its heading instead.
    verify_automated: >-
      Scan again and see if side content inside another landmark is still
      found.
    acceptance: >-
      Every side content region (aside or complementary role) sits at the top
      level of the page or inside the main content, never inside another
      landmark.
    confidence_default: medium

  landmark-contentinfo-is-top-level:
    title: "Site footer region sits inside another region"
    abilities_affected: [vision]
    what_happening: >-
      Page regions (landmarks) are areas a screen reader can jump to, such as
      <code>&lt;main&gt;</code> and <code>&lt;nav&gt;</code>. The rule check
      (axe) tests each element with <code>role="contentinfo"</code> and each
      <code>&lt;footer&gt;</code> outside <code>&lt;article&gt;</code>,
      <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
      <code>&lt;nav&gt;</code> and <code>&lt;section&gt;</code>. It found one
      inside another page region, for example <code>&lt;footer
      role="contentinfo"&gt;</code> inside <code>&lt;main&gt;</code>. WCAG
      does not require this, but it helps people find the site footer region
      (contentinfo landmark).
    why_matters: >-
      Blind and deafblind people who use a screen reader jump to the footer
      from a list of page regions. When the footer sits inside another region,
      it is harder for them to find it quickly.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence and use its element locator (CSS selector) to find
        the footer in the page code (DOM). Then look at the elements around it
        to find the region that wraps it. This can be
        <code>&lt;main&gt;</code>, <code>&lt;header&gt;</code>,
        <code>&lt;nav&gt;</code>, a <code>&lt;section&gt;</code> with a name
        (<code>aria-label</code> or <code>aria-labelledby</code>), or any
        element with a region role, such as <code>role="main"</code>.
      - >-
        If it is the site-wide footer, move it out of that region. It should
        sit next to <code>&lt;main&gt;</code>, not inside it. For example:
        <code>&lt;body&gt; &lt;header&gt;…&lt;/header&gt;
        &lt;main&gt;…&lt;/main&gt; &lt;footer&gt;…&lt;/footer&gt;
        &lt;/body&gt;</code>
      - >-
        If it is the footer of one article, card or section, remove
        <code>role="contentinfo"</code>. The rule check (axe) does not test a
        plain <code>&lt;footer&gt;</code> inside <code>&lt;article&gt;</code>,
        <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
        <code>&lt;nav&gt;</code> or <code>&lt;section&gt;</code>.
      - >-
        Watch for wrappers that use a role instead of an element. A plain
        <code>&lt;footer&gt;</code> inside <code>&lt;div
        role="main"&gt;</code> is still reported. Use
        <code>&lt;main&gt;</code> for that wrapper, or change the local footer
        to a <code>&lt;div&gt;</code>.
    fix_options:
      - label: "Move the site footer out of the other region"
        approach: >-
          Change the page template so the site-wide <footer> sits next to
          <main> and <header>, not inside them. Or end the wrapping region
          earlier: put <main> around the page content only.
        watch_out: >-
          Many templates wrap the whole page in one layout box. Moving the
          footer out of it can change the layout, such as a footer pinned to
          the bottom of the screen. Check the page at phone and desktop
          widths.
      - label: "Remove the role from local footers"
        approach: >-
          Where role="contentinfo" was added to the footer of an article, card
          or section, delete the role and keep the plain <footer> element.
        watch_out: >-
          Keep one site footer region for the real site-wide footer. If you
          strip the role from every footer and the site footer sits inside
          <main>, screen reader users lose the jump to it.
    verify_manual: >-
      Use a screen reader to move through the page regions (NVDA: press D;
      VoiceOver on Mac: press VO+U, then choose Landmarks). The site footer
      should be its own region, not part of main or another region. You can
      also open the page structure a screen reader uses (accessibility tree)
      in the browser. There, the contentinfo item should not sit inside main,
      navigation, banner, region or any other landmark.
    verify_automated: >-
      Scan again and see if a site footer inside another page region is still
      found.
    acceptance: >-
      Every site footer region (contentinfo landmark) on the affected pages
      sits outside all other page regions.
    confidence_default: high

  landmark-main-is-top-level:
    title: "Main content region sits inside another region"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) found the main content region
      (<code>&lt;main&gt;</code> or <code>role="main"</code>) inside another
      landmark, such as a header, menu or named section. A landmark is a page
      region that screen reader users can jump to. The HTML standard says
      <code>&lt;main&gt;</code> may only sit inside <code>&lt;body&gt;</code>,
      <code>&lt;div&gt;</code>, a <code>&lt;form&gt;</code> with no name, or a
      custom element. WCAG does not require this, but it is a best practice.
    why_matters: >-
      Screen reader users use landmarks to understand the page layout and to
      jump straight to the main content. When the main content sits inside,
      for example, the header, the landmark list shows it in the wrong place
      and the layout becomes confusing.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the landmark that wraps the main content. Use the element locator
        (CSS selector) in the occurrence, then look at its parent elements in
        your browser's developer tools.
      - >-
        Close the header, menu or other landmark before the main content
        starts, so the main content sits next to it. For example:
        <code>&lt;header&gt;…&lt;/header&gt; &lt;nav&gt;…&lt;/nav&gt;
        &lt;main&gt;…&lt;/main&gt; &lt;footer&gt;…&lt;/footer&gt;</code>
      - >-
        If a wrapper around the whole page has a landmark role, remove that
        role. For example, the rule check flags <code>&lt;div
        role="region"&gt;</code> or <code>&lt;form role="form"&gt;</code>
        around everything. A page-wide <code>&lt;form&gt;</code> with no role
        and no name is fine.
    fix_options:
      - label: "Rebuild the layout so the main content is top level"
        approach: >-
          Change the shared page layout so the header, menu, main content and
          footer are side by side in the page code (siblings), inside the
          body.
        watch_out: >-
          CSS or scripts may depend on the old nesting, for example a style
          aimed at "header main". Check the page still looks and works the
          same after the change.
      - label: "Remove the landmark role from the outer wrapper"
        approach: >-
          When a wrapper only got a landmark role by mistake, or for styling,
          remove the role and leave the main element where it is.
        watch_out: >-
          If that wrapper is a region people need, such as a search area, keep
          its role. Move the main content out of it instead.
    verify_manual: >-
      In developer tools, none of the main element's parent elements should be
      a landmark, such as the site header, a menu or a named section. In a
      screen reader's landmark list (VoiceOver on Mac: VO+U, then Landmarks;
      NVDA on Windows: Insert+F7, then Landmarks), choose the main landmark.
      It should take you to the start of the main content.
    verify_automated: >-
      Scan again and see if a main content region inside another landmark is
      still found.
    acceptance: >-
      Every main content region (main element or main role) sits at the top
      level of the page, not inside any other landmark.
    confidence_default: high

  landmark-no-duplicate-banner:
    title: "Page has more than one site header region"
    abilities_affected: [vision]
    what_happening: >-
      The site header region (banner landmark) holds the site name, logo and
      often the main menu. It is any element with <code>role="banner"</code>,
      or a <code>&lt;header&gt;</code> outside <code>&lt;article&gt;</code>,
      <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
      <code>&lt;nav&gt;</code> and <code>&lt;section&gt;</code> (or elements
      with their roles). The rule check (axe) found more than one that a
      screen reader can reach. WCAG does not require one banner, but it helps
      people find the site header.
    why_matters: >-
      Blind and deafblind people who use a screen reader jump to the site
      header from a list of page regions. With two or more, they do not know
      which one is the real site header and must check each one.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find every site header region on the page. Search the page code (DOM)
        for <code>&lt;header&gt;</code> and <code>role="banner"</code>. The
        rule check (axe) reports only one occurrence per page, and Axcess does
        not list the other headers. The occurrence may even point at the
        header you want to keep, so look at the whole page.
      - >-
        Keep one: the header at the top of the page with the site name or
        logo.
      - >-
        For each other one, remove <code>role="banner"</code>. If it is a
        <code>&lt;header&gt;</code> outside <code>&lt;article&gt;</code>,
        <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
        <code>&lt;nav&gt;</code> and <code>&lt;section&gt;</code>, it is still
        a site header. Change it to a <code>&lt;div&gt;</code>, or move it
        inside the <code>&lt;article&gt;</code> or
        <code>&lt;section&gt;</code> it belongs to.
      - >-
        Check pop-ups too. A <code>&lt;header&gt;</code> in a pop-up
        (<code>role="dialog"</code>) or in a plain <code>&lt;div&gt;</code>
        still counts as a site header when it is outside those elements.
    fix_options:
      - label: "Keep one site header and change the others"
        approach: >-
          Leave the site-wide <header> as it is. Remove role="banner" from the
          others. Turn any other <header> that sits outside article, aside,
          main, nav and section, such as a card or pop-up heading area, into a
          <div>.
        watch_out: >-
          Giving each header a different name (aria-label) does not clear this
          rule. The rule check (axe) counts every site header region, whatever
          its name.
      - label: "Hide the copy that is not in use"
        approach: >-
          Some sites have two copies of the header, such as one for phones and
          one for desktops. At each screen width, hide the unused copy with
          display:none or the hidden attribute.
        watch_out: >-
          Moving a header off screen or making it see-through (opacity 0)
          still leaves it for screen readers. Adding aria-hidden="true" to a
          header with links in it hides it from screen readers, but people can
          still reach those links by keyboard.
    verify_manual: >-
      Use a screen reader to move through the page regions (NVDA: press D;
      VoiceOver on Mac: press VO+U, then choose Landmarks). The page should
      have only one site header region (banner), and it should be the real
      site header. If the site swaps headers, check at phone and desktop
      widths.
    verify_automated: >-
      Scan again and see if more than one site header region is still found.
    acceptance: >-
      Every affected page has at most one site header region (banner landmark)
      that a screen reader can reach.
    confidence_default: high

  landmark-no-duplicate-contentinfo:
    title: "Page has more than one site footer region"
    abilities_affected: [vision]
    what_happening: >-
      The site footer region (contentinfo landmark) holds facts about the
      whole site, such as copyright, contact and policy links. It is any
      element with <code>role="contentinfo"</code>, or a
      <code>&lt;footer&gt;</code> outside <code>&lt;article&gt;</code>,
      <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
      <code>&lt;nav&gt;</code> and <code>&lt;section&gt;</code> (or elements
      with their roles). The rule check (axe) found more than one that a
      screen reader can reach. WCAG does not require one footer region, but it
      helps people find the site footer.
    why_matters: >-
      Blind and deafblind people who use a screen reader jump to the site
      footer from a list of page regions. With two or more, they do not know
      which one is the real site footer and must check each one.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find every site footer region on the page. Search the page code (DOM)
        for <code>&lt;footer&gt;</code> and <code>role="contentinfo"</code>.
        The rule check (axe) reports only one occurrence per page, and Axcess
        does not list the other footers. The occurrence may even point at the
        footer you want to keep, so look at the whole page.
      - "Keep one: the site-wide footer at the bottom of the page."
      - >-
        For each other one, remove <code>role="contentinfo"</code>. If it is a
        <code>&lt;footer&gt;</code> outside <code>&lt;article&gt;</code>,
        <code>&lt;aside&gt;</code>, <code>&lt;main&gt;</code>,
        <code>&lt;nav&gt;</code> and <code>&lt;section&gt;</code>, it is still
        a site footer. Change it to a <code>&lt;div&gt;</code>, or move it
        inside the <code>&lt;article&gt;</code> or
        <code>&lt;section&gt;</code> it belongs to.
      - >-
        Check pop-ups too. A <code>&lt;footer&gt;</code> in a pop-up
        (<code>role="dialog"</code>) or in a plain <code>&lt;div&gt;</code>
        still counts as a site footer when it is outside those elements.
    fix_options:
      - label: "Keep one site footer and change the others"
        approach: >-
          Leave the site-wide <footer> as it is. Remove role="contentinfo"
          from the others. Turn any other <footer> that sits outside article,
          aside, main, nav and section, such as the button row of a pop-up,
          into a <div>.
        watch_out: >-
          Giving each footer a different name (aria-label) does not clear this
          rule. The rule check (axe) counts every site footer region, whatever
          its name.
      - label: "Hide the copy that is not in use"
        approach: >-
          Some sites have two copies of the footer, such as one for phones and
          one for desktops. At each screen width, hide the unused copy with
          display:none or the hidden attribute.
        watch_out: >-
          Moving a footer off screen or making it see-through (opacity 0)
          still leaves it for screen readers. Adding aria-hidden="true" to a
          footer with links in it hides it from screen readers, but people can
          still reach those links by keyboard.
    verify_manual: >-
      Use a screen reader to move through the page regions (NVDA: press D;
      VoiceOver on Mac: press VO+U, then choose Landmarks). The page should
      have only one site footer region (contentinfo), and it should be the
      real site footer. If the site swaps footers, check at phone and desktop
      widths.
    verify_automated: >-
      Scan again and see if more than one site footer region is still found.
    acceptance: >-
      Every affected page has at most one site footer region (contentinfo
      landmark) that a screen reader can reach.
    confidence_default: high

  landmark-no-duplicate-main:
    title: "Page has more than one main content region"
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (axe) found more than one main content region (a
      <code>&lt;main&gt;</code> or <code>role="main"</code>) that a screen
      reader can reach. It reports one occurrence, on the first of them. A
      main region hidden with the <code>hidden</code> attribute,
      <code>display: none</code> or <code>aria-hidden="true"</code> does not
      count. WCAG does not require this, but the HTML standard allows only one
      <code>&lt;main&gt;</code> without the <code>hidden</code> attribute.
    why_matters: >-
      Screen reader users jump to the main content in one step. With two main
      regions they do not know which one holds the page's real content, and
      they may land in the wrong place.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        List every main region on the page. In the browser console, run
        <code>document.querySelectorAll('main, [role=main]')</code>.
      - >-
        Keep one main region around the page's primary content. Change each
        extra <code>&lt;main&gt;</code> to <code>&lt;div&gt;</code> or
        <code>&lt;section&gt;</code>, and remove each extra
        <code>role="main"</code>.
      - >-
        Check your layouts. A shared page frame and a page template can each
        add a main region, so the page ends up with two. Only one of them
        should.
      - >-
        If several views stay in the page code at once, add the
        <code>hidden</code> attribute to every view that is not showing.
    fix_options:
      - label: "Keep one main region and change the others"
        approach: >-
          Decide which region holds the primary content, keep it as main, and
          turn the others into plain containers.
        watch_out: >-
          A "Skip to main content" link often points at the id of a main
          element. If you change that element, check the skip link still lands
          on the main content.
      - label: "Hide the views that are not showing"
        approach: >-
          In a single-page app that keeps several views in the page code, add
          the hidden attribute to every view except the one on screen.
        watch_out: >-
          Moving a view off screen or making it see-through (opacity 0) does
          not hide it from screen readers. It still counts as a second main
          region. Use the hidden attribute instead.
    verify_manual: >-
      Open the list of landmarks (page regions) in a screen reader (VoiceOver
      on Mac: VO+U, then Landmarks; NVDA on Windows: Insert+F7, then
      Landmarks). It should show exactly one main landmark, and choosing it
      should take you to the page's primary content. Check this on each view
      of a single-page app.
    verify_automated: >-
      Scan again and see if more than one main content region is still found.
    acceptance: >-
      Every page has at most one main content region that a screen reader can
      reach, and it wraps the page's primary content.
    confidence_default: high

  landmark-unique:
    title: "Two page regions have the same type and name"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) found landmarks of the same type that share the
      name a screen reader reads (accessible name), or have no name. A
      landmark is a page region that screen reader users can jump to, such as
      a menu (navigation) or side content (complementary). The rule check
      ignores case and hidden landmarks. It counts a
      <code>&lt;section&gt;</code> or <code>&lt;form&gt;</code> only when it
      has a name. WCAG does not require this, but it is a best practice.
    why_matters: >-
      A screen reader's landmark list reads each region's type and name, so
      two entries that both say "navigation" give no clue which menu is which.
      People have to open each one to find out.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        The rule check reports one occurrence for each matching set, on its
        first landmark. Find the other landmarks of the same type on the page,
        using a screen reader's landmark list or your browser's developer
        tools.
      - >-
        Give each one a short name that says what it holds. If the region
        starts with a heading, point to it with <code>aria-labelledby</code>;
        otherwise use <code>aria-label</code>. For example: <code>&lt;nav
        aria-label="Main"&gt;</code> and <code>&lt;nav
        aria-label="Footer"&gt;</code>. Leave the type out: a menu named "Site
        navigation" is read as "Site navigation navigation".
      - >-
        Two landmarks with exactly the same content, such as one page-number
        menu above and below a table, may share a name. The rule check still
        flags them, so set that occurrence to Not a problem (false positive).
      - >-
        If the element is not a real page region, remove its landmark role
        instead. For example, a pull quote repeated down the page with
        <code>role="complementary"</code> usually does not need to be a
        landmark.
    fix_options:
      - label: "Name each landmark by what it holds"
        approach: >-
          Add a name to every landmark of the same type, taken from its
          heading (aria-labelledby) or written in aria-label.
        watch_out: >-
          A reusable component often gives every copy the same aria-label, so
          the copies still match. Build the name from each copy's own heading,
          and give each heading its own id.
      - label: "Remove the landmark role where it is not a page region"
        approach: >-
          Take the landmark role off boxes that people do not need to jump to,
          such as repeated quotes or cards. Only real page regions then stay
          in the landmark list.
        watch_out: >-
          The box disappears from the landmark list. Keep a heading on it if
          people still need a quick way to find it.
      - label: "Fix repeated site headers and footers"
        approach: >-
          Two headers (or two footers) outside any article, aside, menu,
          section or main content are both landmarks. Keep one as the landmark
          and turn the other into a plain container, or give each its own
          name.
        watch_out: >-
          Do not strip headers and footers from cards and sections. A header
          or footer inside an article, section, aside, menu or the main
          content is not a landmark. The rule check does not count it.
    verify_manual: >-
      Open a screen reader's landmark list (VoiceOver on Mac: VO+U, then
      Landmarks; NVDA on Windows: Insert+F7, then Landmarks). Each entry's
      type and name should be its own and say what the region holds.
    verify_automated: >-
      Scan again and see if landmarks with the same type and name are still
      found.
    acceptance: >-
      Every landmark on the page has a role and name combination that no other
      landmark on the page has.
    confidence_default: high

  list:
    title: "A list holds items that are not list items"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A list (<code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code>) may only
      hold list items (<code>&lt;li&gt;</code>) directly inside it. The check
      ignores elements that screen readers cannot reach, such as
      <code>&lt;script&gt;</code> and <code>&lt;template&gt;</code>. On this
      page, the list holds something else directly. For example, it holds a
      <code>&lt;p&gt;</code>, a <code>&lt;div&gt;</code>, loose text, or an
      <code>&lt;li&gt;</code> with a role other than <code>listitem</code>.
      The rule check (axe) names each element that is not allowed.
    why_matters: >-
      Screen readers announce lists in a special way, but only when the list
      is built correctly. When other content sits in the list, blind and
      deafblind screen reader users may not be able to tell what belongs to
      the list.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence. The rule check (axe) lists the elements that are
        not allowed, for example <code>p, div</code> or
        <code>[role=presentation]</code>.
      - >-
        Move headings and intro text out of the list, and put them just before
        it. Change <code>&lt;ul&gt;&lt;p&gt;Our
        services&lt;/p&gt;&lt;li&gt;…&lt;/li&gt;&lt;/ul&gt;</code> to
        <code>&lt;p&gt;Our
        services&lt;/p&gt;&lt;ul&gt;&lt;li&gt;…&lt;/li&gt;&lt;/ul&gt;</code>.
      - >-
        Put wrappers such as <code>&lt;div&gt;</code> or
        <code>&lt;a&gt;</code> inside each <code>&lt;li&gt;</code>, not around
        it: <code>&lt;li&gt;&lt;a href="…"&gt;…&lt;/a&gt;&lt;/li&gt;</code>.
      - >-
        If an <code>&lt;li&gt;</code> has a role such as
        <code>role="presentation"</code>, remove that role so it counts as a
        list item again.
    fix_options:
      - label: "Move the extra content out of the list"
        approach: >-
          Put headings, intro text and dividers before or after the list, so
          only <li> elements are left inside it.
        watch_out: >-
          Check the layout after the move. Styles that set spacing or borders
          on the list may now fall on a different element.
      - label: "Put each wrapper inside a list item"
        approach: >-
          When a component wraps each item in a <div> or a link, move that
          wrapper inside the <li> instead of around it.
        watch_out: >-
          Styles written for "ul > div" or "ul > a" will no longer match.
          Update them to "li > div" or "li > a".
      - label: "Use a list only for real lists"
        approach: >-
          If the content is not a group of items, replace the <ul> or <ol> and
          its items with <div> elements. A page layout grid is one example.
        watch_out: >-
          Keep it a list if people would expect to hear a count, such as a
          menu of links or a set of results.
    verify_manual: >-
      Turn on a screen reader and move to the list. It should say "list" with
      the right number of items, and every item you hear should belong to the
      list. Headings or intro text should be read before the list, not as part
      of it.
    verify_automated: >-
      Scan again and see if a list with content other than list items is still
      found.
    acceptance: >-
      Every <ul> and <ol> on the affected pages holds only <li> elements
      directly, apart from elements hidden from screen readers, such as
      <script> and <template>.
    confidence_default: high

  listitem:
    title: "A list item is not inside a list"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A list item (<code>&lt;li&gt;</code>) must sit directly inside a list:
      <code>&lt;ul&gt;</code>, <code>&lt;ol&gt;</code>,
      <code>&lt;menu&gt;</code>, or an element with <code>role="list"</code>.
      On this page, the item's parent is something else. There are two common
      cases. The parent is a plain element such as <code>&lt;div&gt;</code>.
      Or the parent is a list with another role, such as <code>&lt;ul
      role="tablist"&gt;</code>, so it no longer counts as a list. The check
      skips any <code>&lt;li&gt;</code> that has its own <code>role</code>.
    why_matters: >-
      Screen readers tell people when they reach a list and how many items it
      has. Some also let people jump from list to list, or item to item. When
      an item has no real list around it, blind and deafblind screen reader
      users lose that structure.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence and look at the element that directly contains the
        <code>&lt;li&gt;</code>. The rule check (axe) gives one of two
        messages. One is "List item does not have a &lt;ul&gt;, &lt;ol&gt;
        parent element". The other is "List item parent element has a role
        that is not role="list"".
      - >-
        If the parent is a plain element, make it a list. Change <code>&lt;div
        class="feed"&gt;&lt;li&gt;…&lt;/li&gt;&lt;/div&gt;</code> to
        <code>&lt;ul class="feed"&gt;&lt;li&gt;…&lt;/li&gt;&lt;/ul&gt;</code>.
        Use <code>&lt;ol&gt;</code> when the order matters, such as steps.
      - >-
        If the content is not really a list, change each
        <code>&lt;li&gt;</code> to an element that fits, such as
        <code>&lt;div&gt;</code> or <code>&lt;article&gt;</code>.
      - >-
        If the parent is a list with another role, such as tabs built as
        <code>&lt;ul role="tablist"&gt;</code>, the items are no longer list
        items. Add <code>role="none"</code> to each <code>&lt;li&gt;</code> so
        only the tabs inside them are announced: <code>&lt;li
        role="none"&gt;&lt;a role="tab" …&gt;</code>.
    fix_options:
      - label: "Wrap the items in a real list"
        approach: >-
          Put the <li> elements inside a <ul> (no order) or an <ol> (in
          order). This is the simplest fix for a group of items that looks
          like a list.
        watch_out: >-
          If the list has no bullets (list-style: none), Safari with VoiceOver
          may not announce it as a list. Adding role="list" to the <ul> or
          <ol> brings the list back in that browser.
      - label: "Use elements that are not list items"
        approach: >-
          If the content is not a group of related items, replace each <li>
          with a <div>, <p> or <article>.
        watch_out: >-
          Check the styles and scripts first. Many of them find li elements by
          name and will stop working when the element changes.
      - label: "Remove the list item role inside a widget"
        approach: >-
          When a <ul> has another role, such as role="tablist" or
          role="menubar", add role="none" to each <li>. The item then acts
          only as a wrapper, and the rule no longer applies to it.
        watch_out: >-
          The element inside each <li> must then carry the real role, such as
          role="tab" or role="menuitem", or the widget has no working items.
    verify_manual: >-
      Turn on a screen reader and move to the list. NVDA should say "list" and
      the number of items, and the L key should jump to it in browse mode.
      VoiceOver should say "list" and the item count. For tabs or menus, check
      that each tab or menu item is announced and that no extra list is
      announced.
    verify_automated: "Scan again and see if a list item outside a list is still found."
    acceptance: >-
      Every <li> on the affected pages sits directly inside a <ul>, <ol>,
      <menu> or role="list" element, or has role="none" inside a widget.
    confidence_default: high

  marquee:
    title: "Scrolling text made with the old marquee element"
    wcag_sc: "2.2.2"
    wcag_name: "Pause, Stop, Hide"
    wcag_level: "A"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      The page shows a <code>&lt;marquee&gt;</code> element. It makes text or
      images scroll across the screen by themselves. The HTML standard says
      authors must not use <code>&lt;marquee&gt;</code> (it is obsolete). The
      rule check (axe) reports each <code>&lt;marquee&gt;</code> that people
      can see on the page. It does not report a hidden one.
    why_matters: >-
      Moving text is hard to read for people with low vision, and moving links
      are hard to click for people with limited hand control. The motion also
      pulls attention away from the rest of the page for people with attention
      or learning disabilities.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Remove the <code>&lt;marquee&gt;</code> element from the page code or
        template.
      - >-
        Show the same content as still text. For example, replace
        <code>&lt;marquee&gt;Office closed Monday&lt;/marquee&gt;</code> with
        <code>&lt;p&gt;Office closed Monday&lt;/p&gt;</code>.
      - >-
        If the content must move, build the motion with a style animation (CSS
        animation). If it starts by itself and moves for more than 5 seconds,
        add a visible button that pauses, stops or hides it. Make sure the
        button works with the keyboard.
    fix_options:
      - label: "Replace it with still text"
        approach: >-
          Put the content in a normal paragraph, list or banner that does not
          move.
        watch_out: >-
          A marquee sometimes holds many messages in one long line. Split them
          into short items so the still text is easy to scan.
      - label: >-
          Rebuild the motion with a style animation (CSS) and a pause button
        approach: >-
          Use a style animation (CSS animation) for the movement. Add a button
          that pauses it and restarts it from where it stopped.
        watch_out: >-
          The rule check (axe) marquee does not look at style animations. A
          clean scan does not show that the new motion is fine. If it starts
          by itself and lasts more than 5 seconds next to other content, it
          still needs a pause, stop or hide control.
    verify_manual: >-
      Load each affected page and watch it for at least 5 seconds. Nothing
      should scroll or slide by itself, unless a visible button that works
      with the keyboard can pause, stop or hide it. If you turn on the motion
      and reading-order check, it also lists every <marquee> for review.
    verify_automated: "Scan again and see if a <marquee> element is still found."
    acceptance: >-
      Every affected page has no <marquee> element, and any self-starting
      motion over 5 seconds can be paused, stopped or hidden.
    confidence_default: high

  meta-refresh:
    title: "The page reloads or moves on after a timer"
    wcag_sc: "2.2.1"
    wcag_name: "Timing Adjustable"
    wcag_level: "A"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      The page has a <code>&lt;meta http-equiv="refresh"&gt;</code> tag with a
      delay. After that many seconds, the browser reloads the page, or sends
      the user to another address if the tag has a <code>url=</code> part. The
      rule check (axe) reads the first number in the <code>content</code>
      value. It reports the tag when the delay is more than 0 seconds and no
      more than 20 hours (72,000 seconds). Examples are
      <code>content="30"</code> and <code>content="5; url=/new-page"</code>.
    why_matters: >-
      Screen reader users and people with low vision, limited hand movement or
      learning disabilities often need more time. The page may change before
      they finish. A reload also sends them back to the top of the page, so
      they lose their place.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the tag in the page head or template, for example <code>&lt;meta
        http-equiv="refresh" content="10; url=/new-page"&gt;</code>. Decide
        why it is there: to send people to a new address, or to show fresh
        content.
      - >-
        To send people to a new address, remove the tag. Set up a redirect on
        the web server instead (an HTTP 301 or 302 status). If you cannot
        change the server, use a delay of 0: <code>&lt;meta
        http-equiv="refresh" content="0; url=/new-page"&gt;</code>.
      - >-
        To show fresh content, remove the tag. Add an "Update now" button, or
        update the content with a script that has a visible control to pause
        it or turn it off.
      - >-
        If the timer ends a session, replace the tag with a script that warns
        people before time runs out. Let them add more time with one simple
        action, such as pressing a button, and give them at least 20 seconds
        to do it.
    fix_options:
      - label: "Redirect on the web server"
        approach: >-
          Remove the meta tag and make the server answer the old address with
          a 301 (moved for good) or 302 (moved for now) redirect. People reach
          the new page at once, with no timer.
        watch_out: >-
          If people need to know the page has moved, do not show a notice on a
          timer. Show the notice with a link they choose to follow.
      - label: "Let people ask for new content"
        approach: >-
          Remove the automatic reload. Give people an "Update now" button, or
          load new content with a script that people can pause, slow down or
          turn off.
        watch_out: >-
          A script that reloads the page on a timer causes the same problem.
          So does a refresh instruction sent by the server (HTTP Refresh
          header). This rule check (axe) cannot see either, so a clean scan
          does not prove the timer is gone.
      - label: "Use a delay of 0 seconds"
        approach: >-
          If you can only change the page, set the delay to 0. The browser
          then moves on at once, and there is nothing to read before it
          happens.
        watch_out: >-
          WCAG guidance still prefers a server redirect. Browsers read a badly
          written content value in different ways, so write it in the standard
          form, such as 0; url=/new-page.
    verify_manual: >-
      Open the page and do nothing for longer than the old delay. Check that
      it does not reload or move to another address unless you ask. Then look
      for a refresh tag in the page source, and for a Refresh header in the
      browser's developer tools (Network tab).
    verify_automated: "Scan again and see if a refresh tag with a timer is still found."
    acceptance: >-
      Every page loads without a timed reload or redirect, and any update or
      redirect happens at once or only when the user asks.
    confidence_default: high

  meta-refresh-no-exceptions:
    title: "A very long timer reloads or moves the page"
    wcag_sc: "2.2.4"
    wcag_name: "Interruptions"
    wcag_level: "AAA"
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      The page has a <code>&lt;meta http-equiv="refresh"&gt;</code> tag that
      reloads the page, or sends the user to another address, after more than
      20 hours (72,000 seconds). The rule check (axe) runs this rule only in
      scans set to Level AAA. It reports only delays over 20 hours, because
      the rule meta-refresh already reports shorter delays. At Level AAA, any
      delay other than 0 is a problem.
    why_matters: >-
      The page changes without the user asking, and a reload sends them back
      to the top of the page. Screen reader users and people with low vision
      can lose their place, and people with attention disorders get
      distracted.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the tag in the page head or template, for example <code>&lt;meta
        http-equiv="refresh" content="86400"&gt;</code> (24 hours), and decide
        why it is there.
      - >-
        To send people to a new address, remove the tag. Set up a redirect on
        the web server (an HTTP 301 or 302 status). Or use a delay of 0:
        <code>content="0; url=/new-page"</code>.
      - >-
        To show fresh content, remove the tag. Let people ask for new content
        with an "Update now" button, or let them put off or turn off automatic
        updates.
    fix_options:
      - label: "Remove the timer and let people ask for updates"
        approach: >-
          Remove the meta refresh tag. Show a control that loads new content
          when the user chooses, and nothing changes on its own.
        watch_out: >-
          A script that reloads on a timer causes the same problem, and so
          does a refresh instruction sent by the server (HTTP Refresh header).
          This rule check (axe) cannot see either one.
      - label: "Redirect on the web server"
        approach: >-
          If the tag moves people to a new address, replace it with a 301 or
          302 redirect on the server. The move then happens at once.
        watch_out: >-
          At Level AAA, only an instant move passes. Do not keep a "this page
          has moved" notice that forwards people on a timer.
    verify_manual: >-
      Look for a refresh tag in the page source, and for a Refresh header in
      the browser's developer tools (Network tab). If one exists, its delay
      must be 0. Check that updates happen only when you ask for them, except
      for emergency messages.
    verify_automated: >-
      Scan again at Level AAA and see if a refresh tag with a timer over 20
      hours is still found.
    acceptance: >-
      Every page is free of timed reloads and redirects, and any meta refresh
      left on the site has a delay of 0.
    confidence_default: high

  meta-viewport:
    title: "Page code blocks zoom or limits it below 200%"
    wcag_sc: "1.4.4"
    wcag_name: "Resize Text"
    wcag_level: "AA"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) reads the viewport tag (<code>&lt;meta
      name="viewport"&gt;</code>), a line in the page head that tells phone
      browsers how far people may zoom. It reports the tag when it blocks zoom
      or stops it below 200%. That means <code>user-scalable=no</code>, a
      <code>user-scalable</code> number between -1 and 1 (such as
      <code>0</code>), or a <code>maximum-scale</code> below 2 (such as
      <code>1</code>). It counts <code>maximum-scale=yes</code> as 1, so it
      reports that too.
    why_matters: >-
      People with low vision zoom in to make text big enough to read. In a
      phone browser or app that obeys this tag, they cannot zoom to 200%, so
      small text stays too small to read.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find where the page gets its viewport tag. It is often in one shared
        page template or layout file, or in a framework setting that writes
        the tag. One change there can fix every page.
      - >-
        Remove <code>user-scalable=no</code> (or
        <code>user-scalable=0</code>). Remove <code>maximum-scale</code>, or
        set it to 2 or more. This tag passes: <code>&lt;meta name="viewport"
        content="width=device-width, initial-scale=1"&gt;</code>.
      - >-
        Zoom the page to at least 200% on a phone-sized screen and read it.
        Removing the limit can show layout problems it was hiding, such as
        text that is cut off or overlaps. Fix those in the page styles (CSS),
        not by limiting zoom again.
    fix_options:
      - label: "Remove the zoom limits"
        approach: >-
          Delete user-scalable and maximum-scale from the tag and keep only
          width=device-width, initial-scale=1. The browser then allows its
          full zoom range.
        watch_out: >-
          Some teams add the limit because Safari on iPhone zooms in by
          itself. It does this when someone taps a form field with text
          smaller than 16 pixels (16px). Give form fields text of at least
          16px instead of putting the limit back.
      - label: "Keep a limit of 2 or more"
        approach: >-
          If your team wants a cap, set maximum-scale=2 or higher and remove
          user-scalable=no. This passes this rule.
        watch_out: >-
          The separate best-practice issue meta-viewport-large still reports a
          cap below 5. Removing the cap fixes both issues at once.
    verify_manual: >-
      Open the page code in the browser's developer tools. Check that the
      viewport tag has no user-scalable=no or user-scalable=0, and no
      maximum-scale below 2. A phone test alone can miss the problem. Safari
      on iPhone ignores these limits, and many phone browsers ignore them or
      offer a setting that allows zoom.
    verify_automated: >-
      Scan again and see if a viewport tag that blocks zoom or limits it below
      200% is still found.
    acceptance: >-
      Every viewport tag on the site lets people zoom: it has no
      user-scalable=no or user-scalable=0, and no maximum-scale below 2.
    confidence_default: high

  meta-viewport-large:
    title: "Page code limits zoom to less than 500%"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) reads the viewport tag (<code>&lt;meta
      name="viewport"&gt;</code>), a line in the page head that tells phone
      browsers how far people may zoom. It reports the tag when
      <code>maximum-scale</code> is 2 or more but below 5, such as
      <code>maximum-scale=3</code>, which limits zoom to 300%. It does not
      report <code>user-scalable=no</code> or a cap below 2: the separate
      issue meta-viewport reports those. This is a best practice: the Web
      Content Accessibility Guidelines (WCAG) do not require zoom beyond 200%,
      but more zoom helps people who need it.
    why_matters: >-
      Some people with low vision need to zoom in further than 200% to read
      text. A zoom cap below 500% can stop them before the text is big enough.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find where the page gets its viewport tag. It is often in one shared
        page template or layout file, or in a framework setting that writes
        the tag.
      - >-
        Remove <code>maximum-scale</code> from the tag, or set it to 5 or
        more. This tag passes: <code>&lt;meta name="viewport"
        content="width=device-width, initial-scale=1"&gt;</code>.
      - >-
        Zoom the page on a phone as far as it goes and check that text and
        controls stay usable. Fix any layout problems in the page styles (CSS)
        rather than lowering the cap.
    fix_options:
      - label: "Remove the zoom cap"
        approach: >-
          Delete maximum-scale and keep only width=device-width,
          initial-scale=1. The browser then allows its full zoom range.
        watch_out: >-
          Do not add user-scalable=no in its place. This rule does not report
          it, but the separate issue meta-viewport does, because it blocks
          zoom completely.
      - label: "Raise the cap to at least 5"
        approach: >-
          If your team wants a cap, set maximum-scale=5 or higher. This lets
          people zoom to 500%.
        watch_out: >-
          Check every template. Some pages use a different layout, such as a
          sign-in page or a campaign page. That layout can have its own
          viewport tag with the old value.
    verify_manual: >-
      Open the page code in the browser's developer tools. Check that the
      viewport tag has no maximum-scale, or one of 5 or more. A phone test
      alone can miss the problem. Safari on iPhone ignores the cap, and many
      phone browsers ignore it or offer a setting that allows zoom.
    verify_automated: >-
      Scan again and see if a viewport tag that limits zoom to less than 500%
      is still found.
    acceptance: >-
      Every viewport tag on the site has no maximum-scale, or a maximum-scale
      of 5 or more.
    confidence_default: high

  nested-interactive:
    title: "A control has another control inside it"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some controls hide what is inside them from screen readers. These
      include a button, checkbox, radio button, switch, tab, slider, list
      option, and a checkbox or radio item in a menu. The rule check (axe)
      found one with another control inside that can take focus, such as a
      link inside a button: <code>&lt;button&gt;Save &lt;a
      href="/more"&gt;More options&lt;/a&gt;&lt;/button&gt;</code>. The
      occurrence is the outer control; the Page inspector's Page code (DOM)
      tab shows the inner one.
    why_matters: >-
      Screen readers do not announce the inner control, so keyboard and screen
      reader users land on a stop with no name or role. They cannot tell what
      kind of control it is or what it does, and browsers handle it in
      different ways.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        In the Page inspector's Page code (DOM) tab, find the control inside
        the outer control. For example, look for a link or button inside
        <code>&lt;button&gt;</code> or inside <code>role="tab"</code>.
      - >-
        Move the inner control out, so the two sit side by side:
        <code>&lt;button&gt;Save&lt;/button&gt; &lt;a href="/more"&gt;More
        options&lt;/a&gt;</code>.
      - >-
        If the outer element is not really a control, remove its role, for
        example <code>role="button"</code> on a card <code>&lt;div&gt;</code>.
        Keep only the inner link or button.
      - >-
        Fix the shared component, such as the card, tab or list item, so every
        page gets the change.
    fix_options:
      - label: "Place the controls side by side"
        approach: >-
          Take the inner link or button out of the outer control and place it
          next to it, each with its own clear name.
        watch_out: >-
          Check the layout and the Tab order after the move. Adding
          tabindex="-1" or aria-hidden="true" to the inner control instead is
          not a fix. Screen readers can still focus it, and the rule check
          (axe) still reports it.
      - label: "Keep one control and drop the other"
        approach: >-
          If both do the same job, such as a clickable card with a link
          inside, keep the real link. Remove the button role or click handler
          from the outer element.
        watch_out: >-
          If you still want the whole card clickable for mouse users, make the
          one link's click area cover the card with CSS. Do not add a second
          stop for the Tab key.
    verify_manual: >-
      Press Tab through the component. Every stop should be one control with a
      clear name. With a screen reader, check that it announces each control's
      name and role, such as "More options, link".
    verify_automated: "Scan again and see if this control is still found."
    acceptance: >-
      Every button, tab, checkbox, option or similar control on the page has
      no link, button, field or other control inside it that can take focus.
    confidence_default: high

  no-autoplay-audio:
    title: "Sound starts by itself with no way to stop it"
    wcag_sc: "1.4.2"
    wcag_name: "Audio Control"
    wcag_level: "A"
    abilities_affected: [vision, hearing, cognition]
    what_happening: >-
      An <code>&lt;audio&gt;</code> or <code>&lt;video&gt;</code> element has
      the <code>autoplay</code> attribute, so it starts playing by itself. The
      rule check (axe) looks only at elements that have loaded a file and do
      not have the <code>muted</code> attribute. It passes the element if it
      has the <code>controls</code> attribute, or if what plays lasts 3
      seconds or less and does not loop. It does not check whether the file
      really has sound. It reports a problem as needing review, not as a
      failure, so a person must check it.
    why_matters: >-
      Screen reader users hear the page as speech. Other sound playing at the
      same time drowns it out, so they cannot find the control to stop it.
      This is worse for people who are hard of hearing. Sound that starts by
      itself also makes it hard for some people to focus on the page.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Best: remove <code>autoplay</code> and let people start the sound
        themselves, for example <code>&lt;video src="intro.mp4"
        controls&gt;&lt;/video&gt;</code>.
      - >-
        If it must start by itself, add the <code>muted</code> attribute so it
        plays without sound. Or keep the sound to 3 seconds or less, with no
        <code>loop</code>.
      - >-
        If sound must play for longer, give people a control to pause, stop or
        mute it, or to change its volume. Put the control near the start of
        the page, and make it work with a keyboard. Give it a clear name, for
        example <code>&lt;button type="button"&gt;Pause background
        music&lt;/button&gt;</code>.
    fix_options:
      - label: "Play sound only when people ask"
        approach: >-
          Remove autoplay. Show a play button so the sound starts only when
          someone chooses it.
        watch_out: >-
          Check scripts too. A script that calls play() when the page loads
          still starts sound by itself, and this rule only looks for the
          autoplay attribute.
      - label: "Autoplay without sound"
        approach: >-
          Add the muted attribute so the video plays silently, and let people
          turn the sound on.
        watch_out: >-
          Muting only with a script, without the muted attribute, does not
          stop this rule from reporting it. A silent video that moves for more
          than 5 seconds also needs a way to pause it (WCAG 2.2.2).
      - label: "Keep autoplay and add controls"
        approach: >-
          Add the controls attribute or your own pause, stop and mute buttons,
          placed near the start of the page.
        watch_out: >-
          The controls attribute passes this rule, but the controls only help
          if people can see them and use them. Test them with a keyboard and a
          screen reader. Turning down the computer's own volume does not count
          as a way to stop the sound.
    verify_manual: >-
      Load the page with the sound on and a screen reader running. If sound
      plays for more than 3 seconds, check that you can reach a pause, stop or
      mute control with the keyboard. The screen reader should read its name.
      Browsers sometimes block sound that starts by itself, so allow autoplay
      for the site in the browser settings before you test.
    verify_automated: >-
      Scan again and see if a video or audio element that starts by itself is
      still found.
    acceptance: >-
      Every audio and video element either waits for the user to start it or
      plays sound for 3 seconds or less. Otherwise, it has a control that
      works with a keyboard to pause, stop or mute it.
    confidence_default: medium

  object-alt:
    title: "Embedded object has no text alternative"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The page embeds a file with <code>&lt;object data="..."&gt;</code>, for
      example an image, a video, a PDF or another page. The rule check (axe)
      looks at each object whose content between the
      <code>&lt;object&gt;</code> tags (fallback content) does not show. That
      usually means the file loaded. The object needs a name from
      <code>title</code>, <code>aria-label</code> or
      <code>aria-labelledby</code>. If it is decoration, it needs
      <code>role="none"</code> or <code>role="presentation"</code> instead.
      This object has none of these. Text between the tags does not count,
      because it shows only when the file fails to load.
    why_matters: >-
      Screen readers cannot turn an embedded image or video into words, so
      they read its text alternative instead. Without one, people who are
      blind or deafblind do not know what the object is, and some screen
      readers skip it completely.
    owner: dev
    effort: under_15m
    fix_steps:
      - "Find out what the object shows and why it is on the page."
      - >-
        Give it a short name that says what it is. Example: <code>&lt;object
        data="map.svg" type="image/svg+xml" aria-label="Campus
        map"&gt;&lt;/object&gt;</code>.
      - >-
        If a visible heading or caption already names it, point to that text:
        <code>&lt;object data="report.pdf"
        aria-labelledby="report-title"&gt;&lt;/object&gt;</code>.
      - >-
        If the object is only decoration, hide it from screen readers with
        <code>role="presentation"</code> or <code>role="none"</code>.
    fix_options:
      - label: "Add aria-label or title to the object"
        approach: >-
          Write a short name on the object itself that says what the embedded
          content is, such as "Campus map" or "2025 annual report (PDF)".
        watch_out: >-
          The name only says what the object is. If it shows information, such
          as a chart, also give that information as text, for example on the
          page or in a linked description.
      - label: "Point to a visible caption with aria-labelledby"
        approach: >-
          Give the heading or caption next to the object an id, and set
          aria-labelledby on the object to that id.
        watch_out: >-
          The id must exist and the text it points to must not be empty, or
          the object still has no name.
      - label: "Mark a decorative object with role none"
        approach: >-
          If the object adds nothing people need, set role="none" or
          role="presentation" so screen readers ignore it.
        watch_out: >-
          The role stops working if the object can take keyboard focus. It
          also stops working if the object has an accessibility attribute
          (ARIA attribute) that any element may use, such as aria-describedby.
          Never hide an object that holds information.
    verify_manual: >-
      With a screen reader on, move through the page to the object. It should
      read a name that says what the object is, or skip it if it is
      decoration. If the object shows information, check that the same
      information is also available as text.
    verify_automated: >-
      Scan again and see if an embedded object with no text alternative is
      still found.
    acceptance: >-
      Every loaded object has a name that says what it is, or is marked as
      decoration with role="none" or role="presentation".
    confidence_default: high

  presentation-role-conflict:
    title: "Hidden decoration can still reach screen readers"
    abilities_affected: [vision, motor]
    what_happening: >-
      Some elements are marked as decoration, but they also have something
      that can make browsers show them to screen readers again. Decoration
      here means <code>role="none"</code>, <code>role="presentation"</code> or
      an image with <code>alt=""</code>. The rule check (axe) fails them when
      they can take keyboard focus. It also fails them when they carry a
      global Accessible Rich Internet Applications (ARIA) attribute, one that
      works on any element. Examples are any <code>tabindex</code> (even
      <code>tabindex="-1"</code>), <code>aria-label</code> and
      <code>aria-describedby</code>. It checks only elements that would
      otherwise have a role, such as <code>&lt;li&gt;</code> or
      <code>&lt;img&gt;</code>. The rule check (axe) lists this as a best
      practice, not as a Web Content Accessibility Guidelines (WCAG)
      criterion.
    why_matters: >-
      Browsers handle this conflict in different ways, so one browser may hide
      the element and another may show it. Screen reader users may land on an
      empty or confusing item, and keyboard users may tab to something that
      does nothing.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide for each occurrence: is the element only decoration, or does it
        do something or carry meaning?
      - >-
        If it is decoration, remove what conflicts. Take off
        <code>tabindex</code> and global ARIA attributes such as
        <code>aria-label</code>: <code>&lt;img src="divider.png"
        alt=""&gt;</code> or <code>&lt;li role="none"&gt;</code>
      - >-
        If it does something or carries meaning, remove
        <code>role="none"</code> or <code>role="presentation"</code>. Give an
        image real alt text instead of <code>alt=""</code>.
      - >-
        Never put <code>role="none"</code> on a control that takes focus, such
        as <code>&lt;button&gt;</code>. The role cannot remove it.
    fix_options:
      - label: "Keep it as decoration and remove the conflict"
        approach: >-
          Leave role="none", role="presentation" or alt="" in place, and
          delete the tabindex and any global ARIA attribute on the element.
        watch_out: >-
          Check that the element holds no information people need. If a script
          adds tabindex or ARIA to it at run time, fix the script too, or the
          conflict comes back.
      - label: "Treat it as real content"
        approach: >-
          Remove the decorative role, or replace alt="" with alt text that
          says what the image means. Keep the aria-label or focus if the
          element needs them.
        watch_out: >-
          A focusable element also needs a role, a name and a keyboard action.
          Removing the decorative role alone does not make a custom control
          work.
    verify_manual: >-
      Press Tab through the page: focus should never land on a decorative
      element. Then use a screen reader to read the area. It should skip
      decoration and read anything meaningful with a clear name.
    verify_automated: "Scan again and see if these elements are still found."
    acceptance: >-
      Every element marked as decoration cannot take focus and has no global
      ARIA attribute, and every meaningful element is not marked as
      decoration.
    confidence_default: medium

  role-img-alt:
    title: "An element shown as an image has no text alternative"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      An element that is not an <code>&lt;img&gt;</code>, such as a
      <code>&lt;div&gt;</code> or <code>&lt;span&gt;</code>, has
      <code>role="img"</code>, so screen readers treat it as one image. It has
      no name a screen reader can read (accessible name). The rule check (axe)
      passes it only with a non-empty <code>aria-label</code>,
      <code>aria-labelledby</code> that points to text, or <code>title</code>.
      An <code>alt</code> attribute does not work here. Text inside the
      element does not count either, because screen readers do not read inside
      an image. Examples are a chart built from shapes, or a gallery that
      shows photos as background images (CSS). An <code>&lt;svg&gt;</code>
      with <code>role="img"</code> is checked by a different rule
      (svg-img-alt).
    why_matters: >-
      Screen readers cannot turn a picture into words, so blind and deafblind
      users get nothing useful, or just "image". Anything the picture shows,
      such as the trend in a chart, is lost to them.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide what the image tells people. If it holds information, write a
        short text alternative that gives that information.
      - >-
        Add it with <code>aria-label</code>: <code>&lt;div role="img"
        aria-label="Enrollment rose from 1,200 in 2023 to 1,450 in
        2025"&gt;</code>. An empty <code>aria-label=""</code> still fails.
      - >-
        If visible text on the page already describes it, point to that text:
        <code>&lt;div role="img" aria-labelledby="chart-caption"&gt;</code>,
        where <code>chart-caption</code> is the <code>id</code> of the
        caption.
      - >-
        If the image is only decoration, remove <code>role="img"</code> or add
        <code>aria-hidden="true"</code>, so screen readers skip the element.
    fix_options:
      - label: "Add aria-label with the text alternative"
        approach: >-
          Write the text alternative into aria-label on the element that has
          role="img". For a gallery, fill it from the alt text stored with
          each photo in the media library.
        watch_out: >-
          A page builder can write aria-label="" when a photo has no alt text
          saved, and that still fails. Fill in the alt text for each photo,
          not just the template.
      - label: "Point to a visible caption with aria-labelledby"
        approach: >-
          When a caption or heading already says what the image shows, point
          aria-labelledby at its id. Sighted and screen reader users then get
          the same words.
        watch_out: >-
          The id must exist on the same page and its element must have text. A
          wrong or missing id leaves the image with no name.
      - label: "Give a complex image a short name and a longer description"
        approach: >-
          For a chart or diagram, keep the name short. Put the full data
          nearby, for example in a table or a text summary under the chart.
        watch_out: >-
          Text inside a role="img" element is hidden from screen readers. Put
          the table or summary outside that element, not inside it.
    verify_manual: >-
      With a screen reader, move to each flagged element. It should say
      "image" and a name that gives the same information the picture shows. A
      decorative element should be skipped.
    verify_automated: >-
      Scan again and see if an element with role="img" and no name is still
      found.
    acceptance: >-
      Every element with role="img" has a non-empty name that gives the
      image's information, or is decoration that screen readers skip.
    confidence_default: high

  scope-attr-valid:
    title: "A table cell uses the scope attribute the wrong way"
    abilities_affected: [vision, motor]
    what_happening: >-
      The <code>scope</code> attribute tells screen readers which cells a
      header cell names: its row (<code>scope="row"</code>) or its column
      (<code>scope="col"</code>). The rule check (axe) found a cell that uses
      <code>scope</code> the wrong way. Its value may be something other than
      <code>row</code>, <code>col</code>, <code>rowgroup</code> or
      <code>colgroup</code>. Or it may sit on a data cell
      (<code>&lt;td&gt;</code>) on a page that starts with <code>&lt;!DOCTYPE
      html&gt;</code>. This is a best practice: WCAG does not require it, but
      it helps people.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, hear a
      cell's row or column header as they move through a table. When scope is
      wrong, the browser ignores it and works out the headers on its own.
      People can then hear the wrong header or none.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the occurrence. It points to the cell itself. In the page code
        (DOM), look at its tag and at the value of its <code>scope</code>
        attribute.
      - >-
        If the value is misspelled or made up, such as
        <code>scope="header"</code> or <code>scope="column"</code>, fix it.
        Use <code>col</code> for a column header or <code>row</code> for a row
        header. The rule check (axe) ignores upper and lower case.
      - >-
        If a <code>&lt;td&gt;</code> has <code>scope</code>, decide if the
        cell is really a header. If it is, change it to
        <code>&lt;th&gt;</code>. If it holds data, remove <code>scope</code>.
      - >-
        Example: <code>&lt;tr&gt;&lt;th scope="col"&gt;Name&lt;/th&gt;&lt;th
        scope="col"&gt;1 mile&lt;/th&gt;&lt;/tr&gt;</code> then
        <code>&lt;tr&gt;&lt;th
        scope="row"&gt;Mary&lt;/th&gt;&lt;td&gt;8:32&lt;/td&gt;&lt;/tr&gt;</code>.
    fix_options:
      - label: "Turn the header cell into a th"
        approach: >-
          Where a td with scope works as a header, change the tag to th and
          keep scope="row" or scope="col".
        watch_out: >-
          Browsers show th text in bold and centered by default. Add a style
          rule if the design must keep the old look. Also check any style
          rules or scripts that select td.
      - label: "Remove scope from a data cell"
        approach: >-
          Where the td holds data and does not name other cells, delete the
          scope attribute.
        watch_out: >-
          Check the cell first. If it really labels a row or column, removing
          scope loses that link. Make it a th instead.
      - label: "Fix the scope value"
        approach: >-
          Replace an unknown value with row or col. Use rowgroup or colgroup
          only when the header covers a real group of rows (such as a tbody)
          or of columns (a colgroup).
        watch_out: >-
          Deque, the maker of axe, lists only row and col on its page for this
          rule. HTML does not allow rowgroup on a header that is not inside a
          row group. So use row and col unless the table really has groups.
    verify_manual: >-
      Turn on a screen reader and move into the table. Move cell by cell with
      table keys (NVDA: Ctrl+Alt+Arrow keys; VoiceOver: Control+Option+Arrow
      keys). Each data cell should be read with the right row or column
      header.
    verify_automated: >-
      Scan again and see if a cell that uses the scope attribute the wrong way
      is still found.
    acceptance: >-
      Every scope attribute on the page sits on a th element and has the value
      row, col, rowgroup or colgroup.
    confidence_default: high

  scrollable-region-focusable:
    title: "Keyboard users cannot scroll this area"
    wcag_sc: "2.1.1"
    wcag_name: "Keyboard"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      An element on the page scrolls on its own, for example a box with
      <code>overflow: auto</code> that holds a long table or text. The Tab key
      cannot reach the box or anything inside it. This rule check (axe) also
      maps it to WCAG 2.1.3 Keyboard (No Exception), which is Level AAA. An
      area that holds only decoration or empty space may not need keyboard
      access.
    why_matters: >-
      People who use only a keyboard scroll with the arrow keys, which work
      only after the area gets keyboard focus. If nothing in the area can get
      focus, they cannot scroll it, so the hidden part of the content is out
      of reach.
    owner: dev
    effort: under_15m
    fix_steps:
      - "Find the scrolling element from the element locator (CSS selector)."
      - >-
        Add <code>tabindex="0"</code> so the Tab key can reach it. Also give
        it a role and a name a screen reader can read (accessible name):
        <code>&lt;div class="table-wrap" tabindex="0" role="region"
        aria-label="Price table"&gt;</code>.
      - >-
        Give it a clear focus outline, for example with a
        <code>:focus-visible</code> style, so people can see where they are.
      - >-
        If the area does not need to scroll, remove the fixed height or
        overflow style instead, so the content shows in full.
    fix_options:
      - label: "Make the scrolling area focusable and named"
        approach: >-
          Add tabindex="0", role="region" and an aria-label or aria-labelledby
          to the scrolling element, so keyboard users can Tab to it and scroll
          with the arrow keys.
        watch_out: >-
          Without a name, a screen reader has nothing useful to say when the
          area gets focus. Firefox and newer Chrome let you Tab to scrolling
          areas on their own, but Safari does not, so do not rely on that.
      - label: "Let the content flow instead of scrolling"
        approach: >-
          Remove the fixed height or overflow style, so the whole content is
          on the page and the page itself scrolls.
        watch_out: >-
          Check that this does not break the layout at narrow widths or at
          400% zoom, for example with a wide table.
      - label: "Rely on a control inside the area"
        approach: >-
          If the area holds a link, button or other element the Tab key can
          reach, that also passes this rule.
        watch_out: >-
          Deque, the maker of the rule check (axe), notes this can fail when
          the browser takes over the keys for form autocomplete. It advises
          tabindex="0" on the area, or on a plain element inside it, as the
          safer choice. Controls with tabindex="-1" do not count.
    verify_manual: >-
      Using only the keyboard, press Tab until the area has focus, then use
      the arrow keys to scroll it to the end. Test in Safari too, because
      Firefox and Chrome may let you Tab to the area even when the code does
      not. With a screen reader, check that it announces the area's name when
      it gets focus.
    verify_automated: "Scan again and see if this scrolling area is still found."
    acceptance: >-
      Every scrolling area on the page is reachable with the Tab key and
      scrolls with the arrow keys, or no longer scrolls on its own.
    confidence_default: high

  select-name:
    title: "A drop-down list has no name"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      A drop-down list (<code>&lt;select&gt;</code>) has no name a screen
      reader can read (accessible name). The rule check (axe) looks for a
      <code>&lt;label&gt;</code> tied to the list, an <code>aria-label</code>,
      an <code>aria-labelledby</code>, or a <code>title</code>. None of them
      gives this list a name. Text that only sits next to the list does not
      count, and neither does a <code>&lt;label&gt;</code> hidden from screen
      readers.
    why_matters: >-
      Screen reader users hear a list of choices but not what it is for, so
      they may pick the wrong option or skip it. A tied label also gives a
      bigger area to click, which helps people who find small targets hard to
      hit.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the text that already describes the list on screen, such as
        "State" or "Sort by". Put it in a <code>&lt;label&gt;</code> and point
        the label at the list: <code>&lt;label
        for="state"&gt;State&lt;/label&gt; &lt;select
        id="state"&gt;…&lt;/select&gt;</code>. The <code>for</code> value must
        match the list's <code>id</code> exactly.
      - >-
        If the text cannot move into a <code>&lt;label&gt;</code>, give it an
        <code>id</code> and point to it: <code>&lt;div
        id="state-label"&gt;State&lt;/div&gt; &lt;select
        aria-labelledby="state-label"&gt;</code>.
      - >-
        Use <code>aria-label="State"</code> only when something else already
        shows the list's purpose on screen, because nobody can see an
        <code>aria-label</code>.
      - >-
        If a component library builds the list, fix the component or its
        settings once, so every page that uses it gets the label.
    fix_options:
      - label: "Tie a visible label to the list"
        approach: >-
          Use a label element with for="…" that matches the list's id, or wrap
          the list inside the label. The axe help page lists these two ways
          first.
        watch_out: >-
          Every id on the page must be unique. If two lists share an id, the
          label names only one of them. Give each list only one label. A label
          hidden with display: none or aria-hidden="true" does not count.
      - label: "Point to text that is already on the page"
        approach: >-
          Give the existing heading or text an id, and add aria-labelledby
          with that id to the list.
        watch_out: >-
          If the referenced element is empty or the id is wrong, the list
          still has no name. Clicking the text will not move focus to the
          list, as a real label does.
      - label: "Name it for screen readers only"
        approach: >-
          Add aria-label, or a title, when a visible label really cannot be
          added.
        watch_out: >-
          Sighted users still see no label. A title alone also makes the rule
          check (axe) report "Form elements should have a visible label"
          (label-title-only), because a title is meant for hints.
    verify_manual: >-
      If you used a label element, click it: focus should move to the list.
      Then turn on a screen reader (VoiceOver: Command+F5 on macOS; NVDA:
      Ctrl+Alt+N on Windows) and press Tab to reach the list. You should hear
      its name, such as "State", along with its selected option.
    verify_automated: "Scan again and see if this list is still found."
    acceptance: >-
      Every drop-down list on the affected pages has a name that says what it
      is for, and visible text that shows the same thing.
    confidence_default: high

  server-side-image-map:
    title: "Clickable image works only with a mouse"
    wcag_sc: "2.1.1"
    wcag_name: "Keyboard"
    wcag_level: "A"
    abilities_affected: [vision, motor]
    what_happening: >-
      The page has a server-side image map: an image with the
      <code>ismap</code> attribute inside a link. When you click the image,
      the link sends the spot you clicked to the server, and the server
      decides where to go. The rule check (axe) does not judge these images by
      itself. It reports every <code>&lt;img ismap&gt;</code> it finds as
      needing review, not as a failure, so a person must check each one.
    why_matters: >-
      This kind of image map depends on where the mouse clicks. People who use
      only a keyboard cannot pick a region, and screen readers get no text for
      each region. This affects people who are blind or deafblind, and people
      who have trouble using a mouse.
    owner: dev
    effort: under_2h
    fix_steps:
      - "List every region of the image and where it leads."
      - >-
        Replace the server-side map with a client-side image map. The image
        gets <code>usemap</code>, and each region becomes an
        <code>&lt;area&gt;</code> with its own link and <code>alt</code> text.
        Example: <code>&lt;img src="campus.png" alt="Campus buildings"
        usemap="#campus"&gt; &lt;map name="campus"&gt;&lt;area shape="rect"
        coords="10,10,120,80" href="/library"
        alt="Library"&gt;&lt;/map&gt;</code>.
      - >-
        Or remove the image map and offer the same choices as a list of text
        links next to the image.
      - "Remove the <code>ismap</code> attribute once the new links work."
    fix_options:
      - label: "Use a client-side image map"
        approach: >-
          Draw each region with an area element that has its own link and alt
          text. Keyboard users can Tab to each region, and screen readers read
          its alt text.
        watch_out: >-
          Browsers handle image maps in different ways. On some phones,
          regions stop lining up if the image is resized but the coordinates
          are not. Give the image its own alt text too, and add text links as
          a backup.
      - label: "Replace the image map with text links"
        approach: >-
          Show the choices as a list of normal links, with the image as a
          picture beside them.
        watch_out: >-
          Give the image alt text that describes what it shows, or alt="" if
          the links carry all of its meaning.
      - label: "Keep the image, and add matching text links"
        approach: >-
          If the server-side map must stay, add a text link on the same page
          for every region it offers.
        watch_out: >-
          Every region needs a matching link. If one is missing, keyboard
          users still cannot reach it. The rule check (axe) flags the image
          for review as long as ismap stays, so a person must check it each
          time.
    verify_manual: >-
      Use only the keyboard. Press Tab to move through the image area and
      check that you can reach and open every choice the image offers. With a
      screen reader on, each choice should read a clear name, such as
      "Library, link".
    verify_automated: >-
      Scan again and see if an image with the ismap attribute is still found.
    acceptance: >-
      Every choice in the image can be reached and opened with a keyboard
      alone, and has a text name a screen reader reads.
    confidence_default: medium

  skip-link:
    title: "Skip link points to a place that does not exist"
    abilities_affected: [vision, motor]
    what_happening: >-
      A skip link is a link near the top of the page that jumps to the main
      content. This rule check (axe) tests same-page links, such as
      <code>&lt;a href="#main"&gt;</code>, that come before the first link to
      another page. It checks them only when they are placed off screen, for
      example above the top edge. For this link, no element on the page has
      the <code>id</code> (or <code>name</code>) after the <code>#</code>, so
      the link goes nowhere.
    why_matters: >-
      Keyboard and screen reader users choose the skip link to avoid the
      menus, but nothing happens and they still have to go through every link.
      WCAG does not require this rule, but a broken skip link can also leave
      the page without a working way to skip repeated blocks.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Read the link's <code>href</code>, for example
        <code>href="#main-content"</code>.
      - >-
        Give the main content that exact <code>id</code>. Ids are case
        sensitive: <code>&lt;main id="main-content"&gt;</code>.
      - "Or change the link to match the id that is already there."
      - >-
        Check every page template: a skip link in a shared header often points
        to an id that only some layouts have.
    fix_options:
      - label: "Add the missing id to the main content"
        approach: >-
          Put the id that the skip link names on the element that starts the
          main content, usually the main element.
        watch_out: >-
          The id must appear once per page and on every page that shows the
          link. Do not put it on an element hidden with display: none, because
          the jump then has nowhere to land.
      - label: "Point the link at an id that already exists"
        approach: >-
          Change the link's href to match the id the main content already has.
        watch_out: >-
          If a script or a framework makes the id, check that it stays the
          same on every page load and in every layout.
    verify_manual: >-
      Load the page and press Tab once. The skip link should appear. Press
      Enter, then press Tab again: focus should move to the first link or
      control inside the main content, not back into the menu.
    verify_automated: "Scan again and see if this skip link is still found."
    acceptance: >-
      Every skip link on the page points to an id that exists, and using it
      moves keyboard focus to the main content.
    confidence_default: high

  summary-name:
    title: "Expandable sections have no name to read"
    wcag_sc: "4.1.2"
    wcag_name: "Name, Role, Value"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A <code>&lt;details&gt;</code> element is a section that opens and
      closes, and its <code>&lt;summary&gt;</code> is the line people click to
      open it. Some summaries have no name a screen reader can read
      (accessible name). The rule check (axe) counts text inside the summary,
      <code>aria-label</code>, <code>aria-labelledby</code> or a
      <code>title</code>. For example, the summary may show only an icon or a
      background image.
    why_matters: >-
      A screen reader reads the control with no name. Blind and deafblind
      users then do not know what the section holds or whether to open it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find what each section holds, for example "Opening hours" or "More
        filters".
      - >-
        Write that text inside the summary:
        <code>&lt;details&gt;&lt;summary&gt;Opening
        hours&lt;/summary&gt;...&lt;/details&gt;</code>.
      - >-
        If the summary shows only an icon, keep the icon hidden with
        <code>aria-hidden="true"</code>. Add text next to it, either visible
        or for screen readers only.
    fix_options:
      - label: "Put visible text in the summary"
        approach: >-
          Write a short phrase that names the hidden content, so every user
          knows what opens.
        watch_out: >-
          Some browsers give the summary a button role, which removes the
          heading role from a heading inside it. Screen readers then do not
          read it as a heading, so test it with a screen reader.
      - label: "Add text only screen readers read"
        approach: >-
          Keep the icon, and add a span inside the summary that uses the
          site's screen-reader-only class.
        watch_out: >-
          Sighted users still see only the icon. Make sure the icon's meaning
          is clear on screen.
      - label: "Name it with aria-label or aria-labelledby"
        approach: >-
          Add aria-label to the summary, or point aria-labelledby at text
          already on the page.
        watch_out: >-
          Browsers give the summary element different roles, so test the name
          with a screen reader in more than one browser. A title attribute
          also passes the rule, but people who use a keyboard or a touch
          screen never see its tooltip. Text inside the summary is the safest
          name.
    verify_manual: >-
      Press Tab to each fixed summary with a screen reader on. It should read
      a name that says what the section holds. Press Enter or Space to check
      that it still opens.
    verify_automated: "Scan again and see if these summaries are still found."
    acceptance: >-
      Every summary on the affected pages has a name that says what its
      section holds, and a screen reader reads it.
    confidence_default: high

  svg-img-alt:
    title: "Graphic marked as an image has no name"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A graphic drawn in code (Scalable Vector Graphics, SVG) has a role that
      tells screen readers it is a meaningful image. The role is
      <code>role="img"</code> or <code>role="graphics-symbol"</code> on an
      <code>&lt;svg&gt;</code> or a shape inside it, or
      <code>role="graphics-document"</code> on the <code>&lt;svg&gt;</code>.
      The rule check (axe) looks for a name from a <code>&lt;title&gt;</code>
      placed directly inside it, <code>aria-label</code>,
      <code>aria-labelledby</code> or <code>title</code>. This graphic has
      none of these, or they are empty.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, get no
      description of the graphic. They miss what it shows, such as an icon's
      meaning or a chart's main point.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide what the graphic means where it sits. A magnifying glass icon
        on a search button means "Search"; a logo means the company's name.
      - >-
        Add the name with <code>aria-label</code>. Example: <code>&lt;svg
        role="img" aria-label="Warning"&gt;...&lt;/svg&gt;</code>.
      - >-
        Or add a <code>&lt;title&gt;</code> as the first direct child, and
        point to it: <code>&lt;svg role="img"
        aria-labelledby="chart-title"&gt;&lt;title id="chart-title"&gt;Sales
        rose 12% in 2025&lt;/title&gt;...&lt;/svg&gt;</code>.
      - >-
        If the graphic is only decoration, remove <code>role="img"</code> and
        add <code>aria-hidden="true"</code> so screen readers skip it.
    fix_options:
      - label: "Add aria-label to the svg"
        approach: >-
          Put a short name that gives the graphic's meaning on the svg
          element, such as aria-label="Warning".
        watch_out: >-
          Describe the meaning, not the shapes. "Red circle" is rarely what
          people need. A complex chart also needs its data as text somewhere
          on the page.
      - label: "Add a title element and point to it"
        approach: >-
          Put a title element as a direct child of the svg, give it an id, and
          set aria-labelledby on the svg to that id.
        watch_out: >-
          On its own, a title counts only when it sits directly inside the
          svg, not deeper inside a group. Browsers and screen readers do not
          all read an SVG title, so pair it with aria-labelledby or
          aria-label.
      - label: "Hide a decorative graphic"
        approach: >-
          Remove role="img" and set aria-hidden="true" on the svg, so screen
          readers ignore it.
        watch_out: >-
          Only do this when nearby text already gives the meaning. An icon
          that is the only content of a button or link then leaves that
          control with no name.
    verify_manual: >-
      With a screen reader on, move to the graphic. It should read it as an
      image with a name that gives its meaning, or skip it if it is
      decoration. Check in at least one other browser too, because SVG support
      varies.
    verify_automated: >-
      Scan again and see if a graphic marked as an image with no name is still
      found.
    acceptance: >-
      Every SVG graphic with an image role has a name that gives its meaning,
      and every decorative one is hidden from screen readers.
    confidence_default: high

  table-duplicate-name:
    title: "A table's summary repeats its caption"
    abilities_affected: [vision]
    what_happening: >-
      The rule check (axe) found a <code>&lt;table&gt;</code> that has both a
      <code>summary</code> attribute and a <code>&lt;caption&gt;</code>, with
      the same text in both. It ignores upper and lower case and extra spaces
      when it compares them. The caption is the table's visible title. The
      summary was meant to tell screen reader users how the table is laid out.
      Current HTML no longer allows it (it is obsolete). This is a best
      practice: WCAG does not require it, but it helps people.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, hear
      the same words where they expect a title and then a description. This
      can confuse them about the table's name and purpose.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the occurrence. It points to the whole
        <code>&lt;table&gt;</code>. In the page code (DOM), compare its
        <code>summary</code> attribute with the text in its
        <code>&lt;caption&gt;</code>.
      - >-
        Keep the <code>&lt;caption&gt;</code> as the table's title. Remove the
        <code>summary</code> attribute, because current HTML no longer allows
        it.
      - >-
        If the table is complex and needs an explanation, put it where
        everyone can read it. Example: <code>&lt;caption&gt;Annual
        sales&lt;br&gt;&lt;span&gt;Sales by region and quarter, with totals in
        the last row.&lt;/span&gt;&lt;/caption&gt;</code>.
      - >-
        If a content editor or a plugin makes the table, fix the template or
        setting that writes the <code>summary</code>, not just this page.
    fix_options:
      - label: "Remove the summary and keep the caption"
        approach: >-
          Delete the summary attribute. The caption goes on naming the table.
        watch_out: >-
          If the summary held any extra facts, such as how to read the table,
          move them into the caption or a nearby paragraph first. Otherwise
          they are lost.
      - label: "Point the table to a visible description"
        approach: >-
          Write the explanation in a paragraph near the table. Link it with
          the aria-describedby attribute, for example a p with id="sales-desc"
          and a table with aria-describedby="sales-desc".
        watch_out: >-
          The id must match exactly and be used only once on the page. If not,
          screen readers read nothing or the wrong text. The W3C notes that
          some screen readers support this less well than a description inside
          the caption.
      - label: "Rewrite the summary so it describes the layout"
        approach: >-
          Keep summary but change it to say how the table is laid out. For
          example, the caption says "Annual sales" and the summary says "Sales
          by region and quarter, with totals".
        watch_out: >-
          This clears the rule, but summary is obsolete in current HTML and
          only screen reader users get it. Sighted people who need the
          explanation miss it. A visible description is better.
    verify_manual: >-
      Look at the table's code and check that the caption and any summary or
      description say different things. Then turn on a screen reader and move
      to the table. You should hear its title once, then any description, not
      the same words twice.
    verify_automated: >-
      Scan again and see if a table whose summary repeats its caption is still
      found.
    acceptance: >-
      Every table with a caption has no summary attribute, or has one with
      different text that describes how the table is laid out.
    confidence_default: high

  td-headers-attr:
    title: "A table cell's headers list points to the wrong cells"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      A cell can list its headers by <code>id</code> in a <code>headers</code>
      attribute, for example <code>&lt;td headers="north q1"&gt;</code>. The
      rule check (axe) found a <code>&lt;table&gt;</code> where a cell's
      <code>headers</code> list has an <code>id</code> that no cell in the
      same table has. Or the list has the cell's own <code>id</code>. Common
      causes are a typo, or a header that sits in a different table. The check
      skips cells that are hidden from screen readers.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, rely
      on these links to hear which headers go with each value. A broken link
      means they can hear the wrong header or none, so a number or date loses
      its meaning.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence. It points to the whole
        <code>&lt;table&gt;</code>, not to one cell. In the page code (DOM),
        find each cell in that table with a <code>headers</code> attribute.
      - >-
        For each <code>id</code> in <code>headers</code>, check that a header
        cell (<code>&lt;th&gt;</code>) in the same table has that exact
        <code>id</code>. Fix typos. Remove the cell's own <code>id</code> from
        its list.
      - >-
        Point only to <code>&lt;th&gt;</code> cells. The rule check (axe)
        accepts any cell in the table, but HTML requires a header cell.
        Example: <code>&lt;th id="north"&gt;North&lt;/th&gt;</code> and
        <code>&lt;th id="q1"&gt;Q1&lt;/th&gt;</code>, then <code>&lt;td
        headers="north q1"&gt;120&lt;/td&gt;</code>.
      - >-
        If the table is simple, with one row of column headers and at most one
        column of row headers, you can drop <code>headers</code> and
        <code>id</code>. Use <code>&lt;th scope="col"&gt;</code> and
        <code>&lt;th scope="row"&gt;</code> instead.
    fix_options:
      - label: "Correct the ids in the headers list"
        approach: >-
          Make every id in each headers list match the id of a th in the same
          table. Remove any id that is the cell's own.
        watch_out: >-
          Every id must be unique on the whole page. If a template repeats a
          table, both copies can share an id, and cells can link to the wrong
          table.
      - label: "Use scope on th instead of headers"
        approach: >-
          For a simple grid, remove headers and id and mark each header with
          th scope="col" or th scope="row".
        watch_out: >-
          scope cannot describe tables where a cell needs headers that are not
          in its own row or column, such as several levels of headers. Keep
          headers and id for those.
      - label: "Keep the headers in the same table"
        approach: >-
          Some pages build the header row as a separate table, so it can stay
          in place while the rows scroll. Put that row back in the same table,
          in a thead.
        watch_out: >-
          Make the header stay in place with a style rule instead, such as
          position: sticky on the th cells. Then check that the columns still
          line up.
    verify_manual: >-
      Turn on a screen reader and move through the table with table keys
      (NVDA: Ctrl+Alt+Arrow keys; VoiceOver: Control+Option+Arrow keys). Each
      cell that uses headers should be read with the right headers. In the
      page code, each id listed in headers should belong to a th in the same
      table.
    verify_automated: >-
      Scan again and see if a table with a headers list that points to the
      wrong cells is still found.
    acceptance: >-
      Every headers attribute in the table lists only ids of th cells in that
      same table, and never the cell's own id.
    confidence_default: high

  th-has-data-cells:
    title: "A table header is not linked to any data cells"
    wcag_sc: "1.3.1"
    wcag_name: "Info and Relationships"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Every header cell in a data table should name some data. The rule check
      (axe) looks at each header cell with text in a table it judges holds
      data. A header cell is a <code>&lt;th&gt;</code>, or a cell with
      <code>role="columnheader"</code> or <code>role="rowheader"</code>. The
      check found a header that no data cell uses. For a column header, it
      looks at the cells below it. For a row header, it looks at the cells to
      its right. No cell points to it with <code>headers</code> or
      <code>aria-labelledby</code> either.
    why_matters: >-
      Screen reader users, including people who are blind or deafblind, cannot
      see which values sit under a header. If a header is not linked to its
      data, the screen reader does not read it with those values. People then
      do not know what the values mean.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the occurrence. It points to the whole
        <code>&lt;table&gt;</code>. Find the header cells that have no data
        cells in their column or row. Common causes: <code>scope="row"</code>
        on a column header, a <code>headers</code> attribute that sends cells
        to another header, or headers with no data rows.
      - >-
        Check the <code>scope</code>. A header at the top of a column should
        have <code>scope="col"</code>. A header at the start of a row should
        have <code>scope="row"</code>.
      - >-
        If cells use <code>headers</code>, make sure the right cells list this
        header's <code>id</code>.
      - >-
        If a header has no data at all, such as a header row with no rows
        under it, remove the header or add the data. If the cell is not a
        header, change it to <code>&lt;td&gt;</code>.
    fix_options:
      - label: "Fix the scope direction"
        approach: >-
          Give column headers scope="col" and row headers scope="row", so each
          header points toward its data.
        watch_out: >-
          Look at every header in the table, not only one. A top row of
          headers that all have scope="row" usually fails for the whole row.
      - label: "Repair the headers links"
        approach: >-
          In a complex table that uses headers and id, add this header's id to
          the headers list of each data cell it names.
        watch_out: >-
          A headers list replaces the cell's automatic headers. If you list
          only one header, the cell loses its column or row header unless you
          list that one too.
      - label: "Remove the empty header or make it a data cell"
        approach: >-
          Delete a header column or row that has no data cells, or change a th
          used only for bold text into a td.
        watch_out: >-
          A script may add the data rows later. Then the header is correct
          once the rows load. Check the page after the rows appear before you
          remove anything.
    verify_manual: >-
      Turn on a screen reader and move through the data cells with table keys
      (NVDA: Ctrl+Alt+Arrow keys; VoiceOver: Control+Option+Arrow keys). Each
      cell should be read with its column header and, if there is one, its row
      header. Also check that every header has data under it or beside it.
    verify_automated: >-
      Scan again and see if a table header with no linked data cells is still
      found.
    acceptance: >-
      Every header cell in the table names at least one data cell in its
      column or row, or through a headers link.
    confidence_default: medium

  valid-lang:
    title: "A passage has a language code that is not valid"
    wcag_sc: "3.1.2"
    wcag_name: "Language of Parts"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      An element inside the page has a <code>lang</code> or
      <code>xml:lang</code> value that is not a known language code, for
      example <code>&lt;span lang="spanish"&gt;</code>. The rule check (axe)
      tests only the first part of the code, before any hyphen, and also
      reports a value that is only spaces. It reports the element only if it
      holds text, or a name a screen reader reads such as alt text, that takes
      this language. It does not report empty or hidden elements.
    why_matters: >-
      Screen readers cannot switch to the right voice for this passage: some
      use the page language, others the nearest parent with a valid code.
      Blind people and people who listen to pages with text-to-speech may hear
      the words with the wrong pronunciation.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        For each occurrence, read the element's text in the Page inspector and
        work out what language it is really in.
      - >-
        Replace the value with the standard code for that language (a BCP 47
        language tag): <code>&lt;span lang="es"&gt;hola&lt;/span&gt;</code>,
        not <code>lang="spanish"</code> or <code>lang="es_MX"</code>. Use the
        two-letter code when one exists, and a hyphen before any region, such
        as <code>es-MX</code>.
      - >-
        For a right-to-left language, also set the text direction: <code>&lt;p
        lang="ar" dir="rtl"&gt;</code>.
      - >-
        If the value comes from a shared component or a content system field,
        fix it there so every page gets the correct code.
    fix_options:
      - label: "Correct the code on the element"
        approach: >-
          Change the lang value to the standard code for the language the text
          is actually in.
        watch_out: >-
          Check the real language of the text, not only the code format. A
          valid but wrong code, such as lang="fr" on German text, passes this
          rule and still makes a screen reader read the text wrongly.
      - label: "Fix the language picker in the editor or component"
        approach: >-
          Where editors choose a language from a list, make the list store
          standard codes (es, de, zh-Hans) instead of names such as spanish.
        watch_out: >-
          Existing content keeps the old values. Search stored content for the
          wrong values and update it too, or the scan will keep finding them.
      - label: "Remove lang where the text is not another language"
        approach: >-
          If the element is in the page's main language, remove its lang value
          so it uses the page language.
        watch_out: >-
          Only remove it when the text really is in the page language.
          Passages in another language need a correct lang. Proper names,
          technical terms and words that are now part of the page language do
          not need one.
    verify_manual: >-
      Read the element code (HTML) and check that each lang value is a valid
      code that matches the language of the text. Then read the passage with a
      screen reader set to switch languages on its own, and listen for the
      voice to change.
    verify_automated: "Scan again and see if this element is still found."
    acceptance: >-
      Every element with a lang or xml:lang value on the affected pages uses a
      valid language code that matches the language of its text.
    confidence_default: high

  video-caption:
    title: "Video may have no captions"
    wcag_sc: "1.2.2"
    wcag_name: "Captions (Prerecorded)"
    wcag_level: "A"
    abilities_affected: [hearing]
    what_happening: >-
      The page has a <code>&lt;video&gt;</code> with no captions track
      (<code>&lt;track kind="captions"&gt;</code>). Captions are on-screen
      text of what is said and heard in a video. The rule check (axe) cannot
      know by itself whether captions come another way, for example burned
      into the picture (open captions). It reports the video as needing
      review, not as a failure, so a person must check it.
    why_matters: >-
      People who are deaf or hard of hearing can see the video but cannot hear
      it. Without captions they miss the speech, who is speaking, and
      important sounds such as music or sound effects.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Play the video with sound on. Two kinds of video do not need captions.
        One has no sound; it needs a text version or an audio track instead
        (WCAG 1.2.1). The other repeats text on the page and clearly says so.
      - >-
        Otherwise, make a captions file in the text format for timed captions
        (WebVTT). Include all speech, who is speaking, and important sounds
        such as "[phone rings]".
      - >-
        Add it to the video: <code>&lt;track src="talk-en.vtt" kind="captions"
        srclang="en" label="English"&gt;</code> inside the
        <code>&lt;video&gt;</code> element.
      - >-
        If you use automatic captions, read them through and correct them
        before you publish.
    fix_options:
      - label: "Add a captions track"
        approach: >-
          Write a WebVTT captions file and link it with a track element whose
          kind is "captions". Viewers can turn these closed captions on and
          off.
        watch_out: >-
          Use kind="captions", not kind="subtitles". Subtitles translate
          speech and usually leave out sounds and speaker names, so they do
          not replace captions.
      - label: "Burn captions into the video (open captions)"
        approach: >-
          Add the captions to the video picture itself, so they always show.
        watch_out: >-
          Viewers cannot turn them off. The rule check (axe) still flags the
          video for review, because it has no captions track. After a person
          checks the captions, set the occurrence to Not a problem (false
          positive).
      - label: "Label the video as a version of text on the page"
        approach: >-
          If the page already gives the same content as text, say clearly next
          to the video that it presents that text.
        watch_out: >-
          This only works when the video adds nothing that is not in the text.
          A video with extra information still needs captions.
    verify_manual: >-
      Play the video with the sound off and captions on. Check that captions
      appear, match the speech, name the speaker when it is not clear, and
      describe important sounds. If there are no captions, check whether the
      video has sound, or repeats text on the page and says so.
    verify_automated: "Scan again and see if a video with no captions track is still found."
    acceptance: >-
      Every video with sound has accurate captions for all speech and
      important sounds, or a clear note that it repeats text on the page.
    confidence_default: low

# Image-of-text findings, keyed on `<classification>_<adequacy>` so the
# renderer can look up by `(group.classification, group.alt_adequacy)`.
image_findings:

  essential_missing:
    title: "Images with important text have no alt text"
    wcag_sc: "1.4.5"
    wcag_name: "Images of Text"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The image text check read words in these images with text recognition
      (OCR). A local AI model that looks at images (vision model) then sorted
      each one as "essential". That means its words carry information that
      would be lost without the image, as on a poster or a sign. On at least
      one page, the image has no <code>alt</code> attribute at all. So it has
      no alt text (the text a screen reader reads for an image).
    why_matters: >-
      Without alt text, a screen reader may skip the image or read its file
      name, so blind users miss the words. Text in an image also blurs when
      zoomed, and people cannot resize, recolor, respace, translate or copy
      it. An image like this with no text alternative also fails WCAG 1.1.1
      Non-text Content (Level A).
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Best: replace the image with real text styled with CSS, for example
        <code>&lt;h2 class="promo"&gt;Summer sale: 50% off until June
        30&lt;/h2&gt;</code>.
      - >-
        If the image must stay, add alt text with the same words the image
        shows. For example: <code>&lt;img src="sale.png" alt="Summer sale: 50%
        off until June 30"&gt;</code>.
      - >-
        If the same words are already in real text right next to the image,
        give the image an empty alt (<code>alt=""</code>). Then the words are
        not read twice.
      - >-
        For an image inside <code>&lt;picture&gt;</code>, put the alt text on
        its <code>&lt;img&gt;</code>. A <code>&lt;source&gt;</code> has no
        alt, so Axcess reports the files it lists as missing alt text, even
        when the <code>&lt;img&gt;</code> has it.
    fix_options:
      - label: "Replace the image with real text"
        approach: >-
          Write the words as HTML text and use CSS for the font, color and
          background. People can then zoom, restyle, translate and copy it.
        watch_out: >-
          Keep the image only where the look of the text is essential, such as
          a logo. That image still needs alt text.
      - label: "Add alt text with the same words"
        approach: >-
          Keep the image and write every word it shows in the alt attribute.
        watch_out: >-
          Screen readers can then read it, but the text still cannot be zoomed
          or restyled, so WCAG 1.4.5 may still not be met. For a long poster,
          put the text on the page instead.
      - label: "Put the words next to the image"
        approach: >-
          Add the same words as real text beside the image, then set alt="" on
          the image.
        watch_out: >-
          The nearby text must include every word from the image. An empty alt
          hides the image from screen readers completely. Axcess then lists
          the image in the issue for alt text that does not match, because
          alt="" has no words. Set that occurrence to Not a problem (false
          positive) after you check.
    verify_manual: >-
      First, look at the image and check that it really shows important words.
      Text recognition and the vision model can be wrong. "Essential" is the
      model's label, not the WCAG exception for text whose look is essential,
      such as a logo. Axcess reads only the alt attribute, so check for
      aria-label, aria-labelledby or title too. Then, with a screen reader,
      check that you hear the same words the image shows, or that real text
      has replaced the image. With the vision model off, the image can move to
      an issue for an image with words.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every affected image has alt text with the same words it shows, or real
      text on the page gives those words.
    confidence_default: high

  essential_inadequate:
    title: "Alt text does not match the image's important text"
    wcag_sc: "1.4.5"
    wcag_name: "Images of Text"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The image text check read words in these images with text recognition
      (OCR). A local AI model that looks at images (vision model) then sorted
      each one as "essential". That means its words carry information that
      would be lost without the image, as on a poster or a sign. On at least
      one page, the alt text (the text a screen reader reads for an image)
      does not match. It is empty (<code>alt=""</code>), or it shares few
      words with the text Axcess read. Axcess compares words, not meaning, so
      good alt text in other words can also land here.
    why_matters: >-
      An empty alt tells screen readers to skip the image, so users hear
      nothing. Others hear something else, such as "banner", and may think
      they got the whole message. Text in an image also blurs when zoomed, and
      people cannot restyle it to make it easier to read.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at the image and at its <code>alt</code> text in the element code
        (HTML). Text recognition (OCR) can misread styled lettering, so
        compare with the image, not only with the text Axcess read.
      - >-
        Rewrite the alt text so it has the same words the image shows. For
        example: <code>&lt;img src="hours.png" alt="Open Monday to Friday, 9
        am to 5 pm"&gt;</code>. Do not use a file name or a word like "image".
      - "Better: replace the image with real text styled with CSS."
    fix_options:
      - label: "Rewrite the alt text"
        approach: >-
          Write every word the image shows in the alt attribute, in the same
          order.
        watch_out: >-
          The text still cannot be zoomed or restyled, so WCAG 1.4.5 may still
          not be met. Replacing the image is better.
      - label: "Replace the image with real text"
        approach: "Write the words as HTML text and use CSS for the look."
        watch_out: >-
          Keep the image only where the look of the text is essential, such as
          a logo. That image still needs alt text.
      - label: "Keep alt=\"\" when the words are already on the page"
        approach: >-
          If real text right next to the image already says the same words, an
          empty alt is correct, so the words are not read twice.
        watch_out: >-
          The nearby text must include every word from the image, or screen
          reader users miss the rest. Axcess still lists the image here,
          because alt="" has no words to compare. Set it to Not a problem
          (false positive) after you check.
    verify_manual: >-
      Check that the image really shows important words, and that they are not
      already in real text beside it. "Essential" here is the model's label,
      not the WCAG exception for text whose look is essential, such as a logo.
      Then, with a screen reader, check that you hear the same words the image
      shows. A correct alt="" beside the same words, or good alt text in other
      words, can still be found here.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every affected image has alt text with the same words it shows, or real
      text on the page gives those words.
    confidence_default: medium

  essential_partial:
    title: "Alt text only partly matches the image's text"
    wcag_sc: "1.4.5"
    wcag_name: "Images of Text"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The image text check read the words in these images with text
      recognition (OCR). A local AI model (vision model) sorted them as
      essential. That means their words carry information that would be lost
      without the image. Each image has alt text (the text a screen reader
      reads for an image). On at least one page, it uses some words from the
      image and some other words. An example is <code>alt="Open day
      poster"</code> on a poster that also gives a date and time. Axcess
      compares words, not meaning, so a close rewording can also land here.
      Alt text that only leaves words out does not land here. If all its words
      are in the image, Axcess counts it as a match.
    why_matters: >-
      Screen reader users may hear a different or shorter message than the
      image shows. Nothing tells them something is missing, so they may act on
      a wrong date, price or instruction. Text in an image also blurs when
      zoomed, and people cannot restyle it to make it easier to read.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Open the image and read all of its text. Then find its alt text in the
        page code (DOM), for example <code>&lt;img src="open-day.png"
        alt="Open day poster"&gt;</code>.
      - >-
        Best fix: replace the image with real text styled with CSS, for
        example <code>&lt;p class="banner"&gt;Open day: Saturday 12 October,
        10am to 4pm&lt;/p&gt;</code>. A web font can keep the same look.
      - >-
        If the image must stay, rewrite the alt text so it has every word the
        image shows. For example: <code>&lt;img src="open-day.png" alt="Open
        day: Saturday 12 October, 10am to 4pm"&gt;</code>. Leave out how the
        text looks, such as its color or font.
      - >-
        Fix it on every page where the image appears. Axcess judges an image
        by its worst alt text, so one page with alt text that only partly
        matches keeps the image in this issue.
    fix_options:
      - label: "Use real text"
        approach: >-
          Replace the image with HTML text styled with CSS (WCAG technique
          C22). A web font can keep a special typeface.
        watch_out: >-
          Real text laid over a photo must still have enough color contrast
          (WCAG 1.4.3). Add a solid or shaded backing if the photo makes the
          text hard to read.
      - label: "Complete the alt text"
        approach: >-
          Keep the image and put all of its words in the alt attribute, in the
          same order.
        watch_out: >-
          This fixes what a screen reader says, but people still cannot resize
          or restyle the text. When someone changes the image, the alt text
          must change too (WCAG failure F20).
      - label: "Put long text on the page"
        approach: >-
          For an image with a lot of text, such as a poster or flyer, put the
          full text as real text next to it. Give the image short alt text
          that names it and says where the full text is.
        watch_out: >-
          The page text must include every word from the image, not a summary
          that drops details. Axcess compares words, so short alt text like
          this can move the image to another issue. Check it there.
    verify_manual: >-
      Open the image and compare its words with the alt text on each page
      listed. Text recognition can misread styled text, so trust the image,
      not only the text Axcess read. It is a real problem if the alt text
      leaves out words that carry meaning, such as dates, prices or steps. It
      is not a problem if those words are in the page text next to the image.
      With a screen reader, move to the image: you should hear every word it
      shows.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text with all of its words, or real
      text on the page gives all of them.
    confidence_default: medium

  essential_adequate:
    title: "Alt text uses words from these essential images"
    wcag_sc: "1.4.5"
    wcag_name: "Images of Text"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The image text check read the words in these images with text
      recognition (OCR). A local AI model (vision model) sorted them as
      essential. That means their words carry information that would be lost
      without the image. On every page, the alt text (the text a screen reader
      reads for an image) is very like those words. It also counts as a match
      when all its words appear in the image. So alt text with only some of
      the words, such as just the heading, lands here too. This is a record of
      what Axcess checked, not a problem it found. WCAG 1.4.5 Images of Text
      also asks for real text instead of an image of text, where real text can
      give the same look. Axcess does not check that part, so a person can
      decide whether to replace the image.
    why_matters: >-
      Matching alt text helps screen reader users, but it does not help people
      who need to resize, restyle or translate the text. Text inside an image
      blurs when zoomed, and people cannot change its font, spacing or colors.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Check that the alt text has all the words the image shows, such as
        dates and prices. Axcess counts alt text with only some of them as a
        match.
      - >-
        Where you can, and above all for headings, buttons and menus, replace
        the image with real text styled with CSS (WCAG technique C22).
      - >-
        If you need a special typeface, load it as a web font. You can also
        use an SVG image whose words are real text in
        <code>&lt;text&gt;</code> elements.
      - >-
        Keep text in images only where the look itself matters, such as a
        logo, or where people can change how the text looks.
    fix_options:
      - label: "Use real text"
        approach: >-
          Rebuild the text in HTML with CSS and a web font, so it keeps the
          look and people can resize and restyle it.
        watch_out: >-
          Real text over a photo must still have enough color contrast (WCAG
          1.4.3).
      - label: "Keep the image"
        approach: "Leave the image and its matching alt text as they are."
        watch_out: >-
          Screen readers are fine, but people still cannot resize or restyle
          the text. When someone changes the image, the alt text must change
          too (WCAG failure F20).
    verify_manual: >-
      Compare the alt text with the image, and check that no words that carry
      meaning are left out. Zoom the page to 200%: real text stays sharp,
      while text in an image blurs. Use the browser's translate feature: real
      text is translated, while text in an image is not. The image text check
      no longer checks an image you replace with real text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text with all its words, or has become
      real text where real text gives the same look.
    confidence_default: medium

  informational_missing:
    title: "Images with useful text have no alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The image text check found words in these images with text recognition
      (OCR). A local AI model (vision model) sorted them as informational.
      That means the words add to the content around them, as in a chart or an
      infographic. On at least one page, the <code>&lt;img&gt;</code> has no
      <code>alt</code> attribute at all. So it has no alt text (the text a
      screen reader reads for an image). Axcess reads only the
      <code>alt</code> attribute, so an image named another way, such as with
      <code>aria-label</code>, also lands here.
    why_matters: >-
      Screen reader users miss the information the image adds to the page.
      With no alt text, some screen readers read the file name instead, such
      as "chart-q3-final.png", which tells them nothing.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Decide what the image adds to the page. Write alt text that gives that
        meaning in a short phrase or sentence. For example, <code>&lt;img
        src="q3-sales.png" alt="Sales grew 23% from Q3 to Q4"&gt;</code> tells
        people more than "bar chart".
      - >-
        For a chart or infographic with a lot of data, keep the alt text
        short. Put the full data or text on the page, for example in a table
        or a <code>&lt;figcaption&gt;</code> under the image. Or put it on a
        page linked next to it.
      - >-
        If the page text next to the image already says the same thing, the
        image may be decorative. Then use <code>alt=""</code> instead.
      - >-
        Add the alt attribute on every page where the image appears. For an
        image inside <code>&lt;picture&gt;</code>, put it on the
        <code>&lt;img&gt;</code> element.
    fix_options:
      - label: "Short alt text"
        approach: "Put the main message of the image in the alt attribute."
        watch_out: >-
          Describe the meaning, not the look: "Sales grew 23%" helps, "blue
          bars on a white chart" does not.
      - label: "Short alt text plus a full description"
        approach: >-
          Give the image short alt text that names it. Put the full data or
          text in page text, a figure caption, or a linked page.
        watch_out: >-
          Screen readers read a description linked with aria-describedby as
          plain text only. It cannot carry a table or a list, so put
          structured data in visible page text instead.
      - label: "Mark it decorative"
        approach: >-
          If the page text already gives all of the image's information, use
          an empty alt attribute (alt="").
        watch_out: >-
          Only do this when every word and number in the image is also in the
          page text nearby. Otherwise screen reader users lose the
          information.
    verify_manual: >-
      Look at the image, decide what it adds to the page, and check that the
      vision model sorted it right. On each listed page, check the page code
      (DOM) for an alt attribute on the img element. If the listed file comes
      from a source element inside a picture element, check the img in that
      picture instead. Axcess reads no alt text from source elements. If
      aria-label or aria-labelledby names the image, listen with a screen
      reader: you should hear what a sighted reader gets. Axcess compares
      words, not meaning, so good alt text in your own words can move the
      image to another issue.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text that gives the information it
      adds, or alt="" because nearby page text gives it.
    confidence_default: medium

  logo_missing:
    title: "Logos have no alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The image text check found words in these images with text recognition
      (OCR). A local AI model (vision model) sorted them as logos. On at least
      one page, the <code>&lt;img&gt;</code> has no <code>alt</code>
      attribute. So it has no alt text (the text a screen reader reads for an
      image). WCAG allows text in a logo image, but the logo still needs alt
      text, usually the name it shows. Axcess reads only the <code>alt</code>
      attribute, so a logo named with <code>aria-label</code> also lands here.
    why_matters: >-
      Screen reader users cannot tell whose site or product this is, and some
      screen readers read the file name instead. A logo at the top of the page
      is often how people check they are on the right site.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Set the alt text to the name the logo shows: <code>&lt;img
        src="logo.png" alt="Acme Corp"&gt;</code>. You do not need the word
        "logo".
      - >-
        If the logo is a link, say where the link goes: <code>&lt;a
        href="/"&gt;&lt;img src="logo.png" alt="Acme Corp
        home"&gt;&lt;/a&gt;</code>.
      - >-
        If the same link already has the name as real text next to the logo,
        use <code>alt=""</code> so the name is not read twice. For example:
        <code>&lt;a href="/"&gt;&lt;img src="logo.png" alt=""&gt; Acme Corp
        home&lt;/a&gt;</code>.
      - >-
        Add the alt attribute on every page where the logo appears. Site
        headers and footers are often shared templates, so one fix can cover
        many pages.
    fix_options:
      - label: "Name in the alt text"
        approach: >-
          Use the organization or product name exactly as the logo shows it.
        watch_out: >-
          Do not describe the look, such as "blue Acme logo". People need the
          name, not the picture.
      - label: "Logo as a home link"
        approach: >-
          When the logo is the only content of a link, write alt text for the
          link's destination, such as "Acme Corp home".
        watch_out: >-
          An empty alt here leaves the link with no name, so screen reader
          users hear only "link", the file name or the web address.
      - label: "Logo next to text in the same link"
        approach: "When the link text already has the name, give the logo alt=\"\"."
        watch_out: >-
          Only when the text is inside the same link. If the name is outside
          the link, the logo still needs its own alt text. After you set
          alt="", Axcess lists the logo in another issue, because alt="" has
          no words to compare. Set it to Not a problem (false positive) after
          you check.
    verify_manual: >-
      Check that the vision model was right that it is a logo. Then check the
      page code (DOM) on each listed page for an alt attribute on the logo's
      img element. With a screen reader, move to the logo: you should hear the
      name, and for a linked logo, where the link goes.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the logo is still
      found here.
    acceptance: >-
      Every logo in this issue has alt text with its name or where its link
      goes, or alt="" when its link already shows the name.
    confidence_default: high

  decorative_missing:
    title: "Decorative images are not marked to be skipped"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      The image text check found words in these images with text recognition
      (OCR). A local AI model (vision model) sorted them as decorative. That
      means the text is only for looks, or the same words are already in the
      page text. On at least one page, the <code>&lt;img&gt;</code> has no
      <code>alt</code> attribute at all. Without <code>alt=""</code>, a screen
      reader cannot tell that it should skip the image.
    why_matters: >-
      Screen reader users hear a pointless interruption, and some screen
      readers read the file name instead, such as "hero-bg-2.jpg". WCAG asks
      for decorative images to be marked so screen readers can ignore them.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        First check that the image adds nothing: every word in it must also be
        in the page text nearby. If it adds information, give it alt text that
        says the same thing instead.
      - >-
        Add an empty alt attribute and no title attribute: <code>&lt;img
        src="divider.png" alt=""&gt;</code>. Do not put a word like "spacer"
        or "image" in the alt.
      - >-
        Where you can, move a purely decorative image into CSS with
        <code>background-image</code>, so it is not an image in the page code
        at all.
      - "Add the alt attribute on every page where the image appears."
    fix_options:
      - label: "Empty alt text"
        approach: >-
          Add alt="" to the img element, with no title attribute (WCAG
          technique H67). This is the best-supported way to tell screen
          readers to skip an image.
        watch_out: >-
          After this fix, Axcess lists the image in the issue for a decorative
          image with empty or different alt text. That is expected: Axcess
          compares words, and alt="" has none.
      - label: "Presentation role"
        approach: "Add role=\"presentation\" or role=\"none\" to the img element."
        watch_out: >-
          The W3C notes this is less widely supported than alt="". Axcess
          reads only the alt attribute, so without alt="" the image stays in
          this issue.
      - label: "CSS background image"
        approach: >-
          Show the image with CSS background-image instead of an img element.
        watch_out: >-
          Never put information in a CSS background image. Screen readers get
          no text for it (WCAG failure F3).
    verify_manual: >-
      Look at the image and the page text around it. The image is decorative
      only if it adds no information, so check that the vision model was
      right. Then check the page code (DOM) on each listed page for alt="" on
      the img element. With a screen reader, move through the page: it should
      pass the image without saying anything. With alt="", the image moves to
      another issue, which is expected.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue that adds no information has alt="", and any
      image that does add information has alt text that gives it.
    confidence_default: high

  decorative_adequate:
    title: "Decorative image has matching alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      This is a record of what was checked, not a problem to fix. Text
      recognition (OCR) found words in these images, and a local AI model
      (vision model) judged them decorative. Everywhere each image appears,
      its alt text (the text a screen reader reads for an image) is very like
      those words. Often every word of the alt text is in the image, and that
      counts as a match.
    why_matters: >-
      Screen reader users hear the image's words, or some of them. If the same
      words are also in the page text next to the image, they hear them twice.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        No fix is needed if the image's words give information found nowhere
        else on the page. The image is then not only decoration.
      - >-
        If the same words are already real text next to the image, or are only
        for looks, use <code>alt=""</code>. Also remove any
        <code>title</code>, so screen readers skip the image.
    fix_options:
      - label: "Leave the alt text as it is"
        approach: >-
          Keep the alt text when the image's words give information found
          nowhere else on the page.
        watch_out: >-
          If the same words are in real text nearby, screen reader users hear
          them twice.
      - label: "Switch to empty alt text"
        approach: >-
          When the words are real text next to the image, or only for looks,
          set alt="" and remove any title. Screen readers then skip the image.
        watch_out: >-
          Keep the alt text if the words give information found nowhere else,
          or if the image is the only content of a link. Otherwise people lose
          the words, or the link has no name.
    verify_manual: >-
      Turn on a screen reader and read the part of the page with the image.
      Listen for the image's words twice: once from the alt text and once from
      the page text. After you set alt="", the image usually moves to the
      issue for empty or different alt text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue either has alt text that gives information
      found nowhere else, or has alt="" and no title.
    confidence_default: medium

  decorative_inadequate:
    title: "Decorative image has empty or different alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged the words decorative: only there for looks, or
      already in the page text. In at least one place, the alt text (the text
      a screen reader reads for an image) is empty or unlike those words. For
      a decorative image, empty alt text (<code>alt=""</code>) is correct.
    why_matters: >-
      Screen readers skip an image with empty alt text, so people do not hear
      words that add nothing. If the AI model is wrong and the words carry
      meaning, screen reader users miss them.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at each image and the page text next to it. If the image's words
        are only for looks, or already said in real text nearby, the image is
        decorative.
      - >-
        For a decorative image, use empty alt text and no <code>title</code>,
        for example <code>&lt;img src="banner.jpg" alt=""&gt;</code>. If it
        already has <code>alt=""</code>, keep it and set its status to Not a
        problem (false positive).
      - >-
        If a decorative image has other alt text, such as a file name or the
        word "image", change it to <code>alt=""</code>.
      - >-
        If the image's words say something the page does not, the image is not
        decorative. Put the same words in its alt text, for example
        <code>alt="Open house, Saturday 12 October"</code>.
    fix_options:
      - label: "Keep or set empty alt text"
        approach: >-
          When the image's words are only for looks, or already appear as real
          text nearby, use alt="". Screen readers then skip the image.
        watch_out: >-
          Never use alt="" on an image that is the only content of a link or
          button: the link or button then has no name. Also remove any title
          attribute, because an empty alt with no title tells screen readers
          to skip the image.
      - label: "Move the image into the style sheet (CSS)"
        approach: >-
          Some images are only page design. Show these as a background image
          in the style sheet, not as an image in the page code (DOM).
        watch_out: >-
          Use this only for images that carry nothing. It is not right for an
          image that gives information or does something when people use it.
      - label: "Write alt text with the image's words"
        approach: >-
          A person may find that the image says something the page does not.
          Then it is an image of text, so put the same words in its alt text.
        watch_out: >-
          If the same words already appear as real text right next to the
          image, screen reader users hear them twice. Use alt="" in that case.
    verify_manual: >-
      Decide for each image whether its words are only for looks or already in
      the page text. Then move past it with a screen reader. The screen reader
      should skip a decorative image, and read the words of an image that
      carries meaning. A correct alt="" still keeps the image in this issue.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt="" and no title because a person
      confirmed it is decorative, or alt text that gives its words.
    confidence_default: low

  decorative_partial:
    title: "Decorative image has partly matching alt text"
    wcag_sc: "1.1.1"
