          Check that any fact in the image, such as a date or a price, is also
          in the page text nearby. If a fact is only in the image, empty alt
          text hides it from screen reader users.
      - label: "Complete the alt text"
        approach: >-
          When a person finds that the image's words carry meaning, put all of
          them in the alt text: the same text the image shows.
        watch_out: >-
          Put in the words, not how they look. Leave styling, such as the font
          or a shadow, out of the alt text.
    verify_manual: >-
      Decide for each image whether its words are only for looks or already in
      the page text. Then move past it with a screen reader. The screen reader
      should skip a decorative image, and read every word of an image that
      carries meaning. After you set alt="", the image usually moves to the
      issue for empty or different alt text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt="" because a person confirmed it is
      decorative, or alt text with all the words the image shows.
    confidence_default: low

  informational_adequate:
    title: "Alt text uses words found in these images"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged that they add information to the page. The alt
      text (the text a screen reader reads for an image) is very like those
      words. Often every word of the alt text appears in the image, so one
      word from a chart title counts as a match. This is a record of what was
      checked, not a problem to fix.
    why_matters: >-
      Matching words is a good sign, but it does not show that the alt text
      gives the image's meaning. For a chart or infographic, a person still
      needs to check that the key message and data are available as text.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Check a few images. Read the alt text and make sure it gives the key
        message, not only a title or one word.
      - >-
        For charts and infographics, check that the data or steps are also on
        the page as text, in a <code>&lt;figcaption&gt;</code>, or on a linked
        page.
      - >-
        For an image that is mostly text, such as a banner, use real HTML text
        where the same look can be made with text. WCAG 1.4.5 Images of Text
        asks for this, so people can resize the text and change its font or
        colors. It does not cover text inside charts and diagrams.
    fix_options:
      - label: "Keep as is"
        approach: "Leave images whose alt text gives the full message."
        watch_out: >-
          A match only means the words overlap. Check a few by hand before you
          rely on this record.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to a few of
      these images. What it reads should give the same information a sighted
      reader gets from the image. If the image or its alt text changes, a new
      scan can move it to another issue.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this record has alt text that gives the information a
      sighted reader gets from it, not only matching words.
    confidence_default: medium

  informational_inadequate:
    title: "Alt text leaves out what these images tell people"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged that the words add information to the page, for
      example a chart with labels. The alt text (the text a screen reader
      reads for an image) is empty (<code>alt=""</code>) or has little in
      common with the image's words. The check compares words, not meaning.
      When an image appears in several places, its weakest alt text counts.
    why_matters: >-
      Screen reader users, including blind people and deaf-blind people who
      read braille, miss the information the image adds to the page. Text
      alternatives may also help some people who find charts and pictures hard
      to understand.
    owner: editor
    effort: under_2h
    fix_steps:
      - >-
        Open the page and look at each image. Decide what it tells people, and
        check whether nearby page text already says the same thing.
      - >-
        Write alt text that gives the key message in a short phrase or
        sentence. Example: <code>&lt;img src="enrollment.png" alt="Enrollment
        rose 12% from 2024 to 2025"&gt;</code>
      - >-
        For a chart, diagram, or infographic (a picture that explains facts
        with words and graphics), keep the alt text short. Then add a long
        description (a full text version of the image's information). Put it
        next to the image as text, in a <code>&lt;figcaption&gt;</code>, or on
        a linked page.
      - >-
        If nearby text already gives the same information, <code>alt=""</code>
        is correct. Keep it and set the status to Not a problem (false
        positive).
    fix_options:
      - label: "Short alt text with the key message"
        approach: >-
          Replace the empty or unrelated alt text with one short sentence that
          says what the image tells people, not what it looks like.
        watch_out: >-
          The image text check compares words, not meaning. A good summary in
          other words can still show up here, so a person must judge it.
      - label: "Short alt text plus a long description"
        approach: >-
          For charts and infographics, give a short alt text that names the
          image. Put the full data or steps in visible text, a
          <code>&lt;figcaption&gt;</code>, or a linked page.
        watch_out: >-
          A screen reader reads a description linked with
          <code>aria-describedby</code> as one paragraph. It loses tables,
          headings, and lists, so use visible text or a linked page for data.
      - label: "Replace the image text with real text"
        approach: >-
          Build the labels and numbers as HTML text styled with CSS, and keep
          only the graphic parts as an image.
        watch_out: >-
          This takes design and developer time. WCAG 1.4.5 Images of Text does
          not cover text inside charts and diagrams. So this is a choice that
          helps people who resize text, not a requirement.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to each
      image. What it reads, with any long description, should give the same
      information a sighted reader gets from the image. If the image uses
      alt="", check that the nearby text says everything the image says. A
      good summary in other words can still be found here.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every affected image gives its information as text: in its alt text, in
      a long description, or in nearby text with alt="".
    confidence_default: medium

  informational_partial:
    title: "Alt text covers only part of these images' information"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged that they add information to the page. The alt
      text (the text a screen reader reads for an image) uses some words from
      the image and some other words. For example, <code>alt="Pie chart of
      survey results"</code> names the chart but leaves out its numbers. The
      check compares words, not meaning, so a good summary in other words can
      also land here.
    why_matters: >-
      Screen reader users may think they got the whole message when part of it
      is missing. They can then make choices based on half the information.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Compare the alt text with the image. List the labels, numbers, or
        short messages in the image that the alt text leaves out.
      - >-
        If any of them matter to understanding the content, add them to the
        alt text, or add them as visible text near the image. Example:
        <code>alt="Survey results: 64% agree, 21% disagree, 15% not
        sure"</code>
      - >-
        If the alt text already gives the key message in other words, leave it
        and set the status to Not a problem (false positive).
    fix_options:
      - label: "Complete the alt text"
        approach: >-
          Add the missing labels or numbers so the alt text gives the same
          information as the image.
        watch_out: >-
          Alt text should stay short. If the information needs more than a
          short sentence, use a long description (a full text version of the
          image's information) instead.
      - label: "Add a long description"
        approach: >-
          Keep a short alt text and put the full data in visible text, a
          <code>&lt;figcaption&gt;</code>, or a linked page.
        watch_out: >-
          Make the long description visible to everyone, for example as part
          of the page. People with low vision or learning disabilities use it
          too, not only screen reader users.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to each
      image. Check that you hear every label, number, or message a sighted
      reader needs, either in the alt text or in nearby text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every affected image has alt text, or nearby text, that gives all the
      information a sighted reader gets from the image.
    confidence_default: low

  logo_adequate:
    title: "Logo alt text uses words from the logo"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged each one a logo, or a name written in a set style
      (wordmark). The alt text (the text a screen reader reads for an image)
      is very like the logo's words. Often every word of the alt text appears
      in the logo, so part of the name counts as a match. This is a record of
      what was checked, not a problem to fix.
    why_matters: >-
      Screen reader users hear words from the logo, usually the organization's
      name. If a logo is also a link, its alt text should also make clear
      where the link goes.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        For logos that are links, check that the alt text also says where the
        link goes, such as <code>alt="Acme Corporation home"</code>.
      - >-
        If the same name is written as text in the same link, consider
        <code>alt=""</code> so screen readers do not read the name twice.
    fix_options:
      - label: "Keep as is"
        approach: "Leave logos whose alt text names the organization."
        watch_out: >-
          A match only means the words overlap. A linked logo can match the
          name and still not say where the link goes.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to a few of
      these logos. You should hear the organization's name once, and a linked
      logo should say where it goes. If the logo or its alt text changes, a
      new scan can move it to another issue.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the logo is still
      found here.
    acceptance: >-
      Every logo in this record names the organization or product, and every
      linked logo also says where it goes.
    confidence_default: medium

  logo_inadequate:
    title: "Logo alt text does not give the name"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged each one a logo, or a name written in a set style
      (wordmark). The alt text (the text a screen reader reads for an image)
      is empty (<code>alt=""</code>) or has little in common with the logo's
      words. An example is <code>alt="logo"</code>. Text recognition can
      misread fancy lettering, which makes good alt text look wrong.
    why_matters: >-
      Screen reader users do not hear whose logo it is, such as the site owner
      or a partner. If the logo is the only thing in a link, such as a link to
      the home page, the link has no useful name.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Set the alt text to the name shown in the logo. You do not need to say
        that it is a logo. Example: <code>&lt;img src="acme.svg" alt="Acme
        Corporation"&gt;</code>
      - >-
        If the logo is the only content of a link, say where the link goes:
        <code>&lt;a href="/"&gt;&lt;img src="acme.svg" alt="Acme Corporation
        home"&gt;&lt;/a&gt;</code>
      - >-
        <code>alt=""</code> is correct only when the same name is already text
        beside the logo. For a linked logo, that text must be inside the same
        link. If so, keep it and set the status to Not a problem (false
        positive).
    fix_options:
      - label: "Name the organization"
        approach: >-
          Use the organization or product name shown in the logo as the alt
          text.
        watch_out: >-
          Words like "logo", "image", or a file name do not tell people whose
          logo it is.
      - label: "Name the link destination"
        approach: >-
          For a logo that is a link, include where it goes, such as "Acme
          Corporation home".
        watch_out: >-
          Check the link in the screen reader's list of links. Its name must
          make sense on its own, without the picture.
      - label: "Keep empty alt text"
        approach: >-
          Keep <code>alt=""</code> when the same name is visible as text in
          the same link, or beside a logo that is not a link.
        watch_out: >-
          Text outside the link does not name the link. A linked logo with
          <code>alt=""</code> and no other text in the link leaves the link
          with no name.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to each
      logo. You should hear the organization's name once. For a linked logo,
      open the screen reader's list of links and check that the link says
      where it goes. A correct alt="" beside visible text can still be found
      here.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the logo is still
      found here.
    acceptance: >-
      Every affected logo names the organization and, if it is a link, where
      it goes, or has alt="" next to the same name as text.
    confidence_default: medium

  logo_partial:
    title: "Logo alt text only partly matches the logo"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found words in these images. A local AI model
      (vision model) judged each one a logo, or a name written in a set style
      (wordmark). The alt text (the text a screen reader reads for an image)
      uses some of the logo's words and some other words. For example,
      <code>alt="Acme Healthcare"</code> on a logo that reads "Acme Health
      System", or part of the name plus the word "logo". Text recognition can
      also misread fancy lettering.
    why_matters: >-
      If the name is wrong or different, screen reader users may not recognize
      the organization. They may hear a different name than sighted users see.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at the logo and read its alt text. Check that the alt text gives
        the name as it appears in the logo. Example: <code>alt="Acme Health
        System"</code> for a logo that reads "Acme Health System".
      - >-
        If the logo is the only content of a link, keep the name and add where
        the link goes, such as <code>alt="Acme Health System home"</code>.
      - >-
        If the alt text already gives the right name, leave it and set the
        status to Not a problem (false positive).
    fix_options:
      - label: "Use the full name from the logo"
        approach: "Change the alt text to the name exactly as the logo shows it."
        watch_out: >-
          Leave out the word "logo". People need the name, not the fact that
          it is a logo.
      - label: "Name the link destination"
        approach: >-
          For a logo that is a link, give the name and where the link goes,
          such as "Acme Health System home".
        watch_out: >-
          Check the link in the screen reader's list of links. Its name must
          make sense on its own, without the picture.
    verify_manual: >-
      Turn on a screen reader, such as VoiceOver or NVDA, and move to each
      logo. The name you hear should match the name you see in the logo. Fancy
      lettering that text recognition misreads can keep a correct logo here.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the logo is still
      found here.
    acceptance: >-
      Every affected logo has alt text that gives the organization or product
      name as the logo shows it.
    confidence_default: low

  no_meaningful_text_adequate:
    title: "Image without meaningful text has matching alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      This is a record of what was checked, not a problem to fix. Text
      recognition (OCR) found marks in these images that looked like words. A
      local AI model (vision model) judged that they are not real words.
      Everywhere each image appears, its alt text (the text a screen reader
      reads for an image) is very like those marks, or contains them.
    why_matters: >-
      The check found no barrier, but alt text that only repeats a watermark
      or a file name tells screen reader users nothing. The AI model can also
      be wrong, for example about place names on a map.
    owner: editor
    effort: under_15m
    fix_steps:
      - "No fix is needed if the alt text fits what the image is for."
      - >-
        If the alt text only repeats stray marks, such as a watermark or a
        file name, rewrite it to give the image's meaning. Use
        <code>alt=""</code> if the image is only decoration.
      - >-
        If the image does carry words that matter, such as place names on a
        map, check that the alt text gives them. For a detailed image, also
        put the information on the page as text.
    fix_options:
      - label: "Leave it as it is"
        approach: "Keep the alt text when it fits what the image is for."
        watch_out: >-
          The AI model can miss real information, such as place names on a
          map. Look at the image once before you rely on this record.
      - label: "Describe the image's meaning"
        approach: >-
          Rewrite the alt text so it says what the image means on the page,
          and gives any words in it that matter.
        watch_out: >-
          Do not copy the words Axcess read as they are. They can contain
          reading mistakes.
      - label: "Mark it as decoration"
        approach: >-
          Use alt="" when the image itself adds nothing, such as a background
          texture with a watermark.
        watch_out: >-
          After the next scan, the image moves to the issue for empty or
          different alt text. That is expected: the check counts empty alt
          text as not matching.
    verify_manual: >-
      Open the image and read any words in it yourself. If they are only
      marks, check that the alt text still says what the image is for. If they
      carry information, use a screen reader and check that the alt text gives
      it.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text that fits what the image is for,
      and gives any words in it that carry information.
    confidence_default: medium

  no_meaningful_text_inadequate:
    title: "Image without meaningful text has empty or different alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found marks in these images that looked like
      words. A local AI model (vision model) judged that they are not real
      words, such as a watermark or a reading mistake. In at least one place,
      the alt text (the text a screen reader reads for an image) is empty or
      unlike those marks. If the marks are not real words, that is expected
      and not a problem.
    why_matters: >-
      This is often not a problem, because the marks are not real words. But
      the AI model can be wrong, for example about place names on a map, and
      then screen reader users miss real words.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Open the image. Check if it holds words a sighted person would read,
        such as a heading, a label or place names.
      - >-
        If it holds no real words, check that the alt text fits the image's
        purpose. Use <code>alt=""</code> for decoration. Use a short
        description for a photo that adds meaning.
      - >-
        If it holds real words that the page does not say, add them to the alt
        text. For example: <code>alt="Campus map: North, Central and Medical
        buildings"</code>.
      - >-
        If the alt text already fits, set its status to Not a problem (false
        positive) and add a short note.
    fix_options:
      - label: "Keep the alt text and mark it Not a problem"
        approach: >-
          A person may confirm that the image has no real words and that the
          alt text fits its purpose. Then set its status to Not a problem
          (false positive).
        watch_out: >-
          Look at the whole image, not only the text Axcess read. Text
          recognition can miss words as well as invent them.
      - label: "Add the image's words to the alt text"
        approach: >-
          The AI model may be wrong, and the image may hold words that matter.
          Put those words in the alt text, or next to the image as real text.
        watch_out: >-
          Some text is part of a photo with a lot else in it, such as a name
          tag in a group photo. WCAG does not count that as an image of text.
          Describe the photo, and include only the words that matter.
    verify_manual: >-
      Look at the image and read its alt text in the page code (DOM). Then
      move past it with a screen reader. The screen reader should skip the
      image if it is decoration, or read words that give the image's meaning.
      The image often stays here even when its alt text is right.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text a person checked: empty for
      decoration, or words giving its meaning and any real text.
    confidence_default: low

  no_meaningful_text_missing:
    title: "Image without meaningful text has no alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found marks in these images that looked like
      words. A local AI model (vision model) judged that they are not real
      words, such as a watermark or a reading mistake. Separately, in at least
      one place Axcess found no <code>alt</code> attribute for the image.
      Every image needs alt text (the text a screen reader reads for an
      image): empty for decoration, or words that give its meaning.
    why_matters: >-
      Without an alt attribute, some screen readers read out the image's file
      name instead. Screen reader users then hear a name that means nothing
      and cannot tell what they missed.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Look at the image and decide what it is for. If it is only decoration,
        give it empty alt text: <code>&lt;img src="texture.jpg"
        alt=""&gt;</code>.
      - >-
        If it adds meaning, such as a photo that goes with the story, write a
        short description. For example: <code>alt="Students planting trees
        outside the library"</code>.
      - >-
        If it is the only content of a link or button, say where the link goes
        or what the button does. Do not describe the picture.
      - >-
        If the occurrence is a <code>&lt;source&gt;</code> inside
        <code>&lt;picture&gt;</code>, check the alt text on the
        <code>&lt;img&gt;</code> in that <code>&lt;picture&gt;</code>, which
        covers it. The check reads no alt text for a
        <code>&lt;source&gt;</code>, so these always count as missing.
    fix_options:
      - label: "Add empty alt text"
        approach: >-
          For an image that is only decoration, add alt="" so screen readers
          skip it.
        watch_out: >-
          Use this only for images that carry nothing. A photo that shows what
          the text is about, or a chart, needs a description instead.
      - label: "Add a short description"
        approach: >-
          For an image that adds meaning, write one short sentence about what
          it shows that matters on this page.
        watch_out: >-
          Say what the image means on this page, not everything it shows. Alt
          text is usually not a full description of the picture.
      - label: "Name the image with aria-label or title"
        approach: >-
          An aria-label, aria-labelledby or title attribute can also give an
          image a name, but only where screen readers support it.
        watch_out: >-
          The image text check reads only the alt attribute, so it still
          counts these images as missing alt text. Prefer the alt attribute.
    verify_manual: >-
      Turn on a screen reader and move past the image. The screen reader
      should not read a file name. It should skip a decorative image and read
      a short description for a meaningful one. If the image moves to the
      issue for empty or different alt text, that is expected.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text that fits its purpose: empty for
      decoration, or words that give its meaning.
    confidence_default: medium

  no_meaningful_text_partial:
    title: "Image without meaningful text has partly matching alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Text recognition (OCR) found marks in these images that looked like
      words. A local AI model (vision model) judged that they are not real
      words. But in at least one place, the alt text (the text a screen reader
      reads for an image) uses some of the same words. That overlap can mean
      the image holds real words, and the AI model was wrong.
    why_matters: >-
      If the image holds real words, screen reader users may hear only part of
      them. If it holds none, the alt text may still be fine, and this is not
      a problem.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Open the image and compare it with its alt text. Check if the image
        shows words a sighted person would read, such as a sign, a label or a
        chart title.
      - >-
        If it shows real words that the page does not say, put all of them in
        the alt text. For example: <code>alt="Poster: Science Fair, 4 May,
        Room 120"</code>.
      - >-
        If it shows no real words, check that the alt text fits the image's
        purpose. Use <code>alt=""</code> for decoration. Use a short
        description for a photo that adds meaning.
      - >-
        If the alt text already fits, set its status to Not a problem (false
        positive) and add a short note.
    fix_options:
      - label: "Complete the alt text"
        approach: >-
          When the image holds words that matter, put every one of them in the
          alt text: the same text the image shows.
        watch_out: >-
          If those words already appear as real text right next to the image,
          screen reader users hear them twice. Use alt="" in that case.
      - label: "Keep the alt text and mark it Not a problem"
        approach: >-
          A person may confirm that the image has no real words and that the
          alt text fits its purpose. Then set its status to Not a problem
          (false positive).
        watch_out: >-
          A partial match hints that the AI model may be wrong. Look at the
          whole image before you set that status.
    verify_manual: >-
      Look at the image and read its alt text in the page code (DOM). Then
      move past it with a screen reader. The screen reader should read every
      word that matters in the image, or skip the image if it is decoration.
      After you set alt="", the image usually moves to the issue for empty or
      different alt text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) and Compare image text
      with alt text (vision model) turned on, and see if the image is still
      found here.
    acceptance: >-
      Every image in this issue has alt text a person checked: every word that
      matters in it, or empty for decoration.
    confidence_default: low

  unclassified_adequate:
    title: "Image with words has matching alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      This is a record of what was checked, not a problem to fix. Axcess found
      words in these images, but a local AI model (vision model) did not sort
      them. Everywhere each image appears, its alt text (the text a screen
      reader reads for an image) is very like those words. Short alt text
      counts as a match when all its words are in the image, such as "Sale"
      for "Sale ends Friday".
    why_matters: >-
      The check found no barrier, but short alt text can leave out a date or a
      condition that the image shows. Words in an image file, such as a PNG,
      can blur when people enlarge them, and people cannot change their
      colors.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        No fix is needed if the alt text gives all the information in the
        image's words.
      - >-
        If the alt text is much shorter than the image's words, check that it
        still gives everything that matters. The check counts a short piece of
        the text as a match.
      - >-
        Where you can, use real text styled with the style sheet (CSS) instead
        of an image of words. WCAG allows words in an image for logos.
    fix_options:
      - label: "Leave it as it is"
        approach: >-
          Keep the alt text when it gives all the information in the image's
          words.
        watch_out: >-
          A short alt text such as "Sale" matches a longer image text such as
          "Sale ends Friday". Check that no date or condition is left out.
      - label: "Use real text"
        approach: >-
          Replace the image with real text on the page, styled with the style
          sheet (CSS) and a web font.
        watch_out: >-
          Do not move the words into a background image in the style sheet. A
          background image has no alt text, so screen readers get nothing.
    verify_manual: >-
      Look at a few of these images next to their alt text. Check that the alt
      text gives all the information the image's words carry, not just part of
      it.
    verify_automated: >-
      Scan again with Read text inside images (OCR) turned on, and see if the
      image is still found here.
    acceptance: >-
      Every image in this issue has alt text that gives all the information
      its words carry.
    confidence_default: medium

  unclassified_inadequate:
    title: "Image with words has empty or different alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Axcess found words in these images and compared them with the alt text
      (the text a screen reader reads for an image). In at least one place,
      the alt text is empty (<code>alt=""</code>) or has little in common with
      those words. The check compares words, not meaning, and ignores capital
      letters and punctuation. A local AI model (vision model) did not sort
      these images, so Axcess cannot tell if empty or different alt text is
      right.
    why_matters: >-
      If the image's words carry information, screen reader users hear other
      words or nothing, and may not know that anything is missing. If the
      words are only for looks or already on the page, empty alt text can be
      right.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Decide what the image's words are for: already on the page as text,
        only for looks, or found nowhere else.
      - >-
        If the words appear nowhere else, put the same words in the alt text.
        For example, an image that reads "Open day, Saturday 4 May" gets
        <code>alt="Open day, Saturday 4 May"</code>.
      - >-
        If the words are already on the page as text, or only for looks, use
        <code>alt=""</code>. For a photo where words are only part of the
        scene, a short alt text that gives the photo's purpose can be right.
      - >-
        For a graphic in the page code (inline <code>&lt;svg&gt;</code>), the
        check reads its <code>aria-label</code> or first
        <code>&lt;title&gt;</code> as the alt text. Change the words there.
    fix_options:
      - label: "Match the image's words"
        approach: "Rewrite the alt text so it gives the words shown in the image."
        watch_out: >-
          The words Axcess read can contain reading mistakes, which can keep
          correct alt text in this issue. Type the words as a person sees
          them.
      - label: "Keep the empty alt text"
        approach: >-
          Keep alt="" when the same words are already on the page as text, or
          are only for looks.
        watch_out: >-
          Axcess keeps listing the image in this issue, because it cannot tell
          decoration from information without the vision model. Set its status
          to Not a problem (false positive) and note why.
      - label: "Describe the image's purpose"
        approach: >-
          Use this for a photo where the words are only part of the scene.
          Write alt text that says what the image shows or is for.
        watch_out: >-
          If the words give information the page does not, the alt text must
          give that information too.
    verify_manual: >-
      Look at the image and decide whether its words carry information found
      nowhere else on the page. If they do, use a screen reader and check that
      it reads the same information. If not, check that the alt text is empty
      or gives the image's purpose, and set the status to Not a problem (false
      positive). An image you keep at alt="" on purpose stays listed here.
    verify_automated: >-
      Scan again with Read text inside images (OCR) turned on, and see if the
      image is still found here.
    acceptance: >-
      Every image in this issue has alt text that gives the information its
      words carry, or a person confirmed its alt text is right.
    confidence_default: low

  unclassified_missing:
    title: "Image with words has no alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Axcess found words in these images, and in at least one place no alt
      text (the text a screen reader reads for an image). For an image element
      (<code>&lt;img&gt;</code>), it reads only the <code>alt</code>
      attribute. For a graphic in the page code (inline
      <code>&lt;svg&gt;</code>), it reads the <code>aria-label</code> or the
      first <code>&lt;title&gt;</code>. A local AI model (vision model) did
      not sort these images, so Axcess cannot tell if their words matter.
    why_matters: >-
      Without alt text, some screen readers read out an image's file name
      instead. If the image's words carry information, such as a date or a
      heading, screen reader users lose it.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Decide what the image's words are for. If the same words are already
        on the page as text, or are only for looks, use <code>alt=""</code>.
      - >-
        If the words appear nowhere else, put the same words in the alt text,
        for example <code>&lt;img src="sale.png" alt="Summer sale: 20% off
        until 30 June"&gt;</code>. If the image is the only content of a link
        or button, say where it goes or what it does.
      - >-
        For an inline <code>&lt;svg&gt;</code>, add <code>role="img"</code>
        and an <code>aria-label</code> with its words. If it is only
        decoration, add <code>aria-hidden="true"</code> instead. The check
        does not read that, so the graphic can stay listed here.
      - >-
        If the occurrence is a <code>&lt;source&gt;</code> inside
        <code>&lt;picture&gt;</code>, check the alt text on the
        <code>&lt;img&gt;</code> in that <code>&lt;picture&gt;</code>, which
        covers it. The check reads no alt text for a
        <code>&lt;source&gt;</code>, so these always count as missing.
    fix_options:
      - label: "Put the words in the alt text"
        approach: "Type the words shown in the image into its alt attribute."
        watch_out: >-
          The words Axcess read can contain reading mistakes. Type the words
          as a person sees them, not as Axcess read them.
      - label: "Mark it as decoration"
        approach: >-
          Use alt="" when the same words are already on the page as text, or
          are only for looks.
        watch_out: >-
          After the next scan, the image moves to the issue for empty or
          different alt text. Without the vision model, Axcess cannot tell
          decoration from information, so set its status there to Not a
          problem (false positive).
      - label: "Use real text"
        approach: >-
          Replace the image with real text on the page, styled with the style
          sheet (CSS) and a web font.
        watch_out: >-
          Logos can stay as images, because WCAG allows words in a logo. The
          alt text of a logo is the name it shows.
    verify_manual: >-
      Look at the image and decide if its words are already on the page, only
      for looks, or found nowhere else. Check the page code (DOM) for names
      Axcess does not read, such as aria-labelledby, and for aria-hidden on an
      inline SVG. Then use a screen reader: it should read the image's words,
      or skip the image if they are only for looks.
    verify_automated: >-
      Scan again with Read text inside images (OCR) turned on, and see if the
      image is still found here.
    acceptance: >-
      Every image in this issue has alt text with its words, or empty alt text
      because those words add nothing new.
    confidence_default: low

  unclassified_partial:
    title: "Image with words has partly matching alt text"
    wcag_sc: "1.1.1"
    wcag_name: "Non-text Content"
    wcag_level: "A"
    abilities_affected: [vision]
    what_happening: >-
      Axcess found words in these images and compared them with the alt text
      (the text a screen reader reads for an image). In at least one place,
      the alt text uses some of those words and some other words. Text
      recognition (OCR) mistakes can also cause this. A local AI model (vision
      model) did not sort these images, so Axcess cannot tell if the missing
      words matter.
    why_matters: >-
      Screen reader users hear only part of the image's words, and may not
      know that a date, price or condition is missing. If the missing words
      are only for looks, the alt text may already be enough.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Read the image and list the words that carry information but are not
        in the alt text or in the page text nearby.
      - >-
        Add those words to the alt text. For example, <code>alt="Workshop
        flyer"</code> becomes <code>alt="Free workshop, Tuesday 3 pm, Room
        204"</code>.
      - >-
        If the image holds a lot of words, such as a poster, put the full text
        on the page next to it. Keep the alt text short, and set its status to
        Not a problem (false positive).
      - >-
        For a graphic in the page code (inline <code>&lt;svg&gt;</code>), the
        check reads its <code>aria-label</code> or first
        <code>&lt;title&gt;</code> as the alt text. Change the words there.
    fix_options:
      - label: "Complete the alt text"
        approach: "Add the missing words that carry information to the alt text."
        watch_out: >-
          Alt text works best as a short phrase or sentence. For a lot of
          words, put them on the page as text instead.
      - label: "Keep it when only words for looks are missing"
        approach: >-
          Leave the alt text as it is when the missing words are only for
          looks or already on the page.
        watch_out: >-
          Axcess keeps listing the image in this issue. Set its status to Not
          a problem (false positive) and note why.
      - label: "Use real text"
        approach: >-
          Replace the image with real text on the page, styled with the style
          sheet (CSS) and a web font.
        watch_out: >-
          Logos can stay as images, because WCAG allows words in a logo. The
          alt text of a logo is the name it shows.
    verify_manual: >-
      Read the image yourself and list any words that carry information and
      are not in the alt text or nearby page text. With a screen reader, check
      that it reads all of those words. If only words for looks are missing,
      set the status to Not a problem (false positive). After a fix, the image
      can move to the record for matching alt text.
    verify_automated: >-
      Scan again with Read text inside images (OCR) turned on, and see if the
      image is still found here.
    acceptance: >-
      Every image in this issue has alt text, or page text next to it, that
      gives all the information its words carry.
    confidence_default: low


# ---------------------------------------------------------------------
# Semantic (per-criterion LLM) analyzer cards. Same shape as
# ``axe_rules`` entries, but keyed on the WCAG SC dotted form so the
# Issues view can resolve a row's title from its ``criterion_sc``.
#
# Phase 9.1 ships SC 2.4.4; Phase 9.2+ adds the rest of the wave-1 set.
# ---------------------------------------------------------------------
semantic_criteria:

  "2.1.1":
    title: "A control may work with a mouse but not with a keyboard"
    # One card covers both keyboard-check rules; each keeps its own title.
    rule_titles:
      keyboard-mouse-only-control: "A control works with a mouse, but the Tab key cannot reach it"
      keyboard-no-key-activation: "The Tab key reaches a control, but Enter and Space may do nothing"
    wcag_sc: "2.1.1"
    wcag_name: "Keyboard"
    wcag_level: "A"
    abilities_affected: [motor, vision]
    what_happening: >-
      The keyboard check reads the page code and finds elements that react to
      the mouse, such as a <code>&lt;div&gt;</code> with a click handler. It
      reports an element when the Tab key cannot reach it, or when the Tab key
      reaches a custom control that has no key handler. It leaves out elements
      with another keyboard path: a link or button inside or around them, a
      control with the same name, arrow-key navigation in a group, or a
      keyboard shortcut the page names. The advanced keyboard check also
      clicks each element and presses Enter and Space. It then reports only
      elements where the click did something and the keys could not do the
      same.
    why_matters: >-
      People who use only a keyboard cannot use a control that works only with
      a mouse. They include many blind people and people with physical
      disabilities. People who use speech input or a switch often move through
      a page the same way a keyboard does, so they are blocked too.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the live page and find the element in the element locator (CSS
        selector). Click it and note what happens.
      - >-
        Reload the page and press Tab until you reach the element. If Tab
        never reaches it, or Enter and Space do not do what the click did,
        the problem is real. If another control on the page does the same
        job and the keyboard can use it, set the status to Not a problem
        (false positive).
      - >-
        Use a real control where you can: a <code>&lt;button&gt;</code> for
        an action and an <code>&lt;a href&gt;</code> for a link. Both work
        with the keyboard without extra code.
      - >-
        If the element must stay custom, give it
        <code>tabindex="0"</code>, a role such as
        <code>role="button"</code>, and a <code>keydown</code> handler that
        runs the same action for Enter and Space.
    fix_options:
      - label: "Use a native button or link"
        approach: >-
          Replace the clickable element with a button or a link. The browser
          then handles Tab, Enter and Space, and screen readers announce it.
        watch_out: >-
          Keep the look by styling the button. Remove the old click handler
          from any wrapper so the action does not run twice.
      - label: "Make the custom control keyboard operable"
        approach: >-
          Add tabindex="0", a role, an accessible name, and one key handler
          that runs the click's action for Enter, and for Space on a button.
        watch_out: >-
          A link given role="button" must also work with Space, which links do
          not do on their own.
      - label: "Show hover content on focus too"
        approach: >-
          If the element opens a menu or tooltip on hover, open it on focus or
          on Enter as well, and let Escape close it.
        watch_out: >-
          Content shown only with CSS :hover needs :focus-within or a script
          for keyboard users.
    verify_manual: >-
      Put the mouse away. Press Tab until you reach the element, then press
      Enter and, for a button, Space. Check that it does what a click does.
      Also check any menu or pop-up window the element opens.
    verify_automated: >-
      Scan again with the keyboard check turned on, and see if the element is
      still found. Turn on the advanced keyboard check to have Axcess click and
      press keys on it for you.
    acceptance: >-
      Everything the element does with a mouse can also be done with the
      keyboard alone, or another control that the keyboard can use does the
      same job.
    confidence_default: medium

  "2.1.2":
    title: "Keyboard focus may be stuck on one element"
    wcag_sc: "2.1.2"
    wcag_name: "No Keyboard Trap"
    wcag_level: "A"
    abilities_affected: [motor, vision]
    what_happening: >-
      The keyboard check presses Tab through the page, up to about 100 times.
      It reports an element when focus stays on it through 4 more presses of
      Tab and then 4 presses of Shift+Tab. Normal cases do not count, such as
      focus going back to the top, moving between two controls, or staying in
      a pop-up window (modal dialog). The check also skips parts it cannot see
      inside. Examples are an embedded frame (<code>&lt;iframe&gt;</code>) and
      a custom element that hides its inner parts (closed shadow root). The
      check stops at the first trap on a page, so another one can appear after
      you fix this one. A person must still check for another way out, such as
      a key the page explains.
    why_matters: >-
      People who use only a keyboard cannot reach anything after a trap, so
      the rest of the page stops working for them. They include many blind
      people and people with physical disabilities. People who use tools that
      act like a keyboard, such as speech input or a switch worked by breath
      (sip-and-puff), are stuck too.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the live page and press Tab until you reach the element in the
        element locator (CSS selector). Then press Tab and Shift+Tab several
        times each, and watch where focus goes.
      - >-
        Try the keys the component uses, such as the arrow keys and Escape. If
        focus leaves with an arrow key, Tab or Escape on its own, it is not a
        trap. It is also not a trap if the page explains the key to use,
        before and inside the component. In both cases, set the status to Not
        a problem (false positive).
      - >-
        If focus is stuck, look for key handlers on the element and its parent
        elements. One common cause is a <code>keydown</code> handler that
        calls <code>event.preventDefault()</code> for the Tab key. Another is
        a script that calls <code>focus()</code> to pull focus back when it
        leaves.
      - >-
        Change the code so Tab after the last control, and Shift+Tab before
        the first control, move focus out of the component. If the component
        needs its own keys, add a key that leaves it, and explain that key
        before and inside the component.
    fix_options:
      - label: "Let Tab and Shift+Tab leave the component"
        approach: >-
          When focus reaches the last control, let Tab move it to the next
          thing on the page. When it reaches the first control, let Shift+Tab
          move it back out.
        watch_out: >-
          Script that moves focus back when it leaves, for example on a blur
          or focusout event, traps people again. Remove or limit those
          listeners as well as the Tab handler.
      - label: "Add an exit key and explain it"
        approach: >-
          Keep the component's own key handling, and add a key that moves
          focus out of it. Tell people about the key before the component and
          inside it.
        watch_out: >-
          The instructions must be easy to find, and must work with a keyboard
          and a screen reader. A key named only on a separate help page is
          hard to find once someone is stuck.
      - label: "Update or replace a third-party widget"
        approach: >-
          If the trap comes from a widget or embed made by another company,
          update it to a version with working keyboard support, or replace it.
        watch_out: >-
          You may not be able to change another company's code. Report the
          trap to them, and do not set the occurrence to Fixed until a fixed
          version is on the live site.
    verify_manual: >-
      Open the live page and use only the keyboard. Tab to the element, then
      check that Tab moves focus past it and Shift+Tab moves focus back past
      it. If a special key is needed, check that the page names that key
      before you reach the element. The check only tests the page as it loads,
      so also test menus and pop-up windows that you open.
    verify_automated: >-
      Scan again with Check keyboard access turned on, and see if the
      element is still found.
    acceptance: >-
      Every affected component lets keyboard users leave with a standard key,
      such as Tab, Shift+Tab or Escape, or the page names the key to use.
    confidence_default: medium

  "2.4.4":
    title: "Link text may not say where the link goes"
    wcag_sc: "2.4.4"
    wcag_name: "Link Purpose (In Context)"
    wcag_level: "A"
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      The AI review (a language model on this computer) reads the first 50
      links on each page. It skips links to a spot on the same page, and
      email, phone, text-message and script (<code>javascript:</code>) links.
      For each link, it sees the link address and the name a screen reader
      reads (accessible name). It also sees the text of up to 5 elements that
      contain the link, such as its paragraph or list item. It reports a link
      only when it judges that you cannot tell where the link goes, even with
      that text. Examples are "click here", "read more", a bare web address,
      or an icon link with no name. The model can be wrong, for example about
      long brand names or abbreviations, so a person must confirm each
      occurrence.
    why_matters: >-
      Screen reader users often jump from link to link, or open a list of all
      links. Then they hear only the link text, so "read more" tells them
      nothing unless they stop to read the text around it. Clear links also
      help people with physical disabilities skip links they do not want, and
      help people with cognitive disabilities avoid getting lost.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Read the model's reason and suggested fix in the occurrence. Then find
        the link on the live page and read it together with its sentence,
        paragraph, list item, table cell, or the heading before it.
      - >-
        If the purpose is clear from that nearby text, set the status to Not a
        problem (false positive).
      - >-
        If it is not clear, rewrite the link text so it names the destination.
        For example, change "Click here" to "Download the 2025 annual report
        (PDF)".
      - >-
        For a link that is only an image or icon, give it a name. Give the
        image alt text (the text a screen reader reads for an image) that
        names the destination. Or add an <code>aria-label</code> to the link,
        for example <code>&lt;a href="/search" aria-label="Search the
        catalog"&gt;</code>.
    fix_options:
      - label: "Rewrite the visible link text"
        approach: >-
          Put the destination in the words everyone sees, for example "2025
          annual report (PDF)" instead of "Click here".
        watch_out: >-
          Long link text is slow to scan. Keep it short, put the key words
          first, and do not give the same text to links that go to different
          places.
      - label: "Add words only screen readers read"
        approach: >-
          Keep a short visible link such as "Read more", and add hidden words
          after it, for example "about the 2025 budget". Use a CSS class that
          hides text on screen but not from screen readers (WCAG technique
          C7).
        watch_out: >-
          Do not hide the words with display: none or visibility: hidden,
          because screen readers skip that too. Keep the visible words at the
          start, so the full name still contains what people see (WCAG 2.5.3
          Label in Name). The zoom and layout check may then report the hidden
          words as cut off. That is not a problem.
      - label: "Name the link with aria-label or aria-labelledby"
        approach: >-
          Give the link a full name in code, or point aria-labelledby at
          nearby text, such as the heading of the card the link sits in.
        watch_out: >-
          This name replaces the visible text for screen readers. It must
          include the visible words, or people who use voice control cannot
          say the link's name to click it (WCAG 2.5.3 Label in Name).
    verify_manual: >-
      Open the list of links in a screen reader (VoiceOver: VO+U, then Links;
      NVDA: Insert+F7). For a link that is unclear on its own, read its
      sentence, paragraph, list item or table cell, and the heading before it.
      Each link should make clear where it goes, from its text or from that
      context.
    verify_automated: >-
      Scan again with AI review of wording turned on, and see if the link is
      still found.
    acceptance: >-
      Every link on the affected pages tells people where it goes, from its
      own text or from the text and heading around it.
    confidence_default: medium

  # ── Responsive/zoom probe cards (Phase 10). One card per SC; the
  #    probe's rule_ids (responsive-*) resolve here via the SC fallback
  #    in issues.py, same mechanism the keyboard probe uses for 2.1.2.

  "1.4.10":
    title: "Page scrolls sideways on a narrow screen"
    wcag_sc: "1.4.10"
    wcag_name: "Reflow"
    wcag_level: "AA"
    abilities_affected: [vision]
    what_happening: >-
      The zoom and layout check makes the browser window 320 pixels wide (CSS
      pixels). That is the same as a 1280-pixel-wide window zoomed to 400%. It
      reports the page when it needs more than 8 pixels of sideways scrolling.
      Each occurrence names an element wider than the window, or the whole
      page (<code>html</code>) when no single element stands out. The check
      names up to 5 elements per page, so others can appear after you fix
      these.
    why_matters: >-
      Many people with low vision zoom in to read. When the page does not fit,
      they must scroll left and right on every line, which takes much more
      effort to read and use. It can also make the page hard to use on small
      phones.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the live page with the browser's developer tools (DevTools) in
        device mode at 320 pixels wide. Find the element from the element
        locator (CSS selector). It is wider than the window, but a box around
        it may already hide the extra width, so look for other causes too.
      - >-
        Look for the usual causes: fixed widths such as <code>width:
        900px</code>, wide tables, and images without <code>max-width:
        100%</code>. Layouts that do not wrap and long words or web addresses
        cause it too.
      - >-
        Fix the cause. Use <code>max-width: 100%</code> or percentages instead
        of fixed widths. Let rows wrap with flexbox or grid, for example
        <code>flex-wrap: wrap</code>. Give images <code>max-width: 100%;
        height: auto</code>. For long strings, add <code>overflow-wrap:
        break-word</code>, or <code>overflow-wrap: anywhere</code> inside flex
        and grid items.
      - >-
        Content that needs two directions to make sense, such as a data table
        or a map, may scroll inside its own box. For example: <code>&lt;div
        tabindex="0" style="overflow-x:
        auto"&gt;&lt;table&gt;…&lt;/table&gt;&lt;/div&gt;</code>. Text,
        headings, and controls around it must still fit.
    fix_options:
      - label: "Use flexible widths and wrapping layouts"
        approach: >-
          Replace fixed pixel widths with max-width and percentages, and use
          flexbox or grid so columns stack into one column on narrow screens.
        watch_out: >-
          Check that nothing disappears at 320 pixels. Hiding content to make
          the page fit fails WCAG 1.4.10 unless the same content is still
          available (failure F102).
      - label: "Let long words and web addresses wrap"
        approach: >-
          Add overflow-wrap: break-word to text that holds long words or web
          addresses, so they break onto the next line. Inside flex and grid
          items, use overflow-wrap: anywhere, which also lets the item shrink.
        watch_out: >-
          This only helps text. A wide image, table, or fixed-width box still
          needs its own fix.
      - label: "Scroll wide tables and maps inside their own box"
        approach: >-
          Wrap content that needs two directions, such as a data table, in a
          box with overflow-x: auto, so only that box scrolls sideways.
        watch_out: >-
          Keyboard users must be able to scroll the box. Make sure it, or
          something inside it, can take keyboard focus, for example with
          tabindex="0" on the box.
    verify_manual: >-
      Set a 1280-pixel-wide browser window to 400% zoom, or use DevTools
      device mode at 320 pixels wide. Check that you only need to scroll up
      and down, and that all text, links, and controls are still there.
    verify_automated: >-
      Scan again with Check narrow screens and zoom turned on, and see if the
      element is still found.
    acceptance: >-
      Every affected page shows all its content in a 320-pixel-wide window
      without sideways scrolling, except parts that need two directions, like
      data tables and maps.
    confidence_default: high

  "2.4.11":
    title: "Focused control may be hidden behind a sticky bar"
    wcag_sc: "2.4.11"
    wcag_name: "Focus Not Obscured (Minimum)"
    wcag_level: "AA"
    abilities_affected: [motor, vision, cognition]
    what_happening: >-
      The focus check looks at the first 150 links, buttons, form fields and
      other elements that can take focus on each page. It moves focus to each
      one without scrolling, and tests those that show in the browser window.
      It reports a control when its center is covered by an element that stays
      in place when you scroll (<code>position: fixed</code> or
      <code>position: sticky</code>). Examples are a sticky header, a footer
      or a cookie banner. WCAG 2.4.11 fails only when the focused control is
      hidden completely, so a person must check whether any part of it still
      shows.
    why_matters: >-
      People who use a keyboard or speech input need to see where focus is. If
      a sticky bar covers the focused control, they may submit a form or
      follow a link they cannot see. It also affects people with low vision
      and people with attention or memory limits.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the live page and press Tab through every control, forward and
        back. Watch whether a sticky header, footer, or banner covers the
        focused control completely.
      - >-
        Add scroll padding so the browser keeps focused controls clear of the
        sticky bar. For example, use <code>html { scroll-padding-top: 5rem;
        }</code> for a header 5rem tall, or <code>scroll-padding-bottom</code>
        for a sticky footer or banner. <code>scroll-margin-top</code> on the
        controls also works in some browsers, but it has had bugs in Safari.
      - >-
        Or make the sticky bar shorter. For a cookie banner, you can also make
        it a pop-up window (modal dialog) that takes focus until the person
        closes it.
    fix_options:
      - label: "Add scroll padding"
        approach: >-
          Set scroll-padding-top or scroll-padding-bottom on the html element
          to the height of the sticky bar. When focus moves, the browser
          scrolls the control into the space the bar does not cover.
        watch_out: >-
          The value must match the bar's real height. If the bar changes
          height, for example when its text wraps on a narrow screen, update
          the value. The W3C example measures the height with a script.
      - label: "Make the sticky bar smaller or not sticky"
        approach: >-
          Reduce the bar's height, or stop it from staying in place on small
          or zoomed screens.
        watch_out: >-
          Test at 200% and 400% zoom too. A bar that is small at normal size
          can cover much more of a zoomed page.
      - label: "Turn the banner into a modal dialog"
        approach: >-
          Show a cookie notice or similar banner as a pop-up window (modal
          dialog) that takes focus when it opens. People then close it before
          they tab through the page.
        watch_out: >-
          The dialog must move focus inside when it opens and back to the page
          when it closes. A banner that only looks like a dialog still hides
          focus.
    verify_manual: >-
      Press Tab and Shift+Tab through the whole live page, at normal size and
      when zoomed in. Every control must stay at least partly visible when it
      has focus. For WCAG 2.4.12 (Level AAA), no part of it may be hidden.
    verify_automated: >-
      Scan again with Check that keyboard focus is never hidden turned on, and
      see if the control is still found.
    acceptance: >-
      Every control on the affected pages stays at least partly visible when
      it has keyboard focus.
    confidence_default: medium

  "2.4.3":
    title: "Tab order set by hand with a positive tabindex"
    wcag_sc: "2.4.3"
    wcag_name: "Focus Order"
    wcag_level: "A"
    abilities_affected: [motor, vision, cognition]
    what_happening: >-
      The focus check lists elements whose <code>tabindex</code> is above 0,
      for example <code>tabindex="1"</code>. It looks at the first 150
      elements with a tabindex on each page. The browser moves focus to these
      elements first, in number order, before everything else. So the Tab
      order often stops matching the reading order. WCAG 2.4.3 fails only if
      the order no longer makes sense (WCAG failure F44), so a person must
      check the order. The New scan switch Check that keyboard focus is never
      hidden also runs this check.
    why_matters: >-
      Keyboard and screen reader users move through a page in Tab order.
      Sudden jumps can leave them lost or unsure where focus went, especially
      in forms. It also confuses people with reading difficulties, and screen
      magnifier users, who see only a small part of the page.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the live page and press Tab from the top. Note where focus goes
        first, and whether the order follows the reading order.
      - >-
        Remove the positive value. Links, buttons, and form fields need no
        <code>tabindex</code>. Use <code>tabindex="0"</code> on a custom
        control that must take focus.
      - >-
        If an element must come earlier, move it earlier in the page code
        (DOM), and use CSS for its place on screen.
    fix_options:
      - label: "Remove the positive tabindex"
        approach: >-
          Delete values above 0 and let the Tab order follow the order of the
          page code (DOM).
        watch_out: >-
          If CSS shows things in a different order from the page code, the Tab
          order can still look wrong after this change. Fix the order in the
          page code too.
      - label: "Fix it where the value comes from"
        approach: >-
          Find the template, component, or plug-in that adds the tabindex, and
          change it there.
        watch_out: >-
          Fixing one page by hand leaves every other page that uses the same
          template or plug-in unchanged.
    verify_manual: >-
      Press Tab from the top of the live page to the bottom. Focus should move
      in an order that fits the meaning, usually the reading order, with no
      sudden jumps.
    verify_automated: >-
      Scan again with Check that keyboard focus is never hidden turned on, and
      see if the element is still found.
    acceptance: >-
      Every affected page has a Tab order that follows the reading order, with
      no tabindex above 0.
    confidence_default: medium

  "1.4.2":
    title: "Audio may play by itself with no stop control"
    wcag_sc: "1.4.2"
    wcag_name: "Audio Control"
    wcag_level: "A"
    abilities_affected: [vision, hearing, cognition]
    what_happening: >-
      The motion and reading-order check looks at audio set to start by itself
      (<code>&lt;audio autoplay&gt;</code>). It reports the audio when it is
      really playing, is not muted, and lasts more than 3 seconds or has no
      set end. Axcess also found no control: no <code>controls</code>
      attribute, and no element linked with <code>aria-controls</code> whose
      name includes pause, stop, mute, audio, video or playback. A person must
      check, because Axcess does not count a custom control that is not linked
      this way.
    why_matters: >-
      Sound that starts by itself can drown out a screen reader's speech, so
      screen reader users may not hear the page. This is worse for people who
      are hard of hearing. The sound also makes it hard for some people to
      focus on the page. WCAG applies this rule to every part of the page,
      because the sound gets in the way of all of it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Best: remove <code>autoplay</code> and let people start the sound, for
        example <code>&lt;audio controls
        src="intro.mp3"&gt;&lt;/audio&gt;</code>.
      - >-
        If the sound must start by itself, keep it under 3 seconds. Or put a
        clearly named pause or stop button near the start of the page. The
        button must work with a keyboard.
      - >-
        WCAG 1.4.2 also accepts a volume control that works separately from
        the computer's own volume.
    fix_options:
      - label: "Play sound only when people ask"
        approach: >-
          Remove autoplay and show a play button or the browser's own
          controls, so sound starts only when someone chooses it.
        watch_out: >-
          Browsers often block sound that starts by itself anyway, so a page
          that depends on autoplay may be silent for some people. A play
          button works for everyone.
      - label: "Add a stop control near the start of the page"
        approach: >-
          Keep autoplay, and put a clearly named pause or stop button early in
          the page, where people reach it first with the keyboard.
        watch_out: >-
          While the sound plays over a screen reader, a control at the bottom
          of the page is hard to reach. So is one that works only with a
          mouse.
      - label: "Add a separate volume control"
        approach: "Give the page its own volume control for the sound."
        watch_out: >-
          It must be separate from the computer's volume, because screen
          reader speech uses the computer's volume too. Turning the whole
          computer down silences the screen reader as well.
    verify_manual: >-
      Reload the live page with a screen reader on. If sound starts by itself
      and lasts more than 3 seconds, find its control with the keyboard. Check
      that it can pause or stop the sound, or turn it down separately from the
      computer's volume. It should be easy to reach, such as near the start of
      the page. Also check sound from videos and scripts, which this check
      does not cover.
    verify_automated: >-
      Scan again with Check motion and animation turned on, and see if the
      audio is still found.
    acceptance: >-
      Every sound that plays by itself for over 3 seconds has a keyboard
      control to pause it, stop it or set its own volume.
    confidence_default: medium

  "2.2.2":
    title: "Moving content may have no way to pause it"
    wcag_sc: "2.2.2"
    wcag_name: "Pause, Stop, Hide"
    wcag_level: "A"
    abilities_affected: [cognition, vision]
    what_happening: >-
      The motion and reading-order check reports two kinds of moving content.
      The first is a visible video set to start by itself (<code>&lt;video
      autoplay&gt;</code>) that Axcess measured playing. It lasts more than 5
      seconds or has no set end. It also has no <code>controls</code>
      attribute, and no element linked with <code>aria-controls</code> whose
      name includes pause, stop, mute, audio, video or playback. The second is
      any <code>&lt;marquee&gt;</code> (scrolling text). A person must check
      how long it moves and whether it has a control.
    why_matters: >-
      Content that moves for more than 5 seconds pulls attention from the rest
      of the page. People with attention or reading difficulties may not be
      able to use the page, and people who read slowly cannot read moving
      text. Motion can also make people with inner-ear (vestibular) disorders
      feel sick or bring on a migraine.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the moving element from its element locator (CSS selector). The
        occurrence says how long the video is, for example "duration is 162.37
        seconds".
      - >-
        Add a visible pause button near the video that people can reach with
        the Tab key. Link it to the video with <code>aria-controls</code>, for
        example <code>&lt;button type="button"
        aria-controls="hero-video"&gt;Pause background
        video&lt;/button&gt;</code>. The button should stop the video until
        the person starts it again.
      - >-
        Or show the browser's own video controls by adding the
        <code>controls</code> attribute. Or do not start the video by itself:
        remove <code>autoplay</code>.
      - >-
        Replace a <code>&lt;marquee&gt;</code> with text that does not move,
        or give it a pause button.
    fix_options:
      - label: "Add a pause button"
        approach: >-
          Put a real button next to the moving content that pauses it and lets
          people start it again from the same place. The W3C techniques G4 and
          G186 describe this.
        watch_out: >-
          Pausing only while the mouse is over the video, or only while it has
          keyboard focus, is not enough. The pause must not tie up the mouse
          or the keyboard. Without aria-controls, Axcess cannot link the
          button to the video and reports it again.
      - label: "Show the browser's video controls"
        approach: >-
          Add the controls attribute to the video element. Axcess does not
          report a video that has it.
        watch_out: >-
          Axcess only reads the attribute. If your styles hide the control
          bar, Axcess stops reporting the video, but people still cannot pause
          it.
      - label: "Do not play the motion by itself"
        approach: >-
          Remove autoplay, so the video plays only when someone starts it. Or
          make the motion stop within 5 seconds.
        watch_out: >-
          A short clip set to repeat (loop) keeps moving, so it still needs a
          pause control. Axcess reads only the clip's length, so it does not
          report a short clip that loops.
    verify_manual: >-
      Open the page and find the moving content. Using only the keyboard, Tab
      to its pause control and press Enter or Space. The motion should stop
      and stay stopped until you start it again. It is not a problem if
      nothing else is shown with the motion, or if the motion is essential to
      the activity. Axcess does not check animations made with CSS, carousels,
      animated GIFs, or videos started by a script, so look for those too.
    verify_automated: >-
      Scan again with Check motion and animation turned on, and see if the
      video or marquee is still found.
    acceptance: >-
      Every piece of content that moves by itself for over 5 seconds has a
      keyboard control to pause, stop or hide it.
    confidence_default: medium

  "1.3.2":
    title: "Screen order may not match the order read aloud"
    wcag_sc: "1.3.2"
    wcag_name: "Meaningful Sequence"
    wcag_level: "A"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The motion and reading-order check takes a screenshot of the browser
      window, 1440 by 900 pixels, which shows only part of a long page. It
      also lists up to 60 text blocks, such as headings, paragraphs, list
      items and table cells, in page code (DOM) order. That is the order a
      screen reader reads. A local AI model that looks at images (vision
      model) compared the two. It said the order on screen differs in a way
      that may change the meaning. Without the vision model, this comparison
      does not run.
    why_matters: >-
      Screen readers and read-aloud tools read content in page code order, and
      keyboard focus follows it too. When styles move content around, people
      can hear it in an order that changes its meaning. For example, they may
      hear steps out of order, or a form's button before its fields.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the model's reason in the occurrence and find the content it
        names on the page. The occurrence is for the whole page
        (<code>body</code>), not one element.
      - >-
        Compare the order on screen with the page code order. Turn off the
        page styles (CSS), or read the page with a screen reader from the top.
      - >-
        If the meaning changes, move the HTML so it is in the right reading
        order. Then use CSS to lay it out, not to change its order. Watch for
        flex or grid <code>order</code>, floats, and <code>position:
        absolute</code>.
    fix_options:
      - label: "Move the HTML into reading order"
        approach: >-
          Change the page code so its order matches the order people should
          read it in. The layout stays the same. Only the source order
          changes. The W3C technique C27 describes this.
        watch_out: >-
          Keyboard focus also follows page code order, so moving HTML changes
          the Tab order too. Test it with the Tab key afterward, and do not
          use positive tabindex values to patch the order.
      - label: "Change the layout to follow the page code"
        approach: >-
          Remove the CSS that moves content out of its code order, such as
          order values or absolute positioning, so the screen shows the code
          order.
        watch_out: >-
          This changes how the page looks, so agree it with your designer.
          Check narrow screens too, where the layout may reorder content
          again.
    verify_manual: >-
      Read the page from the top with a screen reader, or turn off its styles,
      and compare with what you see. A different order is only a problem when
      it changes the meaning. For example, a menu read before the main content
      is fine. The model sees only part of the page and can be wrong. If the
      order makes sense, set the status to Not a problem (false positive).
    verify_automated: >-
      Scan again with Check motion and animation and Compare image text with
      alt text (vision model) turned on, and see if the page is still found.
    acceptance: >-
      Every affected page keeps its meaning when a screen reader reads it in
      page code order.
    confidence_default: low

  "1.4.4":
    title: "Text is cut off when the page is zoomed"
    wcag_sc: "1.4.4"
    wcag_name: "Resize Text"
    wcag_level: "AA"
    abilities_affected: [vision]
    what_happening: >-
      The zoom and layout check sets the browser window to 640 by 450 pixels.
      That lays out the page like a 1280-pixel-wide window zoomed to 200%. It
      then looks for text in a box set to <code>overflow: hidden</code> that
      is more than 4 pixels too small for it. Part of that text is cut off. It
      skips text cut off on purpose with <code>text-overflow: ellipsis</code>
      ("…"), but a person should still check that text. It reports up to 5
      elements per page, so others can appear after you fix these.
    why_matters: >-
      Many people with low vision zoom pages to 200% to read them. When a box
      has a fixed size and hides what does not fit, the extra text is cut off
      and they cannot read it. Often there is no scroll bar to reach it
      either.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the element from its element locator (CSS selector) and element
        code (HTML). The occurrence says how much is cut off, for example
        "content 96px in a 72px box".
      - >-
        Let the box grow with its text. Remove the fixed <code>height</code>
        or <code>width</code>, or the <code>overflow: hidden</code>. For
        example, change <code>.card-title { height: 48px; overflow: hidden;
        }</code> to <code>.card-title { min-height: 3rem; }</code>.
      - >-
        Size text boxes in <code>em</code> or <code>rem</code> units, so the
        box grows when the text does.
    fix_options:
      - label: "Use min-height instead of height"
        approach: >-
          Replace a fixed height with min-height, so the box keeps its size at
          normal zoom but grows when the text gets bigger.
        watch_out: >-
          A box that grows can push into or cover nearby content. Text that is
          covered fails too, so check the whole area at 200% zoom.
      - label: "Size boxes in em or rem"
        approach: >-
          Set the width and height of text boxes in em or rem, so they grow
          with the text. The W3C technique C28 describes this.
        watch_out: >-
          If the text is sized in rem but its box is sized in pixels, the text
          can still be cut off. Size both the same way.
    verify_manual: >-
      Set the browser window to about 1280 pixels wide and zoom to 200% (press
      Ctrl or Cmd and the plus key). Check that all text is fully visible and
      not covered. Text hidden on purpose for screen readers, such as a skip
      link before you Tab to it, is not a problem. For text cut to a set
      number of lines on purpose, check that people can still reach all of it.
    verify_automated: >-
      Scan again with Check narrow screens and zoom turned on, and see if the
      element is still found.
    acceptance: >-
      Every affected piece of text stays fully visible, not cut off or
      covered, at 200% zoom in a 1280-pixel-wide window.
    confidence_default: medium

  "1.4.12":
    title: "Text is cut off when people add more spacing"
    wcag_sc: "1.4.12"
    wcag_name: "Text Spacing"
    wcag_level: "AA"
    abilities_affected: [vision, cognition]
    what_happening: >-
      The zoom and layout check adds the WCAG text spacing to every element.
      Line height becomes 1.5 times the font size, letter spacing 0.12 times,
      and word spacing 0.16 times. Each paragraph (<code>&lt;p&gt;</code>)
      gets space of 2 times the font size after it. Then the check looks for
      text in a box set to <code>overflow: hidden</code> that does not fit, so
      part of it is cut off. It does not compare with the page before the
      change, so it also reports text that was already cut off. It runs in a
      1440-pixel-wide window. It reports up to 5 elements per page, so others
      can appear after you fix these.
    why_matters: >-
      People with dyslexia, low vision, or other reading difficulties add more
      space between lines, words and letters so they can read. Boxes sized
      exactly for the default spacing then cut off their text.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the element from its element locator (CSS selector) and element
        code (HTML). The occurrence says how much is cut off, for example
        "clipped vertically: content 96px in a 72px box".
      - >-
        Do not set a fixed <code>height</code> on boxes that hold text. Use
        <code>min-height</code> or no height, so the box grows. Remove
        <code>overflow: hidden</code> where it cuts off text.
      - >-
        Leave room in the width too. Letter and word spacing make lines
        longer, so let text wrap instead of setting a fixed width on buttons
        and labels.
    fix_options:
      - label: "Let text boxes grow"
        approach: >-
          Remove fixed heights from text boxes so paragraphs can grow as
          spacing increases. The W3C technique C36 describes this.
        watch_out: >-
          Axcess checks only for text cut off by overflow: hidden. Text that
          spills out and covers other content also fails, so look for overlap
          by eye.
      - label: "Keep a designed cut-off, but show the full text"
        approach: >-
          Where a box cannot grow, cut the text with "…". Then give people a
          way to read all of it, such as a link to the full page.
        watch_out: >-
          WCAG accepts "…" here only when the full content is still available.
          A cut-off with no way to read the rest still fails. Axcess skips
          text cut off with "…", so a person must check this.
    verify_manual: >-
      At 100% zoom, apply the four spacing values with a tool such as the Text
      Adaptation Bookmarklet or the Stylus extension. Check at the screen
      widths your site uses that no text is cut off or overlaps other content.
      Text hidden on purpose for screen readers is fine, and so is text cut
      short on purpose if people can still read all of it.
    verify_automated: >-
      Scan again with Check narrow screens and zoom turned on, and see if the
      element is still found.
    acceptance: >-
      Every affected page shows all its content, with nothing cut off or
      overlapping, when someone applies the four WCAG text spacing values.
    confidence_default: medium

  "1.2.1":
    title: "Audio may have no text transcript"
    wcag_sc: "1.2.1"
    wcag_name: "Audio-only and Video-only (Prerecorded)"
    wcag_level: "A"
    abilities_affected: [hearing, vision, cognition]
    what_happening: >-
      The AI review (a language model on this computer) judged that this
      <code>&lt;audio&gt;</code> player has no transcript nearby, such as a
      "Transcript" link. To find one, it looked at the links and the first 300
      characters of text in the element that holds the player. It cannot hear
      the audio, and when it is unsure it flags the audio anyway. It skips
      <code>&lt;video&gt;</code> and players embedded from other sites. It
      misses a transcript further away on the page, so a person must confirm
      it.
    why_matters: >-
      People who are deaf or hard of hearing cannot get what a recording says
      without a text version. People who are deaf-blind can read the text in
      braille, and people who find speech hard to follow can read it instead.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Play the audio and look for its transcript on the page. If the audio
        only reads out text that is already on the page, and the page clearly
        says so, you do not need a transcript.
      - >-
        Otherwise, write a transcript. Include every word spoken, say who is
        speaking, and note other sounds that matter, such as laughter or
        applause.
      - >-
        Put the transcript on the same page, or link to it right after the
        player. For example: <code>&lt;audio controls
        src="episode-42.mp3"&gt;&lt;/audio&gt; &lt;a
        href="episode-42-transcript.html"&gt;Read the transcript of episode
        42&lt;/a&gt;</code>.
    fix_options:
      - label: "Put the transcript on the same page"
        approach: >-
          Add the full transcript under the player, with a heading such as
          "Transcript".
        watch_out: >-
          A summary or show notes are not a transcript. The text must give the
          same information as the audio, including who says what.
      - label: "Link to a separate transcript page"
        approach: >-
          Publish the transcript as a web page and link to it right next to
          the player.
        watch_out: >-
          Make the link text say it is the transcript. If the link sits
          outside the element that holds the player, the AI review may still
          flag the audio.
      - label: "Label the audio as a spoken version of the text"
        approach: >-
          If the audio only reads out text that is already on the page, say so
          next to the player, for example "Listen to this article".
        watch_out: >-
          This only works if the audio adds nothing to the text. An interview,
          extra comments or other sounds need a transcript.
    verify_manual: >-
      Play the audio, then mark the occurrence "Not a problem (false
      positive)" if a full transcript is easy to find from the player. Do the
      same if the audio only reads out text on the page and a label next to
      the player says so. Otherwise, check that the transcript you add
      includes all speech, names each speaker and notes important sounds.
    verify_automated: >-
      Scan again with AI review of wording turned on, and see if this audio is
      still found.
    acceptance: >-
      Every affected audio recording has a full transcript that is easy to
      find, or a label saying it only reads out text on the page.
    confidence_default: low

  "2.4.6":
    title: "Heading may not describe the section below it"
    wcag_sc: "2.4.6"
    wcag_name: "Headings and Labels"
    wcag_level: "AA"
    abilities_affected: [cognition, vision]
    what_happening: >-
      The AI review (a language model on this computer) reads up to 60
      headings on each page: <code>&lt;h1&gt;</code> to
      <code>&lt;h6&gt;</code> and <code>role="heading"</code>. With each
      heading it reads the text right after it, up to the next heading or
      about 400 characters. It flagged this heading because it judged that the
      heading does not describe that text, as with vague headings such as
      "More" or "Details". It checks headings only, not labels, heading order
      or empty headings. It can be wrong, so a person must confirm it.
    why_matters: >-
      People who read slowly or have limited short-term memory use headings to
      predict what each section holds. Many screen reader users jump from
      heading to heading or open a list of headings, so a vague heading does
      not tell them what follows.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Read the reason and the suggested heading in the occurrence. Then read
        the heading on the live page with the section under it. Could someone
        who reads only the heading guess what the section is about?
      - >-
        If not, rewrite the heading to name the topic. Put the words that set
        it apart first: "Flood preparation" and "Fire preparation", not two
        headings that both say "Preparation".
      - >-
        Treat the suggested heading as a draft only. Check that it is true to
        the section before you use it.
      - >-
        If the heading is a placeholder or has no section under it, remove it
        or add the missing content. Then check that the remaining heading
        levels still go in order.
    fix_options:
      - label: "Rewrite the heading to name the topic"
        approach: >-
          Change the heading text so it says what the section covers, for
          example "Opening hours" instead of "Info".
        watch_out: >-
          A heading does not have to be long. One word is enough when it
          predicts the section, so do not lengthen short, accurate headings
          just to stop the AI review from flagging them.
      - label: "Show record fields as a list of names and values"
        approach: >-
          Some pages use headings for the field names of a record, such as
          "Creator" above a person's name. If the heading only names a field
          and the text below is its value, a list of names and values
          (description list) may fit better. Use a dl element, with each name
          in a dt and each value in a dd.
        watch_out: >-
          This takes the text out of the list of headings that screen reader
          users move through. Keep real section headings as headings.
      - label: "Fix the template that makes the heading"
        approach: >-
          When the same vague heading appears on many pages, change it once in
          the content management system (CMS) template or component.
        watch_out: >-
          A heading that fits one page may not fit another. If the heading
          text comes from a field, check what each page fills in.
    verify_manual: >-
      Read each flagged heading on the live page with the section below it.
      Mark the occurrence "Not a problem (false positive)" if the heading
      predicts the section, even if it is short. Open the list of headings in
      a screen reader (VoiceOver: VO+U, then Headings; NVDA: Insert+F7) and
      check that each heading makes sense on its own.
    verify_automated: >-
      Scan again with AI review of wording turned on, and see if this heading
      is still found.
    acceptance: >-
      Every heading on the affected pages tells a reader what the section
      below it is about.
    confidence_default: low

  "3.3.2":
    title: "Form field may lack a clear label or instructions"
    wcag_sc: "3.3.2"
    wcag_name: "Labels or Instructions"
    wcag_level: "A"
    abilities_affected: [cognition, vision]
    what_happening: >-
      The AI review (a language model on this computer) reads up to 50 form
      fields on each page, such as <code>&lt;input&gt;</code>,
      <code>&lt;select&gt;</code> and <code>&lt;textarea&gt;</code>. For each
      field it sees only its type, label, placeholder, any instructions tied
      to it with <code>aria-describedby</code>, and whether it is required. It
      flagged this field because it judged that a new user could not tell what
      to enter, or in what format. It misses text that is not tied to the
      field, such as a nearby button or a group's <code>&lt;legend&gt;</code>,
      so a person must confirm it.
    why_matters: >-
      Clear labels and instructions help everyone enter the right thing,
      especially people with cognitive, language or learning disabilities.
      Without them, people may send wrong or missing answers, and pale
      placeholder text used as a label is hard for many to see.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Read the reason and the suggested label in the occurrence. Then look
        at the field on the live page as a new user would. Do its visible
        label or instructions say what to enter, and in what format?
      - >-
        If there is no visible label, add one and tie it to the field:
        <code>&lt;label for="email"&gt;Email address&lt;/label&gt; &lt;input
        id="email" type="email"&gt;</code>.
      - >-
        If the field needs a set format, say so next to the field and tie the
        hint to it. For example: <code>&lt;label for="dob"&gt;Date of
        birth&lt;/label&gt; &lt;input id="dob" aria-describedby="dob-hint"&gt;
        &lt;span id="dob-hint"&gt;Use DD/MM/YYYY, for example
        21/07/2013&lt;/span&gt;</code>.
      - >-
        Some fields belong together, such as a phone number split into three
        boxes, or a group of radio buttons. Wrap them in
        <code>&lt;fieldset&gt;</code> with a <code>&lt;legend&gt;</code> that
        names the whole set.
    fix_options:
      - label: "Add a visible label tied to the field"
        approach: >-
          Use a label element whose for value matches the field's id, or wrap
          the field inside the label.
        watch_out: >-
          Placeholder text is not a label. It disappears when people start
          typing, and browsers often show it in a color with too little
          contrast to read.
      - label: "Add instructions for the format or rules"
        approach: >-
          Put the format or rules in the label, such as "Date (dd-mm-yyyy)",
          or in text next to the field, tied to it with aria-describedby.
        watch_out: >-
          Do not put the format only in placeholder text, because it
          disappears when people type. Keep instructions short: too many can
          be as harmful as too few.
      - label: "Label a group of fields together"
        approach: >-
          Wrap related fields in a fieldset with a legend, such as "Phone
          number" around the area code, first three digits and last four
          digits.
        watch_out: >-
          Each field in the set still needs its own name, for example
          title="Area code" on the first phone box. The AI review reads that
          title as the field's label.
    verify_manual: >-
      Look at the field on the live page, and mark the occurrence "Not a
      problem (false positive)" if visible text already says what to enter. A
      search box right next to a "Search" button counts. Then move to the
      field with a screen reader: you should hear its label, then any
      instructions.
    verify_automated: >-
      Scan again with AI review of wording turned on, and see if this field is
      still found.
    acceptance: >-
      Every field on the affected pages has a visible label or instructions
      that tell a new user what to enter, and any format it needs.
    confidence_default: low

# ---------------------------------------------------------------------
# Rule check (Alfa) cards, keyed on the Alfa rule id. The same card serves
# both Alfa outcomes: failed, and "cannot tell", where a person decides.
# Guidance only; see the header.
# ---------------------------------------------------------------------
# Cards for a browser-check rule that needs its own guidance, looked up by
# rule id before the criterion's card (``semantic_criteria``).
probe_rules:

  focus-not-visible:
    title: "Keyboard focus may not be visible on this control"
    wcag_sc: "2.4.7"
    wcag_name: "Focus Visible"
    wcag_level: "AA"
    abilities_affected: [motor, vision, cognition]
    what_happening: >-
      The focus check gives keyboard focus to each control on the page, up to
      400 of them, and compares how it looks before and after. It reports a
      control when nothing that could show focus changes: no outline, shadow,
      border, background, colour or underline, on the control, its parent,
      the elements beside it, or its label. A common cause is
      <code>outline: none</code> with no other focus style. Text fields are
      left out, because the blinking text cursor shows focus. The check
      reports one control for each kind of control (tag and class), since one
      style usually covers them all.
    why_matters: >-
      People who use a keyboard need to see which control has focus before
      they press Enter or Space. Without it they lose their place, and may
      press the wrong thing. This affects many people with physical
      disabilities, people with low vision, and people with attention or
      memory difficulties.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the live page, press Tab until you reach the control, and look
        for any sign of focus.
      - >-
        Find the style that removes it, often <code>outline: none</code> or
        <code>outline: 0</code> on <code>a</code>, <code>button</code> or
        <code>*</code>.
      - >-
        Add a clear focus style instead, for example
        <code>a:focus-visible, button:focus-visible { outline: 3px solid
        #1d70b8; outline-offset: 2px; }</code>.
    fix_options:
      - label: "Bring back a focus outline"
        approach: >-
          Remove the rule that hides the outline, or replace it with a
          :focus-visible style that has a strong colour and enough thickness.
        watch_out: >-
          The outline must stand out against the colours around it. A thin
          grey ring on a grey background is hard to see.
      - label: "Use another visible change"
        approach: >-
          A thick border, a shadow, or a strong change of background colour
          also shows focus.
        watch_out: >-
          A small change of text colour alone is easy to miss, and people who
          cannot see colour differences will not notice it.
    verify_manual: >-
      Press Tab through the page and check that you can always see which
      control has focus, without using the mouse.
    verify_automated: >-
      Scan again with Check that keyboard focus is never hidden turned on, and
      see if the control is still found.
    acceptance: >-
      Every control on the page shows a clearly visible change when it has
      keyboard focus.
    confidence_default: medium

  focus-order-non-interactive-stop:
    title: "The Tab key stops on something that is not a control"
    wcag_sc: "2.4.3"
    wcag_name: "Focus Order"
    wcag_level: "A"
    abilities_affected: [motor, vision]
    what_happening: >-
      The focus check finds plain content, such as a paragraph or a
      <code>div</code>, with <code>tabindex="0"</code>, so the Tab key stops
      on it. It has no role, no name or description, no event handlers, and
      it does not scroll. A scrolling area does need
      <code>tabindex="0"</code>, so the check leaves those out, and it also
      leaves out elements named like controls, such as a class with "button"
      in it.
    why_matters: >-
      Keyboard users stop on it and nothing happens when they press Enter, so
      they wonder what they missed. Screen reader users hear text with no
      purpose. Each extra stop also makes the page slower to move through.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the live page and press Tab until focus reaches the element.
        Check whether it is meant to do anything.
      - >-
        If it is not a control, remove <code>tabindex="0"</code>.
      - >-
        If it should be a control, use a <code>&lt;button&gt;</code> or a
        link, or give it a role and handlers for Enter and Space.
    fix_options:
      - label: "Remove the tab stop"
        approach: >-
          Delete tabindex="0" from content that people only read.
        watch_out: >-
          If a script moves focus to the element, for example after an error
          message, use tabindex="-1" instead, which allows that without adding
          a Tab stop.
    verify_manual: >-
      Press Tab through the page and check that focus stops only on things
      you can use.
    verify_automated: >-
      Scan again with Check that keyboard focus is never hidden turned on, and
      see if the element is still found.
    acceptance: >-
      The Tab key stops only on links, buttons, form fields and other
      controls, and on areas that need focus to scroll.
    confidence_default: medium

  focus-order-visual-mismatch:
    title: "The Tab order may not match the order on screen"
    wcag_sc: "2.4.3"
    wcag_name: "Focus Order"
    wcag_level: "A"
    abilities_affected: [motor, vision, cognition]
    what_happening: >-
      The focus check looks at groups of links or buttons that sit side by
      side on one line. It reports a group when the Tab key reaches them in a
      different order from the one they are shown in. The page code (DOM) has
      them in one order, and the layout moves them, for example with
      <code>float: right</code>, the flex <code>order</code> property or
      <code>row-reverse</code>. WCAG 2.4.3 fails only if the new order
      changes the meaning or makes the page harder to use, so a person must
      decide.
    why_matters: >-
      Keyboard users who can see the screen expect focus to move the way they
      read. When it jumps back and forth they lose their place. Screen reader
      users hear the code order, which may not match what sighted colleagues
      describe.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Open the live page, press Tab through the group, and watch the order.
      - >-
        If the order is confusing, change the order in the page code so it
        matches the layout, and remove the CSS that reorders them.
      - >-
        If the order makes sense as it is, set the status to Not a problem
        (false positive).
    fix_options:
      - label: "Put the page code in reading order"
        approach: >-
          Move the elements in the HTML so their order matches what people
          see, then lay them out without float right, order or row-reverse.
        watch_out: >-
          Check other screen sizes too. A layout can reorder items on narrow
          screens only.
    verify_manual: >-
      Press Tab through the group and check that focus moves in the order the
      items are shown.
    verify_automated: >-
      Scan again with Check that keyboard focus is never hidden turned on, and
      see if the group is still found.
    acceptance: >-
      Focus moves through the group in the order the items appear on screen,
      or a person has confirmed the order still makes sense.
    confidence_default: low

alfa_rules:

  sia-r1:
    abilities_affected: [vision, cognition, motor]
    what_happening: >-
      This rule check (Alfa) looks for a <code>&lt;title&gt;</code> element in
      the page code (DOM). The rule fails when there is no
      <code>&lt;title&gt;</code>, or when the first one is empty or holds only
      spaces, such as <code>&lt;title&gt;&lt;/title&gt;</code>. It does not
      judge whether the title describes the page, so a person must check that.
    why_matters: >-
      A title tells people which page they are on before they read it, and
      names the page in browser tabs and search results. Without one, blind
      people and people with low vision have no way to tell open pages apart.
      People with memory or reading difficulties lose their place.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the template that builds the <code>&lt;head&gt;</code> of the
        affected pages. Check why the title is missing or empty, for example a
        missing value in the content system.
      - >-
        Add a title that names this page first and the site second, such as
        <code>&lt;title&gt;Contact us | Example
        University&lt;/title&gt;</code>.
      - >-
        For a single-page app (one page that swaps its views with scripts),
        update <code>document.title</code> each time the view changes.
    fix_options:
      - label: "Set the title in the page template"
        approach: >-
          Make the template always print a title element, built from the
          page's own heading or name followed by the site name.
        watch_out: >-
          A fallback such as "Untitled", or the site name alone, passes this
          rule check. It does not say what the page is about, so build each
          title from the page's own name.
      - label: "Make title a required field for editors"
        approach: >-
          If editors write titles in a content system, make the field required
          so no page can be published without one.
        watch_out: >-
          Editors may copy titles from other pages. Ask them to put the words
          that name the page first, because browser tabs cut long titles
          short.
    verify_manual: >-
      Open the page and read the text in the browser tab, or listen to what a
      screen reader says when the page loads. The title should say what this
      page is about, and make sense on its own, for example in a list of
      search results.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      page is still found.
    acceptance: >-
      Every page has a title element whose text describes the page's topic or
      purpose.
    confidence_default: high

  sia-r2:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at every element that screen readers treat
      as an image. That means an <code>&lt;img&gt;</code>, or any HTML element
      with <code>role="img"</code>, that is not hidden from screen readers. It
      fails when the image has no name for a screen reader to read (accessible
      name), or the name is only spaces. A common cause is an
      <code>&lt;img&gt;</code> with no <code>alt</code> attribute and no other
      name.
    why_matters: >-
      Blind and low-vision people who use a screen reader get no words that
      say what the image shows. People who read the page on a braille display
      lose the same information.
    owner: editor
    effort: under_15m
    fix_steps:
      - >-
        Decide what each flagged image is for. If it gives information, add
        alt text (the text a screen reader reads for an image) that says the
        same thing in a few words. Example: <code>&lt;img src="chart.png"
        alt="Sales rose 20% in 2025"&gt;</code>
      - >-
        If the image is only decoration, give it an empty alt: <code>&lt;img
        src="swirl.png" alt=""&gt;</code>. Do not also give it
        <code>tabindex</code>, <code>aria-label</code>,
        <code>aria-labelledby</code> or <code>aria-describedby</code>. Any of
        these makes screen readers treat it as an image again.
      - >-
        For an element that is not an <code>&lt;img&gt;</code>, such as
        <code>&lt;div role="img"&gt;</code>, add a name with
        <code>aria-label</code> or <code>aria-labelledby</code>. Example:
        <code>&lt;div role="img" aria-label="Five stars out of
        five"&gt;</code>
      - >-
        Fix the template or the image field in your content system. Editors
        should either write alt text or choose to mark the image as
        decoration. Do not add <code>alt=""</code> to every image by default,
        because that hides images that give information.
    fix_options:
      - label: "Write alt text that gives the same information"
        approach: >-
          Add an alt attribute that tells a screen reader user what the image
          tells a sighted user, in the words the page needs.
        watch_out: >-
          Alt text made of only spaces still counts as empty and still fails.
          Avoid alt text that just repeats the file name.
      - label: "Mark it as decoration"
        approach: >-
          If the image adds nothing that the page text does not already say,
          set alt="" so screen readers skip it.
        watch_out: >-
          Only do this when the image really carries no information. An empty
          alt on an image that is the only content of a link leaves that link
          with no name.
      - label: "Use aria-label or aria-labelledby"
        approach: >-
          For a custom image made from a div or span with role="img", give it
          a name with aria-label, or point aria-labelledby at visible text.
        watch_out: >-
          An aria-labelledby that points to a missing or empty element gives
          no name. The title attribute also gives a name, but support for it
          varies between browsers and screen readers, so do not rely on it
          alone.
    verify_manual: >-
      Turn on a screen reader (VoiceOver: Cmd+F5 on macOS; NVDA on Windows)
      and move through each flagged image. An image that gives information
      should read out a useful name. A decorative image should be skipped.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      images are still found.
    acceptance: >-
      Every image that screen readers can reach has a name that is not empty,
      and every decorative image is hidden from screen readers.
    confidence_default: high

  sia-r4:
    abilities_affected: [vision, cognition, hearing]
    what_happening: >-
      This rule check (Alfa) fails when the page's <code>&lt;html&gt;</code>
      element has no <code>lang</code> attribute, or its value is empty or
      only spaces. It only checks that a value is there; rule sia-r5 checks
      that the value is a real language code. An <code>xml:lang</code>
      attribute alone does not count. The rule does not check pages shown
      inside a frame.
    why_matters: >-
      Screen readers, text-to-speech tools and braille software use the page
      language to pick the right pronunciation and characters. Without it,
      blind people and people who listen to text because reading is hard may
      hear words read wrongly.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find where the page template writes the <code>&lt;html&gt;</code> tag.
      - >-
        Add the code for the page's main language (a BCP 47 language tag):
        <code>&lt;html lang="en"&gt;</code>, <code>&lt;html
        lang="es"&gt;</code> or <code>&lt;html lang="fr-CA"&gt;</code>.
      - >-
        If the page mixes languages, use the one used most. If they are used
        equally, use the first one. Mark passages in other languages on their
        own element: <code>&lt;p lang="es"&gt;</code>.
      - >-
        For a translated site, set the value from each page's language
        setting, so every translation gets its own code.
    fix_options:
      - label: "Write the code into the page template"
        approach: >-
          Add a fixed lang value to the html tag in the main template or
          layout.
        watch_out: >-
          On a site with translations, a fixed value labels every translation
          with the same, wrong language.
      - label: "Set the code from the site's language setting"
        approach: >-
          Where a content system already knows each page's language, write
          that value into the html tag.
        watch_out: >-
          Some systems store values like en_US; change them to en-US. An empty
          setting writes lang="" and the page still fails.
    verify_manual: >-
      In the browser developer tools, check that the html element has a lang
      value that matches the main language of the text. Then listen to a
      paragraph with a screen reader and check that the voice and
      pronunciation are right.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      page is still found.
    acceptance: >-
      Every page's <html> element has a lang attribute naming the page's main
      language.
    confidence_default: high

  sia-r5:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) reads the <code>lang</code> attribute on the
      page's <code>&lt;html&gt;</code> element. It fails when the code's first
      part, before any hyphen, is not in the official list of language codes
      (the IANA Language Subtag Registry). For example,
      <code>lang="em-US"</code> (a typo), <code>lang="eng"</code> (a
      three-letter code) and <code>lang="en_US"</code> (an underscore, not a
      hyphen) all fail. It checks only the main page, not pages inside frames,
      and skips a <code>lang</code> that is empty or only spaces.
    why_matters: >-
      Screen readers and read-aloud tools use this code to choose the voice.
      With a wrong code, blind people and people with reading or learning
      disabilities who listen to text may hear the page mispronounced.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find where the page template writes the <code>&lt;html&gt;</code> tag,
        or where the site's language setting comes from.
      - >-
        Set the code of the language the page uses most (a BCP 47 language
        tag), for example <code>&lt;html lang="en"&gt;</code> or
        <code>&lt;html lang="fr-CA"&gt;</code>. Use a hyphen, not an
        underscore.
      - >-
        Use the two-letter code where one exists: <code>en</code>, not
        <code>eng</code>; <code>de</code>, not <code>ger</code>. Look codes up
        in the IANA Language Subtag Registry.
    fix_options:
      - label: "Correct the code in the page template"
        approach: >-
          Write the right code into the html tag in the page template, so
          every page built from it gets the same correct code.
        watch_out: >-
          The rule checks only the first part of the code, so lang="en-XY", or
          lang="fr" on an English page, still passes. Check that the whole
          code is right and matches the page's real language.
      - label: "Map the site's locale setting to a language code"
        approach: >-
          If the content system or a translation plugin knows each page's
          language, convert that setting to a standard code for the html tag.
        watch_out: >-
          Some systems store a language as en_US or as a name such as english.
          Convert each one, for example en_US to en-US, and test every
          language the site offers, not only the default one.
    verify_manual: >-
      In the browser's developer tools, check that the lang value on the
      <html> element is a valid code for the page's main language. Then read
      part of the page with a screen reader and listen for the right voice and
      pronunciation.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the page
      is still found.
    acceptance: >-
      Every affected page has a lang value on its <html> element that is a
      valid language code for the page's main language.
    confidence_default: high

  sia-r7:
    abilities_affected: [vision, cognition]
    what_happening: >-
      An element inside the <code>&lt;body&gt;</code> has a <code>lang</code>
      value that is not a known language code, such as <code>&lt;span
      lang="dutch"&gt;</code> or <code>lang="eng"</code>. The rule check
      (Alfa) checks only the code's first part, before any hyphen, and only
      elements that pass their language to some text inside them. Text counts
      if it shows on screen or screen readers get it, such as an image's alt
      text; text hidden with <code>display: none</code> does not.
    why_matters: >-
      Screen readers cannot switch to the right voice for this passage, so
      blind people and people who listen to text may hear it mispronounced.
      Screen readers also handle a wrong code in different ways: some use the
      page language, others the nearest parent element with a valid code.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find each element from its element locator (XPath), read its element
        code (HTML), and decide what language its text is really in.
      - >-
        Replace the value with the standard code for that language (a BCP 47
        language tag), for example <code>&lt;span lang="nl"&gt;dank
        je&lt;/span&gt;</code>, not <code>lang="dutch"</code>. Use the
        two-letter code where one exists, and a hyphen before any region, such
        as <code>fr-CH</code>.
      - >-
        If the value comes from a shared component, translation plugin or
        content system field, fix it there so every page gets the right code.
    fix_options:
      - label: "Correct the code on the element"
        approach: >-
          Change the lang value to the standard code for the language the text
          is really in.
        watch_out: >-
          Check the real language of the text, not only the code format. A
          valid but wrong code, such as lang="fr" on German text, passes this
          rule and still makes a screen reader read the text wrongly.
      - label: "Fix the language list in the editor or component"
        approach: >-
          Where editors pick a language from a list, make the list save
          standard codes, such as nl, de or zh-Hans. Do not save language
          names such as dutch, or system codes such as nl_NL.
        watch_out: >-
          Content saved earlier keeps the old values. Search saved content for
          the wrong values and update it too, or the next scan will list them
          again.
      - label: "Remove lang where the text is in the surrounding language"
        approach: >-
          If the text is in the same language as the element around it, remove
          its lang so the text takes that language.
        watch_out: >-
          Only remove it when that is true. Proper names, technical terms such
          as "Homo sapiens", and words now part of English, such as
          "rendezvous", need no lang of their own.
    verify_manual: >-
      Read the element code (HTML) and check that each lang value is a valid
      code that matches the language of the text inside it. Then read the
      passage with a screen reader set to switch languages on its own, and
      listen for the voice to change.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the
      element is still found.
    acceptance: >-
      Every element with a lang value inside the body of the affected pages
      uses a valid language code that matches the language of its text.
    confidence_default: high

  sia-r8:
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (Alfa) looks at form fields such as text boxes, check
      boxes, radio buttons, switches, sliders and drop-down lists. It includes
      disabled fields and custom fields built with a <code>role</code>, such
      as <code>role="textbox"</code>. It fails when the field's accessible
      name (the name a screen reader reads) is empty. For example, in
      <code>&lt;div&gt;Last name&lt;/div&gt;&lt;input&gt;</code> the text sits
      next to the field but is not tied to it.
    why_matters: >-
      A screen reader announces only the type of field, such as "edit text" or
      "check box". So blind people do not know what the field is for. People
      who control the computer by voice (speech recognition) cannot say its
      name to move to it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each field from its element locator (XPath) and decide what it
        asks for. If it has visible label text, use those words.
      - >-
        For a standard HTML field (<code>&lt;input&gt;</code>,
        <code>&lt;select&gt;</code> or <code>&lt;textarea&gt;</code>), tie a
        visible label to it: <code>&lt;label for="last-name"&gt;Last
        name&lt;/label&gt; &lt;input id="last-name"&gt;</code>. You can also
        wrap the field inside the <code>&lt;label&gt;</code>.
      - >-
        For a custom field such as <code>&lt;div role="textbox"&gt;</code>,
        add <code>aria-labelledby</code> that points to the visible label's
        <code>id</code>, or add <code>aria-label</code>. A
        <code>&lt;label&gt;</code> does not name a custom field, and the text
        inside a custom text box is its value, not its name.
    fix_options:
      - label: "Tie a visible label to the field"
        approach: >-
          Use a label element tied to the field with for and id, or wrap the
          field in the label. Clicking the label then also works like clicking
          the field.
        watch_out: >-
          This works only for standard fields such as input, select and
          textarea. On a div with role="textbox", the for attribute does
          nothing and the field still has no name.
      - label: "Point to text on the page with aria-labelledby"
        approach: >-
          If the label text is on screen but not in a label element, give it
          an id and point the field's aria-labelledby at that id.
        watch_out: >-
          The id must match exactly, and the element it points to must hold
          text. If that element is empty or the id has a typo, the field still
          has no name.
      - label: "Add aria-label when there is no visible label"
        approach: >-
          For a field with no visible label, such as a search box with only a
          magnifying glass icon, add aria-label="Search site".
        watch_out: >-
          People cannot see aria-label, so it does not help sighted people who
          need a label. A placeholder alone also gives a name, but it
          disappears when someone types, so prefer a label that stays on
          screen.
    verify_manual: >-
      With a screen reader, move to each field and check that you hear a name
      that says what the field is for. A disabled field cannot take Tab focus,
      so reach it with the screen reader's reading keys. To check without a
      screen reader, look at the field's name in the browser's developer tools
      (Accessibility pane).
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the
      field is still found.
    acceptance: >-
      Every form field on the affected pages has a name that a screen reader
      reads and that says what the field is for.
    confidence_default: high

  sia-r9:
    abilities_affected: [vision, motor, cognition, hearing]
    what_happening: >-
      This rule check (Alfa) reads the first <code>&lt;meta
      http-equiv="refresh"&gt;</code> element with a valid delay in the page
      code (DOM). The number at the start of its <code>content</code>
      attribute is the delay in seconds. After that delay the browser reloads
      the page, or sends you to another address (a redirect). The rule fails
      when the delay is more than 0 seconds and no more than 72,000 seconds
      (20 hours), for example <code>&lt;meta http-equiv="refresh"
      content="30"&gt;</code>.
    why_matters: >-
      The page changes on a timer that people cannot stop or extend, so they
      can lose their place before they finish. Screen reader users, people
      with low vision, motor or cognitive disabilities, and some Deaf sign
      language users need more time to read and act.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the <code>&lt;meta http-equiv="refresh"&gt;</code> element in the
        page template, and decide whether it reloads the same page or sends
        people to a different address.
      - >-
        If it sends people to another address, redirect on the web server
        instead, for example with an HTTP 301 redirect. If you can only change
        the page, use a delay of 0: <code>&lt;meta http-equiv="refresh"
        content="0; URL=https://example.com/new"&gt;</code>. Add a normal link
        to the new address on the page as a backup.
      - >-
        If it reloads the page to show new information, remove the meta
        element. Let people choose when to get new content, for example with a
        "Refresh results" button.
      - >-
        If the timer must stay, add a control that turns it off or makes it at
        least 10 times longer. People must be able to use it before the timer
        runs out. Or warn people before it runs out, and give them at least 20
        seconds to extend it with one simple action.
    fix_options:
      - label: "Redirect at once, on the server"
        approach: >-
          Replace a delayed redirect with a server redirect, or a meta refresh
          with a delay of 0. People then never see a page vanish while they
          read it.
        watch_out: >-
          A server redirect that still waits for a timer has the same problem.
          A timer moved into a script has it too, and this rule check cannot
          see scripts, so a new scan will not show it.
      - label: "Let people refresh when they choose"
        approach: >-
          Remove the automatic reload and add a clear control, such as a
          "Refresh results" button. People then get new content only when they
          ask.
        watch_out: >-
          Do not replace it with a 0-second refresh of the same page. W3C
          warns that an instant refresh can make the screen flash quickly.
      - label: "Let people turn off or extend the timer"
        approach: >-
          Keep the timed update, but add a control that turns it off or makes
          the delay at least 10 times longer. People must be able to use it
          before the first change.
        watch_out: >-
          A meta refresh gives people no way to stop it, so this needs a
          script. The control must work with a keyboard and be easy to find
          before the timer ends.
    verify_manual: >-
      Open the page and wait past the delay without touching it: it should not
      reload or move away, except at once as it loads. The rule assumes people
      cannot turn off or extend the timer, and that it is not essential. If
      either is untrue, record why it is not a problem.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      meta element is still found.
    acceptance: >-
      Every automatic reload or redirect happens at once, waits more than 20
      hours, or has a control that turns it off or extends it.
    confidence_default: high

  sia-r10:
    abilities_affected: [cognition, motor]
    what_happening: >-
      The rule check (Alfa) looks at the <code>autocomplete</code> attribute
      on form fields (<code>&lt;input&gt;</code>, <code>&lt;select&gt;</code>
      and <code>&lt;textarea&gt;</code>) that people can use. It skips the
      values <code>on</code> and <code>off</code>, hidden fields, disabled
      fields, and buttons. It fails when the value breaks the HTML standard.
      One cause is an unknown word, such as
      <code>autocomplete="badterm"</code>. Another is words in the wrong
      order, such as <code>autocomplete="work shipping email"</code>. A third
      is words that do not go together, such as <code>autocomplete="work
      photo"</code>. The word <code>work</code> only goes with contact details
      such as <code>email</code> or <code>tel</code>.
    why_matters: >-
      Browsers and helper tools use a valid autocomplete value to fill in a
      person's saved details and to show icons for each field. With an unknown
      value they do nothing, so people with memory, language or movement
      disabilities must remember and type everything themselves.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide what the field asks for. Find the matching word in the WCAG
        list of input purposes, such as <code>email</code>, <code>tel</code>,
        <code>given-name</code> or <code>postal-code</code>.
      - >-
        Replace the value with that word. For example: <code>&lt;input
        type="email" id="email" autocomplete="email"&gt;</code>.
      - >-
        If you add extra words, separate them with spaces (not commas). Put
        them in this order: an optional <code>section-</code> name, then
        <code>shipping</code> or <code>billing</code>. Next,
        <code>home</code>, <code>work</code>, <code>mobile</code>,
        <code>fax</code> or <code>pager</code>, only with <code>email</code>,
        <code>impp</code> or a <code>tel</code> field. Then the field name,
        and last an optional <code>webauthn</code>. For example:
        <code>autocomplete="shipping work email"</code>.
      - >-
        If the field does not ask for information about the user (for example
        a site search box), remove the <code>autocomplete</code> attribute.
    fix_options:
      - label: "Use the standard purpose word"
        approach: >-
          Set autocomplete to the word from the WCAG input purposes list that
          matches what the field asks for.
        watch_out: >-
          This rule only checks that the value is valid, not that it is right.
          A valid but wrong word, such as email on a phone field, passes the
          rule but fills in the wrong details.
      - label: "Remove the attribute from fields that are not about the user"
        approach: >-
          Delete autocomplete from fields such as search boxes, coupon codes
          or comments, where no personal detail is asked.
        watch_out: >-
          Do not remove it from fields that ask for the user's own details,
          such as name, email or address. Those need a valid purpose word.
      - label: "Use off if you meant to turn off autofill"
        approach: >-
          If a made-up value was there only to stop the browser filling the
          field, write autocomplete="off" instead.
        watch_out: >-
          The rule check skips off, but off tells browsers and helper tools
          nothing about what the field asks for. On a field for the user's own
          details, use the purpose word instead.
    verify_manual: >-
      In a browser with saved autofill details (such as Chrome or Safari),
      click into each field. The browser should offer the right saved detail
      for it. The rule check looks only at whether the value is valid. So also
      decide whether the field asks for information about the user, and
      whether the value matches what it asks.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      field is still found.
    acceptance: >-
      Every form field with an autocomplete attribute has a valid value that
      matches what the field asks for.
    confidence_default: high

  sia-r11:
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      This rule check (Alfa) looks at every link that is not hidden from
      screen readers, such as <code>&lt;a href&gt;</code> or an element with
      <code>role="link"</code>. It fails when the link has no accessible name
      (the name a screen reader reads). For example, the link holds only an
      image with <code>alt=""</code>, only an icon, or nothing at all. The
      rule checks only that a name exists, not that it is clear, and Alfa also
      maps it to WCAG 2.4.9 and 4.1.2.
    why_matters: >-
      A screen reader may announce the link as just "link", or read out its
      web address, so blind people do not know where it goes. People who use
      speech input have no name to say to click it.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Use the element locator (XPath) of each occurrence to find the link
        and the template that makes it. "Where on the page" may also show the
        link's address (href).
      - >-
        If the link holds an image, give the image alt text that says where
        the link goes: <code>&lt;a href="/items/29"&gt;&lt;img
        src="report-cover.jpg" alt="Annual report 2025"&gt;&lt;/a&gt;</code>.
      - >-
        If the link holds only an icon, add text that is hidden on screen but
        read by screen readers. Or add an <code>aria-label</code>: <code>&lt;a
        href="/search" aria-label="Search"&gt;&lt;svg
        aria-hidden="true"&gt;…&lt;/svg&gt;&lt;/a&gt;</code>.
      - >-
        If the link is empty and repeats another link next to it, remove it,
        or join the two into one link.
    fix_options:
      - label: "Add visible link text"
        approach: >-
          Put words inside the link that say where it goes, next to or instead
          of the image or icon. Everyone can see and hear the same name.
        watch_out: >-
          Visible text changes the layout, so check the design with the
          designer, and at narrow widths and 200% zoom.
      - label: "Give the image or icon a text alternative"
        approach: >-
          Keep the design and give the image alt text, or the icon an
          aria-label or hidden text, that names the link's destination.
        watch_out: >-
          Describe where the link goes, not what the picture looks like. If
          the image or icon shows words, the name must contain them, best at
          the start, so speech input users can say them (WCAG 2.5.3).
      - label: "Remove empty duplicate links"
        approach: >-
          Where an empty link sits next to a text link to the same place, make
          them one link. For example, join an item's image and its title.
        watch_out: >-
          Check that the link you remove is not the only way to reach that
          place with a keyboard.
    verify_manual: >-
      Press Tab to each affected link with a screen reader on (VoiceOver:
      Cmd+F5 on macOS; NVDA on Windows). It should read a name that says where
      the link goes, not just "link" or a web address. You can also open the
      screen reader's list of links and check that no entry is blank.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      link is still found.
    acceptance: >-
      Every link that a screen reader can reach has a name that says where the
      link goes.
    confidence_default: high

  sia-r12:
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (Alfa) looks at <code>&lt;button&gt;</code>,
      <code>&lt;input&gt;</code> with <code>type="button"</code>,
      <code>"submit"</code> or <code>"reset"</code>, and any element with
      <code>role="button"</code>. It fails when the button's accessible name
      (the name a screen reader reads) is empty. Common causes are an empty
      <code>&lt;button&gt;&lt;/button&gt;</code> and an icon-only button whose
      icon has no text for screen readers. It does not check image buttons
      (<code>&lt;input type="image"&gt;</code>); a separate rule does.
    why_matters: >-
      A screen reader announces only "button", so blind people do not know
      what it does. People who control the computer by voice (speech
      recognition) cannot say the button's name to press it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each button from its element locator (XPath) and decide what it
        does, for example "Open menu" or "Close".
      - >-
        Give it visible text where you can:
        <code>&lt;button&gt;Close&lt;/button&gt;</code>.
      - >-
        For an icon-only button, add a name: <code>&lt;button aria-label="Open
        menu"&gt;&lt;svg
        aria-hidden="true"&gt;…&lt;/svg&gt;&lt;/button&gt;</code>. Or give an
        <code>&lt;img&gt;</code> inside the button alt text that names the
        action.
      - >-
        On a <code>&lt;button&gt;</code>, the <code>value</code> attribute
        does not give a name. Use text, <code>aria-label</code> or
        <code>aria-labelledby</code> instead.
    fix_options:
      - label: "Add visible text"
        approach: >-
          Put a short word or phrase inside the button that says what it does.
          Everyone sees it, and screen reader and voice users get the same
          name.
        watch_out: >-
          If you hide the text on screen, hide it in a way screen readers
          still read. Hiding it with display: none or visibility: hidden also
          hides it from screen readers.
      - label: "Name an icon-only button with aria-label"
        approach: >-
          Keep the icon and add aria-label with the action, such as
          aria-label="Search". Mark the icon itself aria-hidden="true".
        watch_out: >-
          Name the action, not the picture: "Search", not "Magnifying glass".
          If the button changes what it does, such as open and close, update
          the name or its state too.
      - label: "Fix the shared icon-button component"
        approach: >-
          If many buttons come from one component, make its name a required
          input so no one can build a button without one.
        watch_out: >-
          Check every page that uses the component. A default name such as
          "Button" gives every button the same useless name.
    verify_manual: >-
      With a screen reader, move to each button and check that you hear a name
      that says what it does. Reach disabled buttons with the screen reader's
      reading keys, because they cannot take Tab focus. To check without a
      screen reader, look at the button's name in the browser's developer
      tools (Accessibility pane).
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the
      button is still found.
    acceptance: >-
      Every button on the affected pages has a name that a screen reader reads
      and that says what the button does.
    confidence_default: high

  sia-r13:
    abilities_affected: [vision]
    what_happening: >-
      An embedded frame (<code>&lt;iframe&gt;</code>) shows another web page
      inside this one, such as a video, map or social media post. The rule
      check (Alfa) fails a frame whose accessible name (the name a screen
      reader reads) is empty. Examples are <code>&lt;iframe src="…"&gt;</code>
      with no title, and <code>title=""</code>. It skips frames hidden from
      screen readers, frames marked as decorative (<code>role="none"</code> or
      <code>role="presentation"</code>), and frames out of the Tab order (a
      negative <code>tabindex</code>).
    why_matters: >-
      When a screen reader reaches a frame with no name, blind people do not
      know what it holds or whether to go into it. Screen reader users also
      use frame names to move between frames.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each frame from its element locator (XPath) and see what it
        shows.
      - >-
        Add a <code>title</code> that says what the frame holds:
        <code>&lt;iframe title="Map of the campus parking lots"
        src="…"&gt;</code>. Some screen readers read only <code>title</code>
        on a frame and ignore <code>aria-label</code>, so use
        <code>title</code>.
      - >-
        The <code>name</code> attribute does not name a frame for screen
        readers. Keep it if scripts need it, but add <code>title</code> too.
      - >-
        If another service's script builds the frame, such as a video or
        social media embed, first look for a title setting in its embed
        options.
    fix_options:
      - label: "Add a title that says what the frame holds"
        approach: >-
          Set title on the iframe to say what is inside, such as "Video: How
          to apply" or "Instagram post from the library".
        watch_out: >-
          Some browser and screen reader pairs ignore aria-label on a frame
          and read only title, so do not use aria-label alone. Give different
          frames different titles.
      - label: "Name frames that embed scripts build"
        approach: >-
          When another service's script builds the iframe, use its title
          setting, or add the title with your own script after the frame
          appears.
        watch_out: >-
          Your title can be lost when the service changes its script or the
          embed reloads. Scan again after each change to the embed.
      - label: "Hide a frame that holds nothing for people"
        approach: >-
          For a frame with nothing to read or use, such as an empty tracking
          frame, add aria-hidden="true" and tabindex="-1". This hides it from
          screen readers and takes it out of the Tab order.
        watch_out: >-
          Only do this when the frame has no content people need. If it holds
          anything a person can read, focus or use, hiding it takes that away
          from keyboard and screen reader users.
    verify_manual: >-
      With a screen reader, move into each frame and check that you hear a
      name that says what it holds. To check without a screen reader, look at
      the frame's name in the browser's developer tools (Accessibility pane).
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the
      frame is still found.
    acceptance: >-
      Every frame (iframe) on the affected pages that screen readers can reach
      has a title that says what it holds.
    confidence_default: high

  sia-r14:
    abilities_affected: [motor, cognition]
    what_happening: >-
      This rule check (Alfa) tests controls that show text and also have
      <code>aria-label</code> or <code>aria-labelledby</code>, such as
      buttons, links, checkboxes, menu items and tabs. It fails when the
      accessible name (the name a screen reader reads) does not contain the
      visible text. It ignores punctuation, symbols, capital letters and extra
      spaces, but the visible words must appear in the name as one unbroken
      piece. For example, a link shows "Read more", but its name is "Read full
      story".
    why_matters: >-
      Voice control users say the words they see, such as "click Read more",
      and the command fails if the name lacks them. Screen reader users who
      can see the screen are confused when they hear a different name from the
      one they read.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        In the page code (DOM), find the visible text and the
        <code>aria-label</code> value, or the text of the element that
        <code>aria-labelledby</code> points to.
      - >-
        Make the name start with the exact visible words, then add any extra
        detail: <code>&lt;a href="/story" aria-label="Read more about who
        wrote this"&gt;Read more&lt;/a&gt;</code>.
      - >-
        If the visible text already says enough, remove
        <code>aria-label</code> or <code>aria-labelledby</code>, so the name
        comes from the visible text.
      - >-
        Fix the shared component or template that sets the label, so every
        copy of the control is corrected.
    fix_options:
      - label: "Remove the aria-label"
        approach: >-
          Delete aria-label or aria-labelledby and let the visible text be the
          name.
        watch_out: >-
          If the visible text is vague, such as "Read more", the link may no
          longer say where it goes. Add clearer visible text or hidden text
          instead.
      - label: "Put the visible words first in the aria-label"
        approach: >-
          Keep the aria-label but start it with the visible text, word for
          word, and add the extra detail after it.
        watch_out: >-
          The two texts drift apart when someone edits or translates the
          visible text and forgets the aria-label. Build both from the same
          value in the template.
      - label: "Use hidden text instead of an aria-label"
        approach: >-
          Remove the aria-label and add the extra words inside the control in
          a hidden text class that screen readers still read.
        watch_out: >-
          Use a visually hidden class, not display: none or the hidden
          attribute. Those hide the words from screen readers too.
    verify_manual: >-
      In the browser developer tools (Accessibility panel), check that the
      control's name contains its visible words in the same order, best at the
      start. If you can, use voice control (Voice Control on Mac, Voice Access
      on Windows) and say "click" and the visible text. A letter used as an
      icon, such as X on a close button, is not a label in WCAG, so it is not
      a problem.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      control is still found.
    acceptance: >-
      Every control that shows text on screen has an accessible name that
      contains that text, in the same order.
    confidence_default: high

  sia-r15:
    abilities_affected: [vision]
    what_happening: >-
      Two or more embedded frames (<code>&lt;iframe&gt;</code>) on this page
      have the same accessible name (the name a screen reader reads). The rule
      check (Alfa) passes them by itself only when they load the same web
      address. Otherwise it cannot tell whether they hold the same content, or
      content with the same purpose, so a person must decide. A common case is
      two video embeds that keep the default <code>title="YouTube video
      player"</code> but play different videos.
    why_matters: >-
      Screen reader users often move between frames by name. If different
      frames share one name, blind people cannot tell them apart or know which
      one holds what they want.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the frames from their element locators (XPath) and compare what
        each one shows.
      - >-
        If they show different things, give each frame a <code>title</code>
        that names its own content. For example: <code>&lt;iframe
        title="Video: Campus tour" …&gt;</code> and <code>&lt;iframe
        title="Video: How to apply" …&gt;</code>.
      - >-
        If they hold the same thing, or things with the same purpose, such as
        two advertisements, keep the shared name. Mark the occurrence "Not a
        problem (false positive)".
    fix_options:
      - label: "Give each frame a title about its content"
        approach: >-
          Replace the shared name with one that says what each frame holds,
          such as the video or map title.
        watch_out: >-
          Embed code copied from a video site often carries the same default
          title for every video. Change the title each time you paste new
          embed code, or set it in the component that builds the embed.
      - label: "Keep the shared name when the content really is the same"
        approach: >-
          If the frames load the same page, or pages that serve the same
          purpose, the shared name is correct. Record that decision on the
          occurrence.
        watch_out: >-
          "Same purpose" means a person who opens either frame gets what they
          expected from the name. Two different videos with one name do not
          meet this, even if they come from the same channel.
    verify_manual: >-
      Open each frame that shares the name and ask: would a person who picks
      either frame by that name get what they expect? If yes, such as two
      advertisements, it is not a problem; if no, give each frame its own
      title. The next scan lists frames that keep a shared name again, because
      the rule cannot tell whether they match.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      frames are still found.
    acceptance: >-
      Every set of frames on a page that share a name holds the same content,
      or content with the same purpose.
    confidence_default: low

  sia-r16:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at elements whose <code>role</code>
      attribute changes what they are, such as <code>&lt;div
      role="checkbox"&gt;</code>. Each role needs certain attributes that give
      its state, such as <code>aria-checked</code> for a checkbox or
      <code>aria-level</code> for a heading. This element is missing at least
      one of them, or has one set to an empty value. Alfa links this rule to
      WCAG 1.3.1 and to WCAG 4.1.2 Name, Role, Value.
    why_matters: >-
      A screen reader can say what the element is, but it may not be able to
      say its state. For example, it may not say whether a checkbox is
      checked, or what level a heading is. When a needed attribute is missing,
      browsers and screen readers may each guess a different value.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the role on the flagged element and the attribute it is missing.
        Common ones: <code>checkbox</code>, <code>radio</code>,
        <code>switch</code> and <code>menuitemcheckbox</code> need
        <code>aria-checked</code>. <code>heading</code> needs
        <code>aria-level</code>. <code>slider</code>, <code>meter</code> and a
        <code>separator</code> you can focus need <code>aria-valuenow</code>.
        <code>scrollbar</code> needs <code>aria-controls</code> and
        <code>aria-valuenow</code>. <code>combobox</code> needs
        <code>aria-expanded</code>, and <code>aria-controls</code> while it is
        open.
      - >-
        Add the missing attribute with a real value. Example: <code>&lt;div
        role="checkbox" aria-checked="false" tabindex="0"&gt;Send me
        updates&lt;/div&gt;</code>
      - >-
        Update the value with script every time the state changes, for example
        set <code>aria-checked="true"</code> when the box is checked.
      - >-
        Where a native HTML element does the same job, use it instead and
        remove the role, for example <code>&lt;input
        type="checkbox"&gt;</code> or <code>&lt;h2&gt;</code>. Native elements
        report their state by themselves.
    fix_options:
      - label: "Add the missing state or property"
        approach: >-
          Keep the custom element and add the attribute the role needs, with a
          value that matches what the page shows.
        watch_out: >-
          Script must keep the value up to date. A value that never changes is
          wrong most of the time, for example a checkbox that always says "not
          checked".
      - label: "Use the native HTML element"
        approach: >-
          Replace the custom element with the HTML element that has this role
          built in, such as an input, a heading, or a range input.
        watch_out: >-
          Remove the old role attribute too. Check that your styles and
          keyboard handling still work on the new element.
      - label: "Remove a role that does not fit"
        approach: >-
          If the element is not really that kind of control, remove the role
          attribute.
        watch_out: >-
          Only do this if the element does not look or act like that control.
          If it does, people lose the meaning they need.
    verify_manual: >-
      Inspect the element in the browser's accessibility panel and check that
      it shows the role with its state, such as "checked: false". Then use the
      control with the keyboard while a screen reader runs. Check that the
      screen reader announces the new state each time it changes.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every element with a changed role has all the states and properties that
      role needs, with values that match what the page shows.
    confidence_default: high

  sia-r17:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at every element with
      <code>aria-hidden="true"</code>. That attribute hides the element and
      everything inside it from screen readers. The rule fails when the
      element itself, or anything inside it, can still be reached with the Tab
      key. Examples are a link, button, form field or
      <code>&lt;summary&gt;</code> inside the hidden element, or a hidden
      element that has <code>tabindex="0"</code> itself.
    why_matters: >-
      A screen reader user can press Tab and land on something the screen
      reader was told to ignore. The screen reader may then say nothing
      useful, so the user does not know what has focus or what it does.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find each item inside the hidden element that the Tab key reaches:
        links with <code>href</code>, buttons, form fields,
        <code>&lt;summary&gt;</code>, and anything with
        <code>tabindex="0"</code> or higher.
      - >-
        Decide whether the content should be hidden at all. If people need it,
        remove <code>aria-hidden="true"</code>. Setting
        <code>aria-hidden="false"</code> on an inner element does not undo it.
      - >-
        If the content should stay hidden, take it out of the Tab order too.
        For a whole block, add <code>inert</code>, which blocks focus and
        clicks: <code>&lt;div aria-hidden="true" inert&gt;</code>. For one
        control, use <code>tabindex="-1"</code> or <code>disabled</code>. Do
        not use <code>aria-disabled="true"</code>: it does not stop focus, so
        the rule still fails.
      - >-
        If the content is hidden from everyone (for example a closed menu),
        hide it with <code>display: none</code>, <code>visibility:
        hidden</code> or the <code>hidden</code> attribute. This also removes
        it from the Tab order.
    fix_options:
      - label: "Hide it from everyone"
        approach: >-
          When content is not shown on screen, hide it with display: none,
          visibility: hidden or the hidden attribute. Screen readers and the
          Tab key then both skip it.
        watch_out: >-
          Moving content off screen (for example top: -999em) does not remove
          it from the Tab order. The rule still fails, and keyboard users tab
          onto something they cannot see.
      - label: "Keep it visible but make it inert"
        approach: >-
          For visible content that should be ignored, such as the page behind
          an open dialog, add the inert attribute. It stops focus and clicks
          on everything inside.
        watch_out: >-
          Remove inert and aria-hidden when the content becomes active again,
          for example when the dialog closes. Otherwise that content stays out
          of reach.
      - label: "Stop hiding it from screen readers"
        approach: >-
          If the content is meant to be used, remove aria-hidden="true" from
          it and from every element around it.
        watch_out: >-
          Only do this for content people need. If the content only repeats
          something already on the page, screen reader users hear it twice. In
          that case, keep it hidden and take it out of the Tab order instead.
    verify_manual: >-
      Press Tab and Shift+Tab through the page with a screen reader on
      (VoiceOver or NVDA), and check that focus never lands inside the flagged
      element. One case is a false alarm: an invisible "focus guard" at the
      edge of a dialog that moves focus straight back into the dialog. Mark it
      Not a problem (false positive) only if focus moves on at once and you
      never hear or see it stop there.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      hidden element is still found.
    acceptance: >-
      Every element with aria-hidden="true" is skipped by the Tab key, and so
      is everything inside it.
    confidence_default: high

  sia-r24:
    abilities_affected: [vision, hearing]
    what_happening: >-
      The rule check (Alfa) looks at visible, prerecorded (not live)
      <code>&lt;video&gt;</code> elements that have sound. It passes when a
      screen reader can read a full text version (transcript) of what is seen
      and heard, on the page or linked. When a person must say where the
      transcript is, Alfa reports "cannot tell" and Axcess shows the issue as
      Needs review. Axcess runs this rule only in scans set to Level AAA,
      because this criterion is Level AAA.
    why_matters: >-
      People who are deafblind cannot see the video well enough to read
      captions or hear it well enough to follow the speech. A full text
      version lets them read everything on a braille display.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Write a full text version that reads like a screenplay (a film
        script). In the same order as the video, include all speech, who
        speaks, important sounds, the setting, and people's actions and
        expressions.
      - >-
        Put it on the same page, or link to it right next to the video. For
        example: <code>&lt;a href="training-video-text.html"&gt;Full text
        version of the training video&lt;/a&gt;</code>
      - >-
        Make sure a screen reader can reach it. A transcript inside
        <code>aria-hidden="true"</code> fails, even if it shows on screen.
      - >-
        If the video has choices or links in it, give the same choices in the
        text version.
    fix_options:
      - label: "Text version on the same page"
        approach: "Show the full text version under the video, with a clear heading."
        watch_out: >-
          A captions file is not enough. Captions leave out what is only seen,
          so add descriptions of the visuals.
      - label: "Link to a text version page"
        approach: >-
          Publish the text version on its own page and link to it from right
          next to the video.
        watch_out: >-
          A link to the wrong or an out-of-date text version does not help.
          Update it whenever the video changes.
    verify_manual: >-
      Read the text version without playing the video, then watch the video.
      Check that you missed nothing: speech, sounds, actions, and on-screen
      text. For a Needs review occurrence, find the text version. Check that
      it matches the video and that a screen reader can reach it.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this video is still found.
    acceptance: >-
      Every prerecorded video with sound has an accurate full text version of
      what is seen and heard, on the page or linked nearby.
    confidence_default: low

  sia-r27:
    abilities_affected: [hearing]
    what_happening: >-
      The rule check (Alfa) looks at visible, prerecorded (not live)
      <code>&lt;video&gt;</code> elements that have sound. It fails unless the
      video has captions (text shown in time with the video for all speech and
      important sounds). A video that only repeats text on the page also
      passes, if it is labeled as such. Alfa cannot watch or listen, so it
      reports "cannot tell" when a person must answer, and Axcess shows the
      issue as Needs review.
    why_matters: >-
      People who are deaf or hard of hearing cannot hear the speech and sounds
      in a video. Captions give them the same words and sound cues as text.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Make a captions file, for example a WebVTT file (<code>.vtt</code>, a
        common text format for captions). Include all speech, who is speaking,
        and important sounds, such as "[door slams]" or "[music stops]".
      - >-
        Add it to the video with a <code>&lt;track&gt;</code> element in the
        language of the video: <code>&lt;video controls&gt;&lt;source
        src="intro.mp4" type="video/mp4"&gt;&lt;track kind="captions"
        src="intro-en.vtt" srclang="en"
        label="English"&gt;&lt;/video&gt;</code>
      - >-
        Set <code>kind="captions"</code>. Subtitles
        (<code>kind="subtitles"</code>) hold only the dialogue, and a
        <code>&lt;track&gt;</code> with no <code>kind</code> counts as
        subtitles.
      - >-
        Play the video with captions on and check that each caption appears
        while its words are spoken.
    fix_options:
      - label: "Closed captions (can be turned on and off)"
        approach: >-
          Add a captions file to the video with a track element, so people can
          turn captions on in the player.
        watch_out: >-
          W3C lists captions that leave out dialogue or important sounds as a
          common failure (F8). Check every caption against the audio,
          including any made by automatic speech-to-text.
      - label: "Open captions (always shown)"
        approach: >-
          Put the captions into the video picture itself, so they always show.
        watch_out: >-
          People cannot turn them off. They are part of the picture, so fixing
          a typo means editing and exporting the video again.
      - label: "Label the video as a version of the text"
        approach: >-
          When the video only repeats text on the same page, label it as a
          video version of that text.
        watch_out: >-
          This only works when the video adds nothing to the text. W3C lists
          an unlabeled video version as a common failure (F74). A video with
          extra information still needs captions (F75).
    verify_manual: >-
      Turn the sound off and play the whole video with captions on. Check that
      every spoken word, who is speaking, and important sounds appear on time.
      For a Needs review occurrence, first check that the video is prerecorded
      and has sound. If so, look for captions or a visible label.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      video is still found.
    acceptance: >-
      Every prerecorded video with sound has accurate captions for all speech
      and important sounds, or a visible label saying it repeats page text.
    confidence_default: low

  sia-r28:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at every image button (<code>&lt;input
      type="image"&gt;</code>) that screen readers can reach. It fails when
      the button has no name of its own for a screen reader to read
      (accessible name). For example, it has no <code>alt</code>, or an empty
      <code>alt=""</code>. The browser then uses a default name such as
      "Submit Query", which the rule does not accept. This rule also links to
      WCAG 4.1.2 Name, Role, Value.
    why_matters: >-
      A screen reader user hears only "button" or "Submit Query" and does not
      know what the button does, for example "Search" or "Next page". They may
      avoid the button or press the wrong one.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Add an <code>alt</code> attribute that says what the button does, not
        what the picture looks like. Example: <code>&lt;input type="image"
        src="magnifier.png" alt="Search"&gt;</code>
      - >-
        Do not use <code>alt=""</code>. An image button is always a control,
        so an empty alt does not make it decoration. It just leaves it with no
        name.
      - >-
        If nearby visible text already says what the button does, you can
        point to it with <code>aria-labelledby</code> instead. Make sure the
        id it points to exists and holds text.
    fix_options:
      - label: "Add alt text that names the action"
        approach: >-
          Put the action in the alt attribute: alt="Search", alt="Submit
          order". This is the simplest way.
        watch_out: >-
          Describe the action, not the picture. alt="Magnifying glass" tells a
          user nothing about what happens when they press it.
      - label: "Use aria-label or aria-labelledby"
        approach: >-
          Give the name with aria-label, or point aria-labelledby at visible
          text on the page.
        watch_out: >-
          An aria-labelledby that points to a missing or empty element gives
          no name. Do not leave an empty aria-label either: some browser and
          screen reader pairs stop there and ignore the alt text. The name and
          value attributes never give an image button its name.
      - label: "Replace it with a normal button"
        approach: >-
          Use a button element with an image inside it that has alt text, or
          with visible text, if your design allows it.
        watch_out: >-
          An image button also sends the click position (name.x and name.y)
          with the form. Check that the server does not need these values, and
          that the new button keeps a visible focus style.
    verify_manual: >-
      Tab to each image button with a screen reader running. It should
      announce a name that says what the button does, and that it is a button.
      "Submit Query" or no name at all means it still fails.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      image buttons are still found.
    acceptance: >-
      Every image button has a name that says what it does, set through alt,
      aria-label or aria-labelledby.
    confidence_default: high

  sia-r30:
    abilities_affected: [hearing, cognition]
    what_happening: >-
      The rule check (Alfa) looks at prerecorded (not live)
      <code>&lt;audio&gt;</code> elements that play by themselves
      (<code>autoplay</code>) or have a visible play button. It fails unless
      people can see, and a screen reader can read, a transcript (a text
      version of everything said and heard). Audio that only repeats text on
      the page also passes, if it is labeled as such. Alfa cannot listen, so
      it reports "cannot tell" when a person must answer, and Axcess shows the
      issue as Needs review.
    why_matters: >-
      People who are deaf, hard of hearing, or who have trouble understanding
      speech cannot get the content of audio without a text version. People
      who are deafblind can read a transcript on a braille display.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Write a transcript that matches the final audio. Include every word,
        name who is speaking, and describe important sounds, for example
        "[phone rings]" or "[audience laughs]".
      - >-
        Put the transcript on the same page near the player, or link to it
        right next to the player. For example: <code>&lt;audio controls
        src="episode-42.mp3"&gt;&lt;/audio&gt; &lt;a
        href="episode-42-transcript.html"&gt;Transcript of episode
        42&lt;/a&gt;</code>
      - >-
        Make sure the transcript or its link shows on screen and a screen
        reader can read it. Text hidden with <code>display: none</code> or
        inside <code>aria-hidden="true"</code> does not count.
      - >-
        If the audio only reads out text already on the page, say so on screen
        next to the player. For example: "Audio version of the article below".
        Then it needs no separate transcript.
    fix_options:
      - label: "Transcript on the same page"
        approach: >-
          Show the full transcript below the player, under a clear heading
          such as "Transcript".
        watch_out: >-
          A script written before recording often differs from what people
          actually said. W3C advises you to edit it to match the final audio.
      - label: "Link to a transcript page"
        approach: >-
          Publish the transcript on its own page and link to it from right
          next to the player.
        watch_out: >-
          The link must be easy to find and say where it goes, such as
          "Transcript of episode 42". Update the transcript when the audio
          changes, because a wrong transcript is not a real text version.
      - label: "Label the audio as a version of the text"
        approach: >-
          When the audio only repeats text on the same page, label it as an
          audio version of that text.
        watch_out: >-
          This only works when the audio adds nothing to the text. If the
          audio has extra details, it still needs a transcript. The label must
          show on screen, not only in the page code.
    verify_manual: >-
      Play the audio with the transcript open and check that they match: every
      word, the speaker names, and important sounds. Then reach the transcript
      using only the keyboard and a screen reader. For a Needs review
      occurrence, first check that the audio is prerecorded and that people
      can play it. If so, look for an accurate transcript or a visible label.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      audio player is still found.
    acceptance: >-
      Every prerecorded audio player that people can play has an accurate
      transcript nearby, or a visible label saying it repeats page text.
    confidence_default: low

  sia-r35:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at visible, prerecorded (not live)
      <code>&lt;video&gt;</code> elements that have no sound. It fails unless
      the page has a text description of the video, or an audio track
      describes it. A video that only shows what text on the page says also
      passes, if it is labeled as such. Alfa cannot watch video, so it reports
      "cannot tell" when a person must answer, and Axcess shows the issue as
      Needs review.
    why_matters: >-
      People who are blind or have low vision miss everything in a silent
      video unless it is described. A text version also helps people who are
      deafblind (they read it in braille) and some people who find video hard
      to follow.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Write a text description of the video in the same language as the
        page. In order, describe the scenes, actions, on-screen text, and who
        does what. For example: "Step 1: Slide panel A into slot B. An arrow
        shows it clicking into place."
      - >-
        Put it next to the video, or link to it from there. Use a clear
        heading or link text, such as "Assembly video (text description
        follows)".
      - >-
        Make sure a screen reader can read the description. Text inside
        <code>aria-hidden="true"</code> does not count.
      - >-
        Do not use a description track (<code>&lt;track
        kind="descriptions"&gt;</code>) as the fix. Most players and screen
        readers do not support it, so the rule check (Alfa) does not count it.
    fix_options:
      - label: "Text description"
        approach: >-
          Publish a written description with the same information as the
          video, on the page or linked from it.
        watch_out: >-
          A short summary such as "Video of our product" leaves out the
          details. The description must hold all the important information the
          video shows.
      - label: "Describing audio track"
        approach: >-
          Record a narration that describes what the video shows. Let people
          turn it on in the player, or link to the audio file right next to
          the video.
        watch_out: >-
          The narration must be real recorded audio. A description track (a
          track element with kind set to "descriptions") does not count. Check
          that people can find and play the narration with a keyboard.
      - label: "Label the video as a version of the text"
        approach: >-
          When the video only shows what text on the same page says, label it
          as a video version of that text.
        watch_out: >-
          This only works when the video adds nothing to the text. The label
          must show on screen, and it must be clear which text the video
          repeats.
    verify_manual: >-
      Read the description without playing the video, then watch the video.
      Check that you missed nothing important, and that a screen reader can
      reach the description. For a Needs review occurrence, first check that
      the video is prerecorded and really has no sound. If so, look for a text
      description, a describing audio track, or a visible label.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      video is still found.
    acceptance: >-
      Every prerecorded silent video has an accurate text description or
      describing audio track, or a visible label saying it repeats page text.
    confidence_default: low

  sia-r37:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at visible, prerecorded (not live)
      <code>&lt;video&gt;</code> elements that have sound. It passes when the
      soundtrack or an audio description (a narrator saying what is on screen)
      gives all important visual information. A label saying the video repeats
      page text also passes, but a transcript alone does not. When a person
      must answer, Alfa reports "cannot tell" and Axcess shows the issue as
      Needs review.
    why_matters: >-
      People who are blind, have low vision, or find it hard to understand
      what they see miss visual details the soundtrack leaves out. Audio
      description tells them in sound, in time with the video.
    owner: content
    effort: multi_sprint
    fix_steps:
      - >-
        Check the soundtrack first. If the speakers already say everything
        important that appears on screen, no extra description is needed.
      - >-
        Write a description script for the gaps in speech: actions, who is on
        screen, scene changes, and on-screen text.
      - >-
        Record it and publish a described version of the video, or a second
        soundtrack people can pick in the player. Put a clear link or control
        next to the original video.
      - >-
        Do not use a description track (<code>&lt;track
        kind="descriptions"&gt;</code>) as the fix. Most players and screen
        readers do not support it, so the rule check (Alfa) does not count it.
    fix_options:
      - label: "Described version of the video"
        approach: >-
          Publish a second version of the video with the description mixed
          into the soundtrack, and link to it next to the original.
        watch_out: >-
          You now have two videos to keep the same. When the content changes,
          update both.
      - label: "Second soundtrack people can pick"
        approach: >-
          Add a second soundtrack: a copy of the original sound with the
          descriptions added. People switch to it in the player.
        watch_out: >-
          Most players cannot mix two sound files, so a track with only the
          descriptions will not work. Check that people can find and turn on
          the described track with a keyboard.
      - label: "Describe the visuals while recording"
        approach: >-
          Have speakers say what they show as they show it, for example "click
          the blue Save button" instead of "click this". W3C calls this
          integrated description. It works well for presentations and how-to
          videos.
        watch_out: >-
          It needs planning before filming, or a new recording. Speakers must
          still read out important on-screen text, such as names and links.
    verify_manual: >-
      Listen to the video, or its described version, without looking at the
      screen. Check that you can follow everything important that happens. For
      a Needs review occurrence, a person must decide whether the main
      soundtrack already describes the visuals.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      video is still found.
    acceptance: >-
      Every prerecorded video with sound has all important visual information
      available as sound, in the soundtrack or in audio description.
    confidence_default: low

  sia-r38:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at visible, prerecorded (not live)
      <code>&lt;video&gt;</code> elements that have sound. It passes when the
      soundtrack or an audio description (a narrator saying what is on screen)
      gives all important visual information. A full text version (transcript)
      of everything seen and heard also passes, as does a label saying the
      video repeats page text. When a person must answer, Alfa reports "cannot
      tell" and Axcess shows the issue as Needs review.
    why_matters: >-
      People who are blind or have low vision miss actions, scene changes and
      on-screen text that the soundtrack does not mention. Audio description
      or a full text version gives them that information.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Check whether the soundtrack already explains everything important on
        screen, for example a video of only a person talking. If it does, the
        video needs no extra description.
      - >-
        If not, write a full text version. In the same order as the video,
        include all speech, who speaks, important sounds, and what happens on
        screen. Put it on the page, or link to it right next to the video.
      - >-
        This rule is also linked to WCAG 1.2.5 (Level AA). For Level AA, a
        text version is not enough: also add audio description. Offer a
        described version of the video, or a second soundtrack people can
        pick.
      - >-
        Do not use a description track (<code>&lt;track
        kind="descriptions"&gt;</code>) as the fix. Most players and screen
        readers do not support it, so the rule check (Alfa) does not count it.
    fix_options:
      - label: "Full text version (transcript)"
        approach: >-
          Publish a text version that reads like a screenplay (a film script).
          Include all speech, sounds and visual information, on the page or
          linked from it.
        watch_out: >-
          This meets Level A (1.2.3) only. At Level AA (1.2.5), the video
          still needs audio description.
      - label: "Audio-described version"
        approach: >-
          Offer a version of the video, or a second soundtrack, where a
          narrator describes what is on screen.
        watch_out: >-
          The description must fit in the natural pauses in speech. W3C lists
          leaving out key visuals when there are pauses to use as a failure of
          WCAG 1.2.5 (F113). If the pauses are too short, you may need a
          longer version that holds the picture still while the description
          plays.
      - label: "Label the video as a version of the text"
        approach: >-
          When the video only repeats text on the same page, label it as a
          video version of that text.
        watch_out: >-
          This only works when the video adds nothing to the text. The label
          must show on screen.
    verify_manual: >-
      Listen to the video without watching, or read the text version without
      playing it. Check that you learn everything important the picture shows.
      For a Needs review occurrence, a person must first decide whether the
      soundtrack alone already explains the visuals. If it does, the video
      passes this rule.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      video is still found.
    acceptance: >-
      Every prerecorded video with sound gives its visual information through
      sound, a full text version, or a visible label saying it repeats page
      text.
    confidence_default: low

  sia-r39:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) finds an <code>&lt;img&gt;</code> or image button
      (<code>&lt;input type="image"&gt;</code>) where the name a screen reader
      reads (accessible name) matches its file name. For example:
      <code>&lt;img src="/img/IMG_0423.jpg" alt="IMG_0423.jpg"&gt;</code>. It
      ignores upper and lower case, and the file name includes its extension.
      Alfa cannot tell by itself whether that name is useful, and Axcess does
      not answer that question for it. So every occurrence shows as Needs
      review, and a person must decide.
    why_matters: >-
      Content systems often fill in the file name when no alt text is given. A
      screen reader user then hears the file name, such as "IMG_0423.jpg",
      instead of what the image shows or does.
    owner: editor
    effort: under_2h
    fix_steps:
      - >-
        Look at each flagged image and ask: does this name tell someone what
        the image shows or does? A file name such as "nyhavn.jpeg" or a long
        string of numbers and letters usually does not.
      - >-
        If it does not, replace the alt text with a short description of the
        image's purpose. Example: change <code>alt="login.png"</code> on an
        image button to <code>alt="Log in"</code>.
      - >-
        If the image is only decoration, set <code>alt=""</code> instead.
        Image buttons cannot be decoration, so they always need a real name.
      - >-
        Turn off any content system setting that copies the file name into the
        alt text, so new uploads do not repeat the problem.
    fix_options:
      - label: "Rewrite the alt text"
        approach: >-
          Write a few words that give the same information or action as the
          image, in the language of the page.
        watch_out: >-
          Drop the file extension and any codes. "nyhavn.jpeg" is not a good
          name even when "Nyhavn" would be.
      - label: "Keep the name when it already works"
        approach: >-
          A file name can be a good name by chance. What matters is whether
          the words say what the image shows or what the button does.
        watch_out: >-
          A matching word is not enough. A photo saved as "paris" with
          alt="Paris" still fails if "Paris" does not say what the photo
          shows.
      - label: "Fix the content system default"
        approach: >-
          Change the upload form or template so alt text is a required field.
          Or make the system leave it empty, instead of filling in the file
          name.
        watch_out: >-
          A required field can lead to filler text. Tell editors what good alt
          text looks like, and allow a clear "decoration" choice.
    verify_manual: >-
      To decide a Needs review occurrence, look at the image on the live page.
      Read its name with a screen reader, or in the accessibility panel of the
      browser's developer tools. If the name says what the image shows or what
      the button does, set the status to Not a problem (false positive). If it
      is a file name, a code, or ends in an extension like ".jpg", it is a
      real problem, so fix it.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if images
      whose name matches the file name are still found.
    acceptance: >-
      Every image and image button has a name that describes its purpose, not
      a copy of its file name.
    confidence_default: low

  sia-r41:
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      This rule check (Alfa) finds two or more links on the page with the same
      accessible name (the name a screen reader reads). It ignores capital
      letters and extra spaces, and it passes the links only when they all
      have exactly the same address (<code>href</code>). Otherwise it cannot
      tell if they lead to the same content, even when the addresses differ
      only by a <code>#section</code> part. A person must decide: the links
      fail when they lead to different content, such as three "Read more"
      links to three different articles.
    why_matters: >-
      Screen reader users can list all the links on a page, away from the text
      around them, where same-named links sound the same. People with movement
      or cognitive disabilities may open the wrong page and need extra effort
      to get back.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Follow each link in the set and compare where it leads. The occurrence
        lists up to three of the links, so look on the page for others with
        the same name. If all of them lead to the same content, for example
        the same page with and without a tracking code, no change is needed.
        Mark the occurrence Not a problem (false positive).
      - >-
        If they lead to different content, give each link its own text that
        says where it goes. For example, use "Read the 2026 budget report"
        instead of "Read more".
      - >-
        If the design needs the short visible text, add the rest as hidden
        text that screen readers read. Keep the visible words first:
        <code>&lt;a href="/budget"&gt;Read more&lt;span
        class="visually-hidden"&gt; about the 2026
        budget&lt;/span&gt;&lt;/a&gt;</code>.
    fix_options:
      - label: "Write clear, different link text"
        approach: >-
          Change the visible text of each link so it names its destination, in
          the content system or the template that builds the links.
        watch_out: >-
          Longer text in repeated cards can crowd the layout. Check the page
          at 320 pixels wide and at 200% zoom.
      - label: "Add hidden text or an aria-label"
        approach: >-
          Keep the short visible text and give screen readers a longer name,
          with hidden text inside the link or an aria-label attribute.
        watch_out: >-
          The name must still contain the visible words (WCAG 2.5.3 Label in
          Name), or voice control users cannot click the link by saying them.
          An aria-label replaces the visible text as the name, so start it
          with the visible words.
      - label: "Use one address for links that go to the same place"
        approach: >-
          Where the links are meant to reach the same page, give them exactly
          the same href.
        watch_out: >-
          Small differences, such as a #section or a tracking code, do not
          break WCAG if the content is the same. They do make the rule check
          show the links as Needs review again.
    verify_manual: >-
      Open the screen reader's list of links, such as the NVDA Elements List
      (Insert+F7) or the VoiceOver Rotor. Each name should say where the link
      goes. Where links share a name, follow each one: if they lead to the
      same content, it is not a problem; if not, it is. The next scan lists
      the set again while the links' addresses differ.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this set of links is still found.
    acceptance: >-
      Every set of links with the same name leads to the same or equivalent
      content, and links to different content have different names.
    confidence_default: low

  sia-r42:
    abilities_affected: [vision]
    what_happening: >-
      Some roles only make sense inside a certain parent. For example, a list
      item belongs in a list, and a tab (<code>tab</code>) in a tab list
      (<code>tablist</code>). The rule check (Alfa) looks at the element's
      parent in the page structure screen readers use (accessibility tree). It
      fails the element when that parent does not have a needed role. It
      checks native elements such as <code>&lt;li&gt;</code> and
      <code>&lt;tr&gt;</code>, as well as elements with a <code>role</code>
      attribute. It skips plain wrappers: elements with
      <code>role="presentation"</code> or <code>role="none"</code>, and
      elements such as <code>&lt;div&gt;</code> with no role, ARIA attributes
      or <code>tabindex</code>.
    why_matters: >-
      Screen readers use the parent to tell people what an item belongs to,
      such as a list or a tab list. They also use it to tell people how that
      container is built. When the parent is missing or wrong, that structure
      is lost, and screen readers handle it in different ways.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the role of the flagged element, such as <code>listitem</code> or
        <code>tab</code>. Then find the element's closest parent that is not a
        plain wrapper, and check that parent's role.
      - >-
        For a <code>&lt;li&gt;</code>: keep it directly inside a
        <code>&lt;ul&gt;</code> or <code>&lt;ol&gt;</code>. Do not give that
        list a role that replaces "list", such as <code>role="menubar"</code>
        or <code>role="tablist"</code>, unless you also change the items.
      - >-
        For a tab inside a list item, make the list item a plain wrapper so
        the tab sits right under the tab list. Example: <code>&lt;ul
        role="tablist"&gt;&lt;li role="presentation"&gt;&lt;a role="tab"
        aria-selected="true"
        href="#panel-1"&gt;Overview&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;</code>
      - >-
        If the element is not really part of that kind of widget, remove its
        role. For example, a tab shows a panel on the same page. A link that
        goes to another page or site is a link, not a tab.
    fix_options:
      - label: "Give the parent the needed role"
        approach: >-
          Put the right role on the element that holds the items, for example
          role="tablist" on the element around the tabs.
        watch_out: >-
          The parent role brings its own rules. A tab list must hold tabs
          only, and tabs need arrow-key support and states such as
          aria-selected.
      - label: "Hide the wrapper in between"
        approach: >-
          Add role="presentation" to the wrapper that sits between the item
          and its container, such as the list item around a tab.
        watch_out: >-
          This removes the wrapper's own meaning. Do not use it on something
          that can take focus or that people need as its own item.
      - label: "Remove the item's role"
        approach: >-
          If the element is not really a tab, menu item or similar, delete its
          role attribute so it keeps its native meaning.
        watch_out: >-
          Check that the element still makes sense without the role, for
          example that a link still reads as a link.
    verify_manual: >-
      Open the browser's accessibility panel (accessibility tree). Check that
      the element's parent has the needed role, for example that the tab sits
      right under the tab list. Then move through the container with a screen
      reader, and check that it announces the container and each item in it.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every element whose role needs a certain parent sits directly inside an
      element with that parent role, not counting plain wrappers.
    confidence_default: medium

  sia-r43:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at Scalable Vector Graphics (SVG) drawings
      that the page code marks as images on purpose. That means an
      <code>&lt;svg&gt;</code>, or a shape inside it, with
      <code>role="img"</code>, <code>role="graphics-document"</code> or
      <code>role="graphics-symbol"</code>. It fails when such an element has
      no name for a screen reader to read (accessible name), or the name is
      empty. Text drawn inside the SVG does not count as its name.
    why_matters: >-
      The role tells screen readers "this is an image", but with no name they
      cannot say what it shows. Blind and low-vision users miss what the icon,
      chart or logo means.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide whether the SVG gives information. Icons inside a button or
        link that already has text usually do not.
      - >-
        If it gives information, add <code>aria-label</code>, or add a
        <code>&lt;title&gt;</code> inside the SVG. Example: <code>&lt;svg
        role="img" aria-label="Warning"&gt;...&lt;/svg&gt;</code>
      - >-
        If it is decoration, remove the image role and hide it from screen
        readers: <code>&lt;svg aria-hidden="true"&gt;...&lt;/svg&gt;</code>
      - >-
        Fix it in the shared icon component so every use of that icon is fixed
        at once.
    fix_options:
      - label: "Name it with aria-label or aria-labelledby"
        approach: >-
          Put the name on the svg element itself with aria-label, or point
          aria-labelledby at a title or visible text.
        watch_out: >-
          Support for the SVG title and desc elements varies between browsers
          and screen readers. aria-label together with role="img" works in
          more of them.
      - label: "Hide a decorative SVG"
        approach: >-
          Remove role="img" and add aria-hidden="true" so screen readers skip
          it.
        watch_out: >-
          If the SVG is the only content of a button or link, hiding it leaves
          that control with no name. Name the button or link instead.
    verify_manual: >-
      With a screen reader running, move to each flagged SVG. An SVG that
      gives information should read out a useful name. A decorative one should
      be skipped. You can also check the name in the accessibility panel of
      the browser's developer tools.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      SVG elements are still found.
    acceptance: >-
      Every SVG element with role img, graphics-document or graphics-symbol
      has a name that is not empty, and every decorative SVG is hidden from
      screen readers.
    confidence_default: high

  sia-r44:
    abilities_affected: [motor, vision]
    what_happening: >-
      The rule check (Alfa) looks for style sheet (CSS) rules that rotate an
      element in only one screen orientation. These rules sit inside
      <code>@media (orientation: portrait)</code> or <code>@media
      (orientation: landscape)</code>. It checks the <code>rotate</code>
      property and <code>transform</code> with <code>rotate()</code>,
      <code>rotate3d()</code>, <code>rotateZ()</code>, <code>matrix()</code>
      or <code>matrix3d()</code>. It fails when the element turns by 90 or 270
      degrees between portrait and landscape. That turn cancels the device's
      own turn, so the content stays one way up however the device is held.
    why_matters: >-
      Some people cannot turn their device, for example when it is fixed to a
      wheelchair. Some people with low vision use landscape to make text
      larger. Locked content forces them to read sideways or stops them using
      the page.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the style rule that applies in only one orientation (an
        orientation media query) and rotates the element. A failing example:
        <code>@media (orientation: portrait) { html { transform:
        rotate(90deg); } }</code>.
      - >-
        Remove the rotation. Make the layout work both ways with flexible
        widths and layout rules based on screen width (width media queries).
      - >-
        Check scripts too. A script can also lock the orientation with
        <code>screen.orientation.lock()</code> (Screen Orientation API), and
        this rule only checks CSS.
      - >-
        Keep a fixed orientation only if it is essential, and write down why.
        WCAG gives a piano app and a bank check as examples.
    fix_options:
      - label: "Remove the rotation and support both orientations"
        approach: >-
          Delete the rotate or transform rule from the orientation media
          query, and let the layout adapt to the screen with a flexible
          layout.
        watch_out: >-
          Phones in landscape are short. Check that nothing overlaps, gets cut
          off, or hides behind fixed headers when the screen is wide and
          short.
      - label: "Offer a control to change orientation"
        approach: >-
          Keep the lock, and give people a control that shows the content in
          the other orientation (WCAG technique G214).
        watch_out: >-
          The rule check (Alfa) does not look for such a control, so it keeps
          reporting the element and a person must record the decision. W3C
          says it is usually better not to lock at all, so people can use
          their device's own orientation lock. The control must work by
          keyboard and screen reader.
      - label: "Keep one orientation because it is essential"
        approach: >-
          Keep the lock only when the content cannot work any other way, and
          write down why.
        watch_out: >-
          Essential is narrow. "It looks better in landscape" is not
          essential. The rule check cannot judge this, so a person must
          decide.
    verify_manual: >-
      Open the page on a phone or tablet, or in the browser's device mode, and
      turn it between portrait and landscape. The content should turn with the
      device and stay usable both ways. The rule check does not look for a
      control that lets people switch, and cannot judge whether one
      orientation is essential. If the content stays locked, a person must
      decide both.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every page shows its content in portrait and landscape, unless a control
      lets people switch, or one orientation is essential and the reason is
      recorded.
    confidence_default: medium

  sia-r45:
    abilities_affected: [vision]
    what_happening: >-
      A table cell (<code>&lt;td&gt;</code> or <code>&lt;th&gt;</code>) can
      name its header cells with a <code>headers</code> attribute that lists
      their <code>id</code> values. The rule check (Alfa) fails the attribute
      when an <code>id</code> in it does not match a cell in the same
      <code>&lt;table&gt;</code>. It also fails when the cell lists its own
      <code>id</code>, or when two cells in the table share one of the listed
      <code>id</code> values. Common causes are a typo, a header in a
      different table, or an <code>id</code> on something that is not a table
      cell.
    why_matters: >-
      Screen readers use these links to read the right header with each value.
      The browser ignores an id that does not match. Screen reader users then
      hear the value without that header, and may not know what it means.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        For each <code>id</code> in the flagged <code>headers</code>
        attribute, find the header cell with that <code>id</code> in the same
        table. Fix any typo.
      - >-
        Give each header cell its own <code>id</code>, unique on the page.
        List every header that applies, separated by spaces. Example:
        <code>&lt;th id="q1"&gt;Quarter 1&lt;/th&gt; ... &lt;td headers="q1
        sales"&gt;120&lt;/td&gt;</code>
      - >-
        Remove the cell's own <code>id</code> from its <code>headers</code>
        list.
      - >-
        In a simple table, you can remove <code>headers</code> and use
        <code>&lt;th scope="col"&gt;</code> and <code>&lt;th
        scope="row"&gt;</code> instead. A simple table has one header row and
        at most one header column.
    fix_options:
      - label: "Fix the id values"
        approach: >-
          Make every id in each headers attribute match a header cell in the
          same table.
        watch_out: >-
          Every id must be unique on the page. A table copied from another
          table, or a component used twice on one page, often repeats the same
          ids.
      - label: "Use th and scope instead"
        approach: >-
          In a simple table, mark header cells with th and scope, and drop the
          headers attribute.
        watch_out: >-
          This only works when each data cell has one column header and at
          most one row header. A cell with several headers in a row or column
          still needs the headers attribute.
    verify_manual: >-
      Inspect each cell that has a headers attribute and check that every id
      in it belongs to a header cell in the same table. Then move through the
      table with a screen reader's table commands and check that it reads the
      right headers with each value.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      headers attribute is still found.
    acceptance: >-
      Every headers attribute lists only ids of cells in the same table, and
      never the cell's own id.
    confidence_default: high

  sia-r46:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at each visible <code>&lt;th&gt;</code> that
      acts as a row or column header in a table. It fails when no other cell
      in the table, data cell or header cell, belongs to that header. For
      example, the header row has more columns than the data rows, or the
      table has a header row and no data rows. Or a <code>headers</code>
      attribute on the cells points them at other headers, so this one is left
      with none.
    why_matters: >-
      Screen reader users learn what a value means from the header read with
      it. When a header has no cells, the table's code does not match how it
      looks, and people may hear the wrong header or none.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Look at the table on the page and decide what the flagged header is
        meant to label.
      - >-
        If it labels a column or row of data, make the data cells line up with
        it. Match the number of columns in every row, and use
        <code>colspan</code> or <code>rowspan</code> where one cell covers
        more than one column or row. If the data cells use a
        <code>headers</code> attribute, add this header's <code>id</code> to
        it.
      - >-
        If it does not label any data, change it to a <code>&lt;td&gt;</code>,
        or remove the empty column.
      - >-
        If the table is only for layout, not data, do not use
        <code>&lt;th&gt;</code> in it. Add <code>role="presentation"</code> to
        the <code>&lt;table&gt;</code>.
    fix_options:
      - label: "Line up the data cells"
        approach: "Fix the rows so every header has data cells in its column or row."
        watch_out: >-
          Check tables that script fills in. A table with no data rows yet, or
          rows that load later, can leave headers with no cells.
      - label: "Change the header to a normal cell"
        approach: "If the cell is not really a header, use td instead of th."
        watch_out: >-
          Only do this when the cell labels nothing. Changing a real header
          removes it for everyone who uses a screen reader.
      - label: "Fix the headers attribute"
        approach: >-
          Where data cells use the headers attribute, include the id of every
          header that labels them, this one too.
        watch_out: >-
          A headers attribute replaces the headers the browser would work out
          by itself. Leave one out and that header loses its cells.
    verify_manual: >-
      Move through the table with a screen reader's table commands and check
      that each value is read with the right header. A person decides whether
      a header with no cells is still correct, for example in a table that
      holds only header cells. Screen reader support for table headers varies.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      header is still found.
    acceptance: >-
      Every table header labels at least one other cell, or a person has
      confirmed why it does not.
    confidence_default: medium

  sia-r47:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) reads the page's viewport setting (the
      <code>&lt;meta name="viewport"&gt;</code> element in the page head). It
      fails when the setting blocks zoom: <code>user-scalable=no</code> (or
      <code>0</code>), or a <code>maximum-scale</code> under 2, such as
      <code>maximum-scale=1</code> or <code>maximum-scale=1.5</code>. The rule
      check counts <code>maximum-scale=yes</code> as 1, so that fails too.
    why_matters: >-
      People with low vision zoom in on a phone to read small text. When the
      page blocks zoom, some mobile browsers do not let them enlarge the text
      at all. W3C notes that desktop browsers ignore this setting, and most
      new mobile browsers ignore it or have an option to. So people with older
      mobile browsers are the ones affected.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the <code>&lt;meta name="viewport"&gt;</code> element. It is
        usually in one shared page template, so one fix often covers every
        page.
      - >-
        Remove <code>user-scalable=no</code> and <code>maximum-scale</code>,
        and keep the rest: <code>&lt;meta name="viewport"
        content="width=device-width, initial-scale=1"&gt;</code>.
      - >-
        If you must keep <code>maximum-scale</code>, set it to 2 or more, for
        example <code>maximum-scale=5</code>.
    fix_options:
      - label: "Remove the zoom limits"
        approach: >-
          Delete user-scalable and maximum-scale from the viewport setting, so
          the browser allows full zoom.
        watch_out: >-
          A common reason for maximum-scale=1 is to stop iPhone Safari from
          zooming in when someone taps a small form field. Fix that by making
          form field text at least 16px instead of blocking zoom.
      - label: "Raise the maximum zoom to 2 or more"
        approach: >-
          Keep maximum-scale, but set it to at least 2, so people can enlarge
          the page to 200 percent.
        watch_out: >-
          Allowing zoom is only the first step. The page must also still work
          at 200 percent, with no text cut off or covered.
    verify_manual: >-
      Look at the page code (view source) and find the viewport setting. Check
      that it has no user-scalable=no and no maximum-scale under 2. Do not
      rely on a pinch test on a new phone, because many new mobile browsers
      ignore this setting. Then zoom the page to 200 percent and check that
      all text stays readable, with nothing cut off or covered.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if the
      viewport setting is still found.
    acceptance: >-
      Every page's viewport setting lets people zoom, with no user-scalable=no
      and no maximum-scale under 2.
    confidence_default: high

  sia-r50:
    abilities_affected: [vision, hearing, cognition]
    what_happening: >-
      The rule check (Alfa) looks at <code>&lt;audio&gt;</code> and
      <code>&lt;video&gt;</code> elements that have the <code>autoplay</code>
      attribute and a media file, and are not <code>muted</code>. It fails
      when the sound lasts more than 3 seconds and there is no way to pause,
      stop or mute it. To decide, it must know how long the media lasts and
      whether it has sound. Axcess cannot give it those answers, so this issue
      always shows as Needs review, and a person must check. Sound started by
      a script, with no <code>autoplay</code> attribute, is not checked by
      this rule.
    why_matters: >-
      Sound that plays on its own can drown out a screen reader. Screen reader
      users then cannot hear the page, or find the control to stop the sound.
      It also makes reading hard for people who find it hard to focus on text
      while sound plays.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Load the page with sound on and find out whether the media plays sound
        on its own for more than 3 seconds. If it does not, there is nothing
        to fix.
      - >-
        Best: remove <code>autoplay</code> so sound starts only when someone
        chooses to play it: <code>&lt;video src="intro.mp4"
        controls&gt;</code>.
      - >-
        If the media must start on its own, add <code>muted</code>, or cut the
        sound to 3 seconds or less in total.
      - >-
        Otherwise, give a pause, stop or mute button near the start of the
        page. The button must be visible, work with a keyboard, and have a
        name a screen reader reads, for example <code>&lt;button
        type="button"&gt;Pause background sound&lt;/button&gt;</code>.
    fix_options:
      - label: "Play sound only when asked"
        approach: >-
          Remove autoplay and let people start the media themselves, with a
          play button or the browser's controls. This is W3C technique G171.
        watch_out: >-
          A link or button that starts sound should say so, for example "Play
          video (with sound)". Then the sound starts because the person chose
          it.
      - label: "Add a control to pause, stop or mute"
        approach: >-
          Keep autoplay, but add the controls attribute or your own pause and
          mute buttons, placed near the start of the page. This is W3C
          technique G170.
        watch_out: >-
          In some browsers, a keyboard or screen reader cannot reach the
          browser's own media controls. Your own buttons work more reliably. A
          volume control must work apart from the computer's own volume,
          because muting the whole computer also mutes the screen reader.
      - label: "Keep the sound to 3 seconds or less"
        approach: >-
          Trim or stop the sound so it plays for no more than 3 seconds in
          total. This is W3C technique G60.
        watch_out: >-
          The rule counts all the sound the element plays. W3C says WCAG is
          not clear about a short clip that repeats, or several short sounds
          in a row. Do not rely on these to stay under 3 seconds.
    verify_manual: >-
      Turn on your sound and load the page fresh, without clicking anything.
      If no sound plays, or it stops within 3 seconds, mark the occurrence Not
      a problem (false positive). If sound plays longer, check that a visible
      pause, stop or mute control sits near the start of the page. Check that
      you can reach and use it with the keyboard alone, and that a screen
      reader reads its name. A new scan still shows it as Needs review while
      the element has autoplay and is not muted, so rely on this check.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      audio or video element is still found.
    acceptance: >-
      Every audio or video element that plays by itself has no sound longer
      than 3 seconds, or a control to pause, stop or mute it. That control is
      visible, works with a keyboard, and sits near the start of the page.
    confidence_default: low

  sia-r62:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at links inside a paragraph with other text,
      where the link color differs from the text around it. The link must
      stand out by more than color in its normal state, with the mouse over it
      (hover), and with keyboard focus. Alfa accepts an underline, a different
      font weight or font, a background, a border, an outline or a box shadow.
      It also accepts a raised or lowered position, or a difference in
      lightness (contrast ratio) of at least 3:1 between link and text color.
      This link has none of these in at least one state. A different mouse
      pointer counts only in the hover state.
    why_matters: >-
      People who cannot tell some colors apart, and people using displays with
      few colors, cannot see which words are links. They miss links, or have
      to guess where to click.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Underline links in body text. For example: <code>p a {
        text-decoration: underline; }</code>.
      - >-
        Keep a clear cue on hover and on focus as well. If the underline goes
        away on hover or focus, add another cue, such as a border or a
        background. Do not remove the focus outline with <code>outline:
        none</code>.
      - >-
        Check the site's base styles or theme for a rule such as <code>a {
        text-decoration: none; }</code> that removes underlines everywhere.
      - >-
        If the design must use color alone, make the link color at least 3:1
        against the body text color (WCAG technique G183). Both colors must
        still be readable on the background: at least 4.5:1 for normal text.
    fix_options:
      - label: "Underline links in text"
        approach: >-
          Give links inside paragraphs an underline in all states. This is the
          cue most people already know.
        watch_out: >-
          Some themes remove the underline or border on hover or focus. Check
          all three states. A border-bottom or box shadow also counts, but can
          vanish in the same way.
      - label: "Use a 3:1 color contrast between link and text"
        approach: >-
          Pick a link color with a contrast ratio of at least 3:1 against the
          surrounding text color.
        watch_out: >-
          Few color pairs work: the link and the body text must also each
          reach 4.5:1 against the background. W3C notes that dark colors can
          still be hard to tell apart at 3:1, so an underline is safer.
      - label: "Use bold or another font"
        approach: >-
          Make link text bold, or use a different font from the text around
          it.
        watch_out: >-
          Bold is also used for emphasis, so people may not read bold words as
          links. An underline is clearer.
    verify_manual: >-
      Look at the paragraph with a grayscale filter, for example the color
      filters in the operating system's display settings. Then point at the
      link with the mouse, and move to it with Tab. The link should stand out
      from the text around it each time. For a Needs review occurrence, a
      person must judge whether someone who cannot see color would still
      notice the link. Do the same when the link has an icon or other mark
      that shows it is a link.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      link is still found.
    acceptance: >-
      Every link inside a paragraph of text stands out from the text around it
      by more than color, in its normal, hover and focus states.
    confidence_default: medium

  sia-r63:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at <code>&lt;object&gt;</code> elements
      that embed an image, audio or video and that screen readers can reach.
      It decides the media type from the <code>type</code> attribute, for
      example <code>type="video/mp4"</code>. If there is no type, it uses the
      file extension in <code>data</code>, such as .png, .mp3 or .mp4. It
      fails when the object has no name for a screen reader to read
      (accessible name).
    why_matters: >-
      Screen readers handle an object with no name in different ways, and some
      skip it. Blind and low-vision users may not know what the image, audio
      or video is, or that it is there.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Give each flagged object a name that says what it is. Example:
        <code>&lt;object data="intro.mp4" type="video/mp4" aria-label="Welcome
        video"&gt;&lt;/object&gt;</code>
      - >-
        Use <code>aria-label</code>, <code>aria-labelledby</code> or
        <code>title</code>. Do not rely on an <code>alt</code> attribute or on
        an <code>&lt;img alt&gt;</code> inside the object. Neither becomes the
        object's name.
      - >-
        Or replace the object with the element made for that media:
        <code>&lt;img alt="..."&gt;</code>, <code>&lt;video&gt;</code> or
        <code>&lt;audio&gt;</code> with controls.
      - >-
        If the object is only decoration, hide it from screen readers with
        <code>aria-hidden="true"</code>.
    fix_options:
      - label: "Add aria-label or title to the object"
        approach: >-
          Put a short name on the object element that says what the media is,
          such as "Welcome video" or "Campus map".
        watch_out: >-
          The name only says what the media is. A video or audio still needs
          captions, a transcript or a description to meet other WCAG criteria.
      - label: "Replace object with img, video or audio"
        approach: >-
          Use the element made for that media type, with alt text for an
          image, or with controls and a name for audio or video.
        watch_out: >-
          Check the replacement still loads in every browser you support, and
          that video or audio still has its captions and controls.
    verify_manual: >-
      Move to each flagged object with a screen reader and check it announces
      a name that says what the media is. The rule check guesses the media
      type from the type attribute or file extension. If the object really
      holds a web page or text, this rule does not apply.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      objects are still found.
    acceptance: >-
      Every object that embeds an image, audio or video has a name that says
      what it is, or is hidden from screen readers as decoration.
    confidence_default: medium

  sia-r64:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at every heading: <code>&lt;h1&gt;</code> to
      <code>&lt;h6&gt;</code>, and elements with <code>role="heading"</code>.
      It fails when a heading has no text for screen readers (accessible
      name). Examples: an empty <code>&lt;h2&gt;&lt;/h2&gt;</code>, a heading
      that holds only an image with <code>alt=""</code>, or a heading whose
      only text is inside an element with <code>aria-hidden="true"</code>.
    why_matters: >-
      Screen reader users jump from heading to heading to find their way
      around a page. Some screen readers hide an empty heading, while others
      may read it with no words. An empty heading can also show on screen as a
      gap or a styled line that confuses sighted people.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Open the flagged heading and see why it has no text. It may be empty,
        it may hold only an image or icon with no text, or its text may be
        hidden.
      - >-
        If the heading is only there for spacing or looks, delete it and use
        CSS margin or padding instead. In a content editor, remove the empty
        heading line.
      - >-
        If the heading should say something, add the text. For an image in the
        heading, give it alt text. Example: <code>&lt;h2&gt;&lt;img
        src="services-title.png" alt="Our services"&gt;&lt;/h2&gt;</code>
      - >-
        If script fills in the text later, check that the text is there on the
        live page, and that it is not hidden with
        <code>aria-hidden="true"</code>.
    fix_options:
      - label: "Add text to the heading"
        approach: "Put words in the heading that describe the section below it."
        watch_out: >-
          Keep the words short and specific to the section. If no section
          follows the heading, remove the heading instead.
      - label: "Remove the empty heading"
        approach: "Delete heading elements that only add space or style."
        watch_out: >-
          Check that the heading levels still make sense after you remove it,
          and use CSS for the lost spacing.
      - label: "Name the image inside"
        approach: >-
          When the heading is an image or icon, give the image alt text. Or
          add text that is hidden on screen but read by screen readers.
        watch_out: >-
          role="presentation" or alt="" on that image removes its text, so the
          heading stays empty.
    verify_manual: >-
      Inspect the heading in the browser's accessibility panel and check that
      it has a name. Some screen readers leave empty headings out of their
      heading list, so do not rely on that list alone. Then open the heading
      list, for example with the rotor in VoiceOver or the elements list in
      NVDA. Check that every heading has words that describe its section.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      heading is still found.
    acceptance: "Every heading on the page has text that a screen reader reads."
    confidence_default: high

  sia-r65:
    abilities_affected: [motor, cognition]
    what_happening: >-
      This rule check (Alfa) looks at each element you can reach with the Tab
      key, with and without keyboard focus. It looks for a change in outline,
      border, shadow, underline or color, on the element, inside it, or on an
      element that contains it. Here it found no change, so it cannot tell
      whether people can see where the focus is, and a person must check. One
      known cause is a style that removes the browser's focus outline, such as
      <code>outline: none</code>.
    why_matters: >-
      People who use a keyboard instead of a mouse need to see which element
      their next key press will act on. Without a visible marker (focus
      indicator) they lose their place, and people with attention or memory
      difficulties find the page hard to use.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the style rule that hides the focus outline, for example
        <code>:focus { outline: none; }</code> or <code>outline: 0</code>.
        Remove it, or replace it with your own focus style.
      - >-
        Add a clear focus style with at least 3:1 contrast against the colors
        next to it (WCAG 1.4.11). For example: <code>:focus-visible { outline:
        3px solid #1a5fb4; outline-offset: 2px; }</code>.
      - >-
        Make the change in the shared stylesheet or component, so every page
        and every control gets it.
    fix_options:
      - label: "Bring back the browser's own outline"
        approach: >-
          Delete the rules that set outline to none or 0, so the browser draws
          its default focus outline again.
        watch_out: >-
          The default outline differs between browsers and can be hard to see
          on dark or colored areas. Check it there.
      - label: "Add your own focus style"
        approach: >-
          Write a clear outline or border for the focus state, in a
          :focus-visible style rule (it shows the style when a person uses the
          keyboard).
        watch_out: >-
          An older rule that still sets outline: none can win over your new
          style. Test with the Tab key on real pages, not only in the
          stylesheet.
      - label: "Change the style with a script on focus"
        approach: >-
          Use a script to change the background or border when the element
          gets focus, and change it back when focus leaves.
        watch_out: >-
          The rule check (Alfa) cannot see changes made by a script, so this
          element will keep showing as Needs review. Never use a script that
          moves focus away from the element: that is a known WCAG failure.
    verify_manual: >-
      Put the mouse aside and press Tab and Shift+Tab until this element has
      focus. You should clearly see which element has focus, for as long as it
      has it. If you can, mark the occurrence Not a problem (false positive):
      the change comes from something the check does not measure, such as a
      script.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every element you can reach with the Tab key shows a clear, visible
      change while it has keyboard focus.
    confidence_default: low

  sia-r66:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) measures the contrast ratio of visible text: how
      much lighter one color is than the other, from 1:1 to 21:1. Text fails
      when even the best pair of its text and background colors is under 7:1,
      or under 4.5:1 for large text. Sometimes Alfa cannot work out the
      colors, for example because of a <code>text-shadow</code>, a background
      image or an element placed over the text. Then it cannot decide, and the
      issue shows as Needs review.
    why_matters: >-
      People with low vision find it hard to read text that does not stand out
      from its background. W3C chose 7:1 to make up for the loss of contrast
      sensitivity that usually comes with vision of about 20/80.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Decide if your site aims for Level AAA. Axcess runs this rule only in
        scans set to Level AAA. W3C does not advise requiring Level AAA for a
        whole site, because some content cannot meet every AAA criterion.
      - >-
        Read the check's message for each occurrence. A failed occurrence
        gives the best ratio Alfa found. For example: "The highest possible
        contrast of the text is 5.74:1 which is below the required contrast of
        7:1". An occurrence Alfa could not decide lists the reason, such as "A
        text-shadow was encountered". For text over an image or gradient, you
        can put the text on a solid panel.
      - >-
        Pick a darker text color (or a lighter background) that reaches 7:1
        for normal text, or 4.5:1 for large text. Alfa counts text as large at
        18pt (24px) or bigger, or at 14pt (about 18.7px) or bigger with a font
        weight of 700 or more. For example, on white, <code>#666666</code>
        gives 5.74:1 and fails, while <code>#595959</code> gives 7.00:1.
      - >-
        Change the color in the shared style (the design token or CSS custom
        property, such as <code>--text-muted: #595959;</code>), not on each
        element. One shared color often causes many occurrences. Text under
        4.5:1 (3:1 if large) also appears in the Level AA contrast issue, so
        one fix can close both.
    fix_options:
      - label: "Darken the text or lighten the background"
        approach: >-
          Change one of the two colors until the pair reaches 7:1, or 4.5:1
          for large text. A muted gray or a brand color used for text is the
          usual cause.
        watch_out: >-
          A color that reaches 7:1 on white can miss it on a light gray panel.
          Check every background the color sits on, and every state, such as
          hover, focus and visited. A brand color may need a separate, darker
          shade used only for text.
      - label: "Make the text large"
        approach: >-
          Large text only needs 4.5:1. Making a heading or short label 24px,
          or about 18.7px in bold, can fix a near miss without a color change.
        watch_out: >-
          Bold means a font weight of 700 or more. Semibold (600) still counts
          as normal text and needs 7:1. Bigger text can also break the layout
          on narrow screens, so check it at 320px wide.
      - label: "Offer a high-contrast view"
        approach: >-
          Add a clearly labeled control that switches the page to colors that
          reach 7:1 (W3C technique G174). This can suit a design that must
          keep its default colors.
        watch_out: >-
          The scan checks the default view, so it will still report these
          occurrences. The control itself must reach 7:1 and be easy to find.
          The high-contrast view must keep all the same content and features.
    verify_manual: >-
      Check the text color against the background with a contrast tool, such
      as the color picker in your browser's developer tools. If Alfa could not
      decide, measure the text against the lightest or darkest part behind it,
      such as an image, gradient or overlapping element. Text in a logo, in a
      disabled control, or used only as decoration does not need to meet this
      level.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this text is still found.
    acceptance: >-
      Every piece of visible text has a contrast ratio of at least 7:1 with
      its background, or at least 4.5:1 if it is large text.
    confidence_default: medium

  sia-r67:
    abilities_affected: [vision]
    what_happening: >-
      This rule check (Alfa) looks at <code>&lt;img&gt;</code> and
      <code>&lt;svg&gt;</code> elements marked as decoration: an
      <code>&lt;img&gt;</code> with <code>alt=""</code>, or either element
      with <code>role="none"</code> or <code>role="presentation"</code>. It
      fails when the browser still shows the element to screen readers as an
      image. This happens when the element has a <code>tabindex</code>, even
      <code>tabindex="-1"</code>. It also happens with an Accessible Rich
      Internet Applications (ARIA) attribute that any element can have, such
      as <code>aria-label</code>. Alfa links this to WCAG 1.1.1, but it is a
      WCAG problem only when the image really is decoration.
    why_matters: >-
      The code says both "skip this" and "read this". So screen reader users
      may hear an image that should have been skipped, often with no useful
      name. Browsers settle this conflict in different ways, so some users
      hear it and others do not.
    owner: dev
    effort: under_15m
    fix_steps:
      - "Decide whether the image is really decoration or gives information."
      - >-
        If it is decoration, remove what exposes it: take off
        <code>tabindex</code>, <code>aria-label</code>,
        <code>aria-labelledby</code>, <code>aria-describedby</code> and
        similar ARIA attributes. Example: <code>&lt;img src="divider.png"
        alt=""&gt;</code>
      - >-
        If it gives information, remove the decoration mark and give it a real
        name instead. Example: <code>&lt;img src="map.png" alt="Map of the
        north campus"&gt;</code>
      - >-
        For a decorative SVG, you can also hide it from screen readers with
        <code>aria-hidden="true"</code>: <code>&lt;svg
        aria-hidden="true"&gt;</code>
    fix_options:
      - label: "Keep it decorative and remove the conflict"
        approach: >-
          Remove tabindex and ARIA attributes such as aria-label from the
          element so the decoration mark works in every browser.
        watch_out: >-
          If a script or style needs the element to take focus, move that
          behaviour to a real control, such as a button with a name.
          aria-hidden="true" is fine to keep, because it hides the element.
      - label: "Treat it as a real image"
        approach: >-
          If the aria-label or focus was added because the image matters,
          remove alt="" or the none role and give it alt text or a name.
        watch_out: >-
          Only do this if the image gives information. Naming pure decoration
          adds noise for screen reader users.
    verify_manual: >-
      Inspect each flagged element in the accessibility panel of the browser's
      developer tools. A decorative image should show no image role, or not
      appear at all. Also check its code: it should have no tabindex, even
      tabindex="-1", and no aria-label or aria-labelledby.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if these
      decorative images are still found.
    acceptance: >-
      Every image marked as decoration is skipped by screen readers, and every
      image that gives information has a real name instead of a decoration
      mark.
    confidence_default: medium

  sia-r68:
    abilities_affected: [vision]
    what_happening: >-
      Some roles must hold certain items: a list holds list items, a tab list
      (<code>tablist</code>) holds tabs, and a table row holds cells. The rule
      check (Alfa) looks at the element's direct children in the page
      structure screen readers use (accessibility tree). It fails the element
      when none of them has a needed role. Examples: a table row
      (<code>&lt;tr&gt;</code>) with no cells or only hidden cells, or a
      <code>&lt;ul role="tablist"&gt;</code> whose children are list items,
      not tabs. It skips plain wrappers, and it skips an element with
      <code>aria-busy="true"</code> and everything inside it.
    why_matters: >-
      Screen readers use these items to tell people what a container holds,
      and to move through it, for example cell by cell in a table. People
      cannot use an empty or wrongly filled container, and screen readers
      handle it in different ways.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the role of the flagged element and the items it needs. A
        <code>list</code> needs <code>listitem</code>, and a
        <code>tablist</code> needs <code>tab</code>. A <code>row</code> needs
        <code>cell</code>, <code>gridcell</code>, <code>columnheader</code> or
        <code>rowheader</code>. A <code>table</code> or <code>grid</code>
        needs <code>row</code>. A <code>menu</code> or <code>menubar</code>
        needs menu items, and a <code>listbox</code> needs
        <code>option</code>.
      - >-
        Remove empty <code>&lt;tr&gt;</code> rows used for spacing, and use
        CSS padding or margin instead. If every cell in a row is hidden, hide
        the row too.
      - >-
        For a tab list built on a list, make each list item a plain wrapper so
        the tabs are its children. Example: <code>&lt;ul
        role="tablist"&gt;&lt;li role="presentation"&gt;&lt;a role="tab"
        aria-selected="true"
        href="#panel-1"&gt;Overview&lt;/a&gt;&lt;/li&gt;&lt;/ul&gt;</code>
      - >-
        If script adds the items after the page loads, set
        <code>aria-busy="true"</code> on the container while it loads. Set it
        back to <code>false</code> once the items are in.
    fix_options:
      - label: "Give the children the needed role"
        approach: >-
          Put the right role on the items, or make the wrappers between the
          container and the items plain with role="presentation".
        watch_out: >-
          The new roles bring their own rules. Tabs, for example, need states
          such as aria-selected and arrow-key support.
      - label: "Remove the empty container or its role"
        approach: >-
          Delete containers with nothing in them, such as empty table rows. If
          the element is not really a list, menu or tab list, remove its role.
        watch_out: >-
          Removing a role from a real widget takes away its meaning for screen
          reader users. Only remove it when the element does not act like that
          widget.
      - label: "Mark a loading container as busy"
        approach: >-
          While script is still adding the items, set aria-busy="true" on the
          container.
        watch_out: >-
          Write the value in lower case, because some browsers only read
          "true". Set it back to false when loading ends. This is only for
          content that is still loading, not a way to hide a container that
          stays empty.
    verify_manual: >-
      Open the browser's accessibility panel (accessibility tree) and check
      that the container's direct children have the needed roles, for example
      that each row holds cells. Alfa passes a container with one right child,
      so also check that it holds no other kinds of items. Then move through
      the container with a screen reader and check that you can reach each
      item.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every container whose role needs certain items holds at least one of
      them and no other kinds of items, not counting plain wrappers.
    confidence_default: medium

  sia-r69:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) measures the difference in lightness between each
      piece of visible text and its background (contrast ratio). The ratio
      runs from 1:1 to 21:1. It fails when even the best possible pair of text
      and background colors is under 4.5:1, or under 3:1 for large text. When
      it cannot work out the colors, the issue shows as Needs review. That
      happens with a background image, a <code>background-size</code> or a
      <code>text-shadow</code>. It also happens when an element moved with the
      CSS <code>position</code> property may sit between the text and its
      background. The message for each occurrence says which. It skips text in
      disabled controls and text that is only punctuation or symbols.
    why_matters: >-
      People with low vision, color blindness or age-related vision loss
      cannot read text that does not stand out from its background. W3C chose
      4.5:1 to make up for the contrast loss that comes with vision of about
      20/40.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Read the message for each occurrence. For a failed occurrence, the
        message gives the best ratio found and the ratio needed. For example:
        "The highest possible contrast of the text is 4.01:1 which is below
        the required contrast of 4.5:1".
      - >-
        Pick a darker text color, or a lighter background, that reaches 4.5:1.
        Large text needs 3:1. Large text is 24px (18pt) or bigger, or about
        18.7px (14pt) or bigger in bold. Do not round up: 4.49:1 fails.
      - >-
        Change the color in the shared style (the design token or CSS custom
        property), not on each element. For example, on white,
        <code>--text-muted: #767676;</code> gives 4.54:1.
      - >-
        For text on a photo or pattern, put the text on a solid panel, or add
        a solid backing color behind it. Measure against the part of the image
        that is closest in color to the text.
    fix_options:
      - label: "Change the text or background color"
        approach: >-
          Darken the text or lighten the background until the pair reaches
          4.5:1, or 3:1 for large text. A light gray or a brand color used for
          text is the usual cause.
        watch_out: >-
          Check every background the color sits on, and every state, such as
          hover, focus and visited. A color that passes on white can fail on a
          light gray panel.
      - label: "Put the text on a solid surface"
        approach: >-
          Place text that sits on an image or gradient on a solid panel, so
          its contrast no longer depends on what is behind it.
        watch_out: >-
          A see-through panel lets the image show through. Measure the
          contrast at the spot where the image is closest in color to the
          text, not on average. For white text, that is the lightest spot.
      - label: "Make the text large"
        approach: >-
          Large text only needs 3:1. Making a heading or short label 24px, or
          about 18.7px in bold, can fix a near miss without a color change.
        watch_out: >-
          The rule check (Alfa) counts text as bold only at a font weight of
          700 or more. Semibold (600) still needs 4.5:1. Bigger text can also
          break the layout on small screens.
    verify_manual: >-
      For a Needs review occurrence, find the real colors behind the text. Use
      the color picker in your browser's developer tools, or pick colors from
      a screenshot. If an image, gradient or shape is behind the text, measure
      at the spot that is closest in color to the text. If a positioned
      element was the reason, check whether it really covers the text. Text in
      a logo, and text that is only decoration, does not need to meet the
      ratio. If the pair reaches 4.5:1, or 3:1 for large text, mark the
      occurrence Not a problem (false positive). The rule check (axe) has a
      similar rule, so check that issue too.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      text is still found.
    acceptance: >-
      Every piece of visible text except logos and decoration has at least
      4.5:1 contrast with its background, or 3:1 for large text.
    confidence_default: medium

  sia-r71:
    abilities_affected: [cognition]
    what_happening: >-
      The rule check (Alfa) looks at every visible paragraph, such as a
      <code>&lt;p&gt;</code> element. It fails a paragraph whose final style
      (computed CSS) has <code>text-align: justify</code>, so each line
      stretches to touch both the left and the right edge. Axcess runs this
      rule only in scans set to Level AAA.
    why_matters: >-
      Justified text puts uneven gaps between words, which can form "rivers"
      of white space down the paragraph. People with certain cognitive
      disabilities can find this text hard or impossible to read. They may
      struggle to see where one word ends and the next begins.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the style rule that sets <code>text-align: justify</code> for the
        paragraph. It may be in the site's stylesheet, in an inline style such
        as <code>style="text-align: justify"</code>, or on a parent element
        that passes it down.
      - >-
        Align the text to one side instead, for example <code>p { text-align:
        start; }</code>. In left-to-right languages <code>start</code> means
        left. In right-to-left languages it means right.
      - >-
        If the design must offer justified text, keep one-side alignment as
        the default and add a control that turns justification on. The rule
        check (Alfa) looks only at the default view, so a justified default
        still shows up.
    fix_options:
      - label: "Align text to one side in the shared stylesheet"
        approach: >-
          Replace <code>text-align: justify</code> with <code>left</code>,
          <code>right</code> or <code>start</code> in the rule that styles
          body text (W3C techniques C19 and G169).
        watch_out: >-
          Content editors can add justification back with a "Justify" button
          in the page editor, which writes an inline style. Remove that button
          from the editor, or remove those inline styles from existing
          content.
      - label: "Offer a switch to turn justification off"
        approach: >-
          Keep the justified design, but give people a clearly labeled control
          near the top of the page that removes full justification (W3C
          technique G172).
        watch_out: >-
          The scan checks the default view, so it will still report these
          occurrences. Siteimprove's rule page suggests the reverse: one-side
          alignment by default, with a control to justify.
    verify_manual: >-
      Look at the paragraph on the live page: one edge of the text should be
      ragged, and the gaps between words should be even. WCAG asks for this
      only in blocks of text (more than one sentence), so a one-sentence
      paragraph does not need a fix. A control on the page that removes
      justification also meets this WCAG criterion, even though the rule check
      (Alfa) still reports the paragraph.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this paragraph is still found.
    acceptance: >-
      Every paragraph of text is aligned to one side and none has text-align:
      justify.
    confidence_default: high

  sia-r73:
    abilities_affected: [cognition, vision]
    what_happening: >-
      The rule check (Alfa) looks at every visible paragraph, such as a
      <code>&lt;p&gt;</code> element. It fails a paragraph whose line height
      (the CSS <code>line-height</code>) is less than 1.5 times its font size.
      It also fails the browser default, <code>line-height: normal</code>,
      which is about 1.2 in desktop browsers. Axcess runs this rule only in
      scans set to Level AAA.
    why_matters: >-
      Lines that sit close together are hard to follow. Wider line spacing
      helps people with some cognitive disabilities and some people with low
      vision keep their place and move to the next line.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Read the check's message. If it says the line height is "normal", no
        line height was set, so the browser default applies. If it says "less
        than 1.5", a value was set but it is too small.
      - >-
        Set a line height of at least 1.5 on body text, as a number with no
        unit (unitless), for example <code>p { line-height: 1.5; }</code>. A
        number with no unit scales with the font size of each element.
      - >-
        Also make the space between paragraphs at least 1.5 times the line
        spacing, for example with a bottom margin on <code>p</code>. WCAG asks
        for this too, but the rule check (Alfa) does not check it, so a person
        must.
    fix_options:
      - label: "Set a unitless line height of 1.5 or more"
        approach: >-
          Add <code>line-height: 1.5</code> (or more) to the rule that styles
          body text, such as <code>body</code> or <code>p</code> (W3C
          technique C21).
        watch_out: >-
          A more specific rule, such as a component class, can set a smaller
          line height and win over the shared rule. Check every paragraph
          style, and check that boxes with a fixed height do not now cut off
          the text.
      - label: "Use a length based on the font size"
        approach: >-
          Set the line height in <code>em</code> or <code>%</code>, such as
          <code>line-height: 1.5em</code>. Alfa compares that length with the
          font size.
        watch_out: >-
          The browser works out this length once and passes it down to child
          elements as a fixed size. A child with bigger text can end up with
          lines that are too close. A unitless number avoids this.
    verify_manual: >-
      In browser developer tools, check that the paragraph's computed line
      height is at least 1.5 times its font size, such as 24px for 16px text.
      Also check that paragraphs have a clear gap between them. WCAG asks for
      this only in blocks of text (more than one sentence), so a one-sentence
      paragraph does not need a fix.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this paragraph is still found.
    acceptance: >-
      Every paragraph of text has a line height of at least 1.5 times its font
      size.
    confidence_default: high

  sia-r74:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at visible paragraphs with text, such as a
      <code>&lt;p&gt;</code> element, that set their own font size. It fails
      the paragraph when that font size uses a fixed (absolute) unit, such as
      <code>font-size: 12px</code> or <code>10pt</code>. Relative units such
      as <code>rem</code>, <code>em</code> and <code>%</code>, size keywords,
      and <code>calc()</code> pass. Axcess runs this rule only in scans set to
      Level AAA.
    why_matters: >-
      People with low vision often set a larger default text size in their
      browser. Some browsers cannot change text whose size is set in pixels,
      so these people cannot make it bigger that way.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the style rule that sets the paragraph's font size. The element
        locator (XPath) in each occurrence points to the paragraph. Look for
        the matching rule in your browser's developer tools.
      - >-
        Change the fixed unit to a relative one. <code>rem</code> is sized
        from the page's root font size, which follows the reader's browser
        setting. For example, change <code>p { font-size: 18px; }</code> to
        <code>p { font-size: 1.125rem; }</code> (18 divided by 16).
      - >-
        Do not set the root font size in pixels, such as <code>html {
        font-size: 16px; }</code>. That would stop every <code>rem</code> size
        from following the reader's setting.
      - >-
        Do not hide a pixel size inside <code>calc()</code>, such as
        <code>calc(18px)</code>. The rule passes any <code>calc()</code>
        value, but the text still will not follow the reader's setting.
    fix_options:
      - label: "Use rem units"
        approach: >-
          Size paragraph text in <code>rem</code>. Every <code>rem</code> size
          is based on the root font size, so one browser setting scales all
          text together.
        watch_out: >-
          If the root font size is set in pixels, <code>rem</code> sizes stop
          following the reader's setting. Leave the root size unset, or set it
          as a percentage such as <code>100%</code>.
      - label: "Use em or percent units"
        approach: >-
          Size text in <code>em</code> or <code>%</code>, relative to the
          parent element's font size (W3C techniques C14 and C12).
        watch_out: >-
          These sizes multiply when elements are nested. A paragraph at 0.9em
          inside a box at 0.9em comes out at 0.81 times the base size, which
          can make text smaller than you meant.
    verify_manual: >-
      Set your browser's default font size to "Very large" (for example, in
      Chrome's appearance settings), reload the page, and check that the
      paragraph text grows. WCAG accepts any way to resize text to 200%,
      including the browser's own zoom. So also zoom the page to 200%, and
      check that you can read each line without scrolling sideways. WCAG asks
      for this only in blocks of text (more than one sentence).
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this paragraph is still found.
    acceptance: >-
      Every paragraph of text has a relative font size, such as rem, em or
      percent, and grows when the reader raises the browser text size.
    confidence_default: medium

  sia-r76:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at each visible header cell
      (<code>&lt;th&gt;</code>) in a table that screen readers can reach. It
      expects the cell to work as a column header or a row header (role
      <code>columnheader</code> or <code>rowheader</code>). This cell fails
      because the browser treats it as a plain cell. This happens when a
      <code>&lt;th&gt;</code> with no <code>scope</code> has data cells that
      are not empty both in its row and in its column. An example is a
      top-left <code>&lt;td&gt;Open&lt;/td&gt;</code> in the header row.
    why_matters: >-
      Screen readers read a header's text along with each data cell it labels.
      When the header is not treated as a header, screen reader users hear
      values without knowing which row or column they belong to.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Decide what the cell labels: the cells below it (a column), the cells
        beside it (a row), or nothing at all.
      - >-
        If it labels a column, add <code>scope="col"</code>. If it labels a
        row, add <code>scope="row"</code>. For example: <code>&lt;th
        scope="row"&gt;Monday&lt;/th&gt;</code>.
      - >-
        If it labels nothing and is only there for bold or centered text,
        change it to <code>&lt;td&gt;</code> and style it with a style sheet
        (CSS).
      - >-
        Look in the header row and header column for data cells
        (<code>&lt;td&gt;</code>) that hold text, such as a top-left corner
        cell. Leave that cell empty, make it a <code>&lt;th&gt;</code>, or
        remove it if it does not belong there.
    fix_options:
      - label: "Tell the browser which cells the header labels"
        approach: >-
          Add scope="col" or scope="row" to the header cell. Use
          scope="colgroup" or scope="rowgroup" when the header labels a group
          of columns or rows.
        watch_out: >-
          The scope must match what the header means on screen. A wrong scope
          makes screen readers read the header with the wrong cells, which is
          worse than no header.
      - label: "Turn it into a data cell"
        approach: >-
          If the text labels no other cells, change the th to a td and keep
          its look with CSS.
        watch_out: >-
          Only do this when the text truly labels nothing. If it names a row
          or column, changing it to td removes the link that screen reader
          users need.
      - label: "Rebuild a complex table"
        approach: >-
          If headers sit in the middle of the table, fix the row and column
          structure. Or split it into smaller tables that each have one clear
          header row or column.
        watch_out: >-
          Splitting a table changes how people compare values across it. Keep
          related data in the same table and give each new table a caption.
    verify_manual: >-
      Turn on a screen reader and move through the table with its table keys
      (VoiceOver on macOS: Control+Option+arrow keys; NVDA on Windows:
      Control+Alt+arrow keys). When you move to a data cell, you should hear
      this header's text. Also decide whether this cell's text labels other
      cells, because the rule check expects every th to be a header. If it
      does, it must work as a header. If not, it should be a plain cell (td).
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      header cell is still found.
    acceptance: >-
      Every th in a data table works as a row or column header for the cells
      it labels, and cells that label nothing use td.
    confidence_default: high

  sia-r77:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at each visible data cell
      (<code>&lt;td&gt;</code>) in a table that has at least one header cell
      (<code>&lt;th&gt;</code>). It fails when no header applies to the cell.
      There is none above it in its column and none before it in its row. No
      <code>headers</code> attribute points to one either. For example, a
      table has one header, "Mon-Fri", but two data cells below it, "8-17" and
      "10-14", so "10-14" has no header. Other causes are a short header row,
      empty header cells, and header cells that do not work as headers (rule
      sia-r76).
    why_matters: >-
      Screen readers read a data cell together with its headers so the value
      makes sense. A cell with no header is read alone, so screen reader users
      hear "10-14" without knowing which day it is for.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the row and column of the flagged cell, and check which header
        should describe it.
      - >-
        Add the missing header cells so every column (or row) of data has one.
        For example: <code>&lt;tr&gt;&lt;th
        scope="col"&gt;Mon-Fri&lt;/th&gt;&lt;th
        scope="col"&gt;Sat&lt;/th&gt;&lt;/tr&gt;
        &lt;tr&gt;&lt;td&gt;8-17&lt;/td&gt;&lt;td&gt;10-14&lt;/td&gt;&lt;/tr&gt;</code>.
      - >-
        If one header should cover several columns, give it a
        <code>colspan</code> that covers all of them. For tables too complex
        for that, give the data cell a <code>headers</code> attribute that
        lists the <code>id</code> of each header cell it belongs to.
      - >-
        If the table only lays out the page and holds no data, remove its
        <code>&lt;th&gt;</code> cells. Or rebuild the layout with a style
        sheet (CSS).
    fix_options:
      - label: "Add the missing headers"
        approach: >-
          Give every column or row of data a th with a short, clear label, and
          make the header row as wide as the data rows.
        watch_out: >-
          An empty th does not count as a header, so the cell still fails.
          Write real text in each header, even if you hide it visually with a
          screen-reader-only class.
      - label: "Link cells to headers with the headers attribute"
        approach: >-
          Give each header cell an id, then list those ids in the headers
          attribute of each data cell, separated by spaces.
        watch_out: >-
          When a cell has a headers attribute, only the headers listed there
          apply to it. List every header it needs, and keep each id unique on
          the page.
      - label: "Replace a layout table"
        approach: >-
          If the table only places content side by side, rebuild it with CSS
          layout (grid or flexbox) instead of a table.
        watch_out: >-
          Check that the content is truly not data first. Many tables that
          look like layout still compare values across rows and need headers.
    verify_manual: >-
      Turn on a screen reader and move through the table with its table keys
      (VoiceOver on macOS: Control+Option+arrow keys; NVDA on Windows:
      Control+Alt+arrow keys). Each data cell should be read with its row or
      column header. Also decide whether this cell holds data that needs a
      label, because the rule check assumes it does. If it does, it needs a
      header.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      data cell is still found.
    acceptance: >-
      Every data cell (td) in a table with headers is linked to at least one
      header cell that describes it.
    confidence_default: high

  sia-r80:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks at visible paragraphs with text, such as a
      <code>&lt;p&gt;</code> element, that set their own line height. It fails
      the paragraph when the line height uses a fixed (absolute) unit, such as
      <code>line-height: 15px</code>. A number with no unit, <code>em</code>,
      <code>%</code>, keywords and <code>calc()</code> pass. Axcess runs this
      rule only in scans set to Level AAA.
    why_matters: >-
      A fixed line height does not grow when the text grows. When someone with
      low vision or a reading difficulty sets bigger text in the browser, the
      lines can crowd together or overlap.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the style rule that sets the paragraph's <code>line-height</code>
        in a fixed unit, such as <code>px</code> or <code>pt</code>.
      - >-
        Replace it with a number with no unit (unitless). Divide the old line
        height by the font size: 24px on 16px text becomes <code>line-height:
        1.5;</code>.
      - >-
        Keep the number at 1.5 or more. The rule check (Alfa) also checks that
        paragraph line height is at least 1.5 times the font size, in a
        separate issue.
    fix_options:
      - label: "Use a unitless line height"
        approach: >-
          Set <code>line-height</code> as a plain number, such as
          <code>1.5</code>. The browser multiplies it by each element's own
          font size, so the spacing grows with the text (W3C technique C21).
        watch_out: >-
          A component style with its own fixed line height can still win over
          the shared rule. Search the stylesheets for every
          <code>line-height</code> set in <code>px</code>.
      - label: "Use em units"
        approach: >-
          Set the line height in <code>em</code>, such as <code>line-height:
          1.5em</code>. It is based on the font size, so it passes this rule.
        watch_out: >-
          The browser works out an <code>em</code> line height once and passes
          it down to child elements as a fixed size. A child with bigger text
          can get lines that are too close. A unitless number avoids this.
    verify_manual: >-
      Set your browser's default font size to "Very large" and reload the
      page. The gap between lines should grow with the text, and lines should
      never overlap. If the text itself does not grow, its font size is fixed
      too, which is a separate issue.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this paragraph is still found.
    acceptance: >-
      Every paragraph of text sets its line height without a fixed unit, so
      the spacing grows when the text grows.
    confidence_default: medium

  sia-r81:
    abilities_affected: [vision, motor, cognition]
    what_happening: >-
      This rule check (Alfa) finds two or more links with the same accessible
      name (the name a screen reader reads) in the same surroundings. It
      compares the list item, paragraph and table cell each link sits in, and
      any text it points to with <code>aria-describedby</code>. Links that sit
      in none of these count as having the same surroundings, even when they
      are far apart. When the links point to different addresses, Alfa cannot
      tell whether they serve the same purpose, so a person must decide.
    why_matters: >-
      Screen reader users can list a page's links away from the text around
      them, and cannot tell same-named links apart. People with cognitive
      disabilities may follow the wrong one and get lost.
    owner: content
    effort: under_2h
    fix_steps:
      - >-
        Use the element locators (XPath) of each occurrence to find the set of
        links, and follow each one. The occurrence lists up to three of the
        links, so look on the page for others with the same name.
      - >-
        If they lead to the same page, or to pages with the same purpose,
        there is nothing to fix. Mark the occurrence Not a problem (false
        positive).
      - >-
        If they lead to different places, change the text so each link names
        its own destination. For example, change two "Read more" links to
        <code>&lt;a href="/budget"&gt;Read more about the
        budget&lt;/a&gt;</code> and <code>&lt;a href="/staff"&gt;Read more
        about our staff&lt;/a&gt;</code>.
    fix_options:
      - label: "Give each link its own visible text"
        approach: >-
          Rewrite the link text so it names the destination, such as "Contact
          us by chat" and "Contact us by phone".
        watch_out: >-
          A picture or icon next to the link, or drawn with CSS, is not part
          of its name. W3C's test rule shows that links told apart only by
          such pictures still fail.
      - label: "Add hidden words for screen readers"
        approach: >-
          Keep the short visible text and add words that are hidden on screen
          but read by screen readers, so each link's name is different.
        watch_out: >-
          The name must still contain the visible words, best at the start, so
          speech input users can say them (WCAG 2.5.3). Sighted people still
          see identical links, so visible text is often better.
      - label: "Confirm the links serve the same purpose"
        approach: >-
          If the links lead to the same page, or to pages that give the same
          help, keep them. Mark the occurrence Not a problem (false positive).
        watch_out: >-
          The pages must serve the same purpose, not just look alike. A
          redirect that waits before it moves does not count as the same page;
          an instant one does.
    verify_manual: >-
      Follow every link in the set: if they reach the same page, or pages that
      serve the same purpose, it is not a problem. If they reach different
      places, it is a problem, unless the purpose would be unclear to every
      reader, not just to screen reader users. The next scan lists the set
      again while the links' addresses differ.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this set
      of links is still found.
    acceptance: >-
      Every set of links with the same name and the same surroundings leads to
      the same page, or to pages that serve the same purpose.
    confidence_default: low

  sia-r84:
    abilities_affected: [vision, motor]
    what_happening: >-
      The rule check (Alfa) looks for boxes that may scroll: boxes with
      <code>overflow: auto</code> or <code>scroll</code> and a set height or
      width. A set width counts only when text wrapping is turned off (for
      example <code>white-space: nowrap</code>). It fails the box when neither
      the box nor anything inside it can be reached with the Tab key
      (sequential focus navigation). Alfa does not measure whether the content
      really overflows, so it can flag a box that has nothing to scroll.
    why_matters: >-
      People who use only a keyboard scroll a box with the arrow keys once
      focus is in it. They include many blind people, and people who use
      speech input or other tools that act like a keyboard. If focus can never
      reach the box, they cannot reach the hidden part of its content.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Check that the box really scrolls: make the window narrow or zoom in,
        and see if some content is hidden until you scroll. If it never
        scrolls, remove the <code>overflow</code> setting or the fixed size.
      - >-
        If it scrolls and has no link, button or field inside, make the box
        focusable. Give it a role and a name, so a screen reader can announce
        it. For example: <code>&lt;div class="table-wrap" tabindex="0"
        role="region" aria-label="Fees table"&gt;</code>.
      - >-
        Use <code>tabindex="0"</code>, not <code>tabindex="-1"</code>. The Tab
        key cannot reach an element with a negative tabindex, so the rule
        still fails.
      - >-
        Make sure the box shows a clear focus outline, so keyboard users can
        see where they are.
    fix_options:
      - label: "Make the scroll box focusable"
        approach: >-
          Add <code>tabindex="0"</code> to the box, with
          <code>role="region"</code> and an accessible name (the name a screen
          reader reads) from <code>aria-label</code> or
          <code>aria-labelledby</code>.
        watch_out: >-
          Each focusable box adds a Tab stop and a region that screen readers
          announce, even at screen sizes where it does not scroll. Add it only
          to boxes that really scroll.
      - label: "Rely on focusable content inside the box"
        approach: >-
          If the box holds links, buttons or form fields, a keyboard user can
          tab to one of them. Focus is then inside the box, and they can
          scroll it with the arrow keys. The rule passes when at least one of
          them can be reached with Tab.
        watch_out: >-
          Hidden or disabled controls, and controls with
          <code>tabindex="-1"</code>, do not count. If the only control is at
          the top, check that you can still reach text further down.
      - label: "Remove the scroll box"
        approach: >-
          Let the content take the space it needs, so it flows with the rest
          of the page and no inner scrolling is needed.
        watch_out: >-
          Wide content, such as a data table, may then make the whole page
          scroll sideways on narrow screens. Check the page at 320px wide.
    verify_manual: >-
      Use only the keyboard: press Tab until focus is on the box or inside it,
      then scroll through all its content with the arrow keys. Firefox, and
      Chrome from version 132, let you tab to some scroll boxes on their own,
      but Safari may not. So test in Safari too, and check that no script
      blocks the arrow keys. If the box has nothing to scroll, or its content
      is only decoration, this occurrence is not a problem.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      scroll box is still found.
    acceptance: >-
      Every box that scrolls, or something inside it, can be reached with Tab,
      and its content can then be scrolled with the arrow keys.
    confidence_default: medium

  sia-r90:
    abilities_affected: [vision]
    what_happening: >-
      Some kinds of element (roles) treat everything inside them as plain
      content, not as separate parts (presentational children). Examples are
      button, checkbox, radio, switch, tab, option, slider, menuitemcheckbox,
      menuitemradio, img, progressbar, meter, scrollbar and separator. This
      rule check (Alfa) fails when such an element has something inside it
      that the Tab key can reach. For example, a link inside a
      <code>&lt;button&gt;</code>, or a close button inside an element with
      <code>role="tab"</code>.
    why_matters: >-
      In browsers that follow this ARIA rule, screen readers do not get the
      inner item. When focus lands on it, there is no name and no role to
      announce. So screen reader users do not know what they reached or what
      it will do.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Look at each flagged element and find the inner item that the Tab key
        reaches, such as <code>&lt;a href&gt;</code>,
        <code>&lt;input&gt;</code>, <code>&lt;button&gt;</code> or anything
        with <code>tabindex="0"</code>.
      - >-
        Move the inner control out so the two controls sit side by side.
        Wrong: <code>&lt;button&gt;Save &lt;span role="button"
        tabindex="0"&gt;▼&lt;/span&gt;&lt;/button&gt;</code>. Right:
        <code>&lt;button&gt;Save&lt;/button&gt; &lt;button aria-label="Save
        options"&gt;▼&lt;/button&gt;</code>
      - >-
        If the inner item is only there for looks, take it out of the Tab
        order. For example, a checkbox drawn inside an element with
        <code>role="menuitemcheckbox"</code> can be <code>&lt;input
        type="checkbox" role="none" disabled&gt;</code>.
        <code>role="none"</code> helps browsers that ignore this ARIA rule.
      - >-
        If the inner control is the real control, check whether the outer role
        is wrong. For example, remove <code>role="checkbox"</code> from a
        paragraph that holds a link. Use a real <code>&lt;input
        type="checkbox"&gt;</code> with a label, and put the link next to it.
    fix_options:
      - label: "Place the controls side by side"
        approach: >-
          Split the nested controls into siblings, each with its own name. A
          split button becomes two buttons. A checkbox label that holds a link
          becomes a checkbox, then its label text, then the link.
        watch_out: >-
          Each new control needs its own accessible name (the name a screen
          reader reads). An icon-only button needs one too, for example from
          aria-label.
      - label: "Take the inner item out of the Tab order"
        approach: >-
          If the inner item is decoration or repeats the outer control, add
          disabled (for form fields) or tabindex="-1" so only the outer
          control gets focus.
        watch_out: >-
          Only do this if the inner item has no job of its own. If it opens a
          link or does an action, people who use a keyboard or screen reader
          lose it.
      - label: "Change the outer role"
        approach: >-
          Sometimes the outer element is really a set of controls, not one
          control. Then give it a role that allows controls inside (for
          example role="group"), or no role.
        watch_out: >-
          The new role must still match how the component works. A wrong role
          creates a new Name, Role, Value problem.
    verify_manual: >-
      Press Tab through the component with a screen reader on (VoiceOver or
      NVDA) in more than one browser, because browsers differ on this ARIA
      rule. Each stop should read a name and a role, and no stop should be
      inside the flagged element. If focus leaves the inner item at once, the
      page may still meet WCAG 4.1.2, so a person must decide.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found.
    acceptance: >-
      Every button, checkbox, tab, option or other element whose role treats
      its content as plain content holds nothing the Tab key can reach.
    confidence_default: medium

  sia-r91:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks for text whose letter spacing is set in a
      <code>style</code> attribute with <code>!important</code>, for example
      <code>&lt;p style="letter-spacing: 0.1em !important"&gt;</code>. It
      fails when that spacing is less than 0.12 times the font size. The style
      can sit on the flagged element or on a parent element that passes it
      down. Tools that add their own styles to the page, such as many browser
      extensions, cannot override a style like this.
    why_matters: >-
      Some people with low vision or dyslexia add space between letters. They
      use a browser extension, or a bookmark that runs a small script on the
      page (bookmarklet). These tools cannot override an important style in a
      style attribute, so the text stays cramped for them.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the <code>style</code> attribute that sets the spacing. It is on
        the flagged element or on one of its parents. For example, <code>&lt;p
        style="letter-spacing: 0.05em !important"&gt;</code>.
      - >-
        Remove <code>!important</code> from that style: <code>&lt;p
        style="letter-spacing: 0.05em"&gt;</code>. Better still, move the
        style into your stylesheet, so a reading tool can override it.
      - >-
        If the style must stay important, set it to at least 0.12 times the
        font size, for example <code>letter-spacing: 0.12em !important</code>.
      - >-
        If a rich-text editor, page builder or template writes this style, fix
        it there, so new content does not bring the problem back.
    fix_options:
      - label: "Remove !important from the style attribute"
        approach: >-
          Keep the design's spacing, but drop the important flag, or move the
          rule into a stylesheet. Reading tools can then change the spacing.
        watch_out: >-
          The page must still work when someone adds spacing. Wider text can
          be cut off by a fixed width or height, or by overflow set to hidden.
          After the change, test with the four WCAG spacing values listed in
          the manual check.
      - label: "Raise the important value to 0.12em or more"
        approach: >-
          Keep the important flag, but set the spacing to at least 0.12 times
          the font size. The rule check (Alfa) then passes.
        watch_out: >-
          WCAG does not ask for wide spacing by default. It asks that people
          can change it. Forcing 0.12em on everyone changes the design, and
          people who need even more space still cannot add it.
    verify_manual: >-
      Look at the element in your browser's developer tools. Check that its
      style no longer marks letter-spacing as important, or that the value is
      at least 0.12 times the font size. Then add the four WCAG spacing values
      with a text spacing bookmarklet. They are: line height 1.5 times the
      font size, space after paragraphs 2 times the font size, letter spacing
      0.12em, and word spacing 0.16em. Check that no text is cut off or
      covered, and that every control still works. The rule check does not
      look for a spacing control on the page itself. If your page has one,
      check that it works.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found for letter spacing.
    acceptance: >-
      Every element with visible text has no important letter-spacing in a
      style attribute, or has letter spacing of at least 0.12 times its font
      size.
    confidence_default: high

  sia-r92:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks for text whose word spacing is set in a
      <code>style</code> attribute with <code>!important</code>, for example
      <code>&lt;p style="word-spacing: 0.1em !important"&gt;</code>. It fails
      when that spacing is less than 0.16 times the font size. The style can
      sit on the flagged element or on a parent element that passes it down.
      Tools that add their own styles to the page, such as many browser
      extensions, cannot override a style like this.
    why_matters: >-
      Some people with low vision or dyslexia add space between words. They
      use a browser extension, or a bookmark that runs a small script on the
      page (bookmarklet). These tools cannot override an important style in a
      style attribute, so the words stay close together for them.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the <code>style</code> attribute that sets the spacing. It is on
        the flagged element or on one of its parents. For example, <code>&lt;p
        style="word-spacing: 0.1em !important"&gt;</code>.
      - >-
        Remove <code>!important</code> from that style: <code>&lt;p
        style="word-spacing: 0.1em"&gt;</code>. Better still, move the style
        into your stylesheet, so a reading tool can override it.
      - >-
        If the style must stay important, set it to at least 0.16 times the
        font size, for example <code>word-spacing: 0.16em !important</code>.
      - >-
        If a rich-text editor, page builder or template writes this style, fix
        it there, so new content does not bring the problem back.
    fix_options:
      - label: "Remove !important from the style attribute"
        approach: >-
          Keep the design's spacing, but drop the important flag, or move the
          rule into a stylesheet. Reading tools can then change the spacing.
        watch_out: >-
          The page must still work when someone adds spacing. Wider lines of
          text can be cut off by a fixed width or height, or by overflow set
          to hidden. Check buttons, tabs and menus that have a fixed width.
      - label: "Raise the important value to 0.16em or more"
        approach: >-
          Keep the important flag, but set the spacing to at least 0.16 times
          the font size. The rule check (Alfa) then passes.
        watch_out: >-
          WCAG does not ask for wide spacing by default. It asks that people
          can change it. Forcing 0.16em on everyone changes the design, and
          people who need even more space still cannot add it.
    verify_manual: >-
      Look at the element in your browser's developer tools. Check that its
      style no longer marks word-spacing as important, or that the value is at
      least 0.16 times the font size. Then add the four WCAG spacing values
      with a text spacing bookmarklet. They are: line height 1.5 times the
      font size, space after paragraphs 2 times the font size, letter spacing
      0.12em, and word spacing 0.16em. Check that no text is cut off or
      covered, and that every control still works. The rule check does not
      look for a spacing control on the page itself. If your page has one,
      check that it works.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found for word spacing.
    acceptance: >-
      Every element with visible text has no important word-spacing in a style
      attribute, or has word spacing of at least 0.16 times its font size.
    confidence_default: high

  sia-r93:
    abilities_affected: [vision, cognition]
    what_happening: >-
      The rule check (Alfa) looks for text whose line height is set in a
      <code>style</code> attribute with <code>!important</code>. Line height
      is the space given to each line. An example is <code>&lt;p
      style="line-height: 1em !important"&gt;</code>. It fails when the line
      height is less than 1.5 times the font size. It counts
      <code>line-height: normal</code> as 1.2, so that fails too. The style
      can sit on the flagged element or on a parent element that passes it
      down. The rule check does not look at whether the text wraps onto a
      second line, so it can also flag a single line of text.
    why_matters: >-
      Some people with low vision or dyslexia add space between lines. They
      use a browser extension, or a bookmark that runs a small script on the
      page (bookmarklet). These tools cannot override an important style in a
      style attribute, so the lines stay packed together and are hard to
      follow.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find the <code>style</code> attribute that sets the line height. It is
        on the flagged element or on one of its parents. For example,
        <code>&lt;div style="line-height: 18px !important"&gt;</code>.
      - >-
        Remove <code>!important</code> from that style, or move the style into
        your stylesheet, so a reading tool can override it.
      - >-
        If the style must stay important, use a number with no unit of at
        least 1.5: <code>line-height: 1.5 !important</code>. A number with no
        unit scales with each element's own font size.
      - >-
        If a rich-text editor, page builder or template writes this style, fix
        it there, so new content does not bring the problem back.
    fix_options:
      - label: "Remove !important from the style attribute"
        approach: >-
          Keep the design's line height, but drop the important flag, or move
          the rule into a stylesheet. Reading tools can then change it.
        watch_out: >-
          Taller lines make text boxes taller. A box with a fixed height, or
          with overflow set to hidden, can then cut off or overlap the text.
          Let text boxes grow instead of fixing their height.
      - label: "Raise the important value to 1.5 or more"
        approach: >-
          Keep the important flag, but set the line height to at least 1.5
          times the font size. The rule check (Alfa) then passes.
        watch_out: >-
          A length such as 24px set on a parent passes down as the same
          length. On a child with bigger text, the ratio drops below 1.5 and
          fails. A number with no unit, such as 1.5, avoids this.
    verify_manual: >-
      Look at the element in your browser's developer tools. Check that its
      style no longer marks line-height as important, or that the value is at
      least 1.5 times the font size. Then add the four WCAG spacing values
      with a text spacing bookmarklet. They are: line height 1.5 times the
      font size, space after paragraphs 2 times the font size, letter spacing
      0.12em, and word spacing 0.16em. Check that no text is cut off or
      covered, and that every control still works. If the flagged text is
      always one short line, a tight line height there makes little difference
      to reading.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      element is still found for line height.
    acceptance: >-
      Every element with visible text has no important line-height in a style
      attribute, or has line height of at least 1.5 times its font size.
    confidence_default: high

  sia-r94:
    abilities_affected: [vision, motor]
    what_happening: >-
      This rule check (Alfa) looks at every element with
      <code>role="menuitem"</code> that screen readers can reach. It fails
      when the menu item has no accessible name (the name a screen reader
      reads), or the name is empty. For example, a menu item that shows only
      an icon: <code>&lt;button role="menuitem"&gt;&lt;img src="file.svg"
      alt=""&gt;&lt;/button&gt;</code>.
    why_matters: >-
      Screen reader users get no name for the item, so they have no way to
      tell the choices apart. People who use speech input cannot say the
      item's name to pick it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Find each flagged menu item and decide what it does, for example "New
        file" or "Delete".
      - >-
        Best: show that word as text inside the item: <code>&lt;button
        role="menuitem"&gt;New file&lt;/button&gt;</code>.
      - >-
        For an icon-only item, add a name with <code>aria-label</code>:
        <code>&lt;button role="menuitem" aria-label="New file"&gt;&lt;img
        src="file.svg" alt=""&gt;&lt;/button&gt;</code>. Or give the icon
        itself useful alt text (the text a screen reader reads for an image).
      - >-
        If text that names the item already exists, point to it with
        <code>aria-labelledby</code> and that text's <code>id</code>.
    fix_options:
      - label: "Show text inside the menu item"
        approach: >-
          Put the item's name in visible text inside it. Everyone sees it,
          screen readers read it, and speech input users can say it.
        watch_out: >-
          Text hidden with display: none inside the item does not count,
          unless aria-labelledby points to it.
      - label: "Add aria-label to an icon-only item"
        approach: >-
          Keep the icon and add aria-label with a short name that says what
          the item does.
        watch_out: >-
          aria-label replaces any text inside the item as its name. If the
          item also shows text, put that text in the aria-label too. Speech
          input users can then say what they see (WCAG 2.5.3 Label in Name).
      - label: "Use aria-labelledby"
        approach: >-
          Point aria-labelledby at the id of text that already names the item.
        watch_out: >-
          The id must exist and the text must not be empty, or the item still
          has no name. A title attribute alone also passes this rule, but it
          is not always a reliable name. Use aria-label or aria-labelledby
          instead.
    verify_manual: >-
      Open the menu and move through it with the arrow keys while a screen
      reader is on (VoiceOver or NVDA). Each item should read a clear name,
      such as "New file". If the flagged element is not really a control
      people use, a person must decide whether WCAG 4.1.2 applies.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      menu item is still found.
    acceptance: >-
      Every menu item that screen readers can reach has a name that is not
      empty and says what it does.
    confidence_default: high

  sia-r95:
    abilities_affected: [vision, motor]
    what_happening: >-
      This rule check (Alfa) looks at each <code>&lt;iframe&gt;</code> (a
      frame that shows another page inside this one). It applies when the
      frame holds at least one visible item you can reach with the Tab key,
      such as a link or a button. The rule fails when the frame has a negative
      <code>tabindex</code>, such as <code>tabindex="-1"</code>. That takes
      the frame and every control inside it out of the tab order (the order
      the Tab key follows).
    why_matters: >-
      People who use a keyboard instead of a mouse cannot reach the links and
      buttons inside the frame with the Tab key. They include many blind
      people, people with low vision or hand tremors, and people using speech
      input or other keyboard-like tools.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Use the element locator (XPath) of each occurrence to find the
        <code>&lt;iframe&gt;</code> in your template or component. Search the
        code for where <code>tabindex="-1"</code> is set, including scripts
        that add it after the page loads.
      - >-
        Remove the negative <code>tabindex</code>. For example, change
        <code>&lt;iframe tabindex="-1" src="/map" title="Office
        map"&gt;</code> to <code>&lt;iframe src="/map" title="Office
        map"&gt;</code>. A value of <code>tabindex="0"</code> also passes.
      - >-
        Give the frame a <code>title</code> attribute that says what it holds,
        so screen reader users know what is in it before they move into it.
      - >-
        If nobody needs the frame's content, mouse users included, remove the
        frame or hide it with the <code>hidden</code> attribute. Do not leave
        it visible but out of reach.
    fix_options:
      - label: "Put the frame back in the tab order"
        approach: >-
          Delete the negative tabindex from the iframe, or set it to 0. The
          Tab key then moves into the frame and through its controls.
        watch_out: >-
          The frame now adds tab stops. Check that the order still makes
          sense, and that the frame has a title that says what it holds.
      - label: "Remove or hide the frame if nobody uses it"
        approach: >-
          If the frame is there only for a technical reason and nobody needs
          its controls, remove it. Or hide it from everyone with the hidden
          attribute.
        watch_out: >-
          Only do this when mouse users do not need the content either. If the
          frame is visible and useful to mouse users, it must also work with a
          keyboard.
    verify_manual: >-
      Load the page and press Tab from the top, without the mouse. Focus
      should move into the frame, reach every link and button in it, and then
      move past it. The rule assumes those controls do something; if they do
      nothing for anyone, record why it is not a real barrier.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      frame is still found.
    acceptance: >-
      Every frame that holds links, buttons or form fields has no negative
      tabindex, and the Tab key reaches each of those controls.
    confidence_default: high

  sia-r96:
    abilities_affected: [vision, cognition]
    what_happening: >-
      This rule check (Alfa) reads the first <code>&lt;meta
      http-equiv="refresh"&gt;</code> element with a valid delay in the page
      code (DOM). The number at the start of its <code>content</code>
      attribute is the delay in seconds before the page reloads or sends you
      to another address. The rule fails for any delay above 0, even one
      longer than 20 hours. It is a stricter form of rule sia-r9, so both
      rules can report the same element.
    why_matters: >-
      A page that reloads or moves on its own interrupts people who did not
      ask for it. Screen reader users and people with low vision lose their
      place, and people with attention difficulties get distracted.
    owner: dev
    effort: under_2h
    fix_steps:
      - >-
        Find the <code>&lt;meta http-equiv="refresh"&gt;</code> element in the
        page template, and decide whether it reloads the same page or sends
        people to a different address.
      - >-
        If it sends people to another address, redirect on the web server, or
        set the delay to 0: <code>&lt;meta http-equiv="refresh" content="0;
        URL=https://example.com/new"&gt;</code>.
      - >-
        If it reloads the page, remove the meta element and let people ask for
        new content, for example with a "Refresh results" button.
    fix_options:
      - label: "Redirect at once"
        approach: >-
          Use a server redirect, or a meta refresh with a delay of 0, so the
          change happens as the page loads and never interrupts reading.
        watch_out: >-
          Keep a normal link to the new address on the page in case a browser
          does not follow the redirect.
      - label: "Make every update happen on request"
        approach: >-
          Remove the automatic reload and give people a control that loads new
          content when they choose.
        watch_out: >-
          A script that reloads the page on a timer keeps the same
          interruption, and this rule check does not look at scripts. WCAG
          allows an interruption that people cannot put off only in an
          emergency.
    verify_manual: >-
      Open the page and leave it for a long time without touching it. It
      should never reload or move to another address unless you ask, except
      for an instant redirect as it loads. The rule assumes people cannot turn
      off or put off the change; if the page lets them, record why it is not a
      problem.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this meta element is still found.
    acceptance: >-
      Every page either has no meta refresh or redirects at once with a delay
      of 0.
    confidence_default: high

  sia-r110:
    abilities_affected: [vision]
    what_happening: >-
      The rule check (Alfa) looks at every <code>role</code> attribute that is
      not empty, on elements that are not hidden from screen readers. At least
      one word in the value must be a real role from the accessible web app
      standard (WAI-ARIA). Abstract roles such as <code>widget</code> or
      <code>landmark</code> do not count. This element fails because no word
      in its role is valid, for example a typo like <code>role="btn"</code>.
      The rule check also only accepts lowercase, so
      <code>role="Button"</code> fails too.
    why_matters: >-
      Browsers and screen readers ignore a role they do not know, and use the
      element's built-in role instead. A custom control built as div
      role="btn" is then read as plain text. Screen reader users do not know
      it is a button they can use.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Read the <code>role</code> value in the element code (HTML) and decide
        which role you meant.
      - >-
        Fix the spelling and write it in lowercase. For example: <code>&lt;div
        role="button" tabindex="0"&gt;Save&lt;/div&gt;</code>. At least one
        popular browser treats role values as case-sensitive.
      - >-
        If a native HTML element does the same job, use it instead of a role:
        <code>&lt;button type="button"&gt;Save&lt;/button&gt;</code>.
      - >-
        If the element does not need a role at all, remove the
        <code>role</code> attribute.
    fix_options:
      - label: "Correct the role word"
        approach: >-
          Replace the value with the correct role from the WAI-ARIA list, in
          lowercase, such as button, link, tab or dialog.
        watch_out: >-
          A real role brings duties. For example, role="button" also needs a
          name and must work with Enter and Space. This rule does not check
          whether the role fits the element. Older browsers ignore the whole
          attribute if it lists more than one role, so use a single role.
      - label: "Use a native HTML element"
        approach: >-
          Swap the div or span for the element that already has the role, such
          as button, a with href, or input.
        watch_out: >-
          A button inside a form submits it unless you set type="button".
          Check that site styles still look right after the swap.
      - label: "Remove a role that is not needed"
        approach: >-
          Delete the role attribute when the element is not a control or
          structure that needs one, such as a leftover from an old script.
        watch_out: >-
          If the element acts as a control, removing the role leaves screen
          reader users with no clue about what it does. Only remove it when
          the element really is plain content.
    verify_manual: >-
      Open the browser's developer tools and look at the element in the
      accessibility panel: its role should be the one you meant. With a screen
      reader, move to the element and check that it says the role, such as
      "button". Also check each word of the role value against the WAI-ARIA
      role list.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      role attribute is still found.
    acceptance: >-
      Every role attribute on an element that screen readers can reach
      contains at least one real, non-abstract WAI-ARIA role, written in
      lowercase.
    confidence_default: high

  sia-r111:
    abilities_affected: [motor, vision]
    what_happening: >-
      This rule check (Alfa) measures the area you can click or tap on this
      link, button or other control. It fails when no 44 by 44 pixel square
      fits in that area, for example on a button 40 pixels tall. It measures a
      1440 by 900 desktop window, skips controls inside a line of text, and
      never flags an <code>&lt;input&gt;</code>. This Level AAA rule is
      stricter than the 24-pixel Level AA rule in WCAG 2.2.
    why_matters: >-
      People with hand tremors or limited finger control, and people on touch
      screens, miss small controls or press the wrong one. Larger controls are
      also easier to see for people with low vision.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Measure the control in the browser developer tools, and note which
        side is under 44 pixels.
      - >-
        Make the clickable area at least 44 by 44 pixels, for example
        <code>.icon-button { display: inline-block; min-width: 44px;
        min-height: 44px; }</code>. Padding inside the control adds to the
        area; margin outside it does not.
      - >-
        For links in a menu or list, make each link fill its row with enough
        padding to reach 44 pixels. For example: <code>nav a { display: block;
        padding: 12px 16px; }</code>.
      - "Change the shared component or style, not each page."
    fix_options:
      - label: "Make the control bigger"
        approach: >-
          Raise the padding, min-width and min-height of the control until its
          clickable area is at least 44 by 44 pixels.
        watch_out: >-
          Bigger controls can push the layout apart. Check the page at 320
          pixels wide and at 200% zoom.
      - label: "Offer a larger control that does the same thing"
        approach: >-
          Keep the small control, and put a control on the same page that does
          the same job and is at least 44 by 44 pixels. WCAG allows this.
        watch_out: >-
          The rule check (Alfa) does not know about the other control, so the
          small one keeps showing. Record the reason and mark the occurrence
          Not a problem (false positive).
      - label: "Record that your policy stops at Level AA"
        approach: >-
          This rule is Level AAA, and a scan set to Level AA does not run it.
          At Level AA, WCAG 2.2 asks for 24 by 24 pixels instead (rule check
          (Alfa) sia-r113).
        watch_out: >-
          This is a policy choice, not a fix. Small controls still cause
          missed taps, so record who decided and mark the occurrence Accepted
          risk.
    verify_manual: >-
      In the browser developer tools, check that the control's clickable area
      is at least 44 by 44 CSS pixels. Check the phone layout too, because the
      scan measured a desktop window. Record any WCAG exception that applies,
      such as a control inside a sentence or a size that is essential.
    verify_automated: >-
      Scan again at Level AAA, with Alfa or Both as the rule check tool, and
      see if this control is still found.
    acceptance: >-
      Every control outside a line of text has a clickable area of at least 44
      by 44 CSS pixels, or a recorded WCAG exception.
    confidence_default: medium

  sia-r113:
    abilities_affected: [motor]
    what_happening: >-
      This rule check (Alfa) measures the area you can click or tap on this
      link, button or other control. It fails when no 24 by 24 pixel square
      fits in that area, and the control is also too close to another one. Too
      close means a 24-pixel circle centered on it touches another control, or
      touches the circle of another small control. It measures a 1440 by 900
      desktop window, skips controls inside a line of text, and never flags an
      <code>&lt;input&gt;</code>.
    why_matters: >-
      People with hand tremors or limited finger control, and people on touch
      screens, press the wrong control when small controls sit close together.
    owner: designer
    effort: under_2h
    fix_steps:
      - >-
        Measure the control and its nearest neighbors in the browser developer
        tools. For example, menu links 19 pixels tall, stacked with no space
        between them, are too small and too close.
      - >-
        Make the control at least 24 by 24 pixels, usually with padding:
        <code>.submenu a { display: block; min-height: 24px; padding: 4px 8px;
        }</code>.
      - >-
        Or keep it small and add space around it with <code>margin</code> or
        <code>gap</code>. Its 24-pixel circle must touch no other control and
        no other small control's circle.
      - "Change the shared component or style, so every page gets the fix."
    fix_options:
      - label: "Make the control bigger"
        approach: >-
          Raise the padding or min-height and min-width so the clickable area
          is at least 24 by 24 pixels.
        watch_out: >-
          Padding grows the clickable area; margin does not. Check the layout
          at 320 pixels wide and at 200% zoom.
      - label: "Add space between small controls"
        approach: >-
          Keep the size and add margin or gap so each small control has a
          clear 24-pixel circle around its center.
        watch_out: >-
          Check neighbors in every direction, including the rows above and
          below, not only side by side.
      - label: "Use a WCAG exception"
        approach: >-
          WCAG allows a small control when another control on the same page
          does the same job and meets WCAG 2.5.8. It also allows one whose
          exact position matters, such as a pin on a map.
        watch_out: >-
          The rule check (Alfa) cannot see these exceptions, so the occurrence
          keeps showing. Record the reason and mark it Not a problem (false
          positive).
    verify_manual: >-
      In the browser developer tools, read the control's size in CSS pixels.
      If it is under 24 by 24, a 24-pixel circle on its center must not touch
      another control or another small control's circle. Check the phone
      layout too, because the scan measured a desktop window.
    verify_automated: >-
      Scan again set to WCAG version 2.2, with Alfa or Both as the rule check
      tool, and see if this control is still found.
    acceptance: >-
      Every control outside a line of text is 24 by 24 CSS pixels or larger,
      has enough space, or has a recorded WCAG exception.
    confidence_default: medium

  sia-r116:
    abilities_affected: [vision, motor]
    what_happening: >-
      A <code>&lt;details&gt;</code> element makes a section that opens and
      closes, and its first <code>&lt;summary&gt;</code> child is the control
      people click. This rule check (Alfa) fails when that
      <code>&lt;summary&gt;</code> has no accessible name (the name a screen
      reader reads), for example <code>&lt;summary&gt;&lt;/summary&gt;</code>.
      Adding <code>role="none"</code> does not remove the problem, because the
      control can still get focus.
    why_matters: >-
      Screen reader users reach a control with no word for what it opens.
      People who use speech input have no name to say to open it.
    owner: dev
    effort: under_15m
    fix_steps:
      - >-
        Put short visible text inside the first <code>&lt;summary&gt;</code>
        that says what the section holds:
        <code>&lt;details&gt;&lt;summary&gt;Opening
        times&lt;/summary&gt;…&lt;/details&gt;</code>.
      - >-
        If the design shows only an icon, add a name: <code>&lt;summary
        aria-label="Opening times"&gt;&lt;/summary&gt;</code>, or point
        <code>aria-labelledby</code> at nearby text such as a heading's
        <code>id</code>.
      - >-
        If a template or content system builds these sections, make sure it
        never outputs an empty <code>&lt;summary&gt;</code>. For example, this
        can happen when a title field is left blank.
    fix_options:
      - label: "Write visible text in the summary"
        approach: >-
          Put the section's topic as text inside summary. Everyone sees it and
          screen readers read it.
        watch_out: >-
          Only the first summary inside a details element is the control. Text
          in a second summary does not name it.
      - label: "Name it with aria-label or aria-labelledby"
        approach: >-
          When the summary shows only an icon, give it aria-label, or point
          aria-labelledby at visible text such as a heading.
        watch_out: >-
          The rule check (Alfa) does not read text added only with CSS (for
          example ::before content), so it may still flag the element. Check
          what a screen reader reads, or move the text into the page code.
    verify_manual: >-
      Tab to the control with a screen reader on (VoiceOver or NVDA). It
      should read a clear name, such as "Opening times, collapsed". The open
      or closed arrow (marker) is not a name, even though some browsers read
      it as part of the name.
    verify_automated: >-
      Scan again with Alfa or Both as the rule check tool, and see if this
      control is still found.
    acceptance: >-
      Every show-and-hide section (details) has a first summary with a name
      that says what the section holds.
    confidence_default: high
