<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Axcess">
  <!-- UMich blue rounded background. -->
  <rect width="32" height="32" rx="6" fill="#00274C"/>
  <!-- Maize "Ax" wordmark — the product name (Axcess = access + the
       axe-core engine). Bold geometric sans so the pair still reads at
       16×16. Maize #FFCB05 on UMich blue clears AAA contrast. -->
  <text x="16" y="22" text-anchor="middle" fill="#FFCB05"
        font-family="Arial, Helvetica, sans-serif" font-size="18"
        font-weight="800">Ax</text>
</svg>
