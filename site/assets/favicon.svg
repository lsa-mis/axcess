<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* Browser chrome has no currentColor to inherit, so the favicon carries its
       own two-tone rule and follows the OS theme the same way the app does. */
    :root { --mark: #111111; }
    @media (prefers-color-scheme: dark) { :root { --mark: #ffffff; } }
  </style>
  <g fill="none" stroke="var(--mark)" stroke-width="2.5" stroke-linecap="round">
    <path d="M 20.31 4.16 A 12.6 12.6 0 1 0 26.45 8.95"/>
    <circle cx="16" cy="16" r="5.6"/>
    <circle cx="20.31" cy="4.16" r="3.2" fill="var(--mark)" stroke="none"/>
  </g>
</svg>
