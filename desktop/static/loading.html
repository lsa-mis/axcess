<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Nothing here is fetched: no image element, no script, no webfont. The
         mark is inline SVG markup, which no fetch directive governs, so 'none'
         stays the default and the image-source allowance this screen used to
         carry is gone with the element that needed it. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Axcess</title>
    <style>
      /* Hand-written twin of src/components/Loading.tsx. This screen paints
         before the backend and the React bundle exist, so it cannot import
         that component or the Tailwind tokens; the colours below are
         surface.subtle / umich.blue / fg.muted copied literally. Atkinson
         Hyperlegible is skipped for the same reason — its files ship with the
         frontend and are not servable yet, so the system stack is all we have. */
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F9FC; color: #374151; }
      main { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding: 2rem; }
      .mark { width: 5rem; height: 5rem; color: #00274C; }
      /* view-box, not the default border-box: it resolves `center` against the
         viewBox, so the ring turns about the arc's own centre (16,16) instead
         of about the tight bounding box of the ring + node, which would swing
         it off-axis. */
      .ring { transform-box: view-box; transform-origin: center; animation: spin-ring 1.6s linear infinite; }
      @keyframes spin-ring { to { transform: rotate(360deg); } }
      p { margin: 0; font-size: 1rem; font-weight: 500; }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <svg class="mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <g class="ring">
          <path d="M 20.31 4.16 A 12.6 12.6 0 1 0 26.45 8.95" />
          <circle cx="20.31" cy="4.16" r="3.2" fill="currentColor" stroke="none" />
        </g>
        <path d="M 17.438 21.016 C 16.989 21.141 16.515 21.208 16.026 21.208 C 13.135 21.208 10.792 18.865 10.792 15.974 C 10.792 13.083 13.135 10.74 16.026 10.74 C 18.917 10.74 21.26 13.083 21.26 15.974 C 21.26 17.37 21.26 18.97 21.26 21.016" />
      </svg>
      <p>Loading</p>
    </main>
  </body>
</html>
