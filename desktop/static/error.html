<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axcess could not start</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f8fa; color: #172033; }
      main { width: min(36rem, calc(100vw - 3rem)); padding: 2rem; border: 1px solid #d8dee8; border-radius: .75rem; background: #fff; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      .app-icon { display: block; margin-bottom: 1rem; }
      p { line-height: 1.55; color: #4a566d; }
      code { font-family: ui-monospace, monospace; color: #172033; }
    </style>
  </head>
  <body>
    <main role="alert">
      <img class="app-icon" src="../assets/axcess.svg" width="80" height="80" alt="" />
      <h1>Axcess could not start</h1>
      <p>The local service did not become ready. Close Axcess and try again.</p>
      <p>For a development checkout, run <code>make desktop-setup</code> before reopening the app.</p>
    </main>
  </body>
</html>
