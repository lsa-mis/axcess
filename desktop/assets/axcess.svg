<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Axcess">
  <!-- Desktop adaptation of the A11y Crawler mark: an open scan path with a
       node on its leading edge. Platform app icons are composited on unknown
       backgrounds and cannot follow a theme, so the mark is fixed dark on a
       light tile rather than inheriting a colour. Stroke geometry is the
       original's, scaled from its 32-unit box. -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="#ffffff"/>
  <g transform="translate(512 512) scale(19.2) translate(-16 -16)"
     fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round">
    <path d="M 20.31 4.16 A 12.6 12.6 0 1 0 26.45 8.95"/>
    <circle cx="16" cy="16" r="5.6"/>
    <circle cx="20.31" cy="4.16" r="3.2" fill="#111111" stroke="none"/>
  </g>
</svg>
